# Oddie's own pari-mutuel program.
#
# NOT the program running on devnet today. That one (Ao8tBMVCUMMYAm8cbq2qehP78RCK5xNAPyaXv9TH5FZT)
# was deployed without its source ever landing in this repo, which is why
# economy.ts has to describe the creator fee as a "proposed rate": the deployed
# Market account has no creator field and no fee instruction, so there is
# nowhere to record who the 3% is owed to and no way to pay it. This workspace
# exists so that program is ours.
#
# DELIBERATELY NOT WIRED TO PRODUCTION. Nothing in src/ imports this, the server
# still gates every on-chain path behind ONCHAIN_ENABLED (default false), and no
# deploy target here points at mainnet.

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
oddie_chain = "3SYG7hzQBYGc853BGTxcBtTLefESaP9DqP5aHbvgnYsu"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
