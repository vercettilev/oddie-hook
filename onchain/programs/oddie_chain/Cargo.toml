[package]
name = "oddie_chain"
version = "0.2.0"
description = "Oddie pari-mutuel markets with a payable creator fee"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oddie_chain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
# Anchor 1.x's solana_program shim no longer re-exports a hash module, and the
# question commitment has to be computed BY THE PROGRAM: a hash the caller
# supplies is a hash the caller can pick.
solana-sha256-hasher = "3"
