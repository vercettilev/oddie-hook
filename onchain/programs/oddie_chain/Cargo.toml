[package]
name = "oddie_chain"
version = "0.2.0"
description = "Oddie pari-mutuel markets with a payable creator fee"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oddie_chain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# allow-missing-optionals: resolve_market's vault is an OPTIONAL trailing
# account (the swSOL guard). Without this feature Anchor 1.x rejects a call that
# leaves a trailing optional out, and the server deployed today resolves with
# exactly two accounts; it has to keep working across the program upgrade.
anchor-lang = { version = "1.1.2", features = ["init-if-needed", "allow-missing-optionals"] }
# Anchor 1.x's solana_program shim no longer re-exports a hash module, and the
# question commitment has to be computed BY THE PROGRAM: a hash the caller
# supplies is a hash the caller can pick.
solana-sha256-hasher = "3"
