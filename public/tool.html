<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0B">
<title>oddie · operator console</title>
<style>
  :root{
    /* Dark, permanently. This is the tool's own request, not a toggle. Values
       match feed.html's dark-mode tokens exactly (--ground, --card-surface,
       --on-ground, --muted-g, --line-g, --acc-deep) rather than inventing a
       second dark palette for the same brand. --white and --wash KEPT THEIR
       NAMES but not their literal colors, the same move src/card/renderCard.ts
       already made for its accent token ("the var kept its name; the value is
       Oddie green"). Renaming ~15 call sites across this file for a token
       that only ever meant "the elevated surface" / "the page ground" buys
       nothing a comment doesn't already say. There is no light variant to
       keep in sync: this is the only palette the file has.
       color-scheme:dark below is what keeps native controls (the date/time
       picker, form-field chrome) from rendering a stray white box. */
    --accent:#D7DC1F;      /* unchanged, already legible on near-black */
    --accentDeep:#C6CE45;  /* feed's dark-mode --acc-deep. Two call sites used
                               to read var(--accentDeep, #4d6e10), a variable
                               this file never defined, so they ALWAYS ran on
                               that fallback. #4d6e10 is a dark olive tuned for
                               white/pale-lime backgrounds; on near-black it is
                               close to invisible. Defining the variable for
                               real is the fix, not a new bug. */
    --ink:#F4F4F1; --white:#141513; --muted:#9A9A92;
    --wash:#0B0B0B; --bar:#2C2C2A; --bad:#3A1414; --warn:#3A2C05;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:18px 16px calc(28px + env(safe-area-inset-bottom));
    background:var(--wash); color:var(--ink);
    font-family:'Fredoka','Trebuchet MS',system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  /* Every text input/textarea/select in this file sets its own border via an
     inline style, but none set a background: they inherited the browser's
     default white field regardless of the page. Invisible on the old
     pale-lime ground; a glaring white rectangle on this one. One rule catches
     every field, present and future, instead of touching each inline style. */
  input, textarea, select{background:var(--white); color:var(--ink)}
  .wrap{max-width:660px; margin:0 auto}

  header{display:flex; align-items:baseline; gap:10px; margin-bottom:4px}
  h1{font-size:26px; font-weight:700; margin:0; letter-spacing:-.01em}
  .tag{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .lede{font-size:13.5px; color:var(--muted); margin:6px 0 16px; line-height:1.45}

  textarea:focus{outline:3px solid var(--accent); outline-offset:2px}

  /* The jump bar: five stops, in the order the job runs. Sticky so "where am I"
     is never a scroll away — the whole point of the console being one page. */

  .row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
  button{
    font:inherit; font-weight:700; font-size:16px; cursor:pointer;
    border:3px solid var(--ink); border-radius:16px; padding:12px 20px;
    background:var(--white); transition:transform .08s, background .12s;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45; cursor:default}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .ghost{background:var(--white)}
  /* A one-way action deliberately styled BELOW button weight: no border, no
     fill, small and muted. It sits next to buttons that matter more (post,
     mark sent) and should never be the thing the eye lands on first. */
  /* Inside a result box the two actions are peers; let them share the row
     rather than dropping "Download card" onto a line of its own. */
  .box .row button{flex:1 1 138px; padding:12px 10px}

  .out{margin-top:20px}
  /* scroll-margin keeps an anchored box's title clear of the sticky jump bar. */
  .box{border:3px solid var(--ink); border-radius:20px; padding:16px; background:var(--white); scroll-margin-top:58px}
  .box.hit{background:var(--white)}
  .box.error{background:var(--warn)}

  /* Collapsed record panels: present when needed, silent otherwise. */
  details.rec{border-top:2px dashed var(--bar); padding:10px 0 6px}
  details.rec:first-of-type{border-top:none; padding-top:0}
  details.rec summary{cursor:pointer; font-weight:700; font-size:14.5px}
  details.rec summary:hover{color:var(--accentDeep)}

  .verdict{font-size:20px; font-weight:700; line-height:1.3; margin:0 0 6px}
  /* Both top-level sections are <details>, .verdict doubling as their
     <summary>. Native marker kept (no reason to rebuild a disclosure
     triangle this file already gets for free); the outline on focus and the
     hover colour are the same signal .rec summary gives the nested history
     lists, one size up since this is the primary toggle. */
  summary.verdict{cursor:pointer; list-style-position:outside}
  summary.verdict:hover{color:var(--accentDeep)}
  summary.verdict:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
  .why{font-size:13.5px; color:var(--muted); line-height:1.5; margin:0}
  .why + .why{margin-top:6px}

  .q{font-size:15px; font-weight:600; line-height:1.4; margin:0 0 10px}

  .link{
    display:block; word-break:break-all; font-size:13.5px; font-weight:600;
    background:var(--wash); border:2px dashed var(--ink); border-radius:12px;
    padding:10px 12px; margin:12px 0 10px; color:var(--ink); text-decoration:none;
  }
  .hint{font-size:12px; color:var(--muted); margin:10px 0 0; line-height:1.45}

  /* tweet copy variants: one line + one button per row, ready to grab */
  .vhead{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; margin:2px 0 8px}
  .variants{display:flex; flex-direction:column; gap:8px; margin:0 0 14px}
  .variant{display:flex; align-items:center; gap:10px;
    border:2px solid var(--ink); border-radius:12px; padding:9px 12px; background:var(--wash)}
  .vtext{flex:1; min-width:0; font-size:14px; font-weight:600; line-height:1.35}

  /* The at-a-glance count in a section title. Answers "is there anything to do
     here" without opening the section — the thing an operator scanning five
     stacked panels needs first, and the thing the panels never said. */
  .count{font-size:13px; font-weight:700; color:var(--muted)}
  .count.due{color:var(--ink); background:var(--accent); border-radius:8px; padding:1px 8px}

  /* A settled call or a resolved market that needs nothing further — one line,
     not the full working card. The working section above stays the size of the
     actual worklist instead of growing forever with everything ever finished;
     this is where "finished" goes to be checkable, not to compete for room. */
  .donelist{display:flex; flex-direction:column; gap:6px; margin-top:8px}
  .donerow{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;
    border-bottom:1px solid var(--bar)}
  .donerow:last-child{border-bottom:none}
  .donewhat{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--ink); text-decoration:none}
  a.donewhat:hover{text-decoration:underline}
  .donebadge{flex:none; font-weight:800; font-size:11px}
  .donebadge.won{color:var(--accentDeep)}
  .donebadge.lost{color:var(--muted)}
  .donewhen{flex:none; color:var(--muted); font-size:12px}

  @media (min-width:560px){
    body{padding-top:32px}
    h1{font-size:30px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>oddie</h1><span class="tag">operator console · internal</span>
  </header>
  <!-- The tags answer themselves now: the mention loop opens markets and posts
       the reply without anybody here. What is left for a person is the half a
       machine must not do on its own, which is deciding an outcome and paying
       people. One section, so no nav to it. -->
  <p class="lede">The bot opens markets and answers tags on its own. This is where a
    person settles one.</p>

  <!-- One token unlocks everything. It lives up here because every panel below
       is admin-gated — the server fails closed without it. -->
  <div class="box">
    <div class="row" style="margin:0">
      <input id="admtok" type="password" placeholder="admin token (ODDIE_ADMIN_TOKEN)"
        style="flex:1 1 240px;font:inherit;font-size:14px;border:2px solid var(--ink);border-radius:12px;padding:9px 12px">
      <button class="ghost" id="admsave" style="flex:0 0 auto;padding:9px 16px;font-size:14px">save</button>
    </div>
    <p class="hint" style="margin-top:8px">the panel below is admin-gated · saving reloads it.</p>
  </div>

  <!-- The markets themselves: feature onto the homepage, inspect positions,
       resolve with a payout preview. Resolve settles real user positions and
       pays them, which is why it is the one thing left here. Open by default:
       it is the only section, so a closed one would just be a door in front of
       the page. -->
  <details class="box" id="resolve" style="margin-top:22px" open>
    <summary class="verdict" style="font-size:17px">markets <span id="rcount" class="count"></span></summary>
    <p class="why" id="chainstat">—</p>
    <p class="why" id="featstat" style="margin-top:2px">—</p>
    <div id="rlist" style="margin-top:8px"><p class="why">enter the admin token above, then this loads…</p></div>
  </details>

</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// The card SVG's natural size, used when a browser reports naturalWidth 0 for
// an SVG <img> (Safari does, intermittently).
const CARD_W = 1000, CARD_H = 524;


// The one-tap cockpit for manual mentions: for each settled X-connected call,
// [post on X] opens a compose window with the text prefilled, [card ↓] saves
// the personal card PNG to attach to it, and [mark sent] stamps the row. The
// only manual steps left are attaching the image and pressing Post — the two X
// gives no API-free way around.
//
// PENDING vs SENT are two different objects, rendered two different sizes.
// /api/mentions returns up to 30 rows ordered pending-first, but once a day's
// pending queue is small the remaining slots fill with history — every past
// verdict, full card, forever. That history is exactly what made this section
// unmanageable: the actual worklist (a handful of items) was buried in a
// scroll of finished ones repeating the same follow-back sentence. Sent items
// still render — the sent date and the 24h-return signal are real information
// — just as one line each, in a collapsed list that starts closed.
/** Fetch a same-origin PNG and hand it to the browser as a download. */
/**
 * SVG -> PNG in the page. X rejects SVG uploads, so the download button has to
 * hand over a raster. The card embeds no external image or webfont, so the
 * canvas is never tainted and toBlob() is allowed.
 */
// ---- community markets (admin) --------------------------------------------
// Every call carries the admin token as x-oddie-admin. The server fails closed:
// no token / wrong token / unset ODDIE_ADMIN_TOKEN => 401.
const ADMKEY = "oddie_admin_token";
const admInput = $("#admtok");
admInput.value = localStorage.getItem(ADMKEY) || "";
const admHeaders = (extra) => Object.assign({ "x-oddie-admin": localStorage.getItem(ADMKEY) || "" }, extra || {});
$("#admsave").onclick = () => { localStorage.setItem(ADMKEY, admInput.value.trim()); loadCommunity(); };

let chainEnabled = false;

// The homepage's "Live right now" picks — the raw admin choices, in display
// order ([] = none set, home falls back entirely to recently-active markets).
let featuredSlugs = [];

async function loadCommunity() {
  const box = $("#rlist"), stat = $("#chainstat"), count = $("#rcount");
  if (!localStorage.getItem(ADMKEY)) { box.innerHTML = '<p class="why">enter the admin token above, then this loads…</p>'; return; }
  try {
    const [r, fr] = await Promise.all([
      fetch("/api/community/list", { headers: admHeaders() }),
      fetch("/api/admin/featured", { headers: admHeaders() }).catch(() => null),
    ]);
    if (r.status === 401) { stat.textContent = "admin token missing or wrong."; box.innerHTML = '<p class="why">admin token rejected.</p>'; return; }
    const j = await r.json();
    const f = fr && fr.ok ? await fr.json().catch(() => null) : null;
    featuredSlugs = f && Array.isArray(f.slugs) ? f.slugs : [];
    chainEnabled = !!(j.chain && j.chain.enabled);
    const bal = j.chain && j.chain.balanceSol;
    // Hidden entirely when off, which is the long-standing default (the whole
    // onchain/ program is explicitly not wired yet; see onchain/README.md).
    // A line confirming "yep, still off" on every visit is not worth a row;
    // the config steps to turn it on live in that README, not repeated here.
    stat.style.display = chainEnabled ? "" : "none";
    if (chainEnabled) {
      stat.innerHTML = 'on-chain: <b>enabled</b> · admin ' + esc((j.chain.admin || "").slice(0, 10)) + '… · <b>balance ' + (bal == null ? '?' : bal.toFixed(3)) + ' SOL</b>'
        + (bal != null && bal < 0.05 ? ' · <b style="color:#FF8B78">low, top up</b>' : '');
    }
    const featBox = $("#featstat");
    if (featBox) {
      // Counts only. This used to concatenate every featured question's full
      // text inline, all of them on one line, which is exactly what the
      // ★-marked rows in the list right below already show.
      const resolved = f && Array.isArray(f.resolved) ? f.resolved : [];
      featBox.innerHTML = !f
        ? '<b>Live picks:</b> unavailable.'
        : !resolved.length
          ? '<b>Live picks:</b> none set (falls back to recent activity).'
          : '<b>Live picks:</b> ' + featuredSlugs.length + ' featured, ' + resolved.length + ' showing (★ below).';
    }
    if (!j.items.length) { box.innerHTML = '<p class="why">no community markets yet.</p>'; count.textContent = ""; return; }

    // RESOLVED markets have nothing left to manage — no feature toggle (a
    // settled market can't go on the homepage), no position management that
    // changes an outcome already locked in. They used to stay in this list
    // forever, at full size, so "live markets" grew into an archive of every
    // market ever run, resolved or not, TEST rows included. Live keeps the
    // working list working-sized; resolved goes to a closed history below it,
    // one line each, with a link out rather than a rebuilt admin view.
    /* RETIRED IS NOT LIVE, AND THIS PANEL SAID IT WAS.
       The public list filters on `!resolvedOutcome && !retiredAt`
       (server.ts, /api/v1/markets) and this one only checked the first half,
       so a board cleanup that retired five markets left them here counted and
       listed as live: "7 live" over an app that was serving 2. A retired
       market is still a real row and still resolvable, so it goes to the
       history beside the resolved ones rather than disappearing. */
    const live = j.items.filter((m) => !m.resolvedOutcome && !m.retiredAt);
    const resolved = j.items.filter((m) => m.resolvedOutcome);
    const retired = j.items.filter((m) => !m.resolvedOutcome && m.retiredAt);
    count.textContent = `· ${live.length} live`
      + (retired.length ? ` · ${retired.length} retired` : "")
      + (resolved.length ? ` · ${resolved.length} resolved` : "");

    box.innerHTML = (live.length ? live.map((m) => {
      // Per-row on-chain status is only informative when chain is ENABLED —
      // that's the one case where it can differ row to row. Off, it is the
      // same word repeated on every card, already said once in the banner
      // above; this used to print "on-chain: skipped" on every single row.
      const minted = !chainEnabled ? "" : m.explorer
        ? ' · <a href="' + esc(m.explorer) + '" target="_blank" rel="noopener">minted ✓ ↗</a>'
        : ' · on-chain: skipped';
      const pool = 'YES <b>' + m.yesTokens + '</b> (' + m.yesPlayers + 'p) · NO <b>' + m.noTokens + '</b> (' + m.noPlayers + 'p)';
      const isFeatured = featuredSlugs.includes(m.slug);
      const featureBtn = isFeatured
        ? '<button class="ghost unfeature" data-slug="' + esc(m.slug) + '" style="border-color:var(--accent)">★ featured — remove</button>'
        : '<button class="ghost feature" data-slug="' + esc(m.slug) + '">☆ feature this market</button>';
      return '<div class="box mkt" data-slug="' + esc(m.slug) + '" style="margin-bottom:10px' + (isFeatured ? ';border-color:var(--accent)' : '') + '">'
        + '<p class="why" style="color:var(--ink);font-weight:700">' + (isFeatured ? '★ ' : '') + esc(m.question) + '</p>'
        + '<p class="why">' + pool + minted + '</p>'
        + '<div class="row" style="margin-top:6px">'
        + '<button class="ghost manage" data-slug="' + esc(m.slug) + '">manage / view positions ▾</button>'
        + featureBtn
        + '</div>'
        + '<div class="mktdetail" style="margin-top:10px"></div>'
        + '</div>';
    }).join("") : '<p class="why">no live markets — everything so far has resolved.</p>')
      + (retired.length
        ? `<details class="rec" style="margin-top:14px">
             <summary>retired, off the board — ${retired.length}</summary>
             <div class="donelist">${retired.map((m) => `
               <div class="donerow">
                 <a class="donewhat" href="/market/${esc(m.slug)}" target="_blank" rel="noopener" title="${esc(m.question)}">${esc(m.question)}</a>
                 <span class="donewhen">${m.yesTokens + m.noTokens} played · ${m.yesPlayers + m.noPlayers}p</span>
               </div>`).join("")}</div>
           </details>`
        : "")
      + (resolved.length
        ? `<details class="rec" style="margin-top:14px">
             <summary>resolved — ${resolved.length}</summary>
             <div class="donelist">${resolved.map((m) => `
               <div class="donerow">
                 <a class="donewhat" href="/market/${esc(m.slug)}" target="_blank" rel="noopener" title="${esc(m.question)}">${esc(m.question)}</a>
                 <span class="donebadge ${String(m.resolvedOutcome).toLowerCase() === "yes" ? "won" : "lost"}">${esc(String(m.resolvedOutcome).toUpperCase())}</span>
                 <span class="donewhen">${m.yesTokens + m.noTokens} played · ${m.yesPlayers + m.noPlayers}p</span>
               </div>`).join("")}</div>
           </details>`
        : "");
    box.querySelectorAll(".manage").forEach((b) => { b.onclick = () => toggleDetail(b); });
    box.querySelectorAll(".feature").forEach((b) => { b.onclick = () => setFeatured([...featuredSlugs, b.dataset.slug]); });
    box.querySelectorAll(".unfeature").forEach((b) => { b.onclick = () => setFeatured(featuredSlugs.filter((s) => s !== b.dataset.slug)); });
  } catch (e) { box.innerHTML = '<p class="why">' + esc(String(e)) + '</p>'; }
}

// Replace the whole "Live right now" pick list, in order. [] clears every
// explicit pick (home then falls back entirely to recently-active markets).
async function setFeatured(slugs) {
  try {
    const r = await fetch("/api/admin/featured", {
      method: "POST", headers: admHeaders({ "content-type": "application/json" }), body: JSON.stringify({ slugs }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { alert(j.error || "couldn't update the featured markets"); return; }
    loadCommunity();
  } catch (e) { alert(String(e)); }
}

async function toggleDetail(btn) {
  const mkt = btn.closest(".mkt"), panel = mkt.querySelector(".mktdetail");
  if (panel.dataset.open === "1") { panel.style.display = "none"; panel.dataset.open = ""; btn.textContent = "manage / view positions ▾"; return; }
  panel.style.display = "block"; panel.dataset.open = "1"; btn.textContent = "hide ▴";
  await loadMarketDetail(btn.dataset.slug, panel);
}

// The inside-the-market view: on-chain address, pool split, every position, and
// a payout preview for BOTH outcomes — so resolve is done with full visibility.
async function loadMarketDetail(slug, panel) {
  panel.innerHTML = '<p class="why">loading…</p>';
  try {
    const r = await fetch("/api/community/market/" + encodeURIComponent(slug), { headers: admHeaders() });
    const d = await r.json();
    if (!r.ok) { panel.innerHTML = '<p class="why">' + esc(d.error || "failed") + '</p>'; return; }
    const oc = d.onchain && d.onchain.minted
      ? 'minted ✓ — <a href="' + esc(d.onchain.explorer) + '" target="_blank" rel="noopener">' + esc(d.onchain.pubkey) + ' ↗</a>'
      : 'skipped (no Solana artifact)';
    const close = d.closesAt ? new Date(d.closesAt).toLocaleString() : '—';
    const split = d.pool.poolYesPct == null ? 'no bets yet' : (d.pool.poolYesPct + '% YES / ' + (100 - d.pool.poolYesPct) + '% NO');
    const rows = d.positions.length
      ? d.positions.map((p) => '<div class="variant"><span class="vtext">' + esc(p.handle)
          + ' · <b>' + p.side.toUpperCase() + '</b> · ' + p.tokens + ' tok @ ' + (p.entryPct == null ? '?' : p.entryPct + '%') + '</span>'
          + '<span class="why" style="white-space:nowrap">' + (p.closed ? ('paid ' + (p.proceeds || 0)) : ('→ ' + p.payoutIfWin + ' if ' + p.side.toUpperCase() + ' wins')) + '</span></div>').join("")
      : '<p class="why">no positions yet.</p>';
    const done = d.resolvedOutcome;
    panel.innerHTML =
        '<p class="why">slug <b>' + esc(d.slug) + '</b> · closes ' + esc(close) + '</p>'
      + '<p class="why">on-chain: ' + oc + '</p>'
      + '<p class="why" style="margin-top:6px"><b>Pool</b> — YES ' + d.pool.totalYes + ' tok (' + d.pool.playersYes + ' players) · NO ' + d.pool.totalNo + ' tok (' + d.pool.playersNo + ' players) · split ' + split + ' · set odds ' + d.yesPct + '% YES</p>'
      + '<p class="why"><b>Payout preview</b> — if <b>YES</b> resolves: ' + d.preview.ifYes.totalPayout + ' tok to ' + d.preview.ifYes.winners + ' winner(s) · if <b>NO</b>: ' + d.preview.ifNo.totalPayout + ' tok to ' + d.preview.ifNo.winners + ' winner(s)</p>'
      + '<p class="vhead" style="margin-top:8px">positions (' + d.positions.length + ')</p><div class="variants">' + rows + '</div>'
      + (done
          ? '<p class="why" style="margin-top:6px"><b>Resolved ' + String(done).toUpperCase() + '</b> — positions settled.</p>'
          : '<div class="row" style="margin-top:8px">'
            + '<button class="ghost rz" data-slug="' + esc(d.slug) + '" data-o="yes" data-pay="' + d.preview.ifYes.totalPayout + '" data-win="' + d.preview.ifYes.winners + '">resolve YES (pays ' + d.preview.ifYes.totalPayout + ' to ' + d.preview.ifYes.winners + ')</button>'
            + '<button class="ghost rz" data-slug="' + esc(d.slug) + '" data-o="no" data-pay="' + d.preview.ifNo.totalPayout + '" data-win="' + d.preview.ifNo.winners + '">resolve NO (pays ' + d.preview.ifNo.totalPayout + ' to ' + d.preview.ifNo.winners + ')</button>'
            + '</div>');
    panel.querySelectorAll(".rz").forEach((b) => { b.onclick = () => resolveMarket(b.dataset.slug, b.dataset.o, Number(b.dataset.pay), Number(b.dataset.win)); });
  } catch (e) { panel.innerHTML = '<p class="why">' + esc(String(e)) + '</p>'; }
}

async function resolveMarket(slug, outcome, payout, winners) {
  const summary = Number.isFinite(payout) ? ('\n\nThis pays ' + payout + ' tokens to ' + winners + ' winner(s).') : '';
  if (!confirm('Resolve ' + outcome.toUpperCase() + '?' + summary + '\nSettles all positions and cannot be undone.')) return;
  try {
    const r = await fetch("/api/community/resolve", {
      method: "POST", headers: admHeaders({ "content-type": "application/json" }), body: JSON.stringify({ slug, outcome }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { alert(j.error || "resolve failed"); return; }
    alert('Resolved ' + outcome.toUpperCase() + ' — ' + (j.settled != null ? j.settled + ' position(s) settled.' : 'done.'));
    loadCommunity();
  } catch (e) { alert(String(e)); }
}
loadCommunity();
</script>
</body>
</html>
