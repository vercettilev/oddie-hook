<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>oddie overlay</title>
<style>
/* THE OVERLAY: one card for OBS, on a transparent page.
   A gaming stream's viewer watches the game, not the chat, so the call has to
   be on the picture: the question, the split, how to answer, and for a moment
   after it settles, who was right. Nothing else, and nothing at all between
   calls: an empty overlay is the correct one.
   Fonts come from the same files as the app (latin only here: the card is
   read at a glance from across a room, not studied). */
@font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/anton-latin.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:400 800;font-display:swap;src:url('/fonts/nunito-latin.woff2') format('woff2')}
:root{
  --yellow:#FCF604; --pink:#FF2D78; --ink:#0B0D04; --cream:#FBFCF4;
  --display:'Anton','Arial Narrow','Helvetica Neue',Helvetica,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --w:520px;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font-family:var(--body);color:var(--cream);-webkit-font-smoothing:antialiased;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
body[data-pos="tl"]{justify-content:flex-start}
body[data-pos="tr"]{justify-content:flex-start;align-items:flex-end}
body[data-pos="br"]{align-items:flex-end}
#card{width:var(--w);transform-origin:bottom left;display:none}
body[data-pos="tl"] #card{transform-origin:top left}
body[data-pos="tr"] #card{transform-origin:top right}
body[data-pos="br"] #card{transform-origin:bottom right}
#card.on{display:block;animation:in .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(var(--s,1))}to{opacity:1;transform:translateY(0) scale(var(--s,1))}}
.box{background:var(--ink);border:4px solid var(--cream);box-shadow:8px 8px 0 var(--pink);padding:16px 20px 18px}
.k{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:0 0 8px}
.k b{color:var(--yellow)}
.k .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 rgba(255,45,120,.7);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 10px rgba(255,45,120,0)}}
.q{font-family:var(--display);font-size:34px;line-height:1.02;text-transform:uppercase;letter-spacing:.01em;margin:0 0 14px;color:var(--cream);word-wrap:break-word}
.bar{height:22px;background:rgba(255,255,255,.14);border:2px solid var(--cream);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--yellow);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.n{display:flex;justify-content:space-between;font-family:var(--display);font-size:24px;line-height:1;margin:8px 0 0;text-transform:uppercase}
.n .y{color:var(--yellow)}.n .no{color:var(--pink)}
.how{margin:12px 0 0;font-size:15px;font-weight:700;color:rgba(255,255,255,.8)}
.how code{font-family:var(--mono);background:var(--yellow);color:var(--ink);padding:2px 7px;border-radius:4px;font-weight:800}
.res{margin:0;font-family:var(--display);font-size:44px;line-height:1;text-transform:uppercase}
.res.y{color:var(--yellow)}.res.n{color:var(--pink)}
.res small{display:block;font-family:var(--body);font-size:16px;font-weight:700;text-transform:none;color:rgba(255,255,255,.85);margin-top:8px}
.top{margin:14px 0 0;padding:10px 0 0;border-top:2px solid rgba(255,255,255,.18);display:grid;gap:4px}
.top div{display:flex;justify-content:space-between;font-size:15px;font-weight:800}
.top div span:last-child{font-family:var(--mono);color:var(--yellow)}
.top .h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:800}
</style>
<body data-pos="bl">
<div id="card"><div class="box" id="box"></div></div>
<script>
(function () {
  var path = location.pathname.replace(/\/overlay\/?$/, "").split("/");
  var P = path[2], SLUG = decodeURIComponent(path[3] || "");
  var qs = new URLSearchParams(location.search);
  var pos = qs.get("pos"); if (/^(tl|tr|bl|br)$/.test(pos || "")) document.body.dataset.pos = pos;
  var scale = Math.max(0.5, Math.min(2.5, Number(qs.get("scale")) || 1));
  var top = qs.get("top") === null ? 3 : Math.max(0, Math.min(5, Number(qs.get("top")) || 0));
  var RESULT_MS = 25000;   // how long a settled call stays on the picture
  var card = document.getElementById("card"), box = document.getElementById("box");
  card.style.setProperty("--s", scale); card.style.transform = "scale(" + scale + ")";
  var data = null, lastHtml = "", shownResult = "";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function standings(j) {
    var st = (j.standings || []).slice(0, top);
    if (!st.length) return "";
    return '<div class="top"><span class="h">Standings</span>' + st.map(function (s) {
      return "<div><span>#" + s.rank + " " + esc(s.username) + "</span><span>" + s.points + "</span></div>";
    }).join("") + "</div>";
  }
  function countdown(c) {
    if (c.timed === false) return "open until it's settled";
    var ms = new Date(c.closesAt).getTime() - Date.now();
    if (ms <= 0 || c.locked) return "locked";
    var s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " left";
  }

  function paint() {
    var j = data; if (!j) return;
    var html = "";
    var c = j.current;
    var r = (j.recent || [])[0];
    var fresh = r && r.settledAt && Date.now() - new Date(r.settledAt).getTime() < RESULT_MS;
    if (c) {
      var t = c.yes + c.no, y = t ? c.yesPct : 50;
      html = '<p class="k"><span class="dot"></span><b>' + (c.locked ? "Calls are in" : "Live call") + "</b><span>" + (c.locked ? "result next" : countdown(c)) + "</span></p>"
        + '<p class="q">' + esc(c.question) + "</p>"
        + '<div class="bar"><i style="width:' + y + '%"></i></div>'
        + '<p class="n"><span class="y">Yes ' + (t ? c.yesPct : 0) + "%</span><span>" + t + (t === 1 ? " call" : " calls") + '</span><span class="no">No ' + (t ? 100 - c.yesPct : 0) + "%</span></p>"
        + (c.locked ? "" : '<p class="how">Type <code>!yes</code> or <code>!no</code> in chat. Earlier calls score more.</p>')
        + standings(j);
    } else if (fresh) {
      var tt = r.yes + r.no, pct = tt ? Math.round((r.yes / tt) * 100) : 0;
      var side = r.outcome === "yes" ? pct : 100 - pct;
      html = '<p class="k"><b>Settled</b><span>' + esc(r.question) + "</span></p>"
        + '<p class="res ' + (r.outcome === "yes" ? "y" : "n") + '">It\'s ' + esc(String(r.outcome).toUpperCase())
        + "<small>" + (tt ? side + "% of " + tt + " called it" + (r.points ? ", up to +" + r.points : "") : "No calls on this one") + "</small></p>"
        + standings(j);
    } else if ((j.waiting || []).length) {
      var w = j.waiting[0], wt = w.yes + w.no;
      html = '<p class="k"><span class="dot"></span><b>Calls are in</b><span>result next</span></p>'
        + '<p class="q">' + esc(w.question) + "</p>"
        + '<div class="bar"><i style="width:' + (wt ? w.yesPct : 50) + '%"></i></div>'
        + '<p class="n"><span class="y">Yes ' + (wt ? w.yesPct : 0) + "%</span><span>" + wt + (wt === 1 ? " call" : " calls") + '</span><span class="no">No ' + (wt ? 100 - w.yesPct : 0) + "%</span></p>";
    }
    if (html === lastHtml) return;
    // A repaint is a new bar: carry the old width over so a vote glides.
    var was = box.querySelector(".bar i"), wasQ = box.querySelector(".q");
    var from = was && wasQ && c && wasQ.textContent === c.question ? was.style.width : "";
    var wasOn = card.classList.contains("on");
    box.innerHTML = html; lastHtml = html;
    card.classList.toggle("on", !!html);
    if (html && !wasOn) { card.style.animation = "none"; void card.offsetWidth; card.style.animation = ""; }
    var bar = box.querySelector(".bar i");
    if (bar && from && from !== bar.style.width) { var to = bar.style.width; bar.style.width = from; void bar.offsetWidth; bar.style.width = to; }
  }

  function load() {
    return fetch("/api/live/" + P + "/" + encodeURIComponent(SLUG), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) { data = j; paint(); } })
      .catch(function () {});
  }
  load();
  setInterval(load, 3000);
  setInterval(paint, 1000);   // the countdown and the result's 25 seconds
})();
</script>
</body>
</html>
