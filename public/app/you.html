<main class="wrap">
  <!-- THE WAY BACK, which this page alone did not have. Every other page
       carries one; the profile is also the page most often reached through a
       wallet's in-app browser, opened by a deep link that starts a fresh
       session - so the browser's own back chevron has nothing behind it and
       somebody who came to check their money is simply stranded. -->
  <a class="backfeed" href="/markets">&larr; All markets</a>
  <h1>Your profile <img class="hsticker" src="/brand/st-riding.webp" alt=""></h1>
  <p class="sub" id="sub"></p>
  <!-- Signed in as, and the way out. The masthead chip says who you are on
       every page; this is the one page that also has to let you stop being
       them. Same pattern the Genesis page already uses. -->
  <p class="idstrip" id="idstrip" hidden>
    <b class="idstrip__chip" id="idhandle">@you</b>
    <button class="idstrip__out" id="idout" type="button">Sign out</button>
  </p>
  <!-- ABOVE the tickets and outside #view, for the same reason the tickets are:
       every state of this page rewrites #view wholesale. Money outranks the
       ticket book, so it sits above it. -->
  <section class="payout" id="payout" hidden></section>
  <div id="view"><p class="load">Checking for a wallet…</p></div>
  <!-- OUTSIDE #view on purpose. Every state of this page rewrites #view
       wholesale - the X gate, the wallet gate, the error, the list - and a
       balance that only survives one of them is a balance nobody sees. It is
       also wallet-independent: tags are keyed to the X handle, so somebody
       who has never connected a wallet still has five. -->
  <section class="tix" id="tix" hidden>
    <div class="tix__row">
      <p class="tix__n"><b id="tixn">&mdash;</b> <span id="tixlabel">tickets left</span></p>
    </div>
    <p class="tix__spent" id="tixspent" hidden></p>
    <p class="tix__why" id="tixwhy"></p>
  </section>
  <p class="pushask" id="pushask" hidden></p>
</main>

<link rel="stylesheet" href="/app/money.css">
<script src="/app/id.js"></script>
<script src="/app/push.js"></script>
<script src="/app/me.js"></script>
<script src="/chain.js"></script>
<script>
(function () {
  var view = document.getElementById("view");
  var sub = document.getElementById("sub");

  /* What the server says about the chain layer: whether it is on, which
     cluster, and the creator-fee rate. Held here so load() can read the rate
     without a second request and without this file keeping its own copy of a
     number the server owns. Null until the boot fetch lands, and the fee copy
     falls back to a rate-free sentence rather than guessing. */
  var CHAIN_STATUS = null;

  /* SIGNED IN AS, AND THE WAY OUT.
     disconnectDevice() drops this browser's device_account row and nothing
     else: the account, its canonical device, the Genesis profile and every
     settled call survive, and reconnecting through the same OAuth door
     repoints them back. Nothing here is destructive, which is why it asks for
     no confirmation. It does sign the WALLET link out too, since that link is
     a row on the same device, so the label promises a sign-out and not an
     X-only one. */
  (window.OddieMe || Promise.resolve({ accounts: [] })).then(function (me) {
    var tw = ((me && me.accounts) || []).filter(function (a) { return a.provider === "twitter"; })[0];
    if (!tw || !tw.handle) return;
    var strip = document.getElementById("idstrip");
    document.getElementById("idhandle").textContent = "@" + String(tw.handle).replace(/^@+/, "");
    strip.hidden = false;
    document.getElementById("idout").addEventListener("click", function () {
      var did = (window.OddieId && window.OddieId.get()) || "";
      fetch("/api/auth/disconnect", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ deviceId: did }),
      }).then(function () { location.href = "/profile"; })
        .catch(function () { location.href = "/profile"; });
    }, { once: true });
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[<>&"]/g, function (c) {
      return { "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c];
    });
  }
  /* toFixed(3) turns anything under 0.0005 SOL into "0.000", and the trailing
     strip then leaves the literal "0". /api/chain/creator-fees only ever
     returns fees ABOVE zero (src/server.ts drops creatorFeeLamports <= 0), so
     that is a real amount somebody is owed being shown to them as nothing.
     Floored instead of rounded: a small number is small, not absent. */
  var SOL = function (l) {
    var n = l / 1e9;
    if (n > 0 && n < 0.001) return "<0.001";
    return n.toFixed(3).replace(/0+$/, "").replace(/\.$/, "") || "0";
  };
  var C = function () { return window.OddieChain || null; };

  /* THE X GATE. This page is the social layer, so it asks for X first: cheap,
     no money, and anyone arriving from Genesis has already done it. The wallet
     is asked for after, at the point it pays. Off when the server did not
     stamp the page (APP_X_GATE=false), so loosening it never needs a deploy. */
  var XGATE = !!document.querySelector('meta[name="oddie-xgate"]');
  function xgate() {
    var did = (window.OddieId && window.OddieId.get()) || "";
    sub.textContent = "";
    // The gate IS the ask. A "Connect X" pill above it is the same question
    // twice on one screen.
    var chip = document.querySelector(".top .mechip");
    if (chip) chip.hidden = true;
    view.innerHTML = '<div class="gate">'
      /* NOT AN ARCHETYPE STICKER. st-main is THE MAIN CHARACTER, which is one
         of the nine things Genesis tells somebody they are AFTER they connect.
         On the screen that asks them to connect it does two wrong things at
         once: it claims a result nobody has earned, and it spoils the reveal
         that is the entire reason to press the button. This one is about the
         @ and the tag, which is what connecting X is FOR, and it says nothing
         about who the reader turns out to be. */
      + '<img class="gsticker" src="/brand/st-tag.webp" alt="">'
      + "<p>Your calls, under your name. The wallet comes later.</p>"
      + '<a class="big" id="xconnect" href="/api/auth/twitter/start?deviceId=' + encodeURIComponent(did)
      + '&return=%2Fprofile">Continue with X</a>'
      + '<button class="later" id="later" type="button">I\'ll do this later</button>'
      + "</div>";
    // "Later" here means: go straight to the wallet. The page is wallet-scoped
    // anyway; X only adds the name. Remembered for a week, cross-host.
    document.getElementById("later").addEventListener("click", function () {
      if (window.OddieId && window.OddieId.remember) window.OddieId.remember("xlater", "1", 7);
      sub.textContent = "";
      if (chip) chip.hidden = false;
      load();
    });
  }

  /**
   * WHAT IS WAITING, SAID ONCE, AT THE TOP.
   *
   * Two shapes, because they are two different pieces of news. A winner is told
   * they won. A loser is told the truth that nobody has ever told them: their
   * position account has been holding a real rent deposit since the day they
   * bet, claim_winnings carries `close = owner`, and pressing the button gives
   * it back. That is the first reason a loser has ever had to come back.
   *
   * Marked seen as soon as it is DRAWN, which clears the masthead badge on
   * every other page. Seen is not claimed: the section below stays the
   * authority on what is still owed, and it keeps saying so forever.
   */
  function payoutAlert(list) {
    var box = document.getElementById("payout");
    if (!box) return;
    box.hidden = true;
    if (!list || !list.length) return;
    var wins = list.filter(function (o) { return o.won; }).length;
    var rent = list.length - wins;
    var head, line;
    if (wins) {
      head = wins === 1 ? "You won." : "You won " + wins + " of them.";
      line = "The pool is holding money that is yours. Collecting is one signature and it is paid on chain.";
      if (rent) line += " " + (rent === 1 ? "One other settled market" : rent + " other settled markets")
        + " still hold your deposit.";
    } else {
      head = rent === 1 ? "One market of yours settled." : rent + " markets of yours settled.";
      line = "That side did not come in, so there is nothing from the pool. Your position deposit is still"
        + " sitting there though, and collecting gives it back.";
    }
    box.innerHTML = "<h2>" + esc(head) + "</h2><p>" + esc(line) + "</p>";
    box.hidden = false;

    var did = (window.OddieId && window.OddieId.get()) || "";
    if (did) {
      fetch("/api/chain/payouts/seen", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ deviceId: did }),
      }).catch(function () {});
    }
  }

  /**
   * ASK FOR THE ONE THING THAT REACHES SOMEBODY WHO IS NOT LOOKING.
   *
   * A market settles weeks after the bet. By then there is no page open, so the
   * only ways a winner learns are coming back unprompted or a notification.
   *
   * NEVER CALLS THE BROWSER'S PROMPT ON ITS OWN. A permission dialog is
   * answered once and a denial is close to permanent, so the real API fires
   * only from a tap on this line; somebody who is not interested just does not
   * tap, and the door stays open for a better day.
   *
   * IPHONE GETS A DIFFERENT SENTENCE BECAUSE IT HAS A DIFFERENT ANSWER. Safari
   * exposes neither Notification nor PushManager until a site has been added to
   * the home screen, so there is no permission to ask for yet and the honest
   * thing is to say what the actual step is. Not shown inside X's browser,
   * where that step does not exist either.
   */
  function pushAsk(hasSkin) {
    var box = document.getElementById("pushask");
    if (!box) return;
    var P = window.OddiePush;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent || "");
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

    /* ON IPHONE, EVERY ROUTE TO "THIS PERSON BETS" IS CLOSED IN THE ONE PLACE
       THEY COULD BE ASKED, and the order of these checks is the whole fix.
       A wallet is only injected inside Phantom's browser. Push only exists in
       standalone Safari. The bridge between those two storage contexts is an X
       sign-in - and Safari does not share a session with the X app, while X
       does not hand its own OAuth page to its own app, so that bridge is the
       hardest thing on the platform. Three conditions that can never be true at
       once.
       So the instruction that unlocks it comes FIRST and is not gated on
       anything. It was behind the very check it exists to make passable, which
       meant the only iOS route to push was closed by the page that was trying
       to open it. */
    if (ios && !standalone) {
      // Safari's own share sheet is the only place that step exists; X's
      // in-app browser has no "Add to Home Screen" at all, so telling somebody
      // there to look for it sends them hunting for a menu item that is not
      // on their screen.
      var inApp = /FBAN|FBAV|Instagram|Twitter|Line\//i.test(navigator.userAgent || "");
      box.innerHTML = inApp
        ? "<span>A market can settle weeks after you bet. Open this in Safari and add it to your home screen, and oddie can tell you when yours does.</span>"
        : "<span>A market can settle weeks after you bet. Tap <b>Share</b>, then <b>Add to Home Screen</b>, and oddie can tell you when yours does.</span>";
      box.hidden = false;
      return;
    }

    if (!P || !P.supported) return;

    /* ADDING US TO A HOME SCREEN IS A STRONGER SIGNAL THAN A WALLET, and it is
       the only one available here. Somebody who put an icon on their home
       screen has already said they mean to come back, which is the thing the
       wallet check was ever a proxy for. */
    if (standalone) hasSkin = true;

    /* A LIVE WALLET CONNECTION IS THE WRONG TEST even where one is possible:
       positions are read from the wallet injected into THIS browser, while a
       LINKED wallet is answered by the server from the device. Same person,
       one fewer thing that has to be true at this instant. */
    if (!hasSkin && window.OddieMe) {
      window.OddieMe.then(function (j) {
        var w = (j && j.accounts || []).some(function (a) { return a.provider === "phantom"; });
        if (w) pushAsk(true);
      });
      return;
    }
    if (!hasSkin) return;

    /** The "it is on" state, with the one control that proves it. A person who
     *  has granted permission has no other way to find out whether a
     *  notification will actually arrive, and the alternative to a button is
     *  discovering it the first time they win. */
    function showOn() {
      box.innerHTML = "<span>Notifications on. You will hear when one of your markets settles.</span>"
        + '<button type="button" id="pushtest">Send a test</button>';
      box.hidden = false;
      document.getElementById("pushtest").addEventListener("click", function () {
        var b = document.getElementById("pushtest");
        b.disabled = true; b.textContent = "Sending…";
        P.test().then(function (sent) {
          b.textContent = sent ? "Sent" : "Did not send";
          // Re-enabled either way: a failure is exactly when somebody wants to
          // try again, and a dead button after one is a dead end.
          setTimeout(function () { b.disabled = false; b.textContent = "Send a test"; }, 3000);
        });
      });
    }

    /* ALREADY ON IS ITS OWN STATE, and askable() returns false for it, so
       without this the line simply vanished for everybody who had said yes -
       with no way left to check it still worked. */
    P.subscribed().then(function (on) {
      if (on) return showOn();
      return P.askable().then(function (ok) {
        if (!ok) return;
        box.innerHTML = "<span>A market can settle weeks after you bet. Get told when yours does.</span>"
          + '<button type="button" id="pushgo">Turn on</button>';
        box.hidden = false;
        document.getElementById("pushgo").addEventListener("click", function () {
          var b = document.getElementById("pushgo");
          b.disabled = true; b.textContent = "Asking…";
          P.ask().then(function (done) {
            /* SUBSCRIBED, not merely permitted. A browser can grant and then
               fail to subscribe, and telling somebody they will be notified
               when nothing is listening is worse than never asking. */
            if (done) {
              showOn();
              try { localStorage.removeItem("oddie.push.owed"); } catch (e) { /* private mode */ }
            } else {
              box.hidden = true;
            }
          });
        }, { once: true });
      });
    });
  }

  function gate(msg, deepLink) {
    /* A BUTTON THAT CANNOT SUCCEED MUST NOT BE THE LOUD ONE.
       "Connect wallet" was drawn unconditionally. On a phone arriving from X
       there is no injected provider and there never will be - iOS gives one
       only inside a wallet's own browser - so the tap called connect(), got the
       mobile refusal, and re-rendered the gate with the same button still on
       it. Lev, on his phone: "connect wallet tetiklenmiyor, open in phantom
       çalışıyor." It was firing perfectly and failing invisibly, which is
       worse than a dead button, because a dead button at least looks dead.
       Asked up front now. Where a provider can exist, Connect is the loud
       control and the deep link is the fallback. Where one cannot, they swap:
       the thing that works is the button, and Connect is not offered at all. */
    var canConnect = C() && C().canConnectHere ? C().canConnectHere() : true;
    var link = deepLink || (C() && C().deepLink && !canConnect ? C().deepLink() : null);

    // The fee block rides along BELOW the ask. Somebody who has not connected
    // anything is exactly the person who does not yet know that opening a
    // market pays them, and putting that behind the wallet gate meant it only
    // ever reached people who had already gone through it.
    view.innerHTML = '<div class="gate">'
      + '<img class="gsticker" src="/brand/st-decide.webp" alt="">'
      + "<p>" + esc(canConnect ? msg
          : "Open oddie inside Phantom to see what you have riding. It picks up right here.") + "</p>"
      + (canConnect
          ? '<button class="big" id="connect" type="button">Connect wallet</button>'
            + (link ? '<a class="deep" href="' + esc(link) + '">Open in Phantom</a>' : "")
          : (link ? '<a class="big" href="' + esc(link) + '">Open in Phantom</a>' : "")
            + '<button class="later" id="tryanyway" type="button">Try connecting here instead</button>')
      + "</div>"
      + feesSection(null, false);

    var cb = document.getElementById("connect");
    if (cb) cb.addEventListener("click", function () {
      cb.disabled = true; cb.textContent = "Connecting…";
      C().connect().then(load).catch(function (e) {
        gate(e.message, e.deepLink || null);
      });
    });

    /* THE ESCAPE HATCH STAYS, quietly. isMobileNoWallet is a user-agent guess
       plus the absence of window.solana, and a guess that is wrong strands
       somebody who does have a provider we failed to see. Small, and it does
       exactly what the old loud button did. */
    var ta = document.getElementById("tryanyway");
    if (ta) ta.addEventListener("click", function () {
      ta.disabled = true; ta.textContent = "Connecting…";
      C().connect().then(load).catch(function (e) {
        ta.disabled = false;
        ta.textContent = "No wallet answered here";
      });
    });
  }

  /** One position, whether it is riding or ready to collect. */
  function row(o, kind) {
    // EVERY bit is its own element. .row__m is a flex row and `gap` only
    // separates element children, so a bare string joins onto its neighbour
    // with nothing between them ("RESOLVED YESYOU WERE RIGHT").
    var cell = function (t) { return "<span>" + t + "</span>"; };
    /* Trailing zeros off, and never rounding UP: a figure printed beside
       somebody's money has to be one the chain can actually pay. */
    var sol4 = function (n) { return String(Math.floor(n * 1e4) / 1e4); };
    /* BOTH LEGS, when there are two. A wallet can hold each side of a market
       now, and `side` comes back null when it does, so the old ternary drew
       the NO pill for a hedger and then printed their TOTAL beside it: the
       wrong side and a number that belongs to neither. Each leg gets its own
       pill and its own figure, which is also the only honest way to show a
       position that is deliberately on both. */
    var yesLeg = Number(o.amountYes != null ? o.amountYes : (o.side === "yes" ? o.lamports : 0));
    var noLeg = Number(o.amountNo != null ? o.amountNo : (o.side === "no" ? o.lamports : 0));
    var bits = [];
    if (yesLeg > 0 && noLeg > 0) {
      bits.push('<span class="y">YES</span>', cell("<b>" + SOL(yesLeg) + " SOL</b>"),
                '<span class="n">NO</span>', cell("<b>" + SOL(noLeg) + " SOL</b>"));
    } else {
      bits.push(noLeg > 0 ? '<span class="n">NO</span>' : '<span class="y">YES</span>');
      bits.push(cell((kind === "claim" ? "staked <b>" : "<b>") + SOL(o.lamports) + " SOL</b>"));
    }
    if (kind === "open") {
      if (o.entryPct != null) bits.push(cell("in at " + o.entryPct + "%"));
      // Omitted rather than invented when the market could not be read.
      var pool = o.pool ? o.pool.yes + o.pool.no : 0;
      // Only when there IS one side. "% on your side" means nothing to somebody
      // holding both, and picking one of them would be a number about a
      // position they do not have.
      if (pool > 0 && o.side) bits.push(cell(Math.round((100 * (o.side === "yes" ? o.pool.yes : o.pool.no)) / pool) + "% on your side now"));
      // The label moved into the button below, because a cell reading "refund
      // open" beside no control was the whole bug: the product announced an
      // exit and did not give anybody the door to it.
    } else {
      bits.push(cell("ended " + String(o.outcome || "").toUpperCase()));
      /* "YOU WERE RIGHT" IS A CLAIM ABOUT A CALL, AND A HEDGE MADE NONE.
         Measured on the first real settlement: a wallet holding 0.1 on each
         side was told it was right, two cells after the row printed both legs.
         The record's honesty is the only thing this product sells, so it does
         not get to flatter a position that took both sides. */
      var hedged = o.amountYes > 0 && o.amountNo > 0;
      bits.push(cell(hedged ? "you held both sides" : o.won ? "you were right" : "you lost it"));
    }
    /* AN OPEN REFUND WINDOW IS MONEY, SO IT GETS A BUTTON.
       Nobody settled this market and the 30 day window has passed, so the
       program's permissionless refund_after_deadline pays the whole stake back
       plus the position deposit. That server route has existed, fully guarded,
       with ZERO callers, while this row printed the words "refund open" and
       offered nothing to press. */
    var canRefund = kind === "open" && o.refund && o.refund.openNow;
    /* THE WAY OUT BEFORE THE MARKET ENDS, and the only one a pari-mutuel can
       have. Paying somebody out of the vault takes the money from whoever was
       right, so this is a transfer: the next person who wants that side pays
       face for the seat and the pool does not move. It is an OFFER, not an
       exit -- if nobody comes, the money stays here -- and the sheet says so.
       One side per button: a wallet holding both gets two, because "sell your
       seat" has to mean one seat. */
    var sellBtns = "";
    if (kind === "open") {
      [["yes", yesLeg], ["no", noLeg]].forEach(function (pair) {
        if (pair[1] <= 0) return;
        sellBtns += '<button class="go go--rent sell" data-slug="' + esc(o.slug)
          + '" data-side="' + pair[0] + '" data-lamports="' + pair[1] + '" type="button">Sell your '
          + pair[0].toUpperCase() + " seat</button>";
      });
    }
    var act = kind === "open"
      ? (canRefund ? '<button class="go go--rent refund" data-slug="' + esc(o.slug) + '" type="button">Take your stake back</button>' : "")
        + sellBtns
        + '<a class="open" href="/m/' + encodeURIComponent(o.slug) + '">Open the market</a>'
      /* THE FIGURE, ON THE CONTROL THAT PAYS IT.
         The one screen where money moves said "Collect winnings" and never how
         much, while the operator console two tabs away could state it to four
         decimals. The server works it out with claim_winnings' own arithmetic
         and sends it; null means the chain could not be read, and then the
         button says what it has always said rather than a number nobody
         measured. */
      : '<button class="go' + (o.won ? "" : " go--rent") + '" data-slug="' + esc(o.slug) + '" data-outcome="' + esc(o.outcome) + '"'
        + (o.payoutLamports != null ? ' data-pay="' + (o.payoutLamports / 1e9) + '"' : "")
        + ' type="button">'
        + (o.won
            ? (o.payoutLamports != null
                ? (o.refund ? "Take back " : "Collect ") + sol4(o.payoutLamports / 1e9) + " SOL"
                : "Collect winnings")
            : "Get your deposit back") + "</button>"
        + '<a class="open" href="/m/' + encodeURIComponent(o.slug) + '">Open the market</a>';
    return '<div class="row' + (kind === "claim" && o.won ? " row--win" : "") + '">'
      + '<p class="row__q">' + esc(o.question) + "</p>"
      + '<p class="row__m">' + bits.join("") + "</p>"
      + '<div class="act">' + act + "</div></div>";
  }

  /* "We could not check N of these" is the whole point of the read layer:
     an unreadable position is not an absent one, and a winner must never be
     told they have nothing because an RPC blinked. */
  /* WE DID NOT GET AN ANSWER, which is a different sentence from "there is
     nothing". blind() speaks for accounts the chain read could not decode;
     this speaks for a whole request that never came back. Both refuse to
     render an absence as a zero, which is the rule the read layer exists for. */
  function unread(what) {
    return '<div class="blind">We could not read ' + esc(what)
      + " just now. Nothing is wrong with your money; try again in a moment.</div>";
  }

  function blind(n, what) {
    if (!n) return "";
    return '<div class="blind">We could not read <b>' + n + "</b> " + esc(what)
      + ". Your money is safe.</div>";
  }

  /* YOUR FEES, DRAWN IN EVERY STATE, INCLUDING BEFORE A WALLET EXISTS.
     Lev: "fee si hic olmayan bir adama bile bunu gosterebiliriz... fee
     toplayabilecegini anlasin iyice diye." It used to appear only when there
     was money in it, so the one thing it teaches -- that opening markets pays
     you -- reached nobody who had not already been paid. Then it still only
     appeared behind the wallet gate, which is the wrong side of the door: the
     person who most needs to learn this has not connected anything yet.

     WHAT THE ZERO STATE MAY SAY. /api/chain/creator-fees returns only
     UNCLAIMED, resolved, non-zero fees whose on-chain creator is this exact
     wallet, so it physically cannot tell "never earned" apart from "earned it
     and already collected it". "Nothing to collect right now" is honest,
     because collectable is exactly what the endpoint measures. "0 SOL earned"
     would not be: it is a false statement about somebody who has been paid.
     Every other number that would look like a measurement of this person --
     opened, pending, expected -- is unreachable from anywhere in this
     codebase, so none is printed.

     The one number is the RATE, from the server (/api/chain/status), not a
     constant in this file: it is written per market at creation and never
     rewritten, so a stale local copy would describe a deal nobody was offered.

     @param fees      the /api/chain/creator-fees payload, or null
     @param connected whether a wallet is on this device at all */
  function feesSection(fees, connected) {
    var fs = (fees && fees.fees) || [];
    var unreadable = fees && fees.unreadable;
    // null is a fetch that failed, not a measured zero. Without this the block
    // prints "Nothing to collect yet" over a vault that is holding somebody's
    // fee -- a positive false statement about money, in the one section whose
    // whole rule is to say only what was actually measured.
    var answered = fees !== null && fees !== undefined;
    var feeRate = (CHAIN_STATUS && CHAIN_STATUS.creatorFeeBps) || 0;
    // Six words instead of a sentence. It still carries the qualifier that
    // matters -- the TAG is what opens a market that can pay you, and a market
    // with no tagger handle is minted at 0 bps and never pays anyone.
    var rule = feeRate
      ? "Tag <b>@oddiefun</b>, keep <b>" + (feeRate / 100) + "%</b> of the pool."
      : "Tag <b>@oddiefun</b>, keep a cut of the pool.";

    var out = "<section><h2>Your fees</h2>" + blind(unreadable, unreadable === 1 ? "settled market" : "settled markets");

    if (!connected) {
      // No wallet, so nothing about THIS person is knowable. The rule is still
      // true and is the whole reason the block is here; the second line says
      // what would make it personal.
      out += '<p class="empty">' + rule + "</p>";
      return out + "</section>";
    }

    if (!fs.length) {
      if (!answered) {
        out += unread("your fees");
      } else if (!unreadable) {
        // Suppressed when blind() is already saying we could not read some of
        // them: "nothing to collect" and "we could not check N" side by side is
        // two answers to one question.
        out += '<p class="empty">Nothing to collect yet.'
          + '<img class="psticker" src="/brand/st-rocket.webp" alt="">'
          + '<span class="empty--quiet">' + rule + '</span></p>';
      }
    } else {
      out += fs.map(function (f) {
        // A row that names an amount owed MUST carry the control that collects
        // it. The audit found this row with only an "Open the market" link,
        // which sent people to a page whose one button ran the position-claim
        // flow and told them they had no stake here.
        return '<div class="row row--win"><p class="row__q">' + esc(f.question) + "</p>"
          + '<p class="row__m"><span><b>' + SOL(f.lamports) + " SOL</b></span>"
          + "<span>" + (f.feeBps / 100) + "% for opening it</span></p>"
          + '<div class="act"><button class="go fee" data-slug="' + esc(f.slug) + '" type="button">Collect your fee</button>'
          + '<a class="open" href="/m/' + encodeURIComponent(f.slug) + '">Open the market</a></div></div>';
      }).join("");
    }

    /* CONNECTED BUT NOT LINKED, ASKED INSIDE THE SECTION THAT EXPLAINS WHY.
       Signing is the ONLY thing that writes this wallet into a market's
       on-chain `creator` field, so an unlinked wallet cannot be paid a fee no
       matter how many markets its owner opened. It matters more since the
       stake path stopped signing automatically: connecting a wallet to place a
       bet no longer links it, so this is the main door to being named as a
       creator at all.

       `=== false` and not `!linked()`: null means we have not checked yet, and
       a page that asks an already-linked person to link again reads as broken.
       It can still be wrong in the safe direction, since a blinked
       /api/auth/me resolves to false and a second signature costs nothing. */
    if (C().linked() === false) {
      out += '<div class="linkme"><p>One signature, free. Then markets you open can pay you.</p>'
        + '<button class="go" id="linkme" type="button">Link this wallet</button></div>';
    }
    return out + "</section>";
  }

  /* WHICH READ IS STILL THE CURRENT ONE.
     load() fires three chain reads that take seconds against a public RPC and
     then writes their result into #view unconditionally. Anything that
     re-enters load() in that window -- and the wallet Disconnect does exactly
     that, from a button painted BEFORE the reads start -- gets its render
     overwritten when the old promise finally lands. In the disconnect case
     that means the just-disconnected wallet's positions and live "Collect"
     buttons replace the connect gate, with no wallet named above them and no
     connect control anywhere, recoverable only by reloading.
     Every read carries the generation it was issued in and the address it was
     issued for, and a stale one throws its answer away. */
  var loadGen = 0;
  /** How many times a stranded read has re-entered load(). Bounded so a wallet
   *  that keeps changing cannot turn recovery into a spin. */
  var heals = 0;

  /**
   * A CHAIN READ THAT NEVER ANSWERS IS THE COMMONEST FAILURE ON A PHONE, and
   * fetch has no timeout of its own.
   *
   * The three reads on this page are fast against the server (measured: under a
   * second each) and can still hang in a mobile WebView - suspended while the
   * wallet app is in front, a network that dropped between the request and the
   * response. With no timeout the promise simply never settles, which is
   * indistinguishable on screen from a read still in progress, forever.
   *
   * Twelve seconds, then null, which is the same thing a refusal produces and
   * which the caller already knows how to say out loud.
   */
  function getJSON(url, ms) {
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = null;
    /* RACED, NOT JUST ABORTED, and the difference is the whole point. Aborting
       assumes the abort makes fetch REJECT, which a WKWebView suspended behind
       a wallet app does not reliably do: the signal fires, the request is
       dropped, and the promise settles never. Then the timeout is as stuck as
       the thing it was guarding. A timer that RESOLVES cannot be ignored. */
    var timeout = new Promise(function (res) {
      timer = setTimeout(function () { if (ctl) { try { ctl.abort(); } catch (e) {} } res(null); }, ms || 12000);
    });
    var live = fetch(url, ctl ? { signal: ctl.signal } : undefined)
      .then(function (r) { return r.json(); })
      .catch(function () { return null; });
    return Promise.race([live, timeout]).then(function (v) { clearTimeout(timer); return v; });
  }

  /**
   * ONE SENTENCE, ONE BUTTON, AND ONE PLACE THAT WRITES THEM.
   *
   * Three callers need the same thing: take the loading line down, say what
   * went wrong, and leave something to press. It had already been typed out by
   * hand twice, and the third copy is what turned it into a function. Only the
   * sentence differs; the reassurance about the money and the retry are the
   * same promise every time, and they are not the part to get creative with.
   */
  function failView(sentence) {
    view.innerHTML = '<div class="err">' + sentence + ' Nothing is wrong with your money. '
      + '<button class="errgo" id="retry" type="button">Try again</button></div>';
    var rb = document.getElementById("retry");
    if (rb) rb.addEventListener("click", function () { heals = 0; load(); }, { once: true });
  }

  /**
   * AND A WATCHDOG ON THE WORDS THEMSELVES, because every guarantee above is a
   * guarantee about a promise.
   *
   * "Finding your bets…" has now outlived two separate fixes on a real phone.
   * Each one closed the failure it was written for and the sentence stayed, so
   * the next one is not another theory about which promise misbehaved: it
   * watches the SCREEN. If that line is still the whole of the view some
   * seconds after it was written, whatever was supposed to replace it is not
   * coming, and the page says so instead of implying work still in progress.
   */
  function watchLoading(gen) {
    setTimeout(function () {
      if (gen !== loadGen) return;                       // a newer load owns the page
      var l = view.querySelector(".load");
      if (!l || view.children.length !== 1) return;      // something rendered
      failView("We could not read your bets just now.");
    }, 16000);
  }

  function load() {
    var w = C().wallet();
    var myGen = ++loadGen;
    var myPk = w ? w.publicKey : null;
    var current = function () { 
      var now = C().wallet();
      return myGen === loadGen && (now ? now.publicKey : null) === myPk;
    };
    if (!w) return gate("Connect your wallet to see what you have riding. We never hold your money.");
    /* TWO CONTROLS, BECAUSE THEY ARE TWO THINGS.
       The identity control below signs this browser out of its account, which
       takes the X handle AND the wallet's signature link with it, because
       device_account is keyed by device_id alone and the whole graph hangs off
       one row. It does NOT disconnect the wallet, and never did: nothing ever
       called provider.disconnect(), so Phantom's approval survived and the
       trusted probe reconnected on the next load.
       This one is the missing half. It revokes the browser's approval and
       forgets the address, which is what somebody switching wallets or handing
       over a laptop is actually asking for. */
    sub.innerHTML = "Wallet <b>" + esc(C().short(w.publicKey)) + "</b>"
      + ' <button class="idstrip__out" id="wout" type="button">Disconnect wallet</button>';
    var wo = document.getElementById("wout");
    if (wo) wo.addEventListener("click", function () {
      wo.disabled = true;
      C().forgetWallet().then(function () { sub.textContent = ""; load(); });
    }, { once: true });
    view.innerHTML = '<p class="load">Finding your bets…</p>';
    watchLoading(myGen);

    var pk = encodeURIComponent(w.publicKey);
    Promise.all([
      getJSON("/api/chain/claimable?userPubkey=" + pk),
      getJSON("/api/chain/open?userPubkey=" + pk),
      getJSON("/api/chain/creator-fees?creatorPubkey=" + pk),
    ]).then(function (r) {
      /* A STALE ANSWER MUST NOT BE PAINTED, AND A STRANDED PAGE MUST NOT BE
         LEFT EITHER. This used to return and nothing else, on the assumption
         that whatever made it stale is now rendering in its place. That holds
         when a newer load() is running; it does NOT hold when the wallet simply
         changed underneath, and then "Finding your bets…" sits there forever
         with no error, no retry and no way out but a reload. Measured on a
         phone: the wallet named above the line, the line below it, permanently.
         Healed once, and only when nothing newer is in flight, so a flickering
         wallet cannot spin this. */
      if (!current()) {
        if (myGen === loadGen && heals < 2) { heals++; load(); }
        return;
      }
      var claim = r[0], open = r[1], fees = r[2];
      if (!claim && !open && !fees) {
        /* AND A BUTTON, because "try again in a moment" with nothing to press
           is an instruction to reload a page somebody may not realise they can
           reload. */
        failView("We could not reach Solana just now.");
        return;
      }
      var html = "";

      var cl = (claim && claim.claimable) || [];
      /* DECLARED HERE, NOT FORTY LINES DOWN, AND THE DIFFERENCE WAS A CRASH.
         `var op` used to be assigned after pushAsk read op.length. var hoists
         the DECLARATION, not the assignment, so at that line op was undefined,
         .length threw, the whole .then() died, nothing rendered - and "Finding
         your bets…" sat on a phone forever. Three fixes chased that sentence
         (a timeout, a heal, a watchdog) and each treated a symptom of this one
         line, which was mine. */
      var op = (open && open.open) || [];
      /* THE ALERT, drawn from the read this page was already doing.
         No new request and no new number: `won` comes off the chain via
         /api/chain/claimable, which is the only thing that knows whether a
         wallet's winning leg was non-zero. The payout AMOUNT is deliberately
         absent - it depends on the pool's totals, which this payload does not
         carry, and a figure invented here would be a figure about somebody's
         money. The count is true and the button is the action. */
      payoutAlert(cl);
      /* Asked of somebody who HAS something in the product, and nobody else. A
         wallet with no history has nothing to be notified about, and a
         permission spent on them is a permission gone. */
      pushAsk(cl.length > 0 || op.length > 0);
      var blindClaim = claim && claim.unreadable, blindOpen = open && open.unreadable;
      // A NULL PAYLOAD IS A FAILED FETCH, NOT AN EMPTY LIST. Both are [] after
      // the `|| []` above, and `unreadable` is null rather than a count, so
      // every "nothing here" test below would pass for a read that never
      // happened. The all-three-null case is caught above; ONE failing is not,
      // and that is the case where a winner with unclaimed SOL gets told they
      // have nothing.
      var readClaim = claim !== null, readOpen = open !== null;

      /* NOTHING AT ALL: ONE BLOCK WITH THE TWO THINGS TO DO.
         Lev: "cuzdan baglayinca neler yapabilecegimi gosteren ekran daha
         obvious olmali. suan anlasilmiyor." A wallet with no history was
         getting three empty dashed boxes in a row, each of which described
         an absence and none of which said what to do about it. When BOTH
         position lists are genuinely empty they collapse into one block that
         names the two actions and gives them buttons.

         Only when the reads were CLEAN. An unreadable position is not an
         absent one, so if either count is non-zero the real sections render
         and blind() gets to say so. */
      if (readClaim && readOpen && !cl.length && !op.length && !blindClaim && !blindOpen) {
        html += '<section><h2>Nothing riding yet</h2>'
          + '<div class="start"><img class="ssticker" src="/brand/st-grass.webp" alt="">'
          + '<p>Take a side.</p>'
          + '<div class="start__go"><a class="big" href="/markets">See open markets</a>'
          + '<a class="alt" href="/genesis">Open your own market &rarr;</a></div></div>'
          + "</section>";
      } else {
        var wins = cl.filter(function (o) { return o.won; });
        /* Only when there is something to say. A heading over "Nothing to
           collect right now" was a section whose entire content was its own
           absence; the read was clean and the list was empty, so nothing. */
        if (cl.length || !readClaim || blindClaim) {
          html += '<section id="collect"><h2>Ready to collect' + (wins.length ? " <b>" + wins.length + "</b>" : "") + "</h2>"
            + blind(blindClaim, (blindClaim === 1 ? "settled market" : "settled markets") + (cl.length ? " beyond these" : ""))
            + (cl.length ? cl.map(function (o) { return row(o, "claim"); }).join("")
                         : unread("settled markets"))
            + "</section>";
        }

        var riding = op.reduce(function (a, o) { return a + o.lamports; }, 0);
        html += "<section><h2>On the line" + (riding ? " <b>" + SOL(riding) + " SOL</b>" : "") + "</h2>"
          + blind(blindOpen, "of your positions")
          + (op.length ? op.map(function (o) { return row(o, "open"); }).join("")
                       : !readOpen ? unread("your positions")
                       : '<p class="empty">Nothing riding. Tag @oddiefun under a claim on X.'
                         + '<img class="psticker" src="/brand/st-grass.webp" alt=""></p>')
          + "</section>";
      }

      html += feesSection(fees, true);

      /* WHERE WHAT YOU JUST COLLECTED WENT.
         Collecting emptied this page: the section vanished, the empty state
         said "nothing riding yet", and the only page that still knew what had
         happened was linked from a dialog the reader had already closed. One
         line, always true whatever state the page is in, at the foot of the
         money rather than inside any one section of it. */
      if (myPk) {
        html += '<p class="recordline"><a href="/w/' + encodeURIComponent(myPk)
          + '">Your whole record &rarr;</a></p>';
      }

      view.innerHTML = html;

      var lk = view.querySelector("#linkme");
      if (lk) lk.addEventListener("click", function () {
        lk.disabled = true; lk.textContent = "Check your wallet…";
        C().link().then(load).catch(function (e) {
          lk.disabled = false; lk.textContent = "Link this wallet";
          lk.parentNode.querySelector("p").textContent = e.message || "That did not go through. Nothing changed.";
        });
      });

      Array.prototype.forEach.call(view.querySelectorAll(".go.fee"), function (b) {
        b.addEventListener("click", function () {
          b.disabled = true;
          C().collectCreatorFee(b.dataset.slug, function (t) { b.textContent = t; })
            .then(function (r) {
              b.outerHTML = '<span class="done">' + (r.confirmed ? "Collected" : "Sent, still confirming")
                + ' &middot; <a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(C().short(r.signature)) + " &#8599;</a></span>";
            })
            .catch(function (e) {
              b.disabled = false; b.textContent = "Collect your fee";
              var m = b.closest(".row").querySelector(".row__m");
              if (m) m.innerHTML += "<span>" + esc(e.message || "Something went wrong, try again.") + "</span>";
            });
        });
      });
      // #linkme is a .go too, so it matched this selector and picked up the
      // claim listener ON TOP of its own: pressing "Link this wallet" also
      // called openClaim(undefined, undefined) and threw a bogus resolved-market
      // sheet over the page. It is the only .go that is not a position row.
      Array.prototype.forEach.call(view.querySelectorAll(".go.sell"), function (b) {
        b.addEventListener("click", function () {
          C().openSell(b.dataset.slug, b.dataset.side, Number(b.dataset.lamports));
        });
      });
      Array.prototype.forEach.call(view.querySelectorAll(".go.refund"), function (b) {
        b.addEventListener("click", function () { C().openRefund(b.dataset.slug); });
      });
      // .refund excluded below for the same reason #linkme is: it is a .go that
      // is not a settled-position row, and openClaim would refuse it with
      // "not-resolved" -- which is exactly the state a refund exists for.
      // .sell joins .refund and #linkme in the exclusion list for the same
      // reason: it is a .go that must not be wired to the claim handler, which
      // would answer "not-resolved" for a market that is deliberately open.
      Array.prototype.forEach.call(view.querySelectorAll(".go:not(.fee):not(.refund):not(.sell):not(#linkme)"), function (b) {
        b.addEventListener("click", function () {
          // The figure travels with the click: the profile already asked the
          // server what this pays, and the sheet has no pool of its own to
          // work it out from.
          C().openClaim(b.dataset.slug, b.dataset.outcome,
            b.dataset.pay ? Number(b.dataset.pay) : null);
        });
      });
    }).catch(function (e) {
      /* A NET UNDER THE RENDER, AND THE BUG ABOVE IS WHY IT EXISTS.
         Nothing here can arrive from a failed request: getJSON catches its own
         fetch and hands back null, and the all-three-null case is answered
         forty lines up. The only way into this handler is an exception thrown
         while DRAWING the page - which is exactly what `op.length` on a
         hoisted-but-unassigned var did, and the whole .then() died mid-render
         with "Finding your bets…" still on screen. The watchdog would have
         said so eventually, sixteen seconds later. This says it now.
         It also says it to the console, because what made that bug expensive
         was not the throw. It was that nothing, anywhere, reported it. */
      if (myGen !== loadGen) return;                     // a newer load owns the page
      if (window.console && console.error) console.error("[you] the page failed to draw", e);
      failView("We could not read your bets just now.");
    });
  }

  // chain.js is loaded synchronously above, so OddieChain is already here.
  // The cluster comes from the server and is passed in: without it the money
  // sheet labels the network from chain.js's default, and a label about
  // whether this is real money is not a thing to guess.
  if (!C()) {
    view.innerHTML = '<div class="err">Something did not load. Reload the page.</div>';
  } else {
    var did = (window.OddieId && window.OddieId.get()) || "";
    Promise.all([
      fetch("/api/chain/status").then(function (r) { return r.json(); }).catch(function () { return null; }),
      XGATE && did
        ? fetch("/api/auth/me?deviceId=" + encodeURIComponent(did)).then(function (r) { return r.json(); }).catch(function () { return null; })
        : Promise.resolve(null),
    ]).then(function (r) {
      var status = r[0], me = r[1];
      CHAIN_STATUS = status;
      C().init(status && status.cluster);
      // Gate closed and no X on this device: ask for X. An unreachable
      // /api/auth/me is NOT treated as "no X" — that would lock out somebody
      // who is connected because a request blinked — so the page proceeds.
      var hasX = !me || !Array.isArray(me.accounts) || me.accounts.some(function (a) { return a.provider === "twitter"; });
      var skipped = !!(window.OddieId && window.OddieId.recall && window.OddieId.recall("xlater"));
      if (XGATE && me && !hasX && !skipped) return xgate();

      /* THE CHAIN LAYER CAN BE OFF, AND THAT IS NOT A BLIP.
         status.enabled was fetched and dropped on the floor. With real stakes
         switched off the server does not register /api/chain/claimable, /open
         or /creator-fees at all, so all three fetches 404, all three land as
         null, and the page printed "We could not reach the chain just now,
         try again in a moment" -- an invitation to keep reloading a thing that
         is not coming back. Worse, before that it asked for a wallet connect
         to fund a read that cannot happen.
         Only `false` counts. A status fetch that itself failed leaves this
         undefined, and the page proceeds exactly as it did, because a blinked
         request is not evidence that trading is off. */
      if (status && status.enabled === false) {
        sub.textContent = "";
        view.innerHTML = '<div class="err">Betting is switched off right now. '
          + 'Nothing is wrong with your money, and anything you have already staked '
          + 'is still in its market. <a href="/markets">See the markets</a></div>';
        return;
      }
      load();
    });
  }

  /* ASKED FROM ONE PLACE THAT ALWAYS RUNS, and the alternative is why this took
     three goes. load() has five exits - the X gate, the wallet gate, the
     chain-is-off notice, the unreachable-chain error, the positions render -
     and the ask was called from the last of them, which is the one iPhone users
     never reach. Every attempt to fix it by adding another call site added
     another branch to forget. It needs nothing from the render: the wallet, the
     platform and the install state are all things it can see for itself.
     load() still calls it again with what it learned, because having positions
     is better evidence than any of that, and a second call simply redraws the
     same box. */
  pushAsk(false);

  /* THE TAG BALANCE, ON ITS OWN REQUEST AND ITS OWN TIMELINE.
     Deliberately not joined to the Promise.all above. That chain can end in
     four different returns - the X gate, the chain-off notice, an error - and
     hanging the balance off it would mean the number vanished in exactly the
     states where somebody is most likely to be looking for it. It is also the
     one thing on this page that does not need a wallet or a chain: tags are
     keyed to the X handle, so they are readable the moment you have connected
     X and nothing else.
     Silent on failure. A balance we could not read is not zero, and a page
     that guesses at somebody's remaining chances is worse than one that says
     nothing. */
  (function tags() {
    var did = (window.OddieId && window.OddieId.get()) || "";
    if (!did) return;
    fetch("/api/genesis/me?deviceId=" + encodeURIComponent(did))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var st = j && j.profile && j.profile.standing;
        if (!st || typeof st.ticketsLeft !== "number") return;
        var left = st.ticketsLeft;
        var box = document.getElementById("tix");
        document.getElementById("tixn").textContent = String(left);
        document.getElementById("tixlabel").textContent = left === 1 ? "ticket left" : "tickets left";
        if (left === 0) box.className = "tix tix--out";

        /* WHAT BECAME OF THE SPENT ONES. Opening a market and burning a tag on
           a take we could not price are opposite outcomes, and a bare "3 left"
           hides which of the two somebody has been doing - which is the whole
           lesson the charge was added to teach. Only the non-zero parts, so a
           clean record reads as one short line rather than three zeroes. */
        var parts = [];
        if (st.marketsOpened) parts.push("<b>" + st.marketsOpened + "</b> became markets");
        if (st.tagsBurnt) parts.push("<b>" + st.tagsBurnt + "</b> missed");
        if (st.ticketsBack) parts.push("<b>" + st.ticketsBack + "</b> came back");
        var spent = document.getElementById("tixspent");
        // One span per fact, so the flex row wraps BETWEEN them. Joined as one
        // text run it wrapped mid-phrase and left a stranded "1" at the end of
        // a line on a phone.
        if (parts.length) {
          spent.innerHTML = parts.map(function (t) { return "<span>" + t + "</span>"; }).join("");
          spent.hidden = false;
        }

        /* THE REFUND RULE, WRITTEN DOWN SOMEWHERE AT LAST.
           Tags come back when a market you opened brings somebody new in, and
           until this line that fact existed only in the ledger code and in one
           clause of one reply. At zero it stops being a rule and becomes the
           only thing left to do, so it is said as an instruction and the slab
           turns. */
        var mine = (j.profile.opened || []);
        document.getElementById("tixwhy").innerHTML = left > 0
          ? "Every new bettor in a market you opened brings one back, up to five. "
            + "A yes-or-no with a date spends one."
          : mine.length
            /* There IS a way back, and it is one specific market rather than a
               vague gesture at the board: the newest one they opened, linked,
               because "share the ones you opened" with no link is a chore and
               this is the moment they most want to do it. */
            ? "One new bettor in a market you opened brings a ticket back. "
              + '<a href="/m/' + encodeURIComponent(mine[0].slug) + '">Share the last one you opened</a>'
            /* And sometimes there is not one. Five tickets spent without a
               single market means nothing can bring one back, and telling this
               person otherwise would be the one lie on the page. */
            : "All five went on takes we could not price. "
              + "Tickets come back when a market you opened brings somebody new in.";
        box.hidden = false;
      })
      .catch(function () {});
  })();
})();
</script>
<script>
/* NOBODY HAS BEEN RIGHT YET, SO DO NOT SEND ANYONE TO LOOK.
   The board is a list of settled calls and no market has ever settled, so its
   only possible content today is one sentence saying so. The server stamps
   oddie-noboard when it knows the count is zero; unknown leaves the link alone,
   because hiding a board that has real names on it is the worse mistake.
   The link, not the page: /board still answers, so a shared link keeps working
   and the moment the first market settles the item comes back on its own. */
(function(){
  if (!document.querySelector('meta[name="oddie-noboard"]')) return;
  // ALL of them, not the first. The market page carries a second copy of the
  // nav at the foot now (the masthead's is gone on a phone), and a singular
  // query hid the one at the top and left the one at the bottom pointing at an
  // empty board. Every page gets the plural form, because the next page to grow
  // a second link should not have to rediscover this.
  var links = document.querySelectorAll('.top a[href="/board"], nav a[href="/board"], a[href="/board"]');
  Array.prototype.forEach.call(links, function (a) { a.hidden = true; });
})();
</script>
