<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Collect your 2% · oddie</title>
<!--
  Reached only from a private chat with the bot: the URL carries a 30-minute
  token that binds a wallet to one Telegram user's markets. It is never posted
  in a group, because anybody holding it could point that person's 2% at their
  own wallet.

  Most people arrive here inside Telegram's in-app browser, where no wallet is
  injected. The first control on that screen therefore reopens this exact page
  inside Phantom's own browser (phantom.app/ul/browse), where the flow simply
  continues. Nothing private travels in that link except the short-lived token
  this page already has.
-->
<style>
  :root{
    --ground:#0B0D04; --panel:#15180B; --line:#2A2E17;
    --cream:#FBFCF4; --dim:#A9AE8C; --yellow:#D7DC1F; --pink:#FF2D78;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--cream)}
  body{font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
  main{width:100%;max-width:420px}
  .mark{display:flex;align-items:center;gap:10px;margin:0 0 28px}
  .mark img{width:36px;height:36px}
  .mark b{font:800 22px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;text-transform:uppercase}
  h1{font-size:30px;line-height:1.1;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
  h1 em{font-style:normal;color:var(--yellow)}
  p{margin:0 0 14px;color:var(--dim)}
  p b{color:var(--cream);font-weight:600}
  .btn{display:block;width:100%;margin:22px 0 10px;padding:16px 18px;border:0;border-radius:14px;
    background:var(--yellow);color:var(--ground);font:800 17px/1 ui-sans-serif,system-ui,sans-serif;
    text-align:center;text-decoration:none;cursor:pointer}
  .btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
  .btn[disabled]{opacity:.55;cursor:default}
  .note{font-size:13.5px}
  .ok{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin:22px 0 0}
  .ok code{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--yellow)}
  .err{color:var(--pink)}
  @media (prefers-reduced-motion:no-preference){ .btn{transition:transform .08s ease} .btn:active{transform:scale(.98)} }
</style>
</head>
<body>
<main>
  <div class="mark"><img src="/brand/mark.webp" alt=""><b>oddie</b></div>
  <h1>Collect your <em>2%</em></h1>
  <p>Every market you open on Telegram pays you 2% of its pool when it settles. Connect the wallet it should go to.</p>
  <p class="note">Markets you already opened count too, even ones that have closed.</p>
  <div id="act"></div>
</main>
<script>
(function () {
  var act = document.getElementById("act");
  var token = new URLSearchParams(location.search).get("t") || "";
  var BOT = "__BOT__"; // injected by the server from getMe, so a renamed bot needs no edit here

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function short(a) { return a.slice(0, 4) + "…" + a.slice(-4); }
  function say(html) { act.innerHTML = html; }
  // One line, rewritten on each failure. Appending stacked the same sentence
  // three times under the button and read as three separate problems.
  var errLine = null;
  function fail(text) {
    if (!errLine || !errLine.isConnected) {
      errLine = document.createElement("p");
      errLine.className = "err note";
      errLine.setAttribute("role", "status");
      act.appendChild(errLine);
    }
    errLine.textContent = text;
  }
  // A failure inside the wallet never reaches the server on its own: the page
  // just stops before its next request. So the page says what broke.
  function report(stage, e) {
    try {
      fetch("/api/tg/earn/fail", {
        method: "POST", keepalive: true, headers: { "content-type": "application/json" },
        body: JSON.stringify({ t: token, stage: stage, code: e && e.code != null ? String(e.code) : null,
          msg: String((e && e.message) || e).slice(0, 200) }),
      }).catch(function () {});
    } catch (_) { /* reporting must never cost the person a retry */ }
  }
  function expired() {
    say('<p class="err" style="margin-top:22px">This link has expired. Send <b>/earn</b> to <b>@' + BOT
      + '</b> for a fresh one.</p><a class="btn" href="https://t.me/' + BOT + '?start=earn">Open the bot</a>');
  }

  if (!token) { expired(); return; }

  var provider = (window.phantom && window.phantom.solana) || window.solana;
  var hasPhantom = Boolean(provider && provider.isPhantom);
  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (!hasPhantom) {
    if (mobile) {
      var here = location.href;
      var deep = "https://phantom.app/ul/browse/" + encodeURIComponent(here) + "?ref=" + encodeURIComponent(location.origin);
      say('<a class="btn" href="' + esc(deep) + '">Open in Phantom</a>'
        + '<p class="note">This page opens inside Phantom, where you connect in one tap.</p>');
    } else {
      say('<a class="btn" href="https://phantom.app/download" target="_blank" rel="noopener">Get Phantom</a>'
        + '<p class="note">Then open this link again. It works for 30 minutes.</p>');
    }
    return;
  }

  say('<button class="btn" id="go" type="button">Connect Phantom</button>'
    + '<p class="note">You sign a message to prove the wallet is yours. It does not approve a transaction and cannot move any funds.</p>');

  document.getElementById("go").addEventListener("click", async function () {
    var b = this;
    var stage = "connect";
    b.disabled = true; b.textContent = "Connecting…";
    try {
      var conn = await provider.connect();
      var address = conn.publicKey.toString();

      stage = "challenge";
      var cr = await fetch("/api/tg/earn/challenge", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ t: token, address: address }),
      });
      if (cr.status === 401) return expired();
      if (!cr.ok) throw new Error("challenge " + cr.status);
      var ch = await cr.json();

      b.textContent = "Sign in Phantom…";
      stage = "sign";
      var signed = await provider.signMessage(new TextEncoder().encode(ch.message), "utf8");
      // Hex, the same encoding the wallet sign-in sends, so one verifier serves both.
      var sig = Array.prototype.map.call(new Uint8Array(signed.signature), function (x) {
        return x.toString(16).padStart(2, "0");
      }).join("");

      stage = "link";
      var lr = await fetch("/api/tg/earn/link", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ t: token, address: address, nonce: ch.nonce, signature: sig }),
      });
      if (lr.status === 401) return expired();
      var out = await lr.json().catch(function () { return {}; });
      if (!lr.ok || !out.ok) throw new Error(out.error || ("link " + lr.status));

      var n = Number(out.markets || 0);
      say('<div class="ok"><p style="margin:0 0 8px;color:var(--cream)"><b>Linked.</b> Your 2% goes to <code>'
        + esc(short(address)) + '</code>.</p>'
        + '<p style="margin:0">' + (n ? (n === 1 ? "The market you opened is" : n + " markets you opened are") + " now set to pay you. " : "")
        + 'When one settles, collect it on your profile with this wallet.</p></div>'
        + '<a class="btn" href="/profile">Go to your profile</a>');
    } catch (e) {
      b.disabled = false; b.textContent = "Connect Phantom";
      var rejected = e && (e.code === 4001 || /reject|denied|cancel/i.test(String(e.message)));
      if (window.console) console.warn("[oddie] linking stopped at " + stage, e);
      report(stage, e);
      fail(rejected ? "Nothing was linked. Tap again whenever you're ready." : "That didn't go through. Try once more.");
    }
  });
})();
</script>
</body>
</html>
