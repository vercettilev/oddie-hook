  /* Before any CSS is applied, so the page never flashes the wrong theme at
     someone who chose dark. A stored choice wins; otherwise follow the system.
     Wrapped because private browsing can throw on localStorage access. */

    var t=null; try{ t=localStorage.getItem("oddie_theme"); }catch(e){}
    var dark = t==="dark" || (t!=="bright" && matchMedia("(prefers-color-scheme:dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "bright";
  })();

  /* Two families of colour, and the whole dark theme is the line between them.
   *
   * SURFACE tokens paint the things that carry the brand: a white fill inside a
   * chunky black outline. `--white`, `--ink`, `--wash`, `--bar`, `--accent` and
   * `--muted` belong to that family and DO NOT MOVE between themes. The YES/NO
   * rows, the tiles, the picker, the sheets and the desktop frame are all made
   * of them, so they look identical in both themes — which is the point. The
   * shared card on X is white with a black outline, and the app agrees with it.
   *
   * GROUND tokens paint what is behind and around those objects: the page, the
   * header, the tab bar, the rail, and any text that sits directly on them with
   * no surface underneath. Only these change.

   * reaches for it on the ground is a bug in dark mode — that is what `--muted-g`

    --col:560px;      /* the card column, shared by the header and the cards */
    --feedcol:500px;  /* the centred feed column (chips + cards) on every width */
    --rail:248px;     /* desktop left nav */
    --tabh:62px;      /* mobile bottom tab bar */
    /* Feed depth: the card is an elevated GROUND panel the white SURFACE tiles
       float on. `--feed-ground` sits behind the card so it reads as liftable. */
    --feed-ground:#E9F2D2; --card-surface:#FBFDF6; --card-line:#101010;
    --card-shadow:0 2px 5px rgba(35,55,15,.05), 0 12px 26px rgba(45,65,20,.11), 0 30px 56px rgba(45,65,20,.08);
    --feedtop:calc(env(safe-area-inset-top) + 96px);
    /* ---------------------------------------------------------- design system --
       One radius scale, one shadow scale, one type scale — reused across home,
       feed cards, permalink, profile and the og cards so nothing competes for
       attention that shouldn't. Hero text (questions, the Oddie Score) is the
       one thing allowed to be big; everything else steps down deliberately. */
    --r-xs:10px; --r-sm:14px; --r-md:18px; --r-lg:24px; --r-xl:30px;
    --shadow-chip:0 1px 2px rgba(30,45,10,.07), 0 3px 8px rgba(30,45,10,.06);
    --shadow-pop:0 2px 6px rgba(30,45,10,.09), 0 10px 24px rgba(40,60,15,.14);
    --fs-hero:min(38px,9.5vw); --fs-title:22px; --fs-body:15px; --fs-label:13px; --fs-caption:11.5px;
    /* Spacing scale, 8px base — every gap on a static page (Home first; the
       feed's own card-to-card rhythm has its own reasons and stays as-is)
       should be one of these, not a one-off value picked by eye. sp-1/2 group
       tightly-related content (a headline and its subtext); sp-4/5/6 separate
       distinct sections, largest gap for the biggest jump in the page. */
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:40px; --sp-6:48px}

  /* Deep, slightly warm near-black. Not #000: pure black next to a 4px pure-black
   * outline erases the outline, and the outline IS the brand. The ground has to
   * be dark enough that a white card reads as lit, and far enough from the ink
   * that the ink still draws. */
  /* Setting a ground colour on <body> poisons every surface that never declared
   * its own: a white tile inherited near-white text and its question vanished.
   * Surfaces carry the ink, always, in both themes. If you add a boxed element,
   * add it here — the audit checks contrast on the ones that exist. */
  .orow,.tile,.stat,.rep,.acct,.picker,.csheet,.seg,.segb,.promo,.lb,.bal,
  .cbtn,.amt,.amt-in,.confirm,.pcancel,.sellbtn,.avatar{color:var(--ink)}
  .cbtn.x{color:#fff}

  :root[data-theme="dark"]{
    --ground:#17141C; --ground-wide:#110F16; --ground-2:#1D1924; --fade:#17141C;
    --on-ground:#F3EFF6; --muted-g:#9C93AC; --line-g:#332C40; --hair-g:#2A2434;
    --chip-bg:transparent; --chip-bd:#4a5a20; --link-g:#CDF56B;
    /* On near-black the deep olives go invisible; the ground-level accent text
       (balance top-up, payout lines, stat keys) lifts to a light lime instead. */
    --acc-deep:#a8d84a; --acc-mid:#b7e558; --acc-deeper:#c8f06a;
    /* Elevated card panel sits above the deeper feed ground; heavier shadow. */
    --feed-ground:#0C0A11; --card-surface:#211D2A; --card-line:#39333F;
    --card-shadow:0 3px 10px rgba(0,0,0,.5), 0 22px 50px rgba(0,0,0,.62);
    --shadow-chip:0 1px 2px rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.3);
    --shadow-pop:0 2px 8px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--on-ground);font-family:'Fredoka',system-ui,sans-serif;overscroll-behavior:none}

  /* ---------------------------------------------------------------- shell -- */
  /* Mobile is one column and nothing else: `display:contents` dissolves the app
     grid and the frame, so .top keeps floating over a full-bleed scroller exactly
     as it always has. The desktop rules below are the only thing that assembles
     a rail / frame / aside layout out of the same markup. */
  .app,.frame{display:contents}
  .rail,.side,.watermark{display:none}

  .top{position:fixed;top:0;left:0;right:0;z-index:15;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--ground-2)}
  /* Only the feed wants the fade — a card runs edge to edge under it. The shells
     are lists, and a list sliding under a translucent gradient just looks broken. */
  /* On the feed the ground is a tint so the elevated card reads as liftable, and
     the header fades from that same tint (no seam as a card scrolls under it). */
  body[data-view="feed"]{background:var(--feed-ground)}
  body[data-view="feed"] .top{background:linear-gradient(var(--feed-ground) 74%, transparent)}
  body:not([data-view="feed"]) .top{border-bottom:2.5px solid var(--hair-g)}
  .top-in{max-width:var(--col);margin:0 auto;padding:0 6px}
  .brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
  .brand b{font-size:21px;font-weight:600}
  /* The logo+wordmark, now a real link home — grouped so the two keep their own
     8px gap (matching the old flat layout) while acting as one tap target. */
  .brandlink{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
  .brandlink:active{opacity:.82}

  /* The mark IS the logo — the Oddie ghost on its lime tile, baked into the art.
     A rounded square (app-icon shape), not a circle, so it reads as the same tile
     people see as the favicon and home-screen icon. `cover` fills the square. */
  .ghost{width:30px;height:30px;border-radius:7px;background:var(--mark) center/cover no-repeat;flex:none}
  /* A bigger centred mark for the taste interstitials (gate / not-listed). */
  .gmark{width:60px;height:60px;border-radius:13px;margin:0 auto 14px;background:var(--mark) center/cover no-repeat}

  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  /* Scroll affordance: a fade on the right edge hints the row keeps going. It
     fades out (.at-end) once there's nothing left to reveal, so it never sits on
     top of the final chip. Matches the header surface (--ground-2). */
  .chipswrap{position:relative}
  .chipswrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:34px;pointer-events:none;
    background:linear-gradient(to right, rgba(0,0,0,0), var(--ground-2));opacity:1;transition:opacity .18s ease}
  .chipswrap.at-end::after{opacity:0}
  .chip{flex:none;font-family:'Nunito';font-weight:800;font-size:12px;padding:7px 13px;border-radius:999px;
    border:2px solid var(--chip-bd);background:var(--chip-bg);color:var(--muted-g);cursor:pointer;white-space:nowrap;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .18s ease, color .18s ease, border-color .18s ease}
  .chip:active{transform:scale(.93)}
  /* Category header above each cluster of community markets in the grouped
     "For you" feed — same quiet label language as .psec ("Daily Call"),
     left-aligned since it sits inline in a scrolling list, not a page section.
     Not a snap stop (the swipe feed's own cards are) — it rides along with
     the first card of its cluster. */
  .catgroup-header{font-family:'Nunito';font-weight:800;font-size:13px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted-g);margin:22px 2px 10px;scroll-snap-align:none}
  /* Satisfying switch: the active chip fills solid accent and gives a little pop. */
  .chip.on{color:#000;border-color:var(--accent);background:var(--accent);transform:scale(1.05);
    box-shadow:0 2px 8px rgba(120,165,40,.35)}
  /* Community markets: honest signal + the on-chain proof badge. Both are filled
     SURFACE chips (backgrounds fixed across themes) with FIXED dark text, so they
     hold AA in both themes — the old --muted-g / --link-g text turned pale-on-pale
     and near-invisible on the dark card. commtag is neutral grey; the credibility
     badge keeps the lime tint. */
  .commtag{display:inline-block;font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.02em;
    padding:3px 9px;border-radius:999px;background:var(--bar);color:#48525d}
  .chainbadge{display:inline-flex;align-items:center;gap:4px;font-family:'Nunito';font-weight:800;
    font-size:10.5px;letter-spacing:.02em;color:#3c570b;text-decoration:none;white-space:nowrap;
    padding:3px 10px 3px 8px;border-radius:999px;background:var(--wash)}
  .chainbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 1.5px rgba(0,0,0,.22)}
  .chainbadge:active{transform:scale(.94)}
  /* The metadata row, as small pills with icons instead of flat grey text — the
     state ("forming", "closes in Nd", "$X in play") reads at a glance instead
     of competing with the question for attention at the same weight. One chip
     component, three uses. Text stays FIXED dark on a FIXED light chip surface
     (same AA rule as .commtag/.chainbadge — the surface never adapts to theme,
     so the text can't either). */
  .mchip{display:inline-flex;align-items:center;gap:5px;font-family:'Nunito';font-weight:800;
    font-size:12px;letter-spacing:.01em;color:#3c4550;white-space:nowrap;
    padding:4px 10px 4px 8px;border-radius:999px;background:var(--wash);box-shadow:var(--shadow-chip)}
  .mchip svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  /* Forming: a live pulsing dot says "still filling up" without a word doing the
     work — the same visual language a status indicator uses everywhere else. */
  .mchip-forming{color:#5c4300;background:#fff3d6}
  .mchip-forming .pulsedot{width:7px;height:7px;border-radius:50%;background:#e0a300;flex:none;
    box-shadow:0 0 0 0 rgba(224,163,0,.55);animation:pulsedot 1.8s ease-out infinite}
  :root[data-theme="dark"] .mchip-forming{color:#f5cf6b;background:#3a2c05}
  @keyframes pulsedot{0%{box-shadow:0 0 0 0 rgba(224,163,0,.55)}70%{box-shadow:0 0 0 7px rgba(224,163,0,0)}100%{box-shadow:0 0 0 0 rgba(224,163,0,0)}}
  @media (prefers-reduced-motion:reduce){.mchip-forming .pulsedot{animation:none}}
  /* Resolution criteria — kept for transparency but SECONDARY: a collapsed row
     UNDER the YES/NO buttons, not a headline block above them. The question and
     the tap targets lead; the full settlement wording is one tap away. */
  .rby{margin:12px 0 0}
  .rby>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-family:'Nunito';font-weight:800;font-size:11.5px;letter-spacing:.01em;
    color:var(--muted-g);padding:3px 0;user-select:none}
  .rby>summary::-webkit-details-marker{display:none}
  .rby>summary::before{content:"›";font-weight:900;font-size:14px;line-height:1;
    transition:transform .15s ease;display:inline-block}
  .rby[open]>summary::before{transform:rotate(90deg)}
  .rby-body{margin:8px 0 2px;font-family:'Nunito';font-weight:700;font-size:12px;line-height:1.45;
    color:var(--muted-g);border-left:2px solid var(--hair-g);padding-left:11px}
  .card.picking .rby{display:none}   /* stay out of the way once a side is chosen */
  /* Source tweet — permalink-only, sits above the question. Same surface/line
     tokens as the elevated card itself, not a competing block. */
  .srctweet{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:9px 12px;
    border-radius:var(--r-md);background:var(--card-surface);border:1.5px solid var(--hair-g);
    box-shadow:var(--shadow-chip);text-decoration:none}
  .srctweet-ico{flex:none;width:26px;height:26px;border-radius:50%;background:var(--card-line);
    display:flex;align-items:center;justify-content:center}
  .srctweet-ico svg{width:13px;height:13px;fill:var(--card-surface)}
  .srctweet-body{min-width:0;flex:1}
  .srctweet-lab{font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);color:var(--muted-g);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srctweet-lab b{color:var(--on-ground);font-weight:900}
  .srctweet-link{font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);color:var(--muted-g);
    display:inline-flex;align-items:center;gap:3px;margin-top:1px}
  /* "Who called what" — visually secondary, small rows below YES/NO. */
  .callers{margin:12px 0 0}
  .callers-lab{font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);color:var(--muted-g);
    margin:0 0 6px}
  .callers-list{display:flex;flex-direction:column;gap:5px}
  .caller-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);
    background:var(--card-surface);border:1px solid var(--hair-g);font-family:'Nunito'}
  .caller-handle{flex:1;min-width:0;font-weight:800;font-size:12.5px;color:var(--on-ground);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .caller-side{flex:none;font-weight:900;font-size:10.5px;letter-spacing:.02em;padding:2px 7px;
    border-radius:999px}
  .caller-side.yes{color:#1f7a3f;background:#dff5e6}
  .caller-side.no{color:#a3283d;background:#fbdfe4}
  :root[data-theme="dark"] .caller-side.yes{color:#7fe0a4;background:#0f3320}
  :root[data-theme="dark"] .caller-side.no{color:#f2a3b4;background:#3a1420}
  .caller-pct{flex:none;font-weight:800;font-size:11.5px;color:var(--muted-g);min-width:30px;text-align:right}
  .callers-more{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);
    margin:5px 2px 0}
  /* Challenge the other side — a core mechanic on the market page: a pre-filled
     X intent aimed at the claim's author. Secondary to YES/NO (outlined, not the
     lime primary), full width below them. Hidden once a side is being confirmed. */
  .challenge{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;
    margin:12px 0 0;font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--on-ground);
    background:transparent;border:2px solid var(--card-line);border-radius:14px;padding:11px 14px;
    cursor:pointer;transition:transform .1s ease,background .15s ease}
  .challenge:hover{background:var(--ground-2)}
  .challenge:active{transform:scale(.97)}
  .card.picking .challenge{display:none}
  /* Cold-visitor onboarding. A snap-aligned WRAP is the key: the scroller uses
     scroll-snap mandatory, which otherwise snaps straight to the first card on
     load and hides these above the fold. Making the wrap the first snap point
     (scroll-snap-align:start + matching scroll-margin-top) lands the viewport ON
     it at load — visible with no scroll. Carries the header clearance while
     present; when both rows are dismissed, .card:first-child reclaims it.
     Two distinct rows, dismissed independently. */
  .onbwrap{width:min(var(--feedcol), calc(100% - 24px));margin:var(--feedtop) auto 12px;
    display:flex;flex-direction:column;gap:8px;
    scroll-snap-align:start;scroll-margin-top:var(--feedtop)}
  /* tag instruction — fixed dark text on the fixed pale-lime wash (AA in both
     themes, same rule as .rby / .chainbadge). */
  /* One consolidated strip: primary tag instruction, with the follow pill riding
     inline as a secondary element (wrapping under the text on narrow screens
     rather than becoming a second banner). */
  .onbstrip{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:var(--wash);
    border:2px solid var(--card-line);border-radius:16px;padding:11px 14px;
    box-shadow:var(--card-shadow);font-family:'Nunito';font-weight:800;
    font-size:13px;line-height:1.35;color:#3c570b}
  /* The hero headline — one line, full width at the top of the banner. The
     positioning a first-timer reads on load; kept to a single tight line so it
     adds ~one line of height, not a section. */
  .onbstrip .onbhero{flex-basis:100%;font-family:'Fredoka';font-weight:600;
    font-size:16px;line-height:1.1;letter-spacing:-.01em;color:#17250a}
  .onbstrip .onbtxt{flex:1 1 60%;min-width:0}
  .onbstrip b{font-weight:900}
  .fbtn{flex:0 0 auto;text-decoration:none;background:var(--accent);color:#17250a;
    font-family:'Nunito';font-weight:900;font-size:12.5px;border-radius:999px;
    padding:6px 12px;white-space:nowrap;border:1.5px solid rgba(0,0,0,.28)}
  .fbtn:active{transform:scale(.95)}
  .onbx{flex:0 0 auto;border:none;background:transparent;color:currentColor;font-size:20px;
    line-height:1;cursor:pointer;padding:0 2px;font-weight:900;opacity:.6}
  .onbx:hover{opacity:1}
  .onbx:active{transform:scale(.9)}
  /* Daily claim — a secondary retention hook, deliberately quieter than the tag
     CTA (the primary action, with the points incentive, is what should hit the
     eye first). Used to fill solid --accent at full card size, the same
     brightness and near the same size as the CTA button — the two competed for
     "first thing you do here". Now a pale wash card with a small filled pill,
     not a second bright block. Fixed dark text on the fixed wash surface holds
     contrast in both themes, same rule as .mchip. */
  .claimcard{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 13px;
    border:1.5px solid var(--hair-g);font-family:'Nunito'}
  .claimcard.ready{background:var(--wash);color:#3c4550}
  .claimcard.done{background:var(--card-surface);color:var(--on-ground)}
  .cc-grow{flex:1;min-width:0}
  .cc-title{font-weight:900;font-size:13px;line-height:1.2}
  .cc-sub{font-weight:800;font-size:11.5px;margin-top:3px;opacity:.85}
  .cc-next{flex:0 0 auto;font-weight:900;font-size:12px;color:var(--muted-g);white-space:nowrap}
  /* The claimed confirmation collapses to a slim line after a few seconds — it's
     a receipt, not a standing CTA, so it shouldn't hold full banner height. */
  .claimcard.done{transition:padding .3s ease}
  .claimcard.done.cc-mini{padding:6px 12px}
  .claimcard.done.cc-mini .cc-sub{display:none}
  .claimcard.done.cc-mini .cc-title{font-size:12px}
  .claimbtn{flex:0 0 auto;border:1.5px solid rgba(0,0,0,.18);background:var(--accent);color:#17250a;
    font-family:'Nunito';font-weight:900;font-size:12.5px;border-radius:999px;padding:7px 13px;cursor:pointer}
  .claimbtn:active{transform:scale(.96)}
  .claimbtn:disabled{opacity:.6}

  /* The scroller is the feed when it snaps and a plain page when it doesn't. */
  .scroller{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scroll-padding-top:var(--feedtop);scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .scroller.snap{scroll-snap-type:y mandatory}
  .state{height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Nunito';font-weight:800;color:var(--muted-g);text-align:center;padding:24px}

  /* ------------------------------------------------------------------ feed -- */
  /* The card is now a physical object: an elevated panel inset from the ground,
     with a soft layered shadow, refined corners and a hairline outline. It sizes
     to leave the next card's edge peeking below (feed, not single screen), and
     centres its own content so there is no dead space. */
  .card{scroll-snap-align:start;scroll-margin-top:var(--feedtop);position:relative;
    width:min(var(--feedcol), calc(100% - 24px));margin:0 auto 18px;
    /* Fill the visible band — the viewport minus the fixed header and the bottom
       tab bar — and CENTER the content within it, so the question and the YES/NO
       tap targets always land fully visible around the middle of the screen, with
       no scrolling or guessing. `safe center` falls back to top-alignment if the
       content is ever taller than the band (tiny phone + long question), so the
       question can never be clipped under the header. dvh tracks X's in-app
       browser chrome as it grows/shrinks. */
    min-height:calc(100dvh - var(--feedtop) - var(--tabh) - env(safe-area-inset-bottom) - 30px);
    display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:0;
    background:var(--card-surface);border:2px solid var(--card-line);border-radius:var(--r-xl);
    box-shadow:var(--card-shadow);padding:24px 22px 22px;overflow:hidden;
    transform-origin:center center;will-change:transform,opacity;
    /* Scroll-driven depth (scale+fade) is set inline by the scroll handler; the
       short ease keeps it smooth between coarse scroll frames. */
    transition:transform .16s ease-out, opacity .16s ease-out, box-shadow .3s ease}
  .card:first-child{margin-top:var(--feedtop)}
  /* A layered surface, not a flat tile: a soft diagonal sheen across the top —
     the one "this was designed" cue a card gets for free, at rest, no motion.
     Very low-alpha so it reads as depth, not a visible stripe. */
  .card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(155deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 26%);
    border-radius:inherit}
  :root[data-theme="dark"] .card::before{background:linear-gradient(155deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 26%)}
  .card>*{position:relative;z-index:1}
  /* Stage 1 onboarding: a restrained pulse on the FIRST open-market card for a
     zero-position visitor — directional emphasis, not a modal, not a flashing
     "look here". A static ring (no pulse) under reduced motion still marks the
     card; it just doesn't move. */
  .firstcall-cue{border-color:var(--accent);
    box-shadow:var(--card-shadow), 0 0 0 3px rgba(182,240,95,.35)}
  @media (prefers-reduced-motion: no-preference){
    .firstcall-cue{animation:firstcallPulse 2.4s ease-in-out infinite}
  }
  @keyframes firstcallPulse{
    0%,100%{box-shadow:var(--card-shadow), 0 0 0 3px rgba(182,240,95,.35)}
    50%{box-shadow:var(--card-shadow), 0 0 0 7px rgba(182,240,95,.12)}
  }
  .scroller{padding-bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 10px)}
  /* Secondary tier — the category tag recedes below the hero question. Its
     background is the FIXED pale-lime --wash (same in both themes), so the text
     must be a FIXED solid dark, not the ground-adaptive --acc-mid (which lifted
     to light lime on dark and went pale-on-pale). One component, every category. */
  .cat{align-self:flex-start;font-family:'Nunito';font-weight:800;font-size:11px;letter-spacing:.03em;
    text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--wash);color:#201d16}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--muted-g);margin:0 0 18px}
  .pshare{font-family:'Nunito';font-weight:800;font-size:11.5px;color:#000;background:var(--accent);
    border:2px solid #000;border-radius:999px;padding:3px 12px;margin-left:8px;cursor:pointer;vertical-align:1px}
  .waitcta{display:inline-block;font-family:'Fredoka';font-weight:600;font-size:14px;color:#000;
    background:var(--accent);border:3px solid #000;border-radius:16px;padding:9px 15px;
    text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.16)}
  /* the post-call belonging line */
  .socline{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--link-g);margin-top:7px}
  /* The hero: the question commands — dramatically larger + tighter than every
     supporting element, which all sit at ~11-13px. That gap is the hierarchy. */
  .take{font-size:min(35px,9vw);font-weight:600;line-height:1.07;letter-spacing:-.025em;
    color:var(--on-ground);margin:12px 0 14px}
  .social{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted-g);margin:12px 0 0;min-height:16px}
  /* The upside, at the moment of decision. This line renders during the 5s
     undo window — BEFORE the call is final — so it leads with what they stand
     to win rather than restating what they staked. Full-strength ink and its
     own line: it's the reason to go through with it, not a caption. */
  .social .prepay{display:block;color:var(--on-ground);font-size:13.5px;margin-bottom:7px}
  .social .prepay b{font-weight:900}
  .social .prepay .prepay-mult{color:var(--muted-g);font-weight:700}
  /* the 5s undo window after a one-tap call: undo is a real button, change-amount a quiet link */
  .social .undo{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--ink);
    background:var(--wash);border:2.5px solid var(--ink);border-radius:999px;
    padding:4px 13px;margin-left:8px;cursor:pointer;font-variant-numeric:tabular-nums}
  .social .undo:active{transform:scale(.96)}
  .social .chgamt{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--link-g);
    background:none;border:0;padding:4px 2px;margin-left:10px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px}

  /* ---- taste-flow interstitials: the category picker and the sign-in gate.
     Same card surface, but content is centred instead of bottom-anchored, so a
     step in the feed reads as a moment, not a market. Both themes inherit the
     card tokens above. */
  .intercard{justify-content:center;align-items:center;text-align:center;gap:0}
  .ititle{font-family:'Fredoka';font-weight:600;font-size:min(26px,6.6vw);line-height:1.15;
    color:var(--on-ground);margin:0 0 8px}
  .isub{font-family:'Nunito';font-weight:700;font-size:13.5px;color:var(--muted-g);margin:0 0 22px}
  .tchips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 26px;max-width:340px}
  .tchip{font-family:'Nunito';font-weight:800;font-size:15px;padding:11px 18px;border-radius:999px;
    border:2.5px solid var(--chip-bd);background:var(--chip-bg);color:var(--on-ground);cursor:pointer;
    transition:transform .08s}
  .tchip:active{transform:scale(.96)}
  .tchip.on{color:#000;border-color:var(--accent);background:var(--accent)}
  .icont{font-family:'Fredoka';font-weight:600;font-size:16px;color:#000;background:var(--accent);
    border:3px solid #000;border-radius:16px;padding:12px 30px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .icont:disabled{opacity:.4;box-shadow:none;cursor:default}
  .gatecard .cbtn{max-width:320px}

  /* The odds, both of them. A lone giant "60%" made the reader derive the other
     side, and a "win 1.7×" stranded on a button 200px away made them pair the two
     halves of one fact back together. Each row is now one side's whole story, in
     reading order: which side, how likely, what it pays.

     The row IS the bar. A separate split bar above said the same thing twice, so
     it folded into the rows: each one fills to its own percentage, and the number
     sits on top of the fill it describes. `--fill` comes in per-card, inline. */
  /* A decisive binary, not a survey. Two side-by-side SURFACE tiles (white with
     the brand's chunky outline, both themes). At rest each is clean — side label,
     the odds as a big number, the multiplier as small supporting info; a thin
     accent meter along the bottom is the only nod to the split. On tap the chosen
     tile SPRINGS to a solid accent fill and lifts (tactile locked state) while the
     other recedes. `--fill` (per-side odds, inline) drives only the rest-state
     meter. The number keeps its white-stroke halo so it reads on white AND on the
     accent fill. */
  .duel{display:flex;flex-direction:row;gap:12px;margin-top:6px}
  .orow{--fill:50%;flex:1 1 0;position:relative;overflow:hidden;isolation:isolate;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    min-height:122px;padding:15px 8px 18px;border-radius:24px;border:3.5px solid #000;background:#fff;
    cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.15);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, opacity .2s ease}
  .orow:active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .orow:disabled{cursor:default}
  .orow>*{position:relative;z-index:2}
  /* The accent FILL: a layer that springs up from the bottom on tap — the "fill",
     not an instant background swap. overflow clips its spring overshoot. The odds
     are the big number; no sub-bar (it read as a half-rendered stub). */
  .orow::before{content:"";position:absolute;inset:0;z-index:1;background:var(--accent);
    transform:scaleY(0);transform-origin:bottom center;
    transition:transform .34s cubic-bezier(.34,1.55,.5,1)}
  .oside{font-family:'Fredoka';font-size:13px;font-weight:700;letter-spacing:.05em;color:#6B7A88;text-transform:uppercase}
  .opct{font-size:min(42px,11vw);font-weight:700;line-height:1;letter-spacing:-.02em;
    color:#141414;-webkit-text-stroke:2.5px #fff;paint-order:stroke fill;font-variant-numeric:tabular-nums;text-align:center}
  .opct-unit{font-size:.48em;font-weight:700;vertical-align:.42em;margin-left:1px}
  .opay{font-family:'Nunito';font-weight:800;font-size:12px;color:#4d6e10;white-space:nowrap}
  /* Tapped: the fill springs up, the tile lifts — a crisp, tactile locked state. */
  .orow.pick{transform:scale(1.02);box-shadow:0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(120,165,40,.4)}
  .orow.pick::before{transform:scaleY(1)}
  .orow.pick .oside{color:#25340a}
  .orow.pick .opay{color:#31480a}
  .orow.dim{opacity:.4;transform:scale(.955)}
  :root[data-theme="dark"] .orow.dim{opacity:.5}
  /* The confirmation snap: one quick ring-flash the instant a call locks in — the
     "juice" on the single most important tap in the product. A ring (not a fill
     swap, that already happened) expands and fades once, tasteful not gaudy. */
  .orow.locked-flash::after{content:"";position:absolute;inset:-3px;z-index:3;border-radius:inherit;
    border:3px solid var(--accent);opacity:0;pointer-events:none;
    animation:lockring .6s cubic-bezier(.2,.7,.3,1)}
  @keyframes lockring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.14)}}

  /* Shared entrance: a fast, staggered rise+fade — cards, badges, medallions,
     stat rows all use this ONE motion so the product feels like one system
     rather than every screen inventing its own animation. */
  @keyframes enterUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .enter{animation:enterUp .42s cubic-bezier(.2,.7,.3,1) backwards}

  /* The continuous-play chain's card swap — deliberately NOT .enter. A chain
     advance is a snap, not an arrival: it travels further (a real slide, not a
     10px settle), lands faster (.28s vs .42s), and overshoots slightly before
     settling so it reads as spring-loaded rather than faded-in. Home's chain is
     the only place this is used; every other entrance stays on .enter so the
     rest of the product still moves as one system. */
  @keyframes snapIn{
    0%{opacity:0;transform:translateY(30px) scale(.98)}
    55%{opacity:1;transform:translateY(-4px) scale(1.006)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .snap-in{animation:snapIn .28s cubic-bezier(.22,1.15,.36,1) backwards}
  /* The swipe-up exit is driven entirely from JS (inline transform/opacity, so
     it can track the finger frame by frame) — see attachSwipeUp. Nothing to
     declare here; the class exists only so the gesture is greppable from CSS. */
  .nextcall-prev{touch-action:pan-y}

  @media (prefers-reduced-motion:reduce){
    .orow,.orow::after,.orow::before,.card{transition:none}
    .orow.locked-flash::after{animation:none;display:none}
    .enter{animation:none}
    .snap-in{animation:none}
  }

  /* The balance pill keeps its pale-lime fill (a SURFACE token) in BOTH themes,
     so in dark mode its number and top-up note must stay dark to read on it. */
  [data-theme="dark"] .bal{color:#000}
  [data-theme="dark"] .topup{color:#8aa63a}

  /* In the flow, under the buttons. Floated above them it landed in the same strip
     as the "You bet 10 → win 32 tokens" line and sat on top of it. Kept in the
     layout at opacity 0 so nothing reflows when it fades in. */
  /* balance pill — small and friendly, never a dollar sign anywhere near it */
  .bal{margin-left:8px;font-family:'Nunito';font-weight:800;font-size:13.5px;
    padding:4px 11px;border:2.5px solid var(--ink);border-radius:999px;
    background:var(--wash);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bal.pulse{animation:balpulse .45s ease}
  /* "Points" label inside the balance pill — makes clear the number is Oddie
     Points (spendable), distinct from the Oddie Score (reputation). */
  .ptslbl{font-size:9.5px;font-weight:800;opacity:.62;letter-spacing:.03em;text-transform:uppercase}
  /* Pick-streak badge — visible identity beside the balance. Small, warm, fixed
     colours (holds contrast in both themes); only rendered at streak 2+. */
  .streakbadge{display:inline-flex;align-items:center;margin-left:6px;vertical-align:middle;
    font-family:'Nunito';font-weight:900;font-size:12px;line-height:1;color:#7a3b00;
    background:#ffd8a8;border:2px solid var(--ink);border-radius:999px;padding:3px 8px;white-space:nowrap}

  /* One tap, bright<->dark, always in the top bar — no menu, no label. It shows the
     mode you'll GET: a moon in bright, a sun in dark. "Auto" still lives in Profile
     for people who want to follow the system; tapping here just commits a choice. */
  .themetog{width:34px;height:34px;flex:none;margin-left:8px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:2.5px solid var(--line-g);background:transparent;
    color:var(--on-ground);cursor:pointer}
  .themetog svg{width:18px;height:18px;stroke:currentColor;fill:none;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .themetog:hover{background:var(--ground-2)}
  .themetog:active{transform:scale(.92)}

  /* Zero-balance nudge: reframes the wait so a busted device reads as "resting",
     not "locked out". A light wash surface, so it holds in both themes. */
  .znote{background:var(--wash);border:2.5px solid var(--accent);border-radius:16px;
    padding:12px 14px;margin-bottom:16px;font-family:'Nunito';font-weight:700;
    font-size:13px;line-height:1.45;color:var(--ink)}
  .znote b{font-weight:800}

  /* positions: reputation, live tracking, the sell button */
  .rep{display:flex;align-items:center;gap:14px;border:3px solid #000;border-radius:22px;
    background:var(--wash);padding:14px 16px;margin-bottom:16px}
  /* The score is allowed to be red. That is the whole point of measuring it. */
  .repnum{font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;flex:none}
  .repwho{display:flex;flex-direction:column;gap:2px;font-family:'Nunito';font-size:12.5px;color:var(--muted);font-weight:700}
  .repwho b{font-family:'Baloo 2','Nunito',sans-serif;font-size:15px;color:#000;font-weight:700}
  .prov{margin-left:6px;font-weight:800;color:#8a6d1f}
  .prov.done{color:var(--muted)}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .catedge{font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;border:2px solid var(--bar);background:#fff}
  .up{color:#0f7b3d} .down{color:#b3261e} .flat{color:var(--muted)}
  .catedge.up{border-color:#bfe6cd} .catedge.down{border-color:#f0c6c2}
  .psec{font-size:14px;font-weight:700;margin:20px 0 10px;color:var(--muted-g);
    font-family:'Nunito';font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  /* Stage 1 onboarding: the section header itself becomes the cue for a
     zero-position visitor ("Make your first call ↓") — same weight/size as
     every other section label, just accent-colored so it reads as a nudge,
     not an alert. */
  .psec.cue{color:#4d7a1a}
  :root[data-theme="dark"] .psec.cue{color:var(--accent)}
  .track{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45}
  .track b{font-weight:800}
  .sellbtn{font:inherit;font-weight:700;font-size:15px;width:100%;margin-top:11px;padding:10px 0;cursor:pointer;
    border:3px solid var(--ink);border-radius:14px;background:var(--white)}
  .sellbtn:hover{background:var(--wash)}
  .sellbtn:disabled{opacity:.55;cursor:default}
  /* Honest, non-clickable replacement for the Sell button when a retry is pointless. */
  .sellnote{font-family:'Nunito';font-weight:700;font-size:12.5px;line-height:1.4;color:var(--muted-g);margin:11px 0 0}
  /* The sell result — the close made visible, same beat as the locked call state.
     Sits inside a white tile, so text is --ink; a tinted panel carries the tone. */
  .sellresult{margin-top:12px;border:3px solid #000;border-radius:14px;padding:12px 14px;background:var(--wash);color:var(--ink)}
  .sellresult.up{background:#e7f6ec;border-color:#0f7b3d} .sellresult.down{background:#fbe9e7;border-color:#b3261e}
  .srtop{display:flex;align-items:center;justify-content:space-between}
  .srtick{font-family:'Fredoka';font-weight:600;font-size:17px;color:var(--ink)}
  .srdelta{font-family:'Fredoka';font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
  .srdelta.up{color:#0f7b3d} .srdelta.down{color:#b3261e} .srdelta.flat{color:var(--muted)}
  .srnums{font-family:'Nunito';font-weight:800;font-size:14px;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
  .srnums .up{color:#0f7b3d} .srnums .down{color:#b3261e} .srnums .flat{color:var(--muted)}
  .srsub{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted);margin-top:5px}
  .srdone{margin-top:10px;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--ink);
    border:2.5px solid #000;border-radius:999px;background:#fff;padding:6px 18px;cursor:pointer}
  .srdone:active{transform:scale(.97)}
  .tile.closed{background:var(--wash)}
  .status.closed{color:var(--muted)}
  /* The countdown rides inside the pill, quieter than the number it refills. */
  .topup{font-weight:800;font-size:11px;color:var(--acc-mid);opacity:.85;margin-left:5px}

  /* connect sheet — the only auth surface, and it is never in the way */
  .bal{cursor:pointer}
  .cdim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;
    display:flex;align-items:flex-end;justify-content:center}
  .csheet{width:100%;max-width:var(--col);background:var(--white);
    border:3px solid #000;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
  @media (min-width:721px){ .cdim{align-items:center} .csheet{border-radius:24px} }
  .csheet h3{font-size:22px;margin:0 0 6px;font-weight:700}
  .csheet p{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.45}
  .cbtn{font:inherit;font-weight:700;font-size:16px;width:100%;padding:13px 0;margin-bottom:10px;cursor:pointer;
    border:3px solid var(--ink);border-radius:16px;background:var(--white);display:flex;align-items:center;justify-content:center;gap:9px}
  .cbtn.x{background:#000;color:#fff}
  .cbtn:disabled{opacity:.45;cursor:default}
  .cbtn .glyph{font-weight:800;font-size:17px}
  .cclose{font:inherit;font-weight:700;font-size:14px;width:100%;padding:9px 0;cursor:pointer;
    border:0;background:none;color:var(--muted)}
  .cnote{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);margin:2px 0 12px;line-height:1.4}
  /* Custody / no-real-money disclaimer — low-key but present. Used on the sign-up
     sheet and as a quiet profile footer. Never a modal, never blocking. */
  .disclaimer{font-family:'Nunito';font-weight:700;font-size:10.5px;line-height:1.45;
    color:var(--muted-g);opacity:.8;margin:12px 0 0}
  .pfoot{margin-top:26px;padding-top:14px;border-top:1px solid var(--card-line);text-align:center}
  .csheet .cnote{color:var(--muted)}   /* inside a white sheet, the surface grey is right */

  /* the one subtle line under a locked call */
  .upsell{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--link-g);
    background:none;border:0;padding:6px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* Stage 2 onboarding: the one-time "now the real move" teaching moment,
     appended after the locked call's existing CTA(s) — never replacing or
     hiding the share button above it, which stays the loudest thing here.
     A quiet callout (the same pale-wash treatment as .znote), not a second
     hero: this is a lesson, not another ask. */
  .onboard-teach,.loop-tag-reminder{margin-top:14px;padding:14px 16px;border:1.5px solid var(--hair-g);
    border-radius:var(--r-md);background:var(--wash)}
  :root[data-theme="dark"] .onboard-teach,:root[data-theme="dark"] .loop-tag-reminder{background:#1c2410;border-color:#2a3318}
  .onboard-teach-body{font-family:'Nunito';font-weight:700;font-size:13px;line-height:1.5;
    color:var(--on-ground);margin:0 0 10px}
  .onboard-teach-body b{font-weight:900}
  .onboard-teach-cta{display:inline-flex;align-items:center;gap:7px;font-family:'Fredoka';
    font-weight:600;font-size:13.5px;color:#fff;background:#000;border-radius:999px;
    padding:9px 16px;text-decoration:none}
  .onboard-teach-cta .glyphx{font-size:14px;line-height:1}
  /* The loop's cadenced tag reminder (see HOME_TAG_REMINDER_CADENCE) reuses
     the teaching card's exact body/CTA styling above — same lesson, same
     visual language — and adds one thing: a way to skip it and keep the
     chain going, since unlike the one-time teaching moment this one recurs
     and must never read as blocking play. */
  .keep-playing-cta{display:block;margin-top:10px;font-family:'Nunito';font-weight:800;
    font-size:12.5px;color:#4d7a1a;background:none;border:0;padding:0;cursor:pointer}
  :root[data-theme="dark"] .keep-playing-cta{color:var(--accent)}

  /* --- first-visit guided tour -------------------------------------------------
   * An IN-PAGE spotlight, not a modal: the real page stays visible and in place
   * underneath, and each step just dims everything except one element. The dim
   * is drawn by the spotlight's own giant box-shadow rather than a separate
   * full-screen panel — that's what cuts a real hole (the highlighted element
   * shows through at full brightness) instead of laying a translucent sheet
   * over everything including the thing being pointed at.
   *
   * The dim DOES swallow taps on purpose: mid-tour, a stray tap on the
   * spotlighted market card would place a real call. Only the tooltip's own
   * buttons are interactive. */
  /* FOUR dim panels around the target, not one panel with a box-shadow "hole".
     The box-shadow trick only works if the dim reliably paints above the page,
     and here it doesn't: the fixed header and the market cards (will-change:
     transform, so each is its own stacking context) both painted straight
     through it. Four panels leave a real gap that nothing has to out-stack. */
  .tour-mask{position:fixed;background:rgba(0,0,0,.72);z-index:9000;pointer-events:none;
    transition:top .2s ease, left .2s ease, width .2s ease, height .2s ease}
  .tour-catch{position:fixed;inset:0;z-index:9001}  /* swallows taps, incl. through the gap */
  .tour-ring{position:fixed;z-index:9002;border-radius:var(--r-md);pointer-events:none;
    box-shadow:0 0 0 3px var(--accent);
    transition:top .2s ease, left .2s ease, width .2s ease, height .2s ease}
  .tour-tip{position:fixed;z-index:9003;max-width:300px;
    border:2px solid var(--card-line);border-radius:var(--r-md);background:var(--card-surface);
    box-shadow:var(--card-shadow);padding:14px 16px}
  .tour-step{font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted-g);margin:0 0 6px}
  .tour-text{font-family:'Nunito';font-weight:700;font-size:13.5px;line-height:1.5;
    color:var(--on-ground);margin:0 0 12px}
  .tour-text b{font-weight:900}
  .tour-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tour-next{font-family:'Fredoka';font-weight:600;font-size:13.5px;color:#17250a;
    background:var(--accent);border:2px solid #000;border-radius:999px;
    padding:8px 16px;cursor:pointer}
  .tour-skip{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted-g);
    background:none;border:0;padding:4px;cursor:pointer}
  /* A step that also SCROLLS the page must not glide: the ring would animate
     across the viewport while the content moves under it, and for ~200ms it
     sits over whatever happens to be passing by. Jump instead, glide only
     when the page stayed put (a resize, say). */
  .tour-mask.nojump,.tour-ring.nojump{transition:none}
  @media (prefers-reduced-motion:reduce){ .tour-mask,.tour-ring{transition:none} }

  /* --- sharing ----------------------------------------------------------------
   * Two entry points. The card icon is discovery ("check this out"); the button
   * after a call locks is the wedge itself ("I called it — what do you say?").  */
  /* cat chip on the left, share icon on the right; this row carries the
     margin-bottom:auto that used to live on .cat, so the take still drops down. */
  .chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
  .chead .cat{margin-bottom:0}
  .shareico{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:2.5px solid var(--line-g);background:var(--ground);
    color:var(--on-ground);cursor:pointer;padding:0}
  .shareico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .shareico:hover{background:var(--ground-2)}
  .shareico:active{transform:scale(.9)}
  /* The strong one: a solid blue call-to-action, on-brand, under the locked line. */
  .sharebig{display:inline-flex;align-items:center;gap:8px;margin-top:10px;
    font-family:'Fredoka';font-weight:600;font-size:14px;color:#000;
    background:var(--accent);border:3px solid #000;border-radius:16px;padding:9px 15px;cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.16)}
  .sharebig svg{width:17px;height:17px;stroke:#000;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .sharebig:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
  /* Desktop fallback menu (no native share sheet). */
  .sdim{position:fixed;inset:0;z-index:80}
  .smenu{position:fixed;z-index:81;min-width:190px;background:var(--ground-2);
    border:3px solid var(--line-g);border-radius:16px;padding:6px;
    box-shadow:0 18px 44px rgba(13,60,90,.24)}
  .smenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    font-family:'Nunito';font-weight:800;font-size:13.5px;color:var(--on-ground);
    background:none;border:0;border-radius:11px;padding:10px 12px;cursor:pointer}
  .smenu button:hover{background:var(--ground)}
  .smenu svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px);transform:translateX(-50%);z-index:90;
    background:#fff;color:#000;border:3px solid #000;border-radius:14px;padding:9px 15px;max-width:88vw;
    font-family:'Nunito';font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(13,60,90,.2)}

  /* ------------------------------------------------- resolution celebration --
   * The emotional peak: full-screen on mobile, a large centred card from the
   * tablet breakpoint up — highest z-index in the app, above the toast, because
   * this is the one thing that must sit on top of literally everything else
   * that could be on screen when a resolution lands. Win and loss share the
   * same shell; only the accent, copy, and CTAs differ, per the brief's "keep
   * the loss state visually calmer, no red-heavy scolding" — loss reuses the
   * plain card surface, win gets the same lime hero-glow language as the home
   * page's headline (.hero::before), so a win reads as a sibling of the app's
   * one other "premium moment", not a one-off effect. */
  .celebrate-dim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);
    display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:600px){ .celebrate-dim{align-items:center;padding:24px} }
  .celebrate-card{position:relative;width:100%;max-width:460px;max-height:100dvh;overflow-y:auto;
    background:var(--card-surface);border:2.5px solid var(--card-line);
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    padding:calc(env(safe-area-inset-top) + var(--sp-6)) var(--sp-4) calc(env(safe-area-inset-bottom) + var(--sp-4));
    box-shadow:var(--shadow-pop)}
  @media (min-width:600px){ .celebrate-card{border-radius:var(--r-xl);max-height:88dvh} }
  .celebrate-card.win{position:relative;overflow:hidden}
  .celebrate-card.win::before{content:"";position:absolute;top:-60px;left:50%;width:420px;height:280px;
    transform:translateX(-50%);background:radial-gradient(ellipse at center, rgba(182,240,95,.4), transparent 70%);
    filter:blur(2px);pointer-events:none;z-index:0}
  :root[data-theme="dark"] .celebrate-card.win::before{background:radial-gradient(ellipse at center, rgba(182,240,95,.18), transparent 70%)}
  .celebrate-card>*{position:relative;z-index:1}
  .celebrate-x{position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:3;width:34px;height:34px;
    border-radius:50%;border:1.5px solid var(--hair-g);background:var(--ground-2);color:var(--muted-g);
    font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .celebrate-x:active{transform:scale(.92)}
  .celebrate-dots{display:flex;justify-content:center;gap:6px;margin:0 0 var(--sp-3)}
  .celebrate-dots span{width:6px;height:6px;border-radius:50%;background:var(--hair-g)}
  .celebrate-dots span.on{background:var(--accent);width:16px;border-radius:999px}
  /* Confined to the card, not the viewport — "restrained", per the brief, not a
     screen-wide cannon. overflow:hidden on .celebrate-card.win clips it. */
  .celebrate-confetti{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .confetti-piece{position:absolute;top:-5%;width:7px;height:12px;opacity:0;border-radius:2px;
    animation-name:confettifall;animation-timing-function:cubic-bezier(.25,.46,.45,.94);animation-fill-mode:forwards}
  @keyframes confettifall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(480px) rotate(var(--rot,540deg));opacity:0}
  }
  @media (prefers-reduced-motion:reduce){.confetti-piece{display:none}}
  .celebrate-body{text-align:center;padding-top:var(--sp-2)}
  .cel-badge{display:inline-block;font-family:'Fredoka';font-weight:700;font-size:22px;margin:0 0 var(--sp-3)}
  .cel-badge.win{color:var(--on-ground)}
  .cel-badge.loss{font-size:19px;color:var(--muted-g)}
  .cel-q{font-family:'Fredoka';font-weight:600;font-size:17px;line-height:1.3;color:var(--on-ground);
    margin:0 0 var(--sp-2)}
  .cel-callrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 var(--sp-4)}
  .cel-side{font-family:'Nunito';font-weight:900;font-size:13px;letter-spacing:.02em;
    padding:5px 12px;border-radius:999px}
  .cel-side.yes{color:#0a5c22;background:#d7f2e0}
  .cel-side.no{color:#8f1017;background:#fbdfe4}
  :root[data-theme="dark"] .cel-side.yes{color:#7fe0a4;background:#0f3320}
  :root[data-theme="dark"] .cel-side.no{color:#f2a3b4;background:#3a1420}
  .cel-resolved{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--muted-g)}
  .cel-payout{margin:0 0 var(--sp-4);font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted-g)}
  .cel-payout-n{display:block;font-family:'Fredoka';font-weight:700;font-size:34px;color:var(--acc-deep);
    line-height:1.3}
  :root[data-theme="dark"] .cel-payout-n{color:var(--accent)}
  .cel-oscore{display:inline-flex;justify-content:center;margin:0 0 var(--sp-4)}
  .scorering.big{width:152px;height:152px}
  .scorering.big .scorering-num{font-size:36px}
  .scorering.big .scorering-lab{font-size:10px}
  .cel-streak{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:900;
    font-size:13px;color:#7a4a00;background:#ffeec2;border:1.5px solid #e8b34a;
    border-radius:999px;padding:6px 14px;margin:0 0 var(--sp-4)}
  :root[data-theme="dark"] .cel-streak{color:#f5cf6b;background:#3a2c05;border-color:#6b5312}
  .cel-ctas{display:flex;flex-direction:column;gap:var(--sp-2);margin:0 0 var(--sp-2)}
  .cel-cta{font:inherit;font-family:'Fredoka';font-weight:600;font-size:15px;border-radius:999px;
    padding:13px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .cel-cta.share{color:#17250a;background:linear-gradient(180deg, #c4f57a, var(--accent) 60%);
    border:2.5px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .cel-cta.share:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .cel-cta.challenge{color:var(--on-ground);background:transparent;border:2px solid var(--card-line)}
  .cel-cta.challenge:active{transform:scale(.98)}
  .celebrate-next{display:block;width:100%;margin-top:var(--sp-3);font:inherit;font-family:'Nunito';
    font-weight:800;font-size:13.5px;color:var(--muted-g);background:none;border:0;padding:8px;cursor:pointer}
  .celebrate-next:active{opacity:.6}

  /* the handle: who this stream is called */
  .hrow{display:flex;align-items:center;gap:10px;border:3px solid #000;border-radius:22px;
    background:var(--wash);padding:13px 16px;margin-bottom:12px;color:var(--ink)}
  .hname{font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:18px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hkind{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted);flex:none}
  .hedit{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--acc-mid);background:none;border:0;
    padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;flex:none}
  .hin{flex:1;min-width:0;font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:17px;
    border:2.5px solid #000;border-radius:12px;padding:7px 11px;background:#fff;color:#000}
  .hsave{font-family:'Fredoka';font-weight:600;font-size:13.5px;color:#000;background:var(--accent);
    border:2.5px solid #000;border-radius:12px;padding:8px 13px;cursor:pointer;flex:none}
  .herr{font-family:'Nunito';font-weight:800;font-size:12px;color:#b3261e;margin:-6px 4px 10px}

  /* profile, once it is real */
  .acct{display:flex;align-items:center;gap:12px;border:3px solid #000;border-radius:22px;
    background:var(--wash);padding:14px 16px;margin-bottom:12px}
  .acct .glyph{font-size:20px;font-weight:800;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:2.5px solid #000;background:#fff;flex:none}
  .acct .who{font-weight:700;font-size:15px}
  .acct .kind{font-family:'Nunito';font-weight:800;font-size:11.5px;color:var(--muted)}

  /* A three-way switch, built from the same outline the rest of the app is. */
  .seg{display:flex;gap:0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--white);margin-bottom:10px}
  .segb{flex:1;font:inherit;font-weight:700;font-size:14.5px;padding:11px 0;cursor:pointer;
    border:0;border-right:3px solid var(--ink);background:var(--white);color:var(--ink)}
  .segb:last-child{border-right:0}
  .segb.on{background:var(--accent)}
  @keyframes balpulse{40%{transform:scale(1.12)}}

  /* amount picker: appears under the rows after a side is chosen.

     `display:flex` here beats the UA's `[hidden]{display:none}` on specificity,
     so the picker rendered on every card, always — 200px of form nobody asked
     for, sitting in the column before a side was ever tapped. That one line
     produced every symptom we chased: the card overflowed its own top and slid
     the question under the sticky chips bar; the presets showed with none
     selected, because `setAmt` only runs when a side is chosen; the payout line
     was blank for the same reason; and Confirm sat there enabled, next to no
     side and no amount. The `[hidden]` rule below is what `hidden` was always
     supposed to mean. */
  .picker{display:flex;flex-direction:column;gap:10px;margin-top:12px;
    padding:12px;border:3px solid var(--ink);border-radius:18px;background:var(--wash)}
  .picker[hidden]{display:none}
  .amts{display:flex;gap:7px;flex-wrap:wrap}
  .amt{font:inherit;font-weight:700;font-size:14.5px;padding:8px 0;flex:1 1 52px;
    border:2.5px solid var(--ink);border-radius:12px;background:var(--white);cursor:pointer}
  /* Pressed, not merely tinted: the fill alone read as decoration next to four
     identical outlines, so the chosen preset also thickens and sinks. */
  .amt.on{background:var(--accent);border-width:3.5px;box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
  .amt-in{font:inherit;font-size:16px;font-weight:700;width:74px;padding:8px 10px;
    border:2.5px solid var(--ink);border-radius:12px;background:var(--white);text-align:center}
  .pline{font-family:'Nunito';font-weight:800;font-size:14px;color:var(--acc-deep);min-height:18px}
  .pbtns{display:flex;gap:8px}
  .confirm{font:inherit;font-weight:700;font-size:16px;flex:1;padding:11px 0;cursor:pointer;
    border:3px solid var(--ink);border-radius:14px;background:var(--accent)}
  .confirm:disabled{opacity:.4;cursor:default}
  .pcancel{font:inherit;font-weight:700;width:46px;cursor:pointer;
    border:3px solid var(--ink);border-radius:14px;background:var(--white)}
  /* While the picker is open the card is a form, not a poster: the rows shrink
     to make room so nothing escapes the card on a short phone, and the nudge
     gets out of the way. Everything comes back the moment the picker closes. */
  .card.picking .opct{font-size:30px;-webkit-text-stroke-width:2px}
  .card.picking .orow{padding:6px 16px 8px}
  .card.picking .oside{font-size:17px}
  .card.picking .nudge{display:none}
  /* Empty while picking — it only ever holds the locked line, and `picking` is
     gone by the time that is written. Reserving its strip cost 28px of the one
     thing the card cannot spare on a 640px-tall phone: room for the question. */
  .card.picking .social{display:none}
  /* The last 22px on an SE-sized screen. The numeral is the loudest thing on the
     card and the least informative once you are choosing a stake. */
  @media (max-height:680px){ .card.picking .opct{font-size:26px} }

  /* The peek of the next card is the scroll affordance now, so the nudge only
     appears on the first card (via .show) and reserves NO space otherwise — every
     other card hugs its content with nothing dangling below the tiles. */
  .nudge{align-self:center;margin-top:16px;
    font-family:'Nunito';font-weight:800;font-size:13px;color:var(--muted-g);opacity:0;transition:opacity .3s;
    pointer-events:none;display:none;flex-direction:column;align-items:center;gap:2px}
  .nudge.show{display:flex;opacity:1}
  .nudge.show.hint{opacity:.72}   /* quieter than the one you earn by picking a side */
  .nudge .arrow{font-size:18px;animation:bob 1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.nudge .arrow{animation:none}}

  /* ----------------------------------------------------------------- shells -- */
  .sheet{max-width:var(--col);margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 104px) 22px calc(env(safe-area-inset-bottom) + var(--tabh) + 28px)}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .head h1{font-size:27px;font-weight:600;margin:0;color:var(--on-ground)}
  .sub{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted-g);margin:0 0 20px}

  /* ------------------------------------------------------------------ home -- */
  /* homeTop() is a brand-row-only header (no chips, no title row), shorter than
     shellTop()'s — so the top padding here is smaller than .sheet's 104px. */
  /* Matches --feedcol, not --col: the feed's cards scale with the viewport at
     desktop widths (see the 768px/1024px/1440px breakpoints below), and the
     hero used to stay pinned at the older fixed --col, so Home read as
     narrower than the feed it sits above — two different "how wide is this
     page" answers on the same product. */
  /* Every gap from here down is owned by exactly one element (its own
     margin-top marks "a new section starts here"), using the --sp-* scale —
     see the note by --sp-1. Adjacent block margins collapse in normal flow,
     so an optional element (the claim card, the featured-markets label) can
     be skipped entirely without leaving a doubled or missing gap behind it. */
  .homewrap{max-width:var(--feedcol);margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 82px) 20px calc(env(safe-area-inset-bottom) + var(--tabh) + 28px)}
  /* Home is a static page, not a stack of full-screen cards: the featured
     markets borrow the feed's card styling but must NOT borrow the feed's
     near-full-viewport min-height, or the page reads as "one card per screen"
     (feed-like) even with snap correctly disabled. Each hugs its own content —
     a secondary "try this" section under the tag CTA, not a takeover. Same
     reasoning kills scroll-snap-align: harmless without a snap container, but
     pointless here. Tight, uniform gap card-to-card — a list, not separate
     sections — the big section gap arrives via .howitworks' own margin-top. */
  .homewrap .card{min-height:auto;scroll-snap-align:none;scroll-margin-top:0;margin:0 0 var(--sp-2)}
  .homewrap .card:first-child{margin-top:0}
  /* The section label reads as a quiet caption over a secondary section, not a
     header competing with the hero above it — margin-top is the section gap
     (collapses with whatever precedes: the hero, or the claim card when it's
     showing), margin-bottom is the tight "caption to its own list" gap. */
  .homewrap .psec{text-align:center;margin:var(--sp-6) 0 var(--sp-2)}
  .homewrap .claimcard{margin:var(--sp-6) 0 0}
  .hero{position:relative;text-align:center}
  /* A soft lime glow seated behind the headline — the one "premium" cue a
     hackathon build skips. Pure gradient, no image, invisible on load until
     the hero's own .enter fade brings it in with everything else. */
  .hero::before{content:"";position:absolute;top:-40px;left:50%;width:340px;height:220px;
    transform:translateX(-50%);background:radial-gradient(ellipse at center, rgba(182,240,95,.35), transparent 70%);
    filter:blur(2px);pointer-events:none;z-index:0}
  :root[data-theme="dark"] .hero::before{background:radial-gradient(ellipse at center, rgba(182,240,95,.16), transparent 70%)}
  .hero>*{position:relative;z-index:1}
  /* Headline → subtext → +50 stat → CTA is ONE tightly-related group (the
     hero's core pitch, read top to bottom in one breath), so every gap in it
     is the same small scale step — the +50 stat used to sit with noticeably
     more air above and below it than its neighbours, which is exactly what
     made it read as a pasted-in island instead of the next line of the pitch. */
  .herotitle{font-size:min(36px,9vw);font-weight:700;line-height:1.08;letter-spacing:-.025em;
    color:var(--on-ground);margin:0 0 var(--sp-2)}
  .herosub{font-family:'Nunito';font-weight:700;font-size:var(--fs-label);line-height:1.5;color:var(--muted-g);
    max-width:320px;margin:0 auto var(--sp-2)}
  .herosub b{color:var(--on-ground);font-weight:900}
  .herocta{display:inline-flex;align-items:center;gap:9px;font-family:'Fredoka';font-weight:600;font-size:16px;
    color:#17250a;background:linear-gradient(180deg, #c4f57a, var(--accent) 60%);
    border:2.5px solid #000;border-radius:999px;
    padding:14px 26px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.18), var(--shadow-pop);
    transition:transform .12s ease, box-shadow .12s ease}
  .herocta:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .herocta .glyphx{font-size:17px;line-height:1}
  /* Three beats, icon + a few words each — no paragraphs, per the brief. Each
     gets its own medallion (a soft chip circle) instead of a bare emoji
     floating in text, so the row reads as a designed sequence, not a caption.
     margin-top is the section gap (see the .homewrap note); this is also the
     one guaranteed-present element after the hero, so it's the reliable place
     to own that gap even when the claim card and featured markets are both
     absent (a signed-out cold visit with no community markets yet). */
  .howitworks{display:flex;align-items:flex-start;justify-content:center;gap:2px;margin:var(--sp-6) 0 0}
  .howstep{display:flex;flex-direction:column;align-items:center;gap:9px;width:84px;
    font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);line-height:1.25;color:var(--muted-g);text-align:center}
  .howstep .howico{display:flex;align-items:center;justify-content:center;width:52px;height:52px;
    border-radius:50%;background:var(--wash);border:2px solid var(--card-line);
    font-size:22px;line-height:1;box-shadow:var(--shadow-chip)}
  :root[data-theme="dark"] .howstep .howico{background:var(--card-surface)}
  .howarrow{flex:none;color:var(--card-line);opacity:.35;font-weight:700;font-size:16px;margin-top:24px}
  /* The feed is a destination now, chosen not defaulted-into — one quiet link. */
  /* Tertiary, nearly hidden by design: tagging is the primary action, the
     featured markets are a few things to try, and browsing the catalog is the
     last resort for someone who wants it anyway — not a peer of the others,
     so its own gap (sp-4) is a step down from the sp-6 used between the
     bigger sections above it. */
  .browselink{display:block;text-align:center;font-family:'Nunito';font-weight:700;font-size:var(--fs-caption);
    color:var(--muted-g);text-decoration:none;margin:var(--sp-4) 0 0;padding:10px;opacity:.75}
  .browselink:active{opacity:.5}

  /* "Recently settled" — the landing's proof that the loop actually completes.
     Reuses the resolution-receipt language the profile's recent-calls rows and
     the notification cards already use: a compact card with a coloured left
     rail for the verdict, question first, then who was right. Never rendered
     with fabricated rows — the section is absent when nothing has settled. */
  /* A DIV, not an anchor: the card now holds two links of its own (the question
     and the "make your own call" bridge), and interactive content cannot nest
     inside an <a>. */
  .stl{display:block;border:2px solid var(--card-line);border-left-width:6px;border-radius:var(--r-md);
    background:var(--card-surface);padding:12px 14px;margin:0 0 var(--sp-1);
    box-shadow:var(--shadow-chip)}
  .stl.yes{border-left-color:#0a7d2c}
  .stl.no{border-left-color:#b00020}
  .stl-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .stl-out{flex:none;font-family:'Nunito';font-weight:900;font-size:10.5px;letter-spacing:.03em;
    padding:3px 9px;border-radius:999px}
  .stl.yes .stl-out{color:#0a5c22;background:#d7f2e0}
  .stl.no .stl-out{color:#8f1017;background:#fbdfe4}
  :root[data-theme="dark"] .stl.yes .stl-out{color:#7fe0a4;background:#0f3320}
  :root[data-theme="dark"] .stl.no .stl-out{color:#f2a3b4;background:#3a1420}
  .stl-when{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted-g);white-space:nowrap}
  .stl-q{display:block;font-family:'Nunito';font-weight:800;font-size:13.5px;line-height:1.35;
    color:var(--on-ground);text-decoration:none}
  .stl-wins{margin-top:8px;padding-top:8px;border-top:1px solid var(--hair-g);
    display:flex;flex-direction:column;gap:4px}
  .stl-win{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted-g)}
  .stl-win b{color:var(--on-ground);font-weight:900}
  .stl-win .tick{color:#0a7d2c;font-weight:900}
  :root[data-theme="dark"] .stl-win .tick{color:#7fe0a4}
  /* Everyone was wrong is a real, and frankly better, outcome to show than a
     padded row — so it gets said plainly rather than hiding the market. */
  .stl-none{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted-g);opacity:.85}
  /* The spectator-to-player bridge, at the exact moment the proof lands. Quiet
     on purpose — it's an offer, not a second CTA competing with the hero's. */
  .stl-cta{display:inline-block;margin-top:9px;font-family:'Nunito';font-weight:800;
    font-size:var(--fs-caption);color:var(--acc-deep);text-decoration:none;opacity:.9}
  :root[data-theme="dark"] .stl-cta{color:var(--acc-mid)}
  .stl-cta:active{opacity:.6}

  /* Live activity — a row of real counters over the rolling last 24h. Each
     counter is dropped when it's zero and the whole strip is dropped when none
     survive, so this can never read as "0 calls today" theatre. */
  .livestrip{display:flex;align-items:stretch;justify-content:center;gap:0;margin:var(--sp-6) 0 0;
    border:1.5px solid var(--hair-g);border-radius:var(--r-md);background:var(--card-surface);
    box-shadow:var(--shadow-chip);overflow:hidden}
  .lsi{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 8px;border-left:1px solid var(--hair-g);text-align:center}
  .lsi:first-child{border-left:0}
  .lsi-n{font-family:'Fredoka';font-weight:700;font-size:21px;line-height:1;color:var(--on-ground);
    font-variant-numeric:tabular-nums}
  .lsi-k{font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.02em;color:var(--muted-g);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  /* A live counter deserves a live cue — one dot, on the first item only. Its
     own keyframe rather than .mchip-forming's: that one pulses an amber ring,
     which reads wrong behind a lime dot. */
  .lsi:first-child .lsi-n::after{content:"";display:inline-block;width:6px;height:6px;margin-left:5px;
    border-radius:50%;background:var(--accent);vertical-align:middle;
    box-shadow:0 0 0 0 rgba(182,240,95,.6);animation:livedot 1.8s ease-out infinite}
  @keyframes livedot{0%{box-shadow:0 0 0 0 rgba(182,240,95,.6)}70%{box-shadow:0 0 0 7px rgba(182,240,95,0)}100%{box-shadow:0 0 0 0 rgba(182,240,95,0)}}
  @media (prefers-reduced-motion:reduce){.lsi:first-child .lsi-n::after{animation:none}}

  /* Claim streak — the grind, made visible where a returning farmer lands. Sits
     directly above the claim strip; the claim card drops its own duplicate
     mention of the streak whenever this pill is rendering (see claimCard). */
  .streakpill{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:900;
    font-size:12px;color:#7a4a00;background:#ffeec2;border:1.5px solid #e8b34a;
    border-radius:999px;padding:5px 12px}
  :root[data-theme="dark"] .streakpill{color:#f5cf6b;background:#3a2c05;border-color:#6b5312}
  .streakwrap{text-align:center;margin:var(--sp-6) 0 0}
  /* The pill owns the section gap when it renders, so the claim strip below it
     tightens up to read as one unit with it rather than two stacked sections.
     Scoped to :not([hidden]) because the wrapper is always in the DOM (a claim
     can start a streak, and the pill has to be able to appear without a
     re-render) — without this, a streakless visitor would get the tightened
     gap with nothing above it to justify it. */
  .streakwrap:not([hidden]) + .claimcard{margin-top:var(--sp-1)}

  /* "Your open calls" — the Zeigarnik hook, sitting right below the claim
     strip: two personal "you have a reason to come back" rows back to back,
     before the page moves on to aggregate/social sections. A row, not a card
     — quieter than the claim strip above it, since it's a status, not an ask. */
  .opencalls{display:flex;align-items:center;gap:11px;margin:var(--sp-2) 0 0;padding:11px 14px;
    border:1.5px solid var(--hair-g);border-radius:var(--r-md);background:var(--card-surface);
    text-decoration:none;box-shadow:var(--shadow-chip)}
  .oc-ico{flex:none;font-size:17px;line-height:1}
  .oc-text{flex:1;min-width:0;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--on-ground)}
  .oc-text b{font-weight:900}
  .oc-sub{color:var(--muted-g);font-weight:700}
  .oc-arrow{flex:none;color:var(--muted-g);font-weight:800;font-size:14px}

  /* Home's continuous-play loop: the "up next" preview after a locked call's
     CTAs, and the end-of-chain fallback into Feed. Deliberately NOT full-card
     weight — this sits right below a share/connect/teach stack that's already
     asking for attention, so it reads as a quiet next step, not competition. */
  .nextcall-prev{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
    margin-top:12px;padding:12px 14px;border:1.5px solid var(--hair-g);border-radius:var(--r-md);
    background:var(--card-surface);box-shadow:var(--shadow-chip);cursor:pointer;font:inherit}
  .ncp-cat{font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted-g)}
  .ncp-q{display:block;font-family:'Fredoka';font-weight:600;font-size:14.5px;
    color:var(--on-ground);line-height:1.3}
  .ncp-cta{display:flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:800;
    font-size:12.5px;color:#4d7a1a;margin-top:2px}
  :root[data-theme="dark"] .ncp-cta{color:var(--accent)}
  .ncp-timer{color:var(--muted-g);font-weight:700}
  .nextcall-fallback{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:12px;padding:12px 14px;border:1.5px solid var(--hair-g);border-radius:var(--r-md);
    background:var(--card-surface);box-shadow:var(--shadow-chip);text-decoration:none;
    font-family:'Nunito';font-weight:800;font-size:13px;color:var(--on-ground)}
  .nextcall-fallback .nc-arrow{flex:none;color:var(--muted-g);font-weight:800}

  /* Leaderboard teaser — three ranked callers, so a cold visitor can see a
     competition exists. Same rank/handle/edge shape as the full board it links
     to (no new metric invented for the teaser), just compact rows on the
     ground rather than the board's own white panel. */
  .topc{display:block;text-decoration:none;border:2px solid var(--card-line);border-radius:var(--r-md);
    background:var(--card-surface);overflow:hidden;box-shadow:var(--shadow-chip)}
  .topc-r{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--hair-g)}
  .topc-r:last-child{border-bottom:0}
  .topc-rank{flex:none;width:20px;font-family:'Fredoka';font-weight:700;font-size:14px;color:var(--muted-g);text-align:center}
  .topc-r:first-child .topc-rank{color:var(--acc-deep)}
  :root[data-theme="dark"] .topc-r:first-child .topc-rank{color:var(--accent)}
  .topc-who{flex:1;min-width:0;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--on-ground);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topc-edge{flex:none;font-family:'Nunito';font-weight:900;font-size:12.5px;color:var(--on-ground);
    font-variant-numeric:tabular-nums}
  .topc-edge small{display:block;font-weight:800;font-size:10px;color:var(--muted-g)}
  .topc-more{display:block;text-align:center;font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);
    color:var(--muted-g);text-decoration:none;margin:var(--sp-1) 0 0;padding:6px;opacity:.8}
  /* The points incentive, ABOVE the tag CTA — the loudest thing on the page
     after the headline, per the brief. Wired live to the actual Season Points
     surface-award amount (server), never a hardcoded number that can drift
     from what the backend actually pays out. */
  .incentivebig{font-family:'Nunito';font-weight:800;font-size:16px;line-height:1.4;
    color:var(--on-ground);max-width:300px;margin:0 auto var(--sp-2)}
  .incentivebig .ptsnum{display:block;font-family:'Fredoka';font-weight:700;font-size:44px;
    line-height:1.05;color:var(--acc-deep);margin:0 0 2px}
  :root[data-theme="dark"] .incentivebig .ptsnum{color:var(--accent)}

  /* Says what it is, everywhere it is. These screens read as finished on purpose;
     the badge is the only thing standing between "shipped" and "mocked up". */
  .preview{display:inline-flex;align-items:center;gap:5px;flex:none;
    font-family:'Nunito';font-weight:800;font-size:11px;letter-spacing:.02em;
    padding:5px 10px 5px 8px;border-radius:999px;border:2px solid #000;background:var(--accent);color:#000}
  .preview::before{content:"";width:6px;height:6px;border-radius:50%;background:#000}

  .tile{border:3px solid #000;border-radius:22px;background:#fff;padding:16px 16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num{font-family:'Nunito';font-weight:800;font-variant-numeric:tabular-nums}

  /* profile */
  .avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);border:3px solid #000;position:relative;flex:none}
  .avatar::before,.avatar::after{content:"";position:absolute;width:15px;height:15px;background:#000;border-radius:50%;top:31px}
  .avatar::before{left:19px}.avatar::after{left:50px}
  .handle{font-size:23px;font-weight:600}
  .joined{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 14px}
  .stat{border:3px solid #000;border-radius:20px;padding:14px 10px;text-align:center;background:#fff}
  .stat.hero{background:var(--accent)}
  .stat .v{font-size:29px;font-weight:700;line-height:1}
  .stat .k{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--acc-mid);margin-top:5px}
  .stat.hero .k{color:var(--acc-deeper)}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .badge{font-family:'Nunito';font-weight:800;font-size:12px;padding:7px 12px;border-radius:999px;
    border:2px solid #000;background:var(--wash)}
  .sect{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}

  /* positions */
  /* Ink, not the inherited muted grey: #6B7A88 on the blue chip is 2.33:1, and
     it always was — in both themes. Black on blue is what every other blue
     element uses (.navitem.on, .amt.on). */
  .side-chip{font-family:'Nunito';font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;
    border:2px solid #000;flex:none;color:var(--ink)}
  .side-chip.yes{background:var(--accent)} .side-chip.no{background:#fff}
  .q{font-size:16px;font-weight:500;line-height:1.25;margin:0 0 10px}
  .pmeta{display:flex;align-items:center;gap:8px;font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--muted)}
