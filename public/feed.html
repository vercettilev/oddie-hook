}

/* The daily claim card is gone with the claim. It offered "+5" once a day on
   a streak, into a balance that only the play-token call could spend, and that
   call is gone too. A button that increments a number for its own sake is not
   a retention loop, it is a chore with a reward animation. */


function renderFeed(items){
  const scroller=document.getElementById("scroller");
  scroller.innerHTML="";
  if(!items.length){scroller.innerHTML='<div class="state">no live markets here right now. Try another category.</div>';return;}
  maybeFeedTop(scroller); // claim card + onboarding, pinned first so cards flow beneath
  // Grouping is a "For you"/all-markets thing — a single-category chip view is
  // already one category, and a permalink landing (startSlug) pins its own
  // market up top, a different flow this shouldn't disturb.
  //
  // No client-side regrouping: the server ships For You already partitioned
  // into tagged markets and the wider market, with its own divider row. The
  // old groupCommunityByCategory existed to pull the community cluster out of
  // a venue-led list — the partition does that job now, and re-sorting on top
  // of it would only scatter the tagged block it just built.
  const ordered=items;
  // TikTok-web taste flow. An anonymous visitor gets the feed metered so the
  // personalization investment lands BEFORE the gate:
  //   no categories picked yet -> 1 free card, then the category picker
  //   categories picked         -> 1 re-ranked card, then the sign-in gate
  // Two free bets total (one per card); the gate falls on the 3rd. Signed-in /
  // allowlisted / invited visitors see the whole feed (list=ordered).
  let list=ordered, tail=null;
  if(TASTE){
    if(!tasteCats().length){list=ordered.slice(0,1);tail="picker";}
    else{list=ordered.slice(0,1);tail="gate";}
  }
  // The loud promo rides two cards deep in the organic For-You feed only:
  // never on a permalink landing (the shared market is the page's story),
  // never inside the metered taste flow (one thing at a time), and never
  // again once dismissed.
  const showLoudPromo=activeCat==="For you" && !startSlug && !TASTE && !lsGet(LOUD_PROMO_KEY);
  let loudPromoPlaced=false, cardsPlaced=0;
  list.forEach((m,i)=>{
    if(m.__catHeader){
      const h=document.createElement("div");
      h.className="catgroup-header";
      h.textContent=m.__catHeader;
      scroller.appendChild(h);
      return;
    }
    // The tagged / wider-market divider. Not a card and not tappable: it is
    // the one place the feed states its own rule in a sentence.
    if(m.sectionHeader){
      const h=document.createElement("div");
      h.className="feedsplit";
      // The rule is drawn only BETWEEN sections. The feed now opens on a header
      // too, and a rule above the first thing on the page separates it from
      // nothing.
      const lead=scroller.children.length===0;
      h.innerHTML=`${lead?"":"<hr>"}<b>${esc(m.sectionHeader)}</b>${m.sectionNote?`<span>${esc(m.sectionNote)}</span>`:""}`;
      scroller.appendChild(h);
      return;
    }
    const card=buildCard(m,i);
    // The same staggered rise+fade home uses on first paint — one motion
    // system, not a per-screen reinvention. Capped delay: a card 20 deep in
    // the feed has long finished animating by the time a swipe reaches it.
    card.classList.add("enter");card.style.animationDelay=`${Math.min(i*55,220)}ms`;
    scroller.appendChild(card);
    cardsPlaced++;
    if(showLoudPromo && !loudPromoPlaced && cardsPlaced===2){
      loudPromoPlaced=true;
      scroller.appendChild(loudPromoCard());
    }
  });
  // A feed of one card still gets the promo — after it, not instead of it.
  if(showLoudPromo && !loudPromoPlaced && cardsPlaced>0)scroller.appendChild(loudPromoCard());
  if(tail==="picker")scroller.appendChild(buildPicker());
  else if(tail==="gate")scroller.appendChild(buildGate());
  // The loop-closer, last. Only where "that's everything tagged" is TRUE: the
  // organic For You feed, not a category chip (which is one slice of it), not
  // a permalink landing, and not the metered taste flow — the picker and the
  // gate are that flow's ending and there can only be one.
  else if(activeCat==="For you" && !startSlug && cardsPlaced>0)scroller.appendChild(feedEndCard());
  watchDepth(scroller);
  bindDepth(scroller);
  hintFirstCard(scroller);
}

/**
 * Build one market card — question, YES/NO, share, challenge, resolution
 * criteria, the whole tap-to-call interaction — and return it UNATTACHED, so a
 * caller can append it to the feed's scroller (the original use) or drop the
 * exact same tappable card into the home page's featured "Daily Call" slot.
 * `i` only needs to be unique among cards mounted TOGETHER (it seeds local
 * per-card DOM ids, always queried scoped to the card, never globally).
 */
// The metadata row: small pills with icons instead of flat grey text, so the
// state reads at a glance — a pulsing dot while a community market is still
// filling up, a clock once there's a real close date, a coin stack for a venue
// market's actual dollar volume. One function, every card (feed, permalink, home).
/**
 * The tag-provenance line on a community card, in two variants.
 *
 * The grid used to read as a neutral market list sitting under an unrelated
 * tag-mechanic hero — two products stacked. Every community card now says out
 * loud that it EXISTS because a person tagged a claim, and what that person
 * got for it, so scrolling the grid reinforces the same loop the hero
 * demonstrates instead of quietly contradicting it.
 *
 * The card no longer carries a settled-fee receipt. The one it had counted
 * play tokens, an economy nothing can add to any more, and printing "earned 3
 * predictions" beside a stake line denominated in SOL invented a second
 * currency. A real fee is owed in lamports until the creator signs for it, so
 * its honest surface is the claim flow in chain.js, not a card.
 *
 * A market with no surfacer on record is NOT rendered as an anonymous person.
 * That framing assumed a real tagger we simply couldn't name; the actual cause
 * was that provenance was never recorded at all, so the card asserted a person
 * who may not exist. It names oddie instead — see authorRowHtml below. Never
 * invent a tagger.
 */
// The provenance chip, for every tagged market — community by definition, and
// a venue market once somebody tagged it in. It leads the meta row because
// "a person put this here" is what makes a card ours rather than a listing.
//
// It used to say "tagged by anonymous" whenever no surfacer was on record,
// which was every community market in production. A visitor read a feed of
// unattributed markets and asked, reasonably, whether oddie is just another
// venue — the one conclusion this product cannot afford. "anonymous" was also
// simply untrue: nobody chose anonymity, the source was never recorded.
//
// So the nameless case now says what actually happened — oddie opened it —
// and the two chips together teach the model at a glance: markets oddie put
// up, next to markets a named person tagged in. Server-side source_url is now
// a birth requirement, so the nameless branch only ever describes the markets
// created before that rule existed.
/* Step the question's type down with its length so the card fits the one screen
 * it is snapped to. The thresholds are where a 375px-wide card gains a line:
 * under ~68 characters the question sets in 3 lines at full size, and past ~104
 * it needs 6, which is the overflow that pushed the YES/NO buttons under the tab
 * bar. Character count rather than measured text because it runs for every card
 * on every render, and one line of slack is cheaper than a layout pass. */
function takeSizeClass(q){
  const n=(q||"").length;
  return n>104?" take-s":n>68?" take-m":"";
}


/** A deterministic avatar from the handle. We have no profile images and we are
 *  not going to fetch them: that would be a request to a third party on every
 *  card, for every visitor, keyed to a person's identity. A letter on a colour
 *  derived from the handle is stable, free, and reads as an avatar at this size. */
function handleAvatar(handle,stamp){
  // A real picture when the tagger uploaded one. The stamp is the row's own
  // set_at, so the URL changes when the picture does and the week-long cache
  // header is safe.
  if(stamp){
    return `<span class="au-av au-av--img"><img src="${API}/api/avatar/${encodeURIComponent(handle)}.jpg?v=${stamp}" alt="" loading="lazy"></span>`;
  }
  let h=0; for(let i=0;i<handle.length;i++) h=(h*31+handle.charCodeAt(i))|0;
  const hue=Math.abs(h)%360;
  return `<span class="au-av" style="background:hsl(${hue} 70% 62%)">${esc(handle[0].toUpperCase())}</span>`;
}

/**
 * The author row. The card's first line is now a PERSON, not a category.
 *
 * This is the whole product argument in one element. A market here is not a
 * listing somebody curated, it is a thing a named human did, and the reason to
 * do it yourself is visible on every card: their handle is at the top, linked,
 * in front of everyone who bets, and the fee line below says what they earn for
 * it. A chip reading "tagged by @x" said the same words and none of that.
 *
 * The link goes to X rather than to their oddie profile on purpose. The reward
 * for tagging is not only the 2%; it is being seen, by name, on a card other
 * people are putting money into. Sending the click to X is what makes that
 * reward real to the person considering doing it next.
 */
function authorRowHtml(m){
  if(!(m.tagged||m.community))return "";
  if(!m.taggedBy){
    return `<div class="author"><span class="au-av au-av--oddie"></span>
      <span class="au-who"><b>oddie</b><span class="au-sub">opened this one</span></span></div>`;
  }
  const h=esc(m.taggedBy);
  return `<a class="author" href="https://x.com/${h}" target="_blank" rel="noopener noreferrer">
      ${handleAvatar(m.taggedBy,m.taggedByAvatar)}
      <span class="au-who"><b>@${h}</b><span class="au-sub">tagged this</span></span>
      <span class="au-go" aria-hidden="true">↗</span>
    </a>`;
}

/**
 * The source post, rendered as a post — the thing the market argues about.
 *
 * This is the product's strongest differentiator and it was invisible: a
 * market on Oddie exists because someone replied @oddiefun under a real
 * claim, and the card previously showed only "tagged by @x", turning the most
 * social part of the object into an abstract chip. Showing the post ABOVE the
 * question, sharing the card's own surface, makes post→market read as one
 * object instead of two.
 *
 * The text is third-party content from X and is escaped like any other
 * untrusted string. Clamped to three lines: this is context for the question
 * below it, never the headline itself.
 */
function sourcePostHtml(m){
  const p=m.sourcePost;
  if(!p||!p.text)return "";
  const who=p.author?esc(p.author):(p.handle?`@${esc(p.handle)}`:"someone on X");
  const at=p.handle?`<span class="xp-at">@${esc(p.handle)}</span>`:"";
  const body=`<div class="xpost">
      <div class="xp-head"><span class="xp-av"></span><span class="xp-who">${who}</span>${at}<span class="xp-x">𝕏</span></div>
      <p class="xp-text">${esc(p.text)}</p>
    </div>`;
  // A real link when we have the URL — the claim should be checkable at source.
  return p.url
    ? `<a class="xpost-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${body}</a>`
    : body;
}
/**
 * The activity strip — what's actually riding on this market and who made it.
 *
 * Deliberately NOT the exchange-style "$24,680 volume · 1,248 traders · 86
 * comments" row. Three of those four would be fiction here: these markets
 * settle in predictions, not dollars, and there is no comments feature. Every
 * figure below is a real stored number, and anything we don't have simply
 * isn't a column.
 *
 * Pool and callers are both shown because they answer different questions —
 * "how much is riding on this" vs "how many people care" — and they separate
 * as soon as one person takes several positions. A market nobody has touched
 * yet renders nothing at all rather than a row of zeros; the "forming" chip
 * already says that, and repeating it as 0 · 0 makes a new market look dead
 * rather than new.
 */
/** The topic chip, when there is a topic. "Community" is not one: it is true
 *  of every market on the page, so as the first thing on the card it spends
 *  the best line on the screen saying nothing. A real topic (Crypto, Sports)
 *  still earns it. */
function catChipHtml(m){
  const c=String(m.topicCategory||m.category||"").trim();
  if(!c||c.toLowerCase()==="community")return "";
  return `<div class="cat">${esc(c)}</div>`;
}

function statsRowHtml(m){
  // The money, in one line, on every card.
  //
  // This slot was empty for a while, and empty was right when the three stats
  // it used to carry were all counting play tokens. It is wrong now: the card
  // showed two percentages and a multiplier and never once said that a tap
  // puts SOL down, so the single most important fact about the product was the
  // one thing a first-timer could not learn from its main screen.
  //
  // It is deliberately the SAME sentence as the demo card on the landing page
  // ("1.4 SOL in the pool · 2% to CryptoNate"). Someone who arrives from the
  // landing should recognise the thing they were shown, word for word.
  //
  // The pool half is a slot, not a number: only Solana knows the vault total,
  // and chain.js fills it in per card from the fetch it already makes for the
  // odds. Until then it reads as the honest empty state rather than "0 SOL",
  // which looks like a broken market instead of a new one.
  if(!m.community)return "";
  const fee=Number(m.creatorFeeBps)||0;
  // Named, and phrased as something happening TO SOMEBODY. "2% to @x" is a rate
  // with a recipient appended; "@x earns 2% of it" is the reason to go and tag
  // one yourself, which is the only thing this line is here to cause.
  const credit=fee>0&&m.taggedBy
    ? ` · <b>@${esc(m.taggedBy)} earns ${(fee/100)}%</b>`:"";
  return `<div class="stakeline"><span class="stakeline-pool">real SOL, winners split the pool</span>${credit}</div>`;
}

/**
 * "Paste X link" — an in-app shortcut into the SAME tag mechanic, not a
 * second creation path.
 *
 * Sending people to X with a bare "Tag @oddiefun" is the highest-friction
 * version of creating: they leave the product, then have to go find a post.
 * Pasting the post's URL here and letting us open the reply intent already
 * pointed at it collapses that to one step. It deliberately does NOT invent
 * an in-app create endpoint — market creation still happens through the tag,
 * which is what keeps every market attributable to a real public reply.
 */
/**
 * The right rail: who YOU are on Oddie, in two separate panels.
 *
 * Deliberately two, not one merged "stats" block. Oddie has two ways to be
 * somebody — how good your CALLS are, and how good your MARKETS are — and
 * collapsing them into a single number would erase the second, which is the
 * one the product's economics actually run on. A mediocre caller can be an
 * excellent market-maker and the rail should be able to say so.
 *
 * The daily claim lives down here too, not in the feed. It's a helper loop,
 * not the reward loop: create -> people trade -> you earn is the reward loop,
 * and a bright "Claim +5" banner above the markets framed the product as a
 * play-money faucet instead.
 */
function buildRail(me,creator,claimFrag,openCalls,topCreators){
  const rail=document.createElement("aside");rail.className="homerail";

  // YOUR identity on the rail. It used to lead with an accuracy percentage over
  // a resolved-pick count, and both are frozen at zero for everyone who arrived
  // after the play economy was removed: the panel read "null% accurate" over
  // "0 resolved" and told people to resolve picks they can no longer make.
  // It leads with the score and the act that moves it.
  if(me){
    const p=document.createElement("div");p.className="rpanel";
    const tierLine=me.tier?`<span class="rp-tier">🏆 ${esc(me.tier.label)}</span>`:"";
    const pctLine=me.rank&&me.rank.topPct!=null?`<span class="rp-sub">Top ${me.rank.topPct}% on the board</span>`:"";
    const made=Number(me.marketsCreated)||0, mult=Number(me.loudMultiplier)||1;
    p.innerHTML=me.hasEnough
      ? `<div class="rp-head">Your oddies</div>
         ${tierLine}
         <div class="rp-big">${Number(me.oddieScore)||0}<small>oddies</small></div>
         <div class="rp-grid">
           <div><b>${made}</b><span>tagged</span></div>
           <div><b>${mult}x</b><span>loud</span></div>
         </div>
         ${pctLine}
         <a class="rp-link" href="#/profile">View profile →</a>`
      : `<div class="rp-head">Your oddies</div>
         <div class="rp-big rp-big-sm">0<small>oddies</small></div>
         <div class="rp-sub">Tag @oddiefun on X. One market puts you on the board.</div>
         <a class="rp-link" href="#/profile">View profile →</a>`;
    rail.appendChild(p);
  }

  // CREATOR identity — the half that didn't exist on screen at all. Rendered
  // even at zero, because "0 markets created" next to a create button is the
  // clearest possible statement of what to do next; hiding it would leave a
  // user who has never created with no idea the axis exists.
  if(creator){
    const p=document.createElement("div");p.className="rpanel rpanel-creator";
    p.innerHTML=`<div class="rp-head">Your markets</div>
      <div class="rp-big">${creator.earnings}<small>earned in fees</small></div>
      <div class="rp-grid">
        <div><b>${creator.marketsCreated}</b><span>created</span></div>
      </div>
      ${creator.marketsCreated===0
        ? `<div class="rp-sub">Tag a post on X and you'll earn 2% every time someone trades your market.</div>`
        : `<div class="rp-sub">You earn 2% of every market you create, paid when it resolves.</div>`}
      <button class="rp-create" type="button">+ Create a market</button>
      ${creator.marketsCreated>0?`<a class="rp-link" href="#/mymarkets">My markets →</a>`:""}`;
    p.querySelector(".rp-create").onclick=()=>openPasteSheet();
    rail.appendChild(p);
  }

  // Top creators — the growth loop as status. Same rows the Leaderboard's
  // creator board shows (same source), so teaser and board can't disagree.
  // Earnings are PREDICTIONS, deliberately never dressed as currency.
  if(Array.isArray(topCreators)&&topCreators.length){
    const p=document.createElement("div");p.className="rpanel";
    p.innerHTML=`<div class="rp-head">Top creators</div>
      <div class="rp-toplist">${topCreators.map(r=>`
        <div class="rp-toprow"><b>${r.rank}</b><span class="rp-topwho">@${esc(r.handle)}</span>
          <span class="rp-topval">+${r.earnings}<small>${r.marketsCreated} market${r.marketsCreated===1?"":"s"}</small></span></div>`).join("")}</div>
      <a class="rp-link" href="#/leaderboard">Explore leaderboard →</a>`;
    rail.appendChild(p);
  }

  // Open positions, named precisely. "N open calls" was ambiguous between a
  // position you hold and a market you made — two different things in a
  // product where you can do both.
  if(openCalls&&openCalls.count>0){
    const a=document.createElement("a");a.className="rpanel rpanel-open";a.href="#/positions";
    a.innerHTML=`<div class="rp-head">Open positions</div>
      <div class="rp-big rp-big-sm">${openCalls.count}<small>awaiting resolution</small></div>`;
    rail.appendChild(a);
  }

  if(claimFrag&&claimFrag.childNodes.length){
    const p=document.createElement("div");p.className="rpanel rpanel-claim";
    p.appendChild(claimFrag);
    rail.appendChild(p);
  }
  return rail;
}

/* --------------------------------------------------------- pick a face -----
 * A real picture, cropped and resized in the browser before it is ever sent.
 *
 * A canvas draws the file centre-cropped into a 256x256 square and exports a
 * JPEG, which lands around 15-25KB. That means no server-side image
 * processing, no object storage, no upload directory to lose on a redeploy,
 * and an upper bound on what anyone can store that is enforced by the encoder
 * rather than by trusting the client.
 */
const AVATAR_PX=256;

function cropToSquare(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const side=Math.min(img.width,img.height);
      const c=document.createElement("canvas");
      c.width=AVATAR_PX;c.height=AVATAR_PX;
      const g=c.getContext("2d");
      // Centre crop, then scale. Cropping first is what keeps a portrait photo
      // from arriving as a squashed face.
      g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,AVATAR_PX,AVATAR_PX);
      resolve(c.toDataURL("image/jpeg",0.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("that file is not an image"));};
    img.src=url;
  });
}

function openAvatarPicker(scroller){
  let pending=null;
  const dim=document.createElement("div");dim.className="cdim";
  dim.innerHTML=`<div class="csheet" role="dialog" aria-label="Profile picture">
    <h3>Your picture</h3>
    <p class="cnote">Square works best. It is cropped and shrunk on your device before it is sent, so nothing large ever leaves this browser.</p>
    <div class="pf-preview"><span class="pfav pfav--big" id="pfPrev">${myAvatarStamp?`<img src="${API}/api/avatar/${encodeURIComponent(myHandle)}.jpg?v=${myAvatarStamp}" alt="">`:`<span class="pfav-empty">${esc((myHandle||"?")[0].toUpperCase())}</span>`}</span></div>
    <input type="file" id="pfFile" accept="image/jpeg,image/png" hidden>
    <button class="claimbtn" id="pfPick" type="button">Choose a picture</button>
    <div class="paste-err" id="pfErr" hidden></div>
    <button class="quiet" id="pfSave" type="button" hidden>Save this one</button>
    ${myAvatarStamp?'<button class="quiet" id="pfClear" type="button">Remove my picture</button>':""}
    <button class="quiet" id="pfCancel" type="button">Not now</button>
  </div>`;
  dim.onclick=(e)=>{if(e.target===dim)dim.remove();};
  document.body.appendChild(dim);

  const err=dim.querySelector("#pfErr"), prev=dim.querySelector("#pfPrev");
  const file=dim.querySelector("#pfFile"), save=dim.querySelector("#pfSave");
  const fail=(msg)=>{err.textContent=msg;err.hidden=false;};

  dim.querySelector("#pfPick").onclick=()=>file.click();
  file.onchange=async()=>{
    const f=file.files&&file.files[0];
    if(!f)return;
    err.hidden=true;
    try{
      pending=await cropToSquare(f);
      prev.innerHTML=`<img src="${pending}" alt="">`;
      save.hidden=false;
    }catch(e){fail(e.message||"couldn't read that file");}
  };
  save.onclick=async()=>{
    if(!pending)return;
    err.hidden=true;save.disabled=true;save.textContent="Saving…";
    try{
      const r=await fetch(`${API}/api/profile/avatar`,{method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({deviceId,image:pending})});
      const j=await r.json();
      if(!r.ok||!j.ok){save.disabled=false;save.textContent="Save this one";return fail(j.error||"couldn't save. Try again");}
      myAvatarStamp=j.stamp; ev("avatar_set",{});
      dim.remove(); loadProfile(scroller);
    }catch(e){save.disabled=false;save.textContent="Save this one";fail("couldn't save. Try again");}
  };
  const clr=dim.querySelector("#pfClear");
  if(clr)clr.onclick=async()=>{
    try{
      await fetch(`${API}/api/profile/avatar/clear`,{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
      myAvatarStamp=null; dim.remove(); loadProfile(scroller);
    }catch(e){fail("couldn't remove it. Try again");}
  };
  dim.querySelector("#pfCancel").onclick=()=>dim.remove();
}

const X_STATUS_RE=/(?:twitter|x)\.com\/[^/]+\/status\/(\d+)/i;
function openPasteSheet(){
  const dim=document.createElement("div");dim.className="cdim";
  dim.innerHTML=`<div class="csheet" role="dialog" aria-label="Create a market from an X post">
    <h3>Create from an X post</h3>
    <p class="cnote">Paste the link to any post on X. We'll open a reply with <b>@oddiefun</b> already in it. Sending that reply is what creates the market, and it makes you its creator.</p>
    <input class="paste-in" type="url" inputmode="url" placeholder="https://x.com/someone/status/123…" autocomplete="off">
    <div class="paste-err" hidden></div>
    <button class="claimbtn paste-go" type="button">Open the reply on X</button>
    <button class="quiet paste-own" type="button">No post to reply to? State your claim, tag @oddiefun</button>
    <button class="cclose">Not now</button>
  </div>`;
  dim.onclick=(e)=>{if(e.target===dim)dim.remove();};
  document.body.appendChild(dim);
  const input=dim.querySelector(".paste-in"), err=dim.querySelector(".paste-err");
  dim.querySelector(".cclose").onclick=()=>dim.remove();
  input.focus();
  const go=()=>{
    const hit=X_STATUS_RE.exec(input.value.trim());
    if(!hit){
      err.hidden=false;
      err.textContent="That doesn't look like a link to an X post. It should look like x.com/name/status/123…";
      return;
    }
    ev("paste_create",{});
    // in_reply_to makes the intent a REPLY to that exact post, which is what
    // the tag pipeline watches for — a plain tweet mentioning @oddiefun with
    // no parent has no claim attached to it.
    window.open(`https://x.com/intent/tweet?in_reply_to=${hit[1]}&text=${encodeURIComponent("@oddiefun ")}`,"_blank","noopener");
    dim.remove();
  };
  dim.querySelector(".paste-go").onclick=go;
  // The second door: an original claim, composed fresh with the tag already
  // in it. Deliberately the quiet option. The reply path is the product's own
  // loop (the market lands under an argument that already has an audience),
  // and a bare mention with no parent is the weakest thing the tag pipeline
  // can receive, so it is offered rather than led with.
  dim.querySelector(".paste-own").onclick=()=>{
    ev("compose_create",{});
    window.open(`https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}`,"_blank","noopener");
    dim.remove();
  };
  input.onkeydown=(e)=>{if(e.key==="Enter")go();};
  input.oninput=()=>{err.hidden=true;};
}

// The crowd chip: WHO is in this market, as a raw split — the one social fact
// a screenshot can carry. Raw counts, never a percentage (that job belongs to
// the odds), and nothing below two bodies: "0 in" anti-sells, and a single
// caller isn't a crowd. On a forming community card it stays hidden — the
// forming gate exists to keep skewable early splits off the card, and this
// chip must not leak what that gate hides.
function crowdChip(m){
  const y=m.crowd?.yes??0, n=m.crowd?.no??0;
  if(y+n<2 || (m.community&&m.forming))return "";
  return `<span class="mchip mchip-crowd">${PEOPLE_ICON}${y} yes · ${n} no</span>`;
}

/* Which way the line has moved since yesterday's reading.
 *
 * A percentage on its own says what the crowd thinks; a percentage that MOVED
 * says something is happening, and that is the difference between a listing and
 * a live market. It is also the one number on the card that can change while
 * you are not looking, which is the honest reason to come back.
 *
 * The server sends pctDelta only when it has something true to say — a prior
 * reading exists, it is recent enough to call "today", and the line actually
 * moved. So this renders on presence, never on a computed zero, and no chip
 * means "nothing to report" rather than "flat". Community markets never carry
 * one; see pctDeltasFor for why. */
function deltaChip(m){
  const d=Number(m.pctDelta);
  if(!Number.isFinite(d)||d===0)return "";
  const up=d>0;
  return `<span class="mchip mchip-delta ${up?"up":"down"}">${up?"▲":"▼"}${Math.abs(d)} today</span>`;
}

function metaRowHtml(m,yes){
  // Venue markets carry a SOURCED chip rather than any tagging provenance:
  // nobody on Oddie created them, and inventing an attribution would be the
  // exact fake-provenance this section is meant to avoid. Naming the source
  // is also what keeps them visually and semantically secondary to the
  // community markets around them.
  // A tagged venue market leads with WHO tagged it; the venue name drops to a
  // secondary credit behind it. An untagged one keeps the plain sourced row.
  // The movement chip sits directly after the venue credit, ahead of volume and
  // the crowd split: of everything in this row it is the only part that changed
  // since the last visit, and a row that leads with what is new reads faster
  // than one ordered by how the object was built.
  // No "N% yes" chip: the YES button below shows that exact number in the
  // largest type on the card. A market still FORMING has no meaningful % yet,
  // so that one state does get a chip, and it says what it is instead.
  const stateChip=m.forming
    ? `<span class="mchip mchip-forming"><span class="pulsedot"></span>forming · ${m.positions} ${m.positions===1?"call":"calls"}</span>`
    : "";
  const clockChip=m.closesAt?`<span class="mchip mchip-clock">${CLOCK_ICON}${closesIn(m.closesAt)}</span>`:"";
  const chain=m.onchain?`<a class="chainbadge" href="${esc(m.onchain)}" target="_blank" rel="noopener">on-chain on Solana ↗</a>`:"";
  // Attribution is no longer in this row. WHO made the market is the thing that
  // distinguishes it from an exchange listing, so it stopped being a chip among
  // chips and became the card's author row: at the top, with a face and a link.
  // Velocity — only when there IS some. Pool size and caller count say how big
  // a market got; neither says whether that happened today. A chip that reads
  // "0 calls today" on every quiet market is noise, and worse, it makes a
  // healthy-but-settled market look dead — so a quiet market simply doesn't
  // get one and keeps the chips it already earned.
  const hot=Number(m.callsToday)||0;
  const hotChip=hot>0?`<span class="mchip mchip-hot">🔥 ${hot} today</span>`:"";
  return `${hotChip}${stateChip}${crowdChip(m)}${clockChip}${chain}`;
}
// Home's continuous-play loop: how many markets one chain will auto-serve
// (the very first card counts as #1) before handing off to "browse more in
// Feed" instead of pulling another. Keeps Home from trying to replicate an
// infinite feed — it's a taste of the loop, not a replacement for Feed.
const HOME_LOOP_CAP=5;
// Every Nth advance in the chain, a tag reminder interstitial takes the next
// preview's place instead (see renderTagReminderInterstitial) — the loop's
// whole point is bringing attention back to tagging real claims on X, not
// just chaining in-app taps forever. chainCount%CADENCE===0 fires it after
// locks 2 and 4 for the default cap of 5, never on the very last slot (the
// cap check runs first and wins).
const HOME_TAG_REMINDER_CADENCE=2;

/** Replace a chain element (the preview, or the tag-reminder interstitial)
 *  with the next real, playable card. The ONE place the chain's card swap
 *  happens, so tap / auto-advance / swipe / "keep playing" can never drift
 *  apart on how the next card enters or where the page lands afterwards. */
function swapToNextCard(el,nextM,homeLoop,chainCount){
  const card=buildCard(nextM,homeLoop.ctx.nextIdx(),{ctx:homeLoop.ctx,chainCount:chainCount+1});
  // Same non-swipeable-list suppression the initial featured cards get — a
  // loop card is just as static a slot as they are, never a swipeable one.
  card.querySelector(".nudge")?.style.setProperty("display","none","important");
  card.classList.add("snap-in");
  el.replaceWith(card);
  // Scroll duration matched to the snap, not the page's leisurely default:
  // a 520ms glide under a 280ms card animation reads as two separate motions.
  scrollToEl(document.getElementById("scroller"),card,{offset:20,duration:260});
}

/** Swipe-up to advance, for touch. Tracks the finger while the gesture is in
 *  progress (so it feels attached rather than merely triggered), commits past
 *  a short threshold, and springs back otherwise. Everything is inline style
 *  rather than a class: the follow-the-finger transform has to win over any
 *  stylesheet rule, and mixing the two is how that kind of thing silently
 *  stops working. Passive listeners throughout — this never blocks scrolling,
 *  and a downward drag is left alone entirely so the page still scrolls. */
function attachSwipeUp(el,onCommit){
  const THRESHOLD=40, MAX_FOLLOW=70;
  let startY=null,dy=0;
  el.addEventListener("touchstart",(e)=>{startY=e.touches[0].clientY;dy=0;},{passive:true});
  el.addEventListener("touchmove",(e)=>{
    if(startY===null)return;
    dy=e.touches[0].clientY-startY;
    if(dy<0)el.style.transform=`translateY(${Math.max(dy,-MAX_FOLLOW)}px)`;
  },{passive:true});
  el.addEventListener("touchend",()=>{
    if(startY===null)return;
    const committed=dy<-THRESHOLD;
    startY=null;
    if(!committed){el.style.transform="";return;}   // spring back
    if(REDUCE_MOTION){onCommit();return;}
    el.style.transition="transform .16s ease-in, opacity .16s ease-in";
    el.style.transform=`translateY(-${MAX_FOLLOW}px)`;el.style.opacity="0";
    setTimeout(onCommit,140);
  },{passive:true});
}

/** Home's continuous-play loop, step 2: the "up next" preview appended after
 *  a locked call's CTAs (share / connect / tag-teaching — see lockedUI).
 *  `nextM` is already pulled/reserved from the shared pool by the time this
 *  renders, so the preview shows the market that's actually coming, not a
 *  placeholder. Tapping it or letting its countdown reach zero both call the
 *  same `advance` — "tap now" and "auto-advance" are one mechanism, not two
 *  competing ones. */
function renderNextCallPreview(anchor,nextM,homeLoop,chainCount){
  const SECS=5;
  const prev=document.createElement("button");
  prev.type="button";prev.className="nextcall-prev";
  prev.innerHTML=`<span class="ncp-cat">${esc(nextM.topicCategory||nextM.category)}</span>
    <span class="ncp-q trunc">${esc(nextM.question)}</span>
    <span class="ncp-cta">Next call <span class="ncp-timer">in ${SECS}s</span> →</span>`;
  anchor.after(prev);
  let secsLeft=SECS,advanced=false;
  const timerEl=prev.querySelector(".ncp-timer");
  const advance=()=>{
    if(advanced)return; advanced=true;
    clearInterval(tickId);
    swapToNextCard(prev,nextM,homeLoop,chainCount);
  };
  const tickId=setInterval(()=>{
    if(!prev.isConnected){clearInterval(tickId);return;} // navigated away mid-countdown
    secsLeft--;
    if(secsLeft<=0){advance();return;}
    if(timerEl)timerEl.textContent=`in ${secsLeft}s`;
  },1000);
  prev.onclick=advance;
  // Swipe-up as an alternative to tapping — the gesture the feed already
  // trains, reused for the chain. The preview tracks the finger while the
  // swipe is in progress so it feels attached rather than triggered, then
  // hands off to the same `advance` the tap and the timer use.
  attachSwipeUp(prev,advance);
}

/** Home's continuous-play loop, cadenced step: fires INSTEAD of the normal
 *  next-call preview every HOME_TAG_REMINDER_CADENCE locks — the loop must
 *  keep steering attention back to tagging real claims on X, not read as
 *  pure in-app consumption. `nextM` is the SAME already-reserved market the
 *  normal preview would have shown; tapping "keep playing" reveals it
 *  directly (no redundant preview-then-card step). Deliberately NOT
 *  auto-advancing like the regular preview — this is the one deliberate
 *  pause in the loop, not another fast beat, so it waits for an explicit tap. */
function renderTagReminderInterstitial(anchor,nextM,homeLoop,chainCount){
  const el=document.createElement("div");
  el.className="loop-tag-reminder";
  el.innerHTML=`<p class="onboard-teach-body">🔥 On a roll. Tag a real claim on X and earn <b>+50</b> when it becomes a market.</p>
    <a class="onboard-teach-cta" href="https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}" target="_blank" rel="noopener">
      <span class="glyphx">𝕏</span> Tag @oddiefun on X</a>
    <button type="button" class="keep-playing-cta">keep playing →</button>`;
  anchor.after(el);
  // Same swap the preview uses, so the card lands identically either way.
  // Deliberately NOT swipe-enabled: this beat is the loop's one intentional
  // pause, and a gesture that skips it in a flick would undo the point of it.
  el.querySelector(".keep-playing-cta").onclick=()=>swapToNextCard(el,nextM,homeLoop,chainCount);
}

/** Home's continuous-play loop, end state: the chain hit HOME_LOOP_CAP or the
 *  reserve pool ran dry — either way there's more to call, it's just not
 *  auto-served here anymore. Same visual weight as the CTAs above it: a
 *  next step, not an error or an apology. */
function renderFeedFallback(anchor){
  const fb=document.createElement("a");
  fb.className="nextcall-fallback";fb.href="/feed";
  fb.innerHTML=`<span>Keep going. Browse more in Feed</span><span class="nc-arrow">→</span>`;
  anchor.after(fb);
}

function buildCard(m,i,homeLoop){
    const yes=m.yesPct,no=100-yes;
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`
      <div class="chead">
        ${authorRowHtml(m)}
        <button class="shareico" aria-label="Share this market">${SHARE_ICON}</button>
      </div>
      ${m.slug===startSlug && m.sourceUrl ? `<a class="srctweet" href="${esc(m.sourceUrl)}" target="_blank" rel="noopener noreferrer">
        <span class="srctweet-ico">${X_ICON}</span>
        <span class="srctweet-body">
          <div class="srctweet-lab">Tagged from a post${m.challengeHandle?` by <b>@${esc(m.challengeHandle)}</b>`:""}</div>
          <div class="srctweet-link">View the original post on X ↗</div>
        </span>
      </a>` : ""}
      ${sourcePostHtml(m)}
      <div class="meta">${metaRowHtml(m,yes)}</div>
      <div class="take${takeSizeClass(displayTitle(m.question))}">${esc(displayTitle(m.question))}</div>
      <div class="duel">
        <button class="orow" data-side="yes" style="--fill:${yes}%" aria-label="Yes, ${yes} percent, pays ${fmtMult(yes)}">
          <span class="oside">YES</span>
          <span class="opct"><span class="opct-num" data-to="${yes}">${yes}</span><span class="opct-unit">%</span></span>
          <span class="opay">${fmtMult(yes)}</span>
        </button>
        <button class="orow" data-side="no" style="--fill:${no}%" aria-label="No, ${no} percent, pays ${fmtMult(no)}">
          <span class="oside">NO</span>
          <span class="opct"><span class="opct-num" data-to="${no}">${no}</span><span class="opct-unit">%</span></span>
          <span class="opay">${fmtMult(no)}</span>
        </button>
      </div>
      ${statsRowHtml(m)}
      ${m.community && m.resolutionCriteria ? `<details class="rby"><summary>resolution criteria</summary><p class="rby-body">${esc(m.resolutionCriteria)}</p></details>` : ""}
      ${m.community?`<button class="tagcta" type="button" data-tagcta>Your turn: tag <b>@oddiefun</b> <span aria-hidden="true">→</span></button>`:""}
      <!-- The creator-fee note used to sit here, on every card, explaining a
           mechanic to the one person on screen it does not apply to: the
           reader. A market's card is where you pick a side. The reason to
           TAG one belongs where tagging happens (the landing's step 4, the
           feed's end card), not stapled to every question you scroll past.
           What survives is the RECEIPT: once a market has actually paid its
           tagger, that is proof rather than a pitch, it names a person, and
           it is exactly the kind of thing worth screenshotting. -->
      ${m.slug===startSlug && m.callers && m.callers.length ? `<div class="callers">
        <div class="callers-lab">Who called it</div>
        <div class="callers-list">${m.callers.map(c=>`
          <div class="caller-row">
            <span class="caller-handle">${c.handle?`@${esc(c.handle)}`:"anonymous caller"}</span>
            <span class="caller-side ${c.side}">${c.side.toUpperCase()}</span>
            <span class="caller-pct">${Math.round(c.pct)}%</span>
          </div>`).join("")}</div>
        ${m.callersTotal>m.callers.length ? `<div class="callers-more">+${m.callersTotal-m.callers.length} more</div>` : ""}
      </div>` : ""}
      ${m.slug===startSlug ? `<button class="challenge" data-challenge type="button">⚔️ Challenge the other side</button>` : ""}
      <div class="social" id="soc${i}"></div>
      <div class="nudge" id="nudge${i}"><span class="arrow">↑</span><span>${GESTURE} for the next take</span></div>`;
    const tagBtn=card.querySelector("[data-tagcta]");
    if(tagBtn)tagBtn.onclick=(e)=>{e.stopPropagation();ev("tag_cta_card",{slug:m.slug});openPasteSheet();};
    card.dataset.slug=m.slug;card.dataset.idx=i;
    // Inert marker, always present regardless of the real-stakes flag — a plain
    // boolean, not a button or any real-money language. It's how the (optional,
    // separately-loaded) chain.js module finds eligible cards via DOM
    // observation, without buildCard needing to know or import anything about
    // that layer. When the flag is off, chain.js never loads and this
    // attribute does precisely nothing.
    card.dataset.community=m.community?"1":"0";
    // The venue-market equivalent of the marker above, for the SECOND
    // real-money path: a Polymarket market staked through Jupiter's order API
    // rather than our own parimutuel. Two attributes rather than one because
    // the two paths have genuinely different rules — different contract,
    // different geofence (ours blocks nobody, the venue one blocks 19
    // countries incl. the US), different prepare endpoint — and chain.js has
    // to pick per card, not per page. venueId is what the order API keys on;
    // absent for community markets, which use `slug` against our own program.
    if(!m.community && m.venue) card.dataset.venue=m.venue;
    if(!m.community && m.venueId) card.dataset.venueId=m.venueId;
    // Discovery share: "check this out". The link unfurls to the card, so the
    // text stays light — the question rides along in the preview.
    card.querySelector(".shareico").onclick=(e)=>{e.stopPropagation();
      shareMarket({slug:m.slug,text:`${displayTitle(m.question)} · call it 👇`,source:"card",anchor:e.currentTarget});};
    // Challenge the other side: a pre-filled X intent aimed at the party the
    // claim came from (the tweet author, if we know them), else generically
    // framed. Nothing is posted — the compose window opens, they choose to send.
    const chBtn=card.querySelector("[data-challenge]");
    if(chBtn)chBtn.onclick=(e)=>{e.stopPropagation();
      const handle=(m.challengeHandle||"").replace(/^@+/,"");
      const text=(handle?`@${handle} `:"")+"You sound confident. Make the call:";
      xShare(text, `${SHARE_ORIGIN}/m/${m.slug}`, "challenge");
      ev("challenge_click",{slug:m.slug,targeted:!!handle});};
    const [y,nb]=card.querySelectorAll(".orow");
    const soc=card.querySelector("#soc"+i);

    /**
     * One tap picks a side and opens the bet sheet on it.
     *
     * It used to be the whole transaction: every call cost the same, so there
     * was nothing to choose and a tap placed it behind a five-second undo. An
     * amount and a signature exist now, so the tap is the first of three steps
     * rather than all of them, and the sheet carries the rest.
     */
    const pct=()=>side==="yes"?yes:no;
    let side=null;

    /** The one true write path: POST the call, then flip the card to its locked
     *  state. This is the single moment a call actually locks in. */
    const lockedUI=(s,bonus,crowd,callId,firstEver)=>{
      y.disabled=nb.disabled=true;
      // The confirmation snap: fires exactly once, exactly HERE — the single
      // moment a call actually locks in, never on the earlier optimistic tap
      // that a 5s undo can still cancel.
      (s==="yes"?y:nb).classList.add("pick","locked-flash");(s==="yes"?nb:y).classList.add("dim");
      // Promise only what happens: the call is recorded; the market, not us,
      // decides when it means anything. No "we'll tell you who was right".
      soc.textContent=`Locked — 1 prediction on ${s.toUpperCase()}, +${bonus} if right. Settles when the market resolves.`;
      // ...and which side of the room they just joined. Solo action, social fact.
      const slText=crowd?socialLine(s,crowd,s==="yes"?yes:no):"";
      if(slText){
        const sl=document.createElement("div");
        sl.className="socline";
        sl.textContent=slText;
        soc.after(sl);
      }
      // The strong entry point: "I called it — what do you say?" is bet-don't-
      // argue itself. The text names their side; the link carries the market.
      // The reward is ON the button — making the product loud must read as
      // paid work, not a favor. Honest here specifically: the share award
      // dedups per call, and this button only exists right after a fresh
      // call, so its first press really does pay.
      const sb=document.createElement("button");
      sb.className="sharebig";sb.innerHTML=`${SHARE_ICON}<span>Share your call · +80 oddies</span>`;
      // The personal card: mint the owner-only share link, then hand it to the
      // OS sheet. It lands on THEIR timeline — the social layer lives on X.
      sb.onclick=async(e)=>{
        const anchor=e.currentTarget;
        let url;
        if(callId){
          try{const r=await fetch(`${API}/api/position/${callId}/sharelink`,{method:"POST",
            headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
            const j=await r.json();if(j.ok)url=j.url;}catch(e){/* generic link still shares */}
        }
        // Short, confident, challenge-toned — matching the "make the call" voice
        // everywhere else, not a dry status readout. The link rides separately
        // (native share / the X intent both append it), so the ↓ just cues that
        // it's coming right after.
        shareMarket({slug:m.slug,text:`${s.toUpperCase()} at ${s==="yes"?yes:no}%. prove me wrong ↓`,source:"postcall",anchor,url});
      };
      (card.querySelector(".socline")||soc).after(sb);
      // Both post-lock CTAs stack below the locked line in the order a first-
      // timer should meet them: share the call, then (if anonymous) the save-
      // your-balance offer, then (stage 2, below) the tag-teaching moment —
      // each .after() chains off the last, so none of the three ever displaces
      // another; they're just three rows in order, all reachable by scrolling.
      let lastCta=sb;
      // Layer 1 — "save your answer": a soft, explicitly dismissible conversion
      // nudge, only for someone who has not connected. It rides the same
      // "see who's right" moment (the locked line above just promised
      // resolution), converting anonymous prediction -> account-linked
      // reputation. An offer, not a gate: skipping it never touches the call
      // that already landed, and no money is involved anywhere in it.
      if(!auth.accounts.length){
        const nudge=document.createElement("div");
        nudge.className="save-nudge";
        nudge.innerHTML=`<p class="save-nudge-body">Want to save this call and build your track record? <b>Connect X or Google.</b></p>
          <div class="save-nudge-row">
            <button class="save-nudge-cta" type="button">Connect</button>
            <button class="save-nudge-x" type="button" aria-label="Dismiss">✕</button>
          </div>`;
        nudge.querySelector(".save-nudge-cta").onclick=()=>connectSheet("Keep this call when you switch devices");
        nudge.querySelector(".save-nudge-x").onclick=()=>{nudge.remove();ev("save_nudge_dismissed",{slug:m.slug});};
        sb.after(nudge);
        lastCta=nudge;
        ev("save_nudge_shown",{slug:m.slug});
      }
      // Stage 2 of onboarding — "now teach them the tag." Only attempted when
      // THIS call was firstEver:true (never on a returning player's calls), and
      // even then the server's claimTagTeachingMoment is the real one-shot gate:
      // best-effort, fire-and-forget, same tolerance as awardParticipation for
      // "this extra doesn't ship, the call itself already did."
      if(firstEver){
        (async()=>{
          try{
            const r=await fetch(`${API}/api/onboarding/tag-teaching-seen`,{method:"POST",
              headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
            const j=await r.json().catch(()=>({}));
            if(!j.show)return;
            const teach=document.createElement("div");
            teach.className="onboard-teach";
            teach.innerHTML=`<p class="onboard-teach-body">🎉 First call locked. Now the real move: markets here are born from X. Tag <b>@oddiefun</b> under any claim and earn <b>+50</b> when it becomes a market.</p>
              <a class="onboard-teach-cta" href="https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}" target="_blank" rel="noopener">
                <span class="glyphx">𝕏</span> Tag @oddiefun on X</a>`;
            lastCta.after(teach);
          }catch(e){/* the teaching moment just doesn't fire; the call itself already locked */}
        })();
      }
      // The continuous-play loop — Home only; `homeLoop` is undefined on the
      // swipe Feed, where "next" already means "swipe", not "tap a preview".
      // Anchored off `card` itself, NOT `lastCta`: share/connect/teach are all
      // inserted INSIDE the card's own div (siblings of `soc`, a descendant of
      // `card`), which is right for them — they're part of this card's locked
      // state. The next-call preview (and the full card it later swaps into)
      // must NOT nest inside there too, or the next market renders trapped
      // inside the previous card's rounded border instead of appearing below
      // it. `card.after(...)` inserts as a sibling of `card` in the section,
      // landing right after this whole card — CTAs included — same position
      // it would occupy if it had simply been the next card in the section.
      if(homeLoop){
        const chainCount=homeLoop.chainCount;
        const nextM=chainCount<homeLoop.ctx.cap?homeLoop.ctx.pull():null;
        if(!nextM)renderFeedFallback(card);
        // Cadenced tag reminder instead of the usual preview — see
        // HOME_TAG_REMINDER_CADENCE. The cap check above always wins: this
        // never fires on the last slot, where there's nothing left to
        // "keep playing" into anyway.
        else if(chainCount%HOME_TAG_REMINDER_CADENCE===0)renderTagReminderInterstitial(card,nextM,homeLoop,chainCount);
        else renderNextCallPreview(card,nextM,homeLoop,chainCount);
      }
      // One more action on the clock for the guest bar's "come back after N
      // calls" rule — counted here, at the single moment a call truly locks.
      bumpGuestCalls();
      card.querySelector("#nudge"+i).classList.add("show");
      card.querySelector("#nudge"+i).classList.remove("hint");
    };
    /* The optimistic-call machinery is gone with the call it wrapped.
       placeNow, startPending, pendingUI, commitPending and cancelPending
       implemented a five-second undo: a tap deducted the stake immediately,
       showed what it would win, and only POSTed when the window closed, so an
       undone call had never existed anywhere. Good design for a one-tap spend
       of a free token.
       A position is a wallet signature now. There is nothing to deduct
       optimistically, nothing to undo locally once it is signed, and the
       confirmation people need comes from their own wallet rather than from a
       countdown we drew. Nothing called into any of it after the card's YES/NO
       started opening the bet sheet, and dead machinery this size is the kind
       that gets accidentally revived. */

    const tap=(s)=>{
      if(y.disabled)return;
      /* A community market is our own parimutuel, and its only money is real
         SOL in the vault. So the tap opens the bet sheet with this side
         already chosen, instead of spending a free prediction on a pool that
         no longer settles anything.
         The side travels with it deliberately: the tap IS the decision, and
         asking for it again inside the sheet would make these buttons
         decorative. Everything after it (amount, wallet, signature) is
         confirming a choice already made.
         Falls through to the play path when the chain layer is not loaded,
         which is the case on a build with ONCHAIN_ENABLED off. That is a
         development state, not a user-facing one. */
      if(window.OddieChain&&window.OddieChain.openStake){
        try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
        ev("side_tap",{slug:m.slug,idx:i,side:s});
        window.OddieChain.openStake(m.slug,s);
        return;
      }
      /* The chain layer did not load, so there is no way to take a side. Say so.
         This used to fall through to a play-token call, which was correct while
         that call bought a position in a pool that settled. It does not any
         more: the tap would have spent a number from a balance nothing refills,
         on a market that pays in SOL, and looked like it worked.
         Reachable only with ONCHAIN_ENABLED off (a development server with no
         admin key) or if /chain.js failed to load. Both are states where the
         honest answer is that trading is unavailable, not a silent no-op
         wearing the costume of a bet. */
      soc.textContent="Can't take a side right now. Reload in a moment.";
    };
    y.onclick=()=>tap("yes");
    nb.onclick=()=>tap("no");
    return card;
}

/* The first-visit guided tour (3 steps: TOUR_STEPS, runGuidedTour,
 * maybeGuidedTour) was removed here, deliberately and entirely:
 *  - It taught by READING before allowing DOING — the opposite of the
 *    hypercasual bar this product is built to ("content plays before you act").
 *  - It double-onboarded: the hero's tagdemo was built to make a tour
 *    unnecessary, and the tour's own step 3 spotlighted the hero's button.
 *  - Its step 2 targeted #bal, which is display:none on desktop (the rail
 *    carries a separate pill), so the spotlight ring collapsed to a dot.
 *  - X in-app browsers and private windows mint fresh device ids, so the
 *    heaviest onboarding hit the coldest traffic repeatedly.
 * What replaced it: the cued first card (firstcall-cue), the hero demo, the
 * moment-of-spend "−1" flash (flashBalanceSpend), and the win celebrations
 * that already existed. If a one-shot hint is ever needed again, follow
 * claimTagTeachingMoment's pattern — do not resurrect a multi-step tour. */

/* ------------------------------------------------------------------ home --
 * The new default at "/". Sells the product's actual chain — claim -> tag ->
 * call -> opponent -> resolution -> receipt -> reputation — instead of opening
 * on a market catalog. No gate, no extra step: this screen IS the onboarding.

async function renderHome(){
  paintNav("");         // home isn't one of the 5 nav destinations — none highlighted
  homeTop();
  const scroller=document.getElementById("scroller");
  scroller.classList.remove("snap");

  // in-app webviews especially) restore a prior scroll offset on a fresh load of

  scroller.scrollTop=0; window.scrollTo(0,0);
  scroller.innerHTML='<div class="state">loading…</div>';
  await loadBalance().catch(()=>{}); // balance pill + streak badge, same as everywhere
  // Every data-driven section starts EMPTY and is rendered only if the server
  // actually sent rows for it — so a fetch failure, a cold database, or a
  // genuinely thin product all degrade to the section being absent. Nothing
  // here has a placeholder or a sample row to fall back to, by design.
  let featured=[], settled=[], topCallers=[], activity=null, openCalls=null, surfaceReward=50, newUser=false, featuredShown=4, me=null, creator=null, topCreators=[]; // 50/4 are only pre-fetch placeholders; the block below always prefers the live values
  try{

    // section on Home is aggregate and renders the same for anyone.

    if(r.ok){const j=await r.json();
      // `featured` now carries MORE than the visible section shows (see
      // HOME_FEATURED_POOL server-side) — featuredShown is where the visible
      // slice ends and the continuous-play loop's reserve begins; see the
      // featured section below.
      featured=Array.isArray(j.featured)?j.featured:[];

      // rank, tier) and creator (fees earned, markets made). Both null for a
      // device the server doesn't know yet, and the rail omits the panel.
      me=j.me&&typeof j.me==="object"?j.me:null;
      creator=j.creator&&typeof j.creator==="object"?j.creator:null;

  }catch(e){/* every section degrades to absent, not an error state */}

  const wrap=document.createElement("div");wrap.className="homewrap";

  // The hero leads for EVERYONE, new visitor included. Three separate users
  // independently read the product as "another Polymarket" because the first
  // thing on screen was a scrollable list of markets to bet on — which is
  // precisely what Polymarket is. The markets aren't the differentiator; where
  // they COME FROM is. So the tag mechanic opens the page and the feed is
  // demoted to a single sample below it.
  //
  // The mechanic is shown, not described: .tagdemo is a miniature of an X
  // argument becoming a market with live odds. That transformation IS the
  // answer to "how is this different", and a picture of it lands before a
  // sentence about it would — which is also how this stays short. There is

  // explainer, and the CTA underneath names the action.
  // Written for someone who has never used a prediction market and does not

  // familiarity are gone:
  //
  //  - The headline used to end "Turn it into a market." "Market" is the one
  //    word a newcomer cannot decode, and it was the payoff of the sentence.
  //    "Prove you're right" needs no glossary and states the MOTIVE, which is
  //    the part a stranger actually has to buy; the demo below then teaches
  //    the mechanic, so the word arrives with a picture attached instead of
  //    standing on its own. That second line is also the ONE piece of copy
  //    that has to survive future edits: "prove you were right" is the
  //    emotional hook of the whole product, and it was accidentally dropped
  //    once already (the original "Someone's wrong on X? Prove you're right."
  //    lost its third clause when the hero was rewritten tag-first). If this
  //    line is being reworded again, keep the proving.
  //  - The demo stopped at a question with two percentages on it, which shows
  //    WHAT you make but never WHY it's worth making. The third beat — it
  //    actually resolves, and the people who were right are named — is the
  //    entire point of the product and it was the one step missing. A
  //    newcomer can now read the whole loop top to bottom without a caption

  //
  // The connectors carry the verbs so the flow explains itself with no prose
  // block: this is three small pictures and two short lines, not a paragraph.
  // .hero-first: the "own the whole first screen" treatment is scoped to a
  // brand-new visitor ONLY. This element is shared by both branches below,
  // and giving it an enforced near-full-viewport min-height unconditionally
  // would ALSO push a returning player's streak/claim/livestrip — the stuff
  // they actually came back for — behind an oversized hero they don't need
  // explained to them again. "My grandmother understands it in 3 seconds" is
  // about someone with zero context; it was never a complaint about the
  // returning-player view, and this must not become one.
  // TWO different openings, because two different people arrive here.
  //
  // A returning player gets a COMPACT CREATE BAR (~160px) and then the live
  // feed: they know what Oddie is, and the tall explain-the-mechanic hero was
  // spending the most valuable region of the screen telling them something
  // they already knew, while the actual product — markets people are making
  // and trading right now — started below the fold. Pump.fun doesn't explain
  // token creation on its home page, it shows tokens. Same principle.
  //
  // A brand-new visitor still gets the full teaching hero, because for them
  // the mechanic IS the missing information. That branch is unchanged.
  //
  // The headline also widens: "Someone's wrong on X?" frames the whole product
  // as argument-settling, which is one wedge, not the scope. Markets come from
  // news, sports, launches, transfers, crypto — "Turn any post on X into a
  // market" covers all of it, and the sub-line names all three layers (create,

  const hero=document.createElement("div");
  if(!newUser){
    hero.className="createbar";
    hero.innerHTML=`
      <div class="cb-copy">
        <h1 class="cb-title">Turn any post on X into a market.</h1>

      <div class="cb-actions">
        <a class="cb-tag" href="https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}" target="_blank" rel="noopener"><span class="glyphx">𝕏</span> Tag @oddiefun on X</a>
        <button class="cb-paste" type="button">🔗 Paste X link</button>
      </div>`;
    hero.querySelector(".cb-paste").onclick=()=>openPasteSheet();
  }else{
  hero.className="hero hero-first";
  hero.innerHTML=`<h1 class="herotitle">Someone's wrong on X?<br>Prove you're right.</h1>
      <div class="tagdemo" aria-label="How it works: someone posts a take on X, you tag @oddiefun, it becomes a question anyone can answer, and when it plays out everyone sees who was right.">
        <div class="tagdemo-post"><span class="tagdemo-av"></span>
          <span class="tagdemo-txt">“No shot the Lakers make the playoffs.”</span></div>
        <div class="tagdemo-step">↓ you tag <b>@oddiefun</b></div>
        <div class="tagdemo-card">
          <span class="tagdemo-q">Will the Lakers make the playoffs?</span>
          <span class="tagdemo-odds"><span>YES 38%</span><span>NO 62%</span></span>
        </div>
        <div class="tagdemo-step">↓ the season plays out</div>
        <div class="tagdemo-done">✓ Resolved YES. The 38% called it</div>
      </div>
      <a class="herocta" href="https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}" target="_blank" rel="noopener">
        <span class="glyphx">𝕏</span> Tag @oddiefun on X</a>`;
  }
  // The "+${surfaceReward} points" line that used to close the hero is gone
  // from THIS screen, not from the product — real users read it as a fifth
  // stacked thing competing with headline/demo/CTA for the first 3 seconds.
  // The reward now surfaces where it has context: the fee note on every
  // community card and the tag-reminder interstitial. surfaceReward stays
  // wired here (see the /api/home read above) for whichever surface needs
  // the live number next.

  // An active claim streak, as its own badge above the claim strip. Farmers grind
  // streaks, and buried in the claim card's grey sub-line it was easy to miss.
  // Rendered only for a REAL streak of at least a day; the claim card is told to
  // stop repeating it so the same fact isn't stated twice in adjacent elements.
  const streakWrap=document.createElement("div");streakWrap.className="streakwrap";
  const paintStreak=(st)=>{

    streakWrap.innerHTML=n>0?`<span class="streakpill">🔥 ${n}-day streak</span>`:"";
    streakWrap.hidden=!(n>0);
  };
  paintStreak(claim&&claim.streak);

  // hero it's built detached and placed by the append order below. A visitor
  // who has never made a call has nothing to come back to yet, and handing
  // them a second pile of predictions before they've spent their first one is
  // noise on the one screen that should be asking for a single tap. Returning
  // players keep it up top, which is where a daily claim belongs.
  const claimFrag=document.createDocumentFragment();
  claimFrag.appendChild(streakWrap);

  // "Your open calls" — the Zeigarnik hook: an unresolved prediction, visible
  // the moment they land, is a reason to come back that the daily claim isn't.
  // Hidden entirely with zero open positions — never "0 open calls" theatre.
  //
  // newUser ONLY. A returning player gets this in the right rail instead (see
  // buildRail), worded as "open positions" rather than "open calls" — in a
  // product where you can both hold a position and create a market, "calls"
  // was ambiguous between the two. Appending it here as well would render the
  // same fact twice on the same screen.
  if(newUser&&openCalls&&openCalls.count>0){
    const bare=openCalls.nextCloseAt?closesIn(openCalls.nextCloseAt).replace(/^closes in /,""):null;
    // "closing" is closesIn()'s own wording for "past due, not yet swept" — a
    // stale duration reads worse than just omitting the clause here.
    const nextClause=bare&&bare!=="closing"?` · next one resolves in ${esc(bare)}`:"";
    const row=document.createElement("a");row.className="opencalls";row.href="#/positions";
    row.innerHTML=`<span class="oc-ico">🎯</span>
      <span class="oc-text">You have <b>${openCalls.count}</b> open call${openCalls.count===1?"":"s"}${nextClause}</span>

    wrap.appendChild(row);
