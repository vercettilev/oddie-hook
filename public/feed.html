/* After a call: which side of the room did you just join? Only said at all
 * when enough poppers called it that the percentage is a signal — below the
 * floor the line is simply absent, because "67% of poppers" meaning 2-of-3 is
 * noise dressed up as precision, and the locked state reads fine without it. */
const MIN_CROWD=10;
function socialLine(side,crowd,marketSidePct){
  const yes=crowd?.yes??0, no=crowd?.no??0, total=yes+no;
  if(total<MIN_CROWD)return "";
  const p=Math.round(100*(side==="yes"?yes:no)/total);
  const m=marketSidePct;
  if(p>=50&&m<50)return `You're with ${p}% of poppers. The market disagrees (${m}%).`;
  if(p>=50)return `You're with ${p}% of poppers — and the market (${m}%).`;
  if(m>=50)return `Only ${p}% of poppers with you — but the market is (${m}%).`;
  return `Contrarian: ${p}% of poppers and a ${m}% market against you.`;
}

function renderFeed(items){
  const scroller=document.getElementById("scroller");
  scroller.innerHTML="";
  if(!items.length){scroller.innerHTML='<div class="state">no live markets here right now — try another category.</div>';return;}
  // TikTok-web taste flow. An anonymous visitor gets the feed metered:
  //   no categories picked yet -> 2 free cards, then the category picker
  //   categories picked         -> 3 re-ranked cards, then the sign-in gate
  // Signed-in / allowlisted / invited visitors see the whole feed (list=items).
  let list=items, tail=null;
  if(TASTE){
    if(!tasteCats().length){list=items.slice(0,2);tail="picker";}
    else{list=items.slice(0,3);tail="gate";}
  }
  list.forEach((m,i)=>{
    const yes=m.yesPct,no=100-yes;
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`
      <div class="chead">
        <div class="cat">${esc(m.category)}</div>
        <button class="shareico" aria-label="Share this market">${SHARE_ICON}</button>
      </div>
      <div class="take">${esc(m.question)}</div>
      <div class="meta">${money(m.volumeUsd)} in play</div>
      <div class="duel">
        <button class="orow" style="--fill:${yes}%" aria-label="Yes, ${yes} percent, wins ${fmtMult(yes)}">
          <span class="oside">YES</span><span class="opct">${yes}%</span><span class="opay">win ${fmtMult(yes)}</span>
        </button>
        <button class="orow" style="--fill:${no}%" aria-label="No, ${no} percent, wins ${fmtMult(no)}">
          <span class="oside">NO</span><span class="opct">${no}%</span><span class="opay">win ${fmtMult(no)}</span>
        </button>
      </div>
      <div class="picker" id="pick${i}" hidden>
        <div class="amts">
          <button class="amt" data-v="10">10</button>
          <button class="amt" data-v="25">25</button>
          <button class="amt" data-v="50">50</button>
          <button class="amt" data-v="all">All-in</button>
          <input class="amt-in" type="number" min="1" inputmode="numeric" aria-label="custom amount">
        </div>
        <div class="pline" id="pline${i}"></div>
        <div class="pbtns">
          <button class="confirm" id="cf${i}">Confirm</button>
          <button class="pcancel" aria-label="cancel">✕</button>
        </div>
      </div>
      <div class="social" id="soc${i}"></div>
      <div class="nudge" id="nudge${i}"><span class="arrow">↑</span><span>${GESTURE} for the next take</span></div>`;
    card.dataset.slug=m.slug;card.dataset.idx=i;
    // Discovery share: "check this out". The link unfurls to the card, so the
    // text stays light — the question rides along in the preview.
    card.querySelector(".shareico").onclick=(e)=>{e.stopPropagation();
      shareMarket({slug:m.slug,text:`${m.question} · call it 👇`,source:"card",anchor:e.currentTarget});};
    const [y,nb]=card.querySelectorAll(".orow");
    const picker=card.querySelector("#pick"+i), line=card.querySelector("#pline"+i),
          confirmBtn=card.querySelector("#cf"+i), input=card.querySelector(".amt-in");
    let side=null, amt=10;

    /**
     * Two taps: a side, then Confirm. Everything between them is one line that
     * recomputes live, so the payout math never happens in the user's head.
     * The picker caps at the balance rather than erroring — running out of
     * tokens should read as a state, not a mistake.
     */
    const pct=()=>side==="yes"?yes:no;
    const soc=card.querySelector("#soc"+i);
    /**
     * Which control the user actually pressed, not which one happens to equal
     * the amount. With a balance of 50, `50` and `All-in` are the same number
     * and both used to light up, so "which amount is selected" had two answers.
     * A custom amount lights none of them, which is correct: the input shows it.
     */
    let chosen="10";
    const setAmt=(v)=>{
      let capped=false;
      chosen=String(v);
      if(v==="all")v=balance??1;
      v=Math.max(1,Math.floor(Number(v)||1));
      if(balance!==null&&v>balance){v=Math.max(1,balance);capped=true;}
      amt=v;
      card.querySelectorAll(".amt").forEach(b=>{
        const on=b.dataset.v===chosen;
        b.classList.toggle("on",on);
        b.setAttribute("aria-pressed",String(on));
      });
      if(balance===0){
        line.textContent="Out of tokens — nothing left to put on this one.";
        confirmBtn.disabled=true;return;
      }
      confirmBtn.disabled=false;
      const win=Math.round(amt*100/pct());
      line.textContent=`Put ${amt} → win ${win} if you're right (${(win/amt).toFixed(1)}×)`
        +(capped?" — that's everything you've got":"")
        +(balance!==null&&amt===balance&&!capped?" — all of it":"");
    };
    const openPick=(s,initAmt=10)=>{
      side=s;card.classList.add("picking");
      (s==="yes"?y:nb).classList.add("pick");(s==="yes"?nb:y).classList.add("dim");
      picker.hidden=false;input.value="";
      setAmt(initAmt);
    };
    const closePick=()=>{
      side=null;picker.hidden=true;card.classList.remove("picking");
      y.classList.remove("pick","dim");nb.classList.remove("pick","dim");
    };
    card.querySelectorAll(".amt").forEach(b=>b.onclick=()=>{input.value="";setAmt(b.dataset.v);});
    input.oninput=()=>{if(input.value)setAmt(input.value);};
    card.querySelector(".pcancel").onclick=closePick;

    /** The one true write path: POST the call, then flip the card to its locked
     *  state. Both doors — the 5s auto-commit and the picker's Confirm — land
     *  here, so the locked UI cannot drift between them. */
    const lockedUI=(s,stake,win,crowd,callId)=>{
      y.disabled=nb.disabled=true;picker.hidden=true;card.classList.remove("picking");
      (s==="yes"?y:nb).classList.add("pick");(s==="yes"?nb:y).classList.add("dim");
      // Promise only what happens: the call is recorded; the market, not us,
      // decides when it means anything. No "we'll tell you who was right".
      soc.textContent=`Locked — ${stake} tokens on ${s.toUpperCase()}, pays ${win}. Settles when the market resolves.`;
      // ...and which side of the room they just joined. Solo action, social fact.
      const slText=crowd?socialLine(s,crowd,s==="yes"?yes:no):"";
      if(slText){
        const sl=document.createElement("div");
        sl.className="socline";
        sl.textContent=slText;
        soc.after(sl);
      }
      // The strong entry point: "I called it — what do you say?" is bet-don't-
      // argue itself. The text names their side; the link carries the market.
      const sb=document.createElement("button");
      sb.className="sharebig";sb.innerHTML=`${SHARE_ICON}<span>Share your call 🔥</span>`;
      // The personal card: mint the owner-only share link, then hand it to the
      // OS sheet. It lands on THEIR timeline — the social layer lives on X.
      sb.onclick=async(e)=>{
        const anchor=e.currentTarget;
        let url;
        if(callId){
          try{const r=await fetch(`${API}/api/position/${callId}/sharelink`,{method:"POST",
            headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
            const j=await r.json();if(j.ok)url=j.url;}catch(e){/* generic link still shares */}
        }
        shareMarket({slug:m.slug,text:`calling ${s.toUpperCase()} on this at ${s==="yes"?yes:no}%`,source:"postcall",anchor,url});
      };
      (card.querySelector(".socline")||soc).after(sb);
      // One line, once, only to someone who has not connected. An offer, not a gate.
      if(!auth.accounts.length){
        const up=document.createElement("button");
        up.className="upsell";up.textContent="Connect to save your balance  +100 tokens";
        up.onclick=()=>connectSheet("Keep this call when you switch devices");
        sb.after(up);
      }
      card.querySelector("#nudge"+i).classList.add("show");
      card.querySelector("#nudge"+i).classList.remove("hint");
    };
    const placeNow=async(s,stake,fromPicker)=>{
      try{
        const r=await fetch(`${API}/api/market/${m.slug}/call`,{method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({side:s,tokens:stake,deviceId})});
        const j=await r.json().catch(()=>({}));
        // Put an honest reason where the user is looking: the picker line if the
        // picker's open, the social slot for a one-tap. Re-arm the controls so the
        // person can act on what we just told them.
        const reopen=()=>{
          if(fromPicker){confirmBtn.disabled=false;confirmBtn.textContent="Confirm";}
          else{y.disabled=nb.disabled=false;y.classList.remove("pick","dim");nb.classList.remove("pick","dim");}
        };
        const failLine=(txt,keepConfirmOff)=>{
          reopen();
          if(fromPicker){line.textContent=txt;if(keepConfirmOff)confirmBtn.disabled=true;}
          else soc.textContent=txt;
        };
        if(!r.ok||!j.ok){
          // The call did not go through. A one-tap optimistically deducted the
          // stake up front; give it back before we render why. (insufficient
          // overwrites this with the server's authoritative balance just below.)
          if(!fromPicker){balance=(balance??0)+stake;paintBalance();}
          // Not on the list / free taste spent — this IS the gate moment. Bring it
          // forward in place, not a picker that quietly fails.
          if(j.reason==="not_allowed"){
            picker.hidden=true;card.classList.remove("picking");
            y.disabled=nb.disabled=true;
            soc.className="social gatecard";
            soc.innerHTML=terminalGateInner();wireTerminalGate(soc);
            ev("gate_shown",{via:"taste_used",slug:m.slug,reason:GATE.reason});
            return;
          }
          // Not enough tokens — never "try again" (trying again can't make tokens).
          // Say the true number and when the next top-up lands.
          if(j.reason==="insufficient"){
            balance=j.balance;paintBalance(true);
            const when=topUpWhen(nextTopUpMs);
            if(balance>0){
              if(fromPicker){setAmt(Math.min(stake,balance));confirmBtn.textContent="Confirm";
                line.textContent=`Only ${balance} left — pick that or less. Next +200 in ${when}.`;
                confirmBtn.disabled=false;}
              else failLine(`That left you ${balance}. Tap again to call with what you've got.`);
            }else{
              failLine(`Out of tokens — next +200 in ${when}. Sell an open call to free some up now.`,true);
            }
            return;
          }
          // Structural refusals — the market, not the network. Trying again changes
          // nothing, so don't promise it will.
          if(j.reason==="unpriced"){
            failLine("This one isn't quoted right now — the odds moved to the edge. Try another market.");
            return;
          }
          if(j.reason==="unknown-market"||r.status===404){
            failLine("This market just closed — it's no longer taking calls.");
            return;
          }
          // A 5xx or an unreadable body is a server-side hiccup — genuinely
          // transient, the one refusal where "try again" is the honest answer.
          if(r.status>=500||!j.reason){
            failLine("Something went wrong on our end — give it a moment and try again.");
            return;
          }
          // Some other named refusal we didn't special-case: surface the server's
          // own words if they're human, else an honest structural note.
          failLine(j.error&&j.error.length<90?j.error:"Couldn't lock it — the market won't take that call.");
          return;
        }
        balance=j.balance;paintBalance(true);loadBalance();
        lockedUI(s,stake,Math.round(stake*100/j.pctAt),j.crowd,j.id);
        ev("amount_confirm",{slug:m.slug,idx:i,side:s});
      }catch(e){
        // The only genuinely transient failure: we never reached the server or
        // couldn't read it. This is the one place "try again" is the truth.
        console.error(e);
        if(!fromPicker){balance=(balance??0)+stake;paintBalance();
          y.disabled=nb.disabled=false;y.classList.remove("pick","dim");nb.classList.remove("pick","dim");
          soc.textContent="Couldn't reach the server — check your connection and try again.";}
        else{confirmBtn.disabled=false;confirmBtn.textContent="Confirm";
          line.textContent="Couldn't reach the server — check your connection and try again.";}
      }
    };

    confirmBtn.onclick=()=>{
      confirmBtn.disabled=true;confirmBtn.textContent="Locking…";
      placeNow(side,amt,true);
    };

    /**
     * ONE TAP, DONE. The data said the picker was losing the most engaged
     * visitors: two side_taps, zero confirms, both abandoned within seconds —
     * not deliberating an amount, walking away from a second decision. So the
     * default path makes the call immediately at a default stake, shows the
     * result with a 5s undo, and the amount picker becomes opt-in ("change
     * amount"). Undo is honest by construction: the POST only fires when the
     * window closes (or the page is left mid-window, via sendBeacon), so an
     * undone call never existed anywhere.
     */
    const DEFAULT_STAKE=50;
    let pending=null; // {s, stake, left, timer, beacon}
    const clearPendingUI=()=>{
      y.classList.remove("pick","dim");nb.classList.remove("pick","dim");
      soc.textContent="";
    };
    const cancelPending=(refund=true)=>{
      if(!pending)return;
      clearInterval(pending.timer);PENDING_CALLS.delete(pending.beacon);
      if(refund){balance=(balance??0)+pending.stake;paintBalance();}
      pending=null;
    };
    const commitPending=()=>{
      if(!pending)return;
      const {s,stake}=pending;
      clearInterval(pending.timer);PENDING_CALLS.delete(pending.beacon);
      pending=null;
      placeNow(s,stake,false);
    };
    const pendingUI=()=>{
      const {s,stake,left}=pending;
      const win=Math.round(stake*100/(s==="yes"?yes:no));
      soc.innerHTML=`Locked — ${stake} on ${s.toUpperCase()}, pays ${win}. `
        +`<button class="undo">undo (${left})</button>`
        +`<button class="chgamt">change amount</button>`;
      soc.querySelector(".undo").onclick=()=>{cancelPending();clearPendingUI();};
      soc.querySelector(".chgamt").onclick=()=>{
        const stakeNow=pending.stake;
        cancelPending();soc.textContent="";
        openPick(s,stakeNow); // the old flow, now opt-in, seeded with the default
      };
    };
    const startPending=(s)=>{
      const stake=Math.min(DEFAULT_STAKE,balance??DEFAULT_STAKE);
      if(!Number.isFinite(stake)||stake<1){ // out of tokens: the picker explains, honestly
        ev("side_tap",{slug:m.slug,idx:i,side:s});openPick(s);return;
      }
      balance-=stake;paintBalance();
      (s==="yes"?y:nb).classList.add("pick");(s==="yes"?nb:y).classList.add("dim");
      const beacon={slug:m.slug,side:s,tokens:stake};
      pending={s,stake,left:5,beacon,timer:null};
      PENDING_CALLS.add(beacon);
      pendingUI();
      pending.timer=setInterval(()=>{
        if(!pending)return;
        pending.left--;
        if(pending.left<=0)commitPending();
        else pendingUI();
      },1000);
      ev("side_tap",{slug:m.slug,idx:i,side:s});
    };

    const tap=(s)=>{
      if(y.disabled)return;
      if(!GATE.allowed&&!TASTE){
        // The rope, said plainly. The card stays a spectacle; playing needs a pass.
        soc.innerHTML=`<a class="waitcta" href="/about">join the waitlist to play →</a>`;
        ev("allowlist_denied",{slug:m.slug});
        return;
      }
      // In TASTE mode the tap proceeds: the server grants one free call and then
      // 403s, at which point placeNow surfaces the gate in place.
      if(card.classList.contains("picking")){ // picker open: switching sides in place, as before
        if(side===s)return;
        const keep=amt;closePick();openPick(s,keep);
        ev("side_tap",{slug:m.slug,idx:i,side:s});
        return;
      }
      if(pending){
        if(pending.s===s)return;      // same side again: the 5s clock keeps running
        cancelPending();clearPendingUI();
      }
      startPending(s);
    };
    y.onclick=()=>tap("yes");
    nb.onclick=()=>tap("no");
    scroller.appendChild(card);
  });
  if(tail==="picker")scroller.appendChild(buildPicker());
  else if(tail==="gate")scroller.appendChild(buildGate());
  watchDepth(scroller);
  hintFirstCard(scroller);
}

/**
 * Step three of the taste flow: "what do you have takes on?" — the free signal.
 * Multi-select 1-3 of the five real feed categories, Continue re-ranks the feed
 * toward them. The picks are logged (taste_pick) and stashed in sessionStorage
 * so the reload knows to show the re-ranked run and, after it, the gate.
 */
function buildPicker(){
  const CATS=["Sports","Crypto","Politics","Culture","Tech"];
  const el=document.createElement("div");
  el.className="card intercard pickcard";
  el.innerHTML=`
    <div class="ititle">what do you have<br>takes on?</div>
    <div class="isub">pick up to 3 — we'll tune your feed</div>
    <div class="tchips">${CATS.map(c=>`<button class="tchip" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <button class="icont" disabled>Continue</button>`;
  const sel=new Set(), cont=el.querySelector(".icont");
  el.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c;
    if(sel.has(c)){sel.delete(c);b.classList.remove("on");}
    else{if(sel.size>=3)return;sel.add(c);b.classList.add("on");}
    cont.disabled=sel.size===0;
    cont.textContent=sel.size?`Continue (${sel.size})`:"Continue";
  });
  cont.onclick=()=>{
    const cats=[...sel];
    try{sessionStorage.setItem("taste_cats",cats.join(","));}catch(e){}
    ev("taste_pick",{cats:cats.join(",")});
    document.getElementById("scroller").scrollTop=0;
    loadFeed(); // reloads with ?cats= -> 3 re-ranked cards, then the gate
  };
  return el;
}

/**
 * The gate, as the last card in the taste run. Not a wall dropped in front of
 * the feed — a natural next step reached after a real taste. One line, X first,
 * Google second. gate_shown fires once, when the card is built.
 */
function buildGate(){
  const el=document.createElement("div");
  el.className="card intercard gatecard";
  el.innerHTML=terminalGateInner();
  wireTerminalGate(el);
  ev("gate_shown",{via:"feed",reason:GATE.reason});
  return el;
}

/**
 * Feed depth — the Week-2 metric, instrumented now so Week 1 seeds it.
 *
 * A card counts as viewed when it is mostly on screen, not when it is rendered:
 * all forty are in the DOM from the start, so "rendered" would report every
 * session as forty cards deep. The observer fires once per card per render;
 * switching category re-renders and legitimately starts the count over, because
 * the index means "how far into THIS list".
 */
function watchDepth(scroller){
  if(!("IntersectionObserver" in window))return;   // depth goes unmeasured, feed still works
  const seen=new Set();
  const io=new IntersectionObserver(entries=>{
    for(const e of entries){
      if(!e.isIntersecting)continue;
      const idx=Number(e.target.dataset.idx);
      if(seen.has(idx))continue;
      seen.add(idx);
      ev("card_view",{slug:e.target.dataset.slug,idx});
    }
  },{root:scroller,threshold:.6});
  scroller.querySelectorAll(".card").forEach(c=>io.observe(c));
}

/**
 * Before this, the only sign that the feed continued below was a nudge you had
 * to pick a side to see — so the one screen a new arrival actually looks at was
 * the one screen with no way out of it. The first card now says so on its own,
 * quietly, and stops the moment they act on it.
 */
function hintFirstCard(scroller){
  if(hintRetired)return;
  const nudge=scroller.querySelector(".nudge");
  if(!nudge)return;
  nudge.classList.add("show","hint");
  const retire=()=>{
    if(scroller.scrollTop<24)return;   // ignore the snap's own settling jitter
    hintRetired=true;
    nudge.classList.remove("show","hint");
    scroller.removeEventListener("scroll",retire);
  };
  scroller.addEventListener("scroll",retire,{passive:true});
}

/* ---------------------------------------------------------------- shells -- */
function renderShell(view){
  const scroller=document.getElementById("scroller");
  // Positions is REAL — this device's actual calls, no Preview badge. The other
  // three stay mock until something real exists to put in them.
  if(view==="positions"){shellTop("Positions",false);loadPositions(scroller);}
  if(view==="leaderboard"){shellTop("Leaderboard",false);loadLeaderboard(scroller);}
  if(view==="alerts"){shellTop("Notifications",false);loadNotices(scroller);}
  if(view==="profile"){shellTop("Profile",false);loadProfile(scroller);}
}

/**
 * Real rows: this device's calls, straight from the server. Potential win is
 * computed from the odds AT LOCK TIME (pct_at), so a position never appears to
 * change value because the market moved afterwards. Everything is pending —
 * resolution doesn't exist yet and the copy says only that.
 */
/**
 * Positions is the screen the exit decision is made on, so it has to show the
 * two numbers that decision is made from: what you paid, and what it is worth
 * now. Everything else here is derived from those.
 *
 * Reputation sits at the top rather than the bottom because it is the score,
 * and because it is allowed to be negative — a screen that only ever shows a
 * green number is not measuring anything.
 */
async function loadPositions(scroller){
  scroller.innerHTML='<div class="state">loading your calls…</div>';
  try{
    const r=await fetch(`${API}/api/positions?deviceId=${encodeURIComponent(deviceId)}`);
    if(!r.ok)throw new Error("positions "+r.status);
    const d=await r.json();
    balance=d.tokens;nextTopUpMs=d.nextTopUpMs;paintBalance();
    if(!d.open.length && !d.closed.length){
      scroller.innerHTML=`<div class="sheet">
        <p class="sub">Your calls on this device land here.</p>
        ${zeroNote(d)}
        <div class="state">Nothing yet — open the feed and call one.</div>
      </div>`;
      return;
    }
    // History newest-first, and the running totals derived from it: net tokens
    // won/lost across every closed position, and a win rate over the ones that
    // actually SETTLED (a sold-early exit is neither a win nor a loss).
    const history=[...d.closed].sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt));
    const net=history.reduce((s,p)=>s+(p.proceeds-p.tokens),0);
    const settledArr=history.filter(p=>p.exitPct===100||p.exitPct===0);
    const wins=settledArr.filter(p=>p.exitPct===100).length;
    const winRate=settledArr.length?Math.round(100*wins/settledArr.length):null;
    const netStr=`${net>0?"+":net<0?"−":"±"}${Math.abs(net)}`;
    scroller.innerHTML=`<div class="sheet">
      <p class="sub">Your calls on this device. Sell any time at the market's current odds, or hold to resolution.</p>
      ${zeroNote(d)}
      ${repHTML(d.overall,d.byCategory)}
      <div class="summary">
        <div class="tile"><div class="v num ${cls(net)}">${netStr}</div><div class="k">NET TOKENS</div></div>
        <div class="tile"><div class="v num">${winRate===null?"—":winRate+"%"}</div><div class="k">${settledArr.length?`WIN RATE · ${wins}/${settledArr.length}`:"WIN RATE"}</div></div>
        <div class="tile"><div class="v num">🪙 ${d.tokens}</div><div class="k">BALANCE</div></div>
      </div>
      ${d.open.length?`<h2 class="psec">Open · ${d.open.length}</h2>${d.open.map(openHTML).join("")}`:""}
      ${history.length?`<h2 class="psec">History · ${history.length}</h2>${history.map(historyHTML).join("")}`:""}
    </div>`;
    scroller.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>sellPosition(b,scroller));
    // The victory/defeat card — resolution (or an early exit) as content, out to
    // their timeline. Every closed row is shareable, not just the settled ones.
    scroller.querySelectorAll("[data-share]").forEach(b=>b.onclick=async(e)=>{
      const side=b.dataset.side.toUpperCase(), entry=b.dataset.entry, exit=b.dataset.exit, kind=b.dataset.kind;
      let url,slug;
      try{const r=await fetch(`${API}/api/position/${b.dataset.share}/sharelink`,{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
        const j=await r.json();if(j.ok){url=j.url;slug=(url.match(/market\/([^?]+)/)||[])[1];}}catch(err){}
      if(!url)return;
      const text=kind==="won"?`called ${side} at ${entry}% — and it hit`
        :kind==="lost"?`took ${side} at ${entry}% — market said no`
        :`sold my ${side} — in at ${entry}%, out at ${exit}%`;
      shareMarket({slug,url,anchor:e.currentTarget,source:"settled",text});
    });
  }catch(e){
    console.error(e);
    scroller.innerHTML='<div class="state">couldn’t load your calls — try again in a moment.</div>';
  }
}

/** Percentage points, always signed. +0 is a real answer and reads as "flat". */
const pts=(n)=>`${n>0?"+":n<0?"−":"±"}${Math.abs(Math.round(n*10)/10)}%`;
const cls=(n)=>n>0?"up":n<0?"down":"flat";

function repHTML(overall,byCat){
  if(overall.avgEdge===null)
    return `<div class="rep"><div class="repnum flat">—</div>
      <div class="repwho"><b>Reputation</b><span>Close a position to get a number. It can go down.</span></div></div>`;
  const tag=overall.provisional
    ? `<span class="prov">🌱 provisional · ${overall.closed}/10</span>`
    : `<span class="prov done">${overall.closed} closed</span>`;
  const cats=byCat.filter(c=>c.avgEdge!==null).slice(0,3)
    .map(c=>`<span class="catedge ${cls(c.avgEdge)}">${esc(c.category)} ${pts(c.avgEdge)}</span>`).join("");
  return `<div class="rep">
    <div class="repnum ${cls(overall.avgEdge)}">${pts(overall.avgEdge)}</div>
    <div class="repwho"><b>Reputation</b><span>average edge per call ${tag}</span>
      ${cats?`<div class="cats">${cats}</div>`:""}</div>
  </div>`;
}

function openHTML(p){
  const live = p.nowPct!==null;
  // "Called YES at 39% · now 44% ↑ (+5%)" — the whole hold-or-sell argument,
  // in one line, in the order you'd say it out loud.
  const track = live
    ? `Called ${p.side.toUpperCase()} at ${p.entryPct}% · now ${p.nowPct}% ${p.edgeNow>0?"↑":p.edgeNow<0?"↓":"→"} <b class="${cls(p.edgeNow)}">${pts(p.edgeNow)}</b>`
    : `Called ${p.side.toUpperCase()} at ${p.entryPct}% · the venue isn't quoting this right now`;
  return `<div class="tile">
    <p class="q">${esc(p.question)}</p>
    <div class="pmeta">
      <span class="side-chip ${p.side}">${p.side.toUpperCase()}</span>
      <span class="num">${p.tokens} tokens</span>
      <span class="dot"></span><span class="num">holds to ${p.toWin}</span>
      <span class="status">open</span>
    </div>
    <p class="track">${track}</p>
    ${live?`<button class="sellbtn" data-sell="${p.id}">Sell now → ${p.valueNow} tokens</button>`:""}
  </div>`;
}

/**
 * One row of history. The verdict is the loud part — a coloured chip and a rail,
 * "called it ✓" / "market said no" / "sold early" — and the ledger (entry→exit,
 * tokens in→out, edge) sits under it for anyone who wants the receipt. Every row
 * is shareable, win OR loss: the defeat card is as much a part of the game as the
 * victory one. exit 100 = your side resolved true, 0 = false, anything between =
 * you sold before it settled; the market's own YES/NO follows from your side.
 */
function historyHTML(p){
  const settled=p.exitPct===100||p.exitPct===0;
  const won=p.exitPct===100;
  const kind=settled?(won?"won":"lost"):"sold";
  const badge={won:"called it ✓",lost:"market said no",sold:"sold early"}[kind];
  const marketYes=(p.side==="yes")===won; // only meaningful when settled
  const how=settled?`resolved ${marketYes?"YES":"NO"}`:"sold early";
  const delta=p.proceeds-p.tokens;
  const deltaStr=`${delta>0?"+":delta<0?"−":"±"}${Math.abs(delta)}`;
  return `<div class="htile ${kind}">
    <div class="hhead">
      <span class="hbadge ${kind}">${badge}</span>
      <span class="hwhen">${agoOf(p.closedAt)}</span>
    </div>
    <p class="q">${esc(p.question)}</p>
    <div class="hrow2">
      <span class="side-chip ${p.side}">${p.side.toUpperCase()}</span>
      <span>${p.entryPct}% → ${p.exitPct}% · ${how}</span>
    </div>
    <div class="hfoot">
      <span class="hio">${p.tokens} → ${p.proceeds} tok <b class="${cls(delta)}">${deltaStr}</b></span>
      <span class="${cls(p.edge)}">edge ${pts(p.edge)}</span>
      <button class="hshare" data-share="${p.id}" data-side="${p.side}" data-entry="${p.entryPct}" data-exit="${p.exitPct}" data-kind="${kind}" aria-label="Share this call">${SHARE_ICON}</button>
    </div>
  </div>`;
}

/**
 * Sell. The button is disabled the instant it is pressed, because the second
 * press would be a second sale of the same position — the server refuses it,
 * but a UI that lets you try is a UI that looks broken when it does.
 */
async function sellPosition(btn,scroller){
  const id=btn.dataset.sell;
  btn.disabled=true;btn.textContent="Selling…";
  let j={};
  try{
    const r=await fetch(`${API}/api/position/${id}/sell`,{method:"POST",
      headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
    j=await r.json().catch(()=>({reason:"server-error"}));
    if(r.ok&&j.ok){
      balance=j.balance;paintBalance(true);
      ev("sell",{slug:null,side:null});
      showSellResult(btn,j,scroller); // a visible, satisfying result — not a silent re-render
      return;
    }
  }catch(e){console.error(e);j={reason:"network"};}
  // Two kinds of failure. TRANSIENT ones (odds refreshing, a server hiccup, a
  // dropped connection) are worth another tap, so the button re-enables and says
  // so. STRUCTURAL ones (the market isn't trading, the row is already gone) will
  // NOT change on a retry — inviting one is the lie we're removing — so they
  // replace the button with an honest, non-clickable note.
  const TRANSIENT={"stale-odds":"Odds are refreshing — tap to try again.",
    "server-error":"Something went wrong — tap to try again.",
    "network":"Couldn't reach the server — tap to try again."};
  const STRUCTURAL={
    "unpriced":"This market isn't quoted right now — you can't sell until it's trading again.",
    "no-entry-price":"No entry price on record for this one, so it can't be priced to sell.",
    "already-closed":"Already sold.","not-found":"That position is gone.",
    "not_allowed":"Selling isn't available on this account yet."};
  if(TRANSIENT[j.reason]){btn.textContent=TRANSIENT[j.reason];btn.disabled=false;return;}
  const note=document.createElement("p");
  note.className="sellnote";
  note.textContent=STRUCTURAL[j.reason]||"Couldn't sell this position right now.";
  btn.replaceWith(note);
}

/**
 * The close, made visible. Selling used to just silently re-render the screen;
 * now the tap lands on a result — "Sold ✓ 50 → 74 tokens (+48%)", the edge on the
 * record — the same beat as the one-tap call's locked state. No confirm dialog
 * (the sell already happened); a Done button and a 6s timer both fold it back
 * into History, where the row now lives.
 */
function showSellResult(btn,j,scroller){
  const stake=j.stake, proceeds=j.proceeds, delta=proceeds-stake;
  const pct=stake?Math.round((proceeds/stake-1)*100):0;
  const tone=delta>0?"up":delta<0?"down":"flat";
  const el=document.createElement("div");
  el.className="sellresult "+tone;
  el.innerHTML=`
    <div class="srtop"><span class="srtick">Sold ✓</span>
      <span class="srdelta ${tone}">${delta>0?"+":delta<0?"−":"±"}${Math.abs(delta)}</span></div>
    <div class="srnums">${stake} → <b>${proceeds}</b> tokens · <b class="${tone}">${pct>0?"+":pct<0?"−":"±"}${Math.abs(pct)}%</b></div>
    <div class="srsub">edge ${pts(j.edge)} recorded${delta>0?" — nice exit 🎯":delta<0?" — cut it, no shame":""}</div>
    <button class="srdone">Done</button>`;
  btn.replaceWith(el);
  let done=false;
  const finish=()=>{if(done)return;done=true;loadPositions(scroller);};
  el.querySelector(".srdone").onclick=finish;
  setTimeout(finish,6000);
}


/**
 * Real standings, ranked by average edge — the same number Positions shows you.
 * Not by tokens: a leaderboard of tokens is a leaderboard of who started
 * earliest and staked hardest, which is a fact about time, not about judgement.
 *
 * Provisional players are listed and marked, never hidden. They sort below
 * everyone whose number has settled, so two lucky scalps cannot take the top.
 */
let lbTab="edge";
async function loadLeaderboard(scroller){
  scroller.innerHTML='<div class="state">counting edges…</div>';
  try{
    const r=await fetch(`${API}/api/leaderboard?deviceId=${encodeURIComponent(deviceId)}`);
    if(!r.ok)throw new Error("leaderboard "+r.status);
    const data=await r.json();
    renderLb(scroller,data);
  }catch(e){
    console.error(e);
    scroller.innerHTML='<div class="state">couldn’t load the standings — try again in a moment.</div>';
  }
}
/* Three boards, three virtues: edge = skill, streak = showing up, winnings =
 * playing AND being right. Raw call count is deliberately not a board. */
function renderLb(scroller,data){
  const row=(r,inner)=>`
    <div class="r${r.you?" you":""}">
      <div class="rank${r.rank<=3?" podium":""}">${r.rank}</div>
      <div class="mini"></div>
      <div class="grow"><div class="who trunc">@${esc(r.handle)}${r.you?" · you":""}</div></div>
      ${inner}
    </div>`;
  const bodies={
    edge:{sub:"Ranked by average edge — points gained per call, not tokens won. 🌱 means fewer than 10 closed positions.",
      empty:"Nobody has closed a position yet. Be first.",
      rows:data.rows,html:(r)=>row({...r,handle:r.handle+(r.provisional?" 🌱":"")},`<div class="acc ${cls(r.avgEdge)}">${pts(r.avgEdge)}<small>${r.closed} closed</small></div>`)},
    streak:{sub:"Consecutive days with at least one call. Show up, stay up.",
      empty:"No streaks yet — day one starts now.",
      rows:data.streaks,html:(r)=>row(r,`<div class="acc ${r.current>0?"up":"flat"}">${r.current}d<small>best ${r.best}d</small></div>`)},
    winnings:{sub:"Net tokens from settled and sold positions. Volume only counts if you're right.",
      empty:"No settled tokens yet — make a call and let a market resolve.",
      rows:data.winnings,html:(r)=>row(r,`<div class="acc ${cls(r.net)}">${r.net>0?"+":""}${r.net}<small>${r.closed} closed</small></div>`)},
  };
  const b=bodies[lbTab];
  scroller.innerHTML=`<div class="sheet">
    <div class="seg" role="tablist" style="margin-bottom:14px">
      ${[["edge","Edge"],["streak","Streak"],["winnings","Winnings"]].map(([k,l])=>
        `<button class="segb${lbTab===k?" on":""}" data-lbtab="${k}" role="tab">${l}</button>`).join("")}
    </div>
    <p class="sub">${b.sub}</p>
    ${b.rows&&b.rows.length?`<div class="lb">${b.rows.map(r=>b.html(r)).join("")}</div>`:`<div class="state">${b.empty}</div>`}
  </div>`;
  scroller.querySelectorAll("[data-lbtab]").forEach(t=>t.onclick=()=>{lbTab=t.dataset.lbtab;renderLb(scroller,data);});
}



/* Real events only. A row exists because a market this device holds resolved —
 * nothing invented, nothing "watched on your behalf" that isn't. */
function agoOf(iso){
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<90)return "just now";
  const m=Math.floor(s/60); if(m<60)return `${m}m ago`;
  const h=Math.floor(m/60); if(h<24)return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}
async function loadNotices(scroller){
  scroller.innerHTML='<div class="state">checking…</div>';
  ev("alerts_view",{}); // the screen was opened — the read half of retention
  try{
    const r=await fetch(`${API}/api/notices?deviceId=${encodeURIComponent(deviceId)}`);
    if(!r.ok)throw new Error("notices "+r.status);
    const {notices}=await r.json();
    // Each rendered notification counts as viewed: the list is short and fully
    // on screen, so render == read is the honest approximation here.
    for(const n of notices)ev("notice_view",{slug:n.slug});
    if(!notices.length){
      scroller.innerHTML=`<div class="sheet">
        <p class="sub">When a market you hold resolves, it lands here.</p>
        <div class="state">Nothing yet — your open calls are still live.</div>
      </div>`;
      return;
    }
    scroller.innerHTML=`<div class="sheet">
      <p class="sub">Markets you held that resolved. Won or lost — the call is yours to post.</p>
      ${notices.map(noticeCardHTML).join("")}
    </div>`;
    // The brag, one tap from the alert. Mint the owner-only card, hand it to the
    // OS share sheet. No token reward, by design — a paid share is spam, and the
    // reward campaign is exactly what let the farm in. The win is the reason.
    scroller.querySelectorAll("[data-nshare]").forEach(b=>b.onclick=async(e)=>{
      const anchor=e.currentTarget, win=b.dataset.win==="1";
      let url,slug;
      try{const rr=await fetch(`${API}/api/position/${b.dataset.nshare}/sharelink`,{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
        const j=await rr.json();if(j.ok){url=j.url;slug=(url.match(/market\/([^?]+)/)||[])[1];}}catch(err){}
      if(!url)return;
      shareMarket({slug,url,anchor,source:"settle_notice",
        text:win?"called it 🔥":"took the other side — market said no 😤"});
    });
  }catch(e){
    console.error(e);
    scroller.innerHTML='<div class="state">couldn’t load notifications — try again in a moment.</div>';
  }
}

/**
 * A settlement, as a moment worth posting. A win is loud — green rail, the payout
 * as a hero number, a prominent "Share your call 🔥". A loss is honest, not hidden:
 * "market said no", and a share button that's a shrug, not a trophy — losers post
 * too when the framing is funny rather than shaming. Any non-settle notice falls
 * back to the quiet row. The share needs a callId (the personal card); older
 * notices without one still render, just without the button.
 */
function noticeCardHTML(n){
  const win=n.kind==="settle_win", loss=n.kind==="settle_loss";
  if(!win && !loss){
    return `<div class="tile" style="padding:2px 16px"><div class="note">
      <div class="nicon">✅</div>
      <div class="grow"><div class="ntext">${esc(n.body)}</div><div class="nwhen">${agoOf(n.at)}</div></div></div></div>`;
  }
  const share=n.callId
    ? `<button class="ncshare ${win?"win":"loss"}" data-nshare="${n.callId}" data-win="${win?1:0}">${SHARE_ICON}<span>${win?"Share your call 🔥":"Share it anyway 😤"}</span></button>`
    : "";
  return `<div class="ncard ${win?"win":"loss"}">
    <div class="nctop">
      <span class="ncbadge ${win?"win":"loss"}">${win?"🎉 you called it":"🙃 market said no"}</span>
      <span class="ncwhen">${agoOf(n.at)}</span>
    </div>
    ${win?`<div class="ncpay">+${n.delta} tokens</div>`:""}
    <p class="ncbody">${esc(n.body)}</p>
    ${share}
  </div>`;
}

/**
 * Profile is real now, and small. It answers exactly two questions: who is this
 * browser, and what has it done. The mock handle, the streak and the badges are
 * gone — none of them were true, and a screen that shows an invented "5-day
 * streak" next to a real reputation teaches the reader to distrust both.
 */
async function loadProfile(scroller){
  scroller.innerHTML='<div class="state">loading…</div>';
  await loadAuth();
  let pos={open:[],closed:[],overall:{avgEdge:null,closed:0,provisional:true},tokens:balance};
  try{
    const r=await fetch(`${API}/api/positions?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok)pos=await r.json();
  }catch(e){/* profile still renders; it just has less to say */}

  const linked=auth.accounts.map(a=>{
    const p=PROV[a.provider];
    const who=a.handle||a.name||(a.provider==="google"?"Google account":"X account");
    return `<div class="acct">
      <div class="glyph">${p.glyph}</div>
      <div class="grow"><div class="who trunc">${esc(who)}</div>
        <div class="kind">${a.provider==="twitter"?"X — your identity":"Google — saved across devices"}</div></div>
    </div>`;}).join("");

  const rep=pos.overall.avgEdge===null?"—":pts(pos.overall.avgEdge);
  const repCls=pos.overall.avgEdge===null?"flat":cls(pos.overall.avgEdge);

  await loadBalance(); // the handle rides on /api/me
  const handleRow=myHandle?`
    <div class="hrow" id="hrow">
      <span class="hname">@${esc(myHandle)}</span>
      ${myHandleEditable
        ? '<button class="hedit" id="hedit">edit</button>'
        : '<span class="hkind">your X handle</span>'}
    </div>
    <div class="herr" id="herr" hidden></div>`:"";

  scroller.innerHTML=`<div class="sheet">
    ${handleRow}
    <p class="sub">${auth.accounts.length
      ? "Your tokens, calls and reputation follow this account to any browser."
      : "You are playing anonymously. Nothing is lost — but nothing follows you to another browser either."}</p>
    ${linked||`<button class="cbtn x" data-connect="twitter"><span class="glyph">𝕏</span>Connect X</button>
       <button class="cbtn" data-connect="google"><span class="glyph">G</span>Connect Google</button>
       <p class="cnote">X connects your identity. Google saves your balance across devices. Either grants <b>+100 tokens</b>, once.</p>`}
    <div class="summary" style="margin-top:16px">
      <div class="tile"><div class="v num ${repCls}">${rep}</div><div class="k">REPUTATION</div></div>
      <div class="tile"><div class="v num">${pos.streak?`${pos.streak.current}d`:"—"}</div><div class="k">STREAK${pos.streak&&pos.streak.best>pos.streak.current?` · BEST ${pos.streak.best}D`:""}</div></div>
      <div class="tile"><div class="v num">🪙 ${pos.tokens??"—"}</div><div class="k">BALANCE</div></div>
    </div>
    ${pos.overall.provisional&&pos.overall.avgEdge!==null
      ? `<p class="cnote">🌱 provisional — ${pos.overall.closed} of 10 closed positions.</p>`:""}
    <p class="psec" style="margin-top:24px">Appearance</p>
    <div class="seg" role="group" aria-label="Theme">
      ${[["auto","Auto"],["bright","Bright"],["dark","Dark"]].map(([v,l])=>
        `<button class="segb${themeMode()===v?" on":""}" data-theme-mode="${v}">${l}</button>`).join("")}
    </div>
    <p class="cnote">Auto follows your system. Shared cards are always the same — your theme never changes the image that goes on X.</p>
  </div>`;
  scroller.querySelectorAll("[data-connect]").forEach(b=>b.onclick=()=>{
    location.href=`${API}/api/auth/${b.dataset.connect}/start?deviceId=${encodeURIComponent(deviceId)}`;
  });
  scroller.querySelectorAll("[data-theme-mode]").forEach(b=>b.onclick=()=>{
    setTheme(b.dataset.themeMode);
    scroller.querySelectorAll("[data-theme-mode]").forEach(x=>x.classList.toggle("on",x===b));
  });
  // Rename in place. The server is the judge (shape, blocklist, uniqueness);
  // this only carries the verdict back.
  const heditBtn=scroller.querySelector("#hedit");
  if(heditBtn)heditBtn.onclick=()=>{
    const row=scroller.querySelector("#hrow"), err=scroller.querySelector("#herr");
    row.innerHTML=`<input class="hin" id="hin" maxlength="20" value="${esc(myHandle)}"
        aria-label="handle" autocomplete="off" spellcheck="false">
      <button class="hsave" id="hsave">Save</button>`;
    const input=row.querySelector("#hin");
    input.focus();input.select();
    row.querySelector("#hsave").onclick=async()=>{
      err.hidden=true;
      try{
        const r=await fetch(`${API}/api/handle`,{method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({deviceId,handle:input.value})});
        const j=await r.json();
        if(!j.ok){err.textContent=j.reason;err.hidden=false;return;}
        myHandle=j.handle;
        loadProfile(scroller);
      }catch(e){err.textContent="couldn't save — try again";err.hidden=false;}
    };
    input.onkeydown=(e)=>{if(e.key==="Enter")row.querySelector("#hsave").click();};
  };
}


/**
 * The velvet rope, client side. /feed without a pass -> back to the landing
 * (the waitlist). /market/[slug] stays viewable for everyone — the share loop
 * must not die — but the call flow swaps to "join the waitlist to play".
 * ?invite=1 (the invite email's link) shows the sign-in step instead of
 * bouncing, so an invited person can actually get through the door.
 * The server enforces the same gate on /call and /sell regardless.
 */
let GATE={allowed:false,reason:"signed_out"};
let TASTE=false; // anonymous free-taste mode: 2 cards -> picker -> 3 cards -> gate
const tasteCats=()=>{try{return (sessionStorage.getItem("taste_cats")||"").split(",").filter(Boolean);}catch(e){return [];}};
// The sign-in redirect, shared by the invite screen, the in-feed gate card and
// the "free taste spent" moment. `p` is the provider (twitter | google); it is
// also the gate_signin label, so the funnel can see which button converts.
function startAuth(p){ev("gate_signin",{cat:p});location.href=`${API}/api/auth/${p}/start?deviceId=${encodeURIComponent(deviceId)}`;}
// The gate itself: one line of copy, X first (prominent, black), Google second.
// Reused verbatim by the interstitial card and the free-taste-spent handler so
// the two never drift. gate_shown fires once, at the caller, with its `via`.
function gateInner(){
  return `<div class="gmark"></div>
    <div class="ititle">keep calling — sign in</div>
    <div class="gatecard-btns" style="width:100%;max-width:320px;margin-top:4px">
      <button class="cbtn x" data-p="twitter"><span class="glyph">𝕏</span>Sign in with X</button>
      <button class="cbtn" data-p="google"><span class="glyph">G</span>Sign in with Google</button>
    </div>
    <p class="cnote" style="max-width:300px">Free to play. Virtual tokens, nothing to cash out. Your call is saved to this device.</p>`;
}
function wireGate(root){root.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>startAuth(b.dataset.p));}

// The OTHER terminal gate: signed in, but the identity isn't on the list yet.
// Same position in the flow (the last card, after the taste) — the honest room,
// with hold-my-spot for Google users and the X-handle note for the rest.
function notListedInner(){
  const ident=GATE.identity||GATE.email||"your account";
  const hasEmail=!!GATE.email;
  return `<div class="gmark"></div>
    <div class="ititle" style="font-size:min(23px,5.6vw)">almost — invites<br>are rolling out</div>
    <p class="cnote" style="max-width:340px;margin:2px auto 0">You're signed in as <b>${esc(ident)}</b>.
      ${GATE.provider==="twitter"?"That X account":"That address"} isn't on the beta list yet — spots open gradually, and the list is the way in.</p>
    ${hasEmail
      ? `<button class="cbtn" id="gjoin" style="margin:16px auto 0;max-width:320px">Hold my spot on the waitlist</button><p class="cnote" id="gmsg" style="min-height:0"></p>`
      : `<p class="cnote" style="max-width:340px;margin:14px auto 0">Your spot is tracked by your X handle — we'll open it up soon. Want an email heads-up? Add one on <a href="/about" style="color:var(--link-g)">the about page</a>.</p>`}`;
}
function wireNotListed(root){
  const gj=root.querySelector("#gjoin");
  if(!gj)return;
  gj.onclick=async(e)=>{
    const b=e.currentTarget;b.disabled=true;b.textContent="Saving…";
    const msg=root.querySelector("#gmsg");
    try{
      const r=await fetch(`${API}/api/waitlist`,{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({email:GATE.email})});
      const j=await r.json().catch(()=>({}));
      msg.innerHTML=r.ok
        ? `You're on the list${j.position?` — <b>#${j.position}</b> in line`:""}. We'll email <b>${esc(GATE.email)}</b> the moment a spot opens.`
        : "Couldn't save — try again in a moment.";
      b.textContent=r.ok?"Spot held ✓":"Hold my spot on the waitlist";
      if(!r.ok)b.disabled=false;
    }catch(err){msg.textContent="Couldn't reach the waitlist — try again.";b.disabled=false;b.textContent="Hold my spot on the waitlist";}
  };
}
// One dispatcher for the terminal gate, so the interstitial card and the
// free-taste-spent moment always agree. Sign-in for the signed-out; the
// not-listed room for the signed-in-but-unlisted. allowlist_denied fires here,
// at the gate — the denial that matters happens AFTER the taste, not before it.
function terminalGateInner(){return GATE.reason==="not_allowlisted"?notListedInner():gateInner();}
function wireTerminalGate(root){
  if(GATE.reason==="not_allowlisted"){wireNotListed(root);ev("allowlist_denied",{});}
  else wireGate(root);
}
const IS_MARKET_PAGE=location.pathname.startsWith("/market/");
const IS_INVITE=new URLSearchParams(location.search).get("invite")==="1";
// Render the WHOLE feed, skipping the taste interleaving. A preview/audit switch
// only: the call-rope still holds (tap shows the waitlist, the server 403s), so
// this reveals layout, never access. The layout audit navigates with it so every
// card — including the pathological long-question one — actually exists to measure.
const FULL=new URLSearchParams(location.search).get("full")==="1";
async function checkGate(){
  try{
    const r=await fetch(`${API}/api/gate?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok)GATE=await r.json();
  }catch(e){/* gate unreachable: fail closed for /feed, open for /market views */}
  if(GATE.allowed)return true;
  if(IS_MARKET_PAGE)return true; // viewable; the call flow handles the rope

  const scroller=document.getElementById("scroller");

  // The one deliberate exception to taste-first: a targeted invite link. Someone
  // we explicitly invited (and who is signed out) gets the sign-in step directly
  // rather than being re-teased with a taste they were already promised through.
  if(IS_INVITE && GATE.reason==="signed_out"){
    scroller.innerHTML=`<div class="sheet" style="text-align:center;padding-top:56px">
      <p class="sub" style="font-size:16px">you're invited — sign in to open the feed:</p>
      <button class="cbtn x" data-p="twitter" style="margin:14px auto 0;max-width:320px"><span class="glyph">𝕏</span>Sign in with X</button>
      <button class="cbtn" data-p="google" style="margin:10px auto 0;max-width:320px"><span class="glyph">G</span>Sign in with Google</button>
      <p class="cnote">Free to play. Virtual tokens, nothing to cash out.</p></div>`;
    scroller.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>startAuth(b.dataset.p));
    return false;
  }

  // TikTok-web entry: the feed IS the landing, and the gate is the LAST thing,
  // never the first. EVERYONE not already through — signed out OR signed in but
  // not on the list yet — gets the same taste: two free cards, one free call,
  // the category picker, three re-ranked cards, and only THEN the terminal gate.
  // Being signed in must not cost the taste; allowlist status only decides which
  // gate (sign-in vs. "not on the list yet") renders at the end. ?full=1 opts
  // out (preview/audit). renderFeed reads TASTE and does the interleaving.
  if(!FULL)TASTE=true;
  return true;
}
(async()=>{
  const ok=await checkGate();
  if(ok){
    try{sessionStorage.removeItem("gate_oauth");}catch(e){}
    render();loadAuth().then(loadBalance).then(authReturn);
  }
})();

// One per page load, not per category switch — a chip is not a new arrival.
// `slug` carries the door they came through, so "arrived from a tweet" can be
// separated from "opened /feed directly".
ev("feed_view", startSlug ? { slug: startSlug } : {});
</script>
