  .sellnote{font-family:'Nunito';font-weight:700;font-size:12.5px;line-height:1.4;color:var(--muted-g);margin:11px 0 0}
  /* The sell result — the close made visible, same beat as the locked call state.
     Sits inside a white tile, so text is --ink; a tinted panel carries the tone. */
  .sellresult{margin-top:12px;border:1.5px solid #000;border-radius:14px;padding:12px 14px;background:var(--wash);color:var(--ink)}
  .sellresult.up{background:#e7f6ec;border-color:#0f7b3d} .sellresult.down{background:#fbe9e7;border-color:#b3261e}
  .srtop{display:flex;align-items:center;justify-content:space-between}
  .srtick{font-family:'Fredoka';font-weight:600;font-size:17px;color:var(--ink)}
  .srdelta{font-family:'Fredoka';font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
  .srdelta.up{color:#0f7b3d} .srdelta.down{color:#b3261e} .srdelta.flat{color:var(--muted)}
  .srnums{font-family:'Nunito';font-weight:800;font-size:14px;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
  .srnums .up{color:#0f7b3d} .srnums .down{color:#b3261e} .srnums .flat{color:var(--muted)}
  .srsub{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted);margin-top:5px}
  .srdone{margin-top:10px;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--ink);
    border:1.5px solid #000;border-radius:999px;background:#fff;padding:6px 18px;cursor:pointer}
  .srdone:active{transform:scale(.97)}
  .tile.closed{background:var(--wash)}
  .status.closed{color:var(--muted)}
  /* The countdown rides inside the pill, quieter than the number it refills. */
  .topup{font-weight:800;font-size:11px;color:var(--acc-mid);opacity:.85;margin-left:5px}

  /* connect sheet — the only auth surface, and it is never in the way */
  .bal{cursor:pointer}
  .cdim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;
    display:flex;align-items:flex-end;justify-content:center}
  /* THE SIGN-UP SURFACE, in the landing's language.
     The sheet used to be var(--white) with a 3px black border — fixed white in
     BOTH themes, which on the new dark app was a slab of paper thrown over the
     page, and nothing like the band the landing asks the same question in. It
     is now the theme's own card with a hairline, and the buttons are the
     landing's .pbtn: left-aligned, the mark in a fixed slot, one hairline each.
     Both surfaces now ask in the same voice. */
  .csheet{width:100%;max-width:var(--col);background:var(--card-surface);color:var(--on-ground);
    border:1.5px solid var(--card-line);border-radius:22px 22px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 20px)}
  @media (min-width:721px){ .cdim{align-items:center} .csheet{border-radius:22px} }
  .csheet h3{font-family:'Fredoka';font-size:22px;margin:0 0 6px;font-weight:600;color:var(--on-ground)}
  .csheet p{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted-g);margin:0 0 16px;line-height:1.45}
  .cbtn{font:inherit;font-weight:800;font-size:15px;width:100%;padding:14px 16px;margin-bottom:10px;cursor:pointer;
    border:1.5px solid var(--card-line);border-radius:12px;background:var(--ground-2);color:var(--on-ground);
    display:flex;align-items:center;justify-content:flex-start;gap:11px;text-align:left}
  .cbtn:hover:not(:disabled){border-color:var(--accent)}
  .cbtn.x .glyph{font-size:17px}
  .cbtn:disabled{opacity:.45;cursor:default}
  .cbtn .glyph{flex:none;width:22px;display:inline-flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px}
  .pmark{width:19px;height:19px;display:block;border-radius:5px}
  .cclose{font:inherit;font-weight:700;font-size:14px;width:100%;padding:9px 0;cursor:pointer;
    border:0;background:none;color:var(--muted)}
  .cnote{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);margin:2px 0 12px;line-height:1.4}
  /* Custody / no-real-money disclaimer — low-key but present. Used on the sign-up
     sheet and as a quiet profile footer. Never a modal, never blocking. */
  .disclaimer{font-family:'Nunito';font-weight:700;font-size:10.5px;line-height:1.45;
    color:var(--muted-g);opacity:.8;margin:12px 0 0}
  .pfoot{margin-top:26px;padding-top:14px;border-top:1px solid var(--card-line);text-align:center}
  /* Was var(--muted), justified as "inside a white sheet, the surface grey is
     right". The sheet is no longer white in either theme, so the note follows
     the theme's own muted ink instead. */
  .csheet .cnote{color:var(--muted-g)}

  /* Layer 1 — save-your-answer nudge. Same quiet-card weight as .znote/the
     guest bar (a status, not another ask): copy first, one clear CTA, and an
     explicit dismiss so "skippable" is a real control, not just something to
     scroll past. */
  .save-nudge{margin-top:10px;padding:11px 13px;border-radius:14px;
    background:var(--wash);border:1.5px solid var(--hair-g)}
  .save-nudge-body{margin:0 0 9px;font-family:'Nunito';font-weight:700;font-size:12.5px;
    line-height:1.4;color:var(--muted-g)}
  .save-nudge-body b{font-weight:900;color:var(--on-ground)}
  .save-nudge-row{display:flex;align-items:center;gap:8px}
  .save-nudge-cta{flex:none;font-family:'Nunito';font-weight:900;font-size:12.5px;color:#17250a;
    background:var(--accent);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
  .save-nudge-x{margin-left:auto;flex:none;font-size:13px;line-height:1;color:var(--muted-g);
    background:none;border:0;padding:4px 2px;cursor:pointer}

  /* Stage 2 onboarding: the one-time "now the real move" teaching moment,
     appended after the locked call's existing CTA(s) — never replacing or
     hiding the share button above it, which stays the loudest thing here.
     A quiet callout (the same pale-wash treatment as .znote), not a second
     hero: this is a lesson, not another ask. */
  .onboard-teach,.loop-tag-reminder{margin-top:14px;padding:14px 16px;border:1.5px solid var(--hair-g);
    border-radius:var(--r-md);background:var(--wash)}
  :root[data-theme="dark"] .onboard-teach,:root[data-theme="dark"] .loop-tag-reminder{background:#1c2410;border-color:#2a3318}
  .onboard-teach-body{font-family:'Nunito';font-weight:700;font-size:13px;line-height:1.5;
    color:var(--on-ground);margin:0 0 10px}
  .onboard-teach-body b{font-weight:900}
  .onboard-teach-cta{display:inline-flex;align-items:center;gap:7px;font-family:'Fredoka';
    font-weight:600;font-size:13.5px;color:#fff;background:#000;border-radius:999px;
    padding:9px 16px;text-decoration:none}
  .onboard-teach-cta .glyphx{font-size:14px;line-height:1}
  /* The loop's cadenced tag reminder (see HOME_TAG_REMINDER_CADENCE) reuses
     the teaching card's exact body/CTA styling above — same lesson, same
     visual language — and adds one thing: a way to skip it and keep the
     chain going, since unlike the one-time teaching moment this one recurs
     and must never read as blocking play. */
  .keep-playing-cta{display:block;margin-top:10px;font-family:'Nunito';font-weight:800;
    font-size:12.5px;color:#4d7a1a;background:none;border:0;padding:0;cursor:pointer}
  :root[data-theme="dark"] .keep-playing-cta{color:var(--accent)}

  /* The 3-step guided tour's CSS lived here. Removed with the tour itself:
     a read-first walkthrough is the opposite of hypercasual, it double-taught
     what the hero demo already shows, and its step-2 spotlight targeted the
     mobile balance pill — display:none on desktop — so the ring collapsed to
     a dot at the viewport corner. Onboarding is now the first action itself;
     the economy teaches at the moment of spend (see .balspend below). */

  /* The moment-of-spend receipt: a "−1" that floats off the balance pill the
     instant a call is placed. This replaces the tour's "each tap costs a
     prediction" sentence — the cost is SHOWN, at the exact moment it happens,
     instead of narrated in advance as a warning. */
  .bal{position:relative}
  .balspend{position:absolute;right:6px;top:-2px;pointer-events:none;
    font-family:'Fredoka';font-weight:700;font-size:14px;color:var(--acc-deep);
    animation:balspend .9s ease-out forwards}
  :root[data-theme="dark"] .balspend{color:var(--accent)}
  @keyframes balspend{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
  @media (prefers-reduced-motion:reduce){.balspend{animation:none;opacity:0}}

  /* --- sharing ----------------------------------------------------------------
   * Two entry points. The card icon is discovery ("check this out"); the button
   * after a call locks is the wedge itself ("I called it — what do you say?").  */
  /* cat chip on the left, share icon on the right; this row carries the
     margin-bottom:auto that used to live on .cat, so the take still drops down. */
  /* The money line under the duel. Small, wide, and lit only on the part that
     is a promise to a person: the fee credit names someone who gets paid. */
  .stakeline{margin-top:10px;font-size:12.5px;font-weight:700;line-height:1.45;
    color:var(--muted-g);letter-spacing:.01em}
  .stakeline b{color:var(--acc-mid);font-weight:800}
  :root[data-theme="dark"] .stakeline b{text-shadow:0 0 14px rgba(215,220,31,.45)}
  .stakeline-pool{white-space:nowrap}

  .chead{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .chead .shareico{margin-left:auto}

  /* -------------------------------------------------------- the author row --
   * The card's first line is a person. It replaces the "tagged by @x" chip
   * that used to sit in the meta row below, so the card is no taller than it
   * was: the same fact, moved to where a social feed puts it and given the
   * weight an author gets rather than the weight a label gets.
   */
  .author{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
  .au-av{width:36px;height:36px;flex:none;border-radius:50%;border:2.5px solid var(--ink);
    display:grid;place-items:center;font-family:'Fredoka';font-weight:700;font-size:17px;color:#12140A;
    box-shadow:0 3px 0 rgba(0,0,0,.25)}
  :root[data-theme="dark"] .au-av{border-color:#05060A;box-shadow:0 3px 0 rgba(0,0,0,.8)}
  .au-av--oddie{background:var(--accent) var(--mark) center/cover no-repeat}
  .au-av--img{background:var(--ground-2);overflow:hidden;padding:0}
  .au-av--img img{width:100%;height:100%;object-fit:cover;display:block}
  .au-who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
  .au-who b{font-family:'Fredoka';font-weight:700;font-size:16px;color:var(--on-ground);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .au-sub{font-family:'Nunito';font-weight:800;font-size:11.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted-g)}
  .au-go{font-size:14px;color:var(--muted-g);flex:none}
  .author:hover .au-who b{color:var(--accent)}
  :root[data-theme="dark"] .author:hover .au-who b{color:#D7DC1F}

  /* ------------------------------------------------------------- the ask --
   * The one action this whole product exists to cause, on every card. It sits
   * AFTER the bet rather than before it: someone who just looked at a market
   * somebody else earns from is the most receptive they will ever be to the
   * idea of making the next one. It is a quiet line rather than a second big
   * button, because the loud control on this card has to stay the one that
   * takes a side. */
  .tagcta{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    margin-top:10px;padding:11px 12px;cursor:pointer;font:inherit;white-space:nowrap;
    font-family:'Nunito';font-weight:800;font-size:13px;
    border:2.5px dashed var(--card-line);border-radius:14px;background:none;color:var(--muted-g)}
  .tagcta b{color:var(--accent)}
  :root[data-theme="dark"] .tagcta b{color:#D7DC1F}
  .tagcta:hover{border-color:var(--accent);color:var(--on-ground)}
  .tagcta:active{transform:translateY(2px)}
  .chead .cat{margin-bottom:0}
  .shareico{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:1.5px solid var(--line-g);background:var(--ground);
    color:var(--on-ground);cursor:pointer;padding:0}
  .shareico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .shareico:hover{background:var(--ground-2)}
  .shareico:active{transform:scale(.9)}
  /* The strong one: a solid blue call-to-action, on-brand, under the locked line. */
  .sharebig{display:inline-flex;align-items:center;gap:8px;margin-top:10px;
    font-family:'Fredoka';font-weight:600;font-size:14px;color:#000;
    background:var(--accent);border:1.5px solid #000;border-radius:16px;padding:9px 15px;cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.16)}
  .sharebig svg{width:17px;height:17px;stroke:#000;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .sharebig:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
  /* Desktop fallback menu (no native share sheet). */
  .sdim{position:fixed;inset:0;z-index:80}
  .smenu{position:fixed;z-index:81;min-width:190px;background:var(--ground-2);
    border:1.5px solid var(--line-g);border-radius:16px;padding:6px;
    box-shadow:0 18px 44px rgba(13,60,90,.24)}
  .smenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    font-family:'Nunito';font-weight:800;font-size:13.5px;color:var(--on-ground);
    background:none;border:0;border-radius:11px;padding:10px 12px;cursor:pointer}
  .smenu button:hover{background:var(--ground)}
  .smenu svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px);transform:translateX(-50%);z-index:90;
    background:#fff;color:#000;border:1.5px solid #000;border-radius:14px;padding:9px 15px;max-width:88vw;
    font-family:'Nunito';font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(13,60,90,.2)}

  /* ------------------------------------------------- resolution celebration --
   * The emotional peak: full-screen on mobile, a large centred card from the
   * tablet breakpoint up — highest z-index in the app, above the toast, because
   * this is the one thing that must sit on top of literally everything else
   * that could be on screen when a resolution lands. Win and loss share the
   * same shell; only the accent, copy, and CTAs differ, per the brief's "keep
   * the loss state visually calmer, no red-heavy scolding" — loss reuses the
   * plain card surface, win gets the same lime hero-glow language as the home
   * page's headline (.hero::before), so a win reads as a sibling of the app's
   * one other "premium moment", not a one-off effect. */
  .celebrate-dim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);
    display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:600px){ .celebrate-dim{align-items:center;padding:24px} }
  .celebrate-card{position:relative;width:100%;max-width:460px;max-height:100dvh;overflow-y:auto;
    background:var(--card-surface);border:1.5px solid var(--card-line);
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    padding:calc(env(safe-area-inset-top) + var(--sp-6)) var(--sp-4) calc(env(safe-area-inset-bottom) + var(--sp-4));
    box-shadow:var(--shadow-pop)}
  @media (min-width:600px){ .celebrate-card{border-radius:var(--r-xl);max-height:88dvh} }
  .celebrate-card.win{position:relative;overflow:hidden}
  .celebrate-card.win::before{content:"";position:absolute;top:-60px;left:50%;width:420px;height:280px;
    transform:translateX(-50%);background:radial-gradient(ellipse at center, rgba(182,240,95,.4), transparent 70%);
    filter:blur(2px);pointer-events:none;z-index:0}
  :root[data-theme="dark"] .celebrate-card.win::before{background:radial-gradient(ellipse at center, rgba(182,240,95,.18), transparent 70%)}
  .celebrate-card>*{position:relative;z-index:1}
  .celebrate-x{position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:3;width:34px;height:34px;
    border-radius:50%;border:1.5px solid var(--hair-g);background:var(--ground-2);color:var(--muted-g);
    font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .celebrate-x:active{transform:scale(.92)}
  .celebrate-dots{display:flex;justify-content:center;gap:6px;margin:0 0 var(--sp-3)}
  .celebrate-dots span{width:6px;height:6px;border-radius:50%;background:var(--hair-g)}
  .celebrate-dots span.on{background:var(--accent);width:16px;border-radius:999px}
  /* Confined to the card, not the viewport — "restrained", per the brief, not a
     screen-wide cannon. overflow:hidden on .celebrate-card.win clips it. */
  .celebrate-confetti{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .confetti-piece{position:absolute;top:-5%;width:7px;height:12px;opacity:0;border-radius:2px;
    animation-name:confettifall;animation-timing-function:cubic-bezier(.25,.46,.45,.94);animation-fill-mode:forwards}
  @keyframes confettifall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(480px) rotate(var(--rot,540deg));opacity:0}
  }
  @media (prefers-reduced-motion:reduce){.confetti-piece{display:none}}
  .celebrate-body{text-align:center;padding-top:var(--sp-2)}
  .cel-badge{display:inline-block;font-family:'Fredoka';font-weight:700;font-size:22px;margin:0 0 var(--sp-3)}
  .cel-badge.win{color:var(--on-ground)}
  .cel-badge.loss{font-size:19px;color:var(--muted-g)}
  .cel-q{font-family:'Fredoka';font-weight:600;font-size:17px;line-height:1.3;color:var(--on-ground);
    margin:0 0 var(--sp-2)}
  .cel-callrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 var(--sp-4)}
  .cel-side{font-family:'Nunito';font-weight:900;font-size:13px;letter-spacing:.02em;
    padding:5px 12px;border-radius:999px}
  .cel-side.yes{color:#0a5c22;background:#d7f2e0}
  .cel-side.no{color:#8f1017;background:#fbdfe4}
  :root[data-theme="dark"] .cel-side.yes{color:#7fe0a4;background:#0f3320}
  :root[data-theme="dark"] .cel-side.no{color:#f2a3b4;background:#3a1420}
  .cel-resolved{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--muted-g)}
  .cel-oscore{display:inline-flex;justify-content:center;margin:0 0 var(--sp-4)}
  .scorering.big{width:152px;height:152px}
  .scorering.big .scorering-num{font-size:36px}
  .scorering.big .scorering-lab{font-size:10px}
  .cel-streak{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:900;
    font-size:13px;color:#7a4a00;background:#ffeec2;border:1.5px solid #e8b34a;
    border-radius:999px;padding:6px 14px;margin:0 0 var(--sp-4)}
  :root[data-theme="dark"] .cel-streak{color:#f5cf6b;background:#3a2c05;border-color:#6b5312}
  .cel-ctas{display:flex;flex-direction:column;gap:var(--sp-2);margin:0 0 var(--sp-2)}
  .cel-cta{font:inherit;font-family:'Fredoka';font-weight:600;font-size:15px;border-radius:999px;
    padding:13px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .cel-cta.share{color:#17250a;background:linear-gradient(180deg, #c4f57a, var(--accent) 60%);
    border:1.5px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .cel-cta.share:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .cel-cta.challenge{color:var(--on-ground);background:transparent;border:2px solid var(--card-line)}
  .cel-cta.challenge:active{transform:scale(.98)}
  .celebrate-next{display:block;width:100%;margin-top:var(--sp-3);font:inherit;font-family:'Nunito';
    font-weight:800;font-size:13.5px;color:var(--muted-g);background:none;border:0;padding:8px;cursor:pointer}
  .celebrate-next:active{opacity:.6}

  /* the handle: who this stream is called */
  .hrow{display:flex;align-items:center;gap:10px;border:1.5px solid #000;border-radius:22px;
    background:var(--wash);padding:13px 16px;margin-bottom:12px;color:var(--ink)}
  .hname{font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:18px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hkind{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted);flex:none}
  /* .hrow is var(--wash) — light in BOTH themes — so this label needs a FIXED
     dark ink. var(--acc-mid) flips to a light lime in dark mode and measured
     1.38:1 on that cream row. */
  .hedit{font-family:'Nunito';font-weight:800;font-size:12.5px;color:#4d5a12;background:none;border:0;
    padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;flex:none}
  .hin{flex:1;min-width:0;font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:17px;
    border:1.5px solid #000;border-radius:12px;padding:7px 11px;background:#fff;color:#000}
  .hsave{font-family:'Fredoka';font-weight:600;font-size:13.5px;color:#000;background:var(--accent);
    border:1.5px solid #000;border-radius:12px;padding:8px 13px;cursor:pointer;flex:none}
  .herr{font-family:'Nunito';font-weight:800;font-size:12px;color:#b3261e;margin:-6px 4px 10px}

  /* profile, once it is real */
  .acct{display:flex;align-items:center;gap:12px;border:1.5px solid #000;border-radius:22px;
    background:var(--wash);padding:14px 16px;margin-bottom:12px}
  .acct .glyph{font-size:20px;font-weight:800;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:1.5px solid #000;background:#fff;flex:none}
  .acct .who{font-weight:700;font-size:15px}
  .acct .kind{font-family:'Nunito';font-weight:800;font-size:11.5px;color:var(--muted)}

  /* A three-way switch, built from the same outline the rest of the app is. */
  .seg{display:flex;gap:0;border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--white);margin-bottom:10px}
  /* var(--white)/var(--ink) are fixed in both themes, so this switch stayed a
     white slab with black type on the dark app. It is the theme's own surface
     now; the selected segment keeps the accent, which reads on both. */
  .segb{flex:1;font:inherit;font-weight:700;font-size:14.5px;padding:11px 0;cursor:pointer;
    border:0;border-right:1.5px solid var(--hair-g);background:var(--card-surface);color:var(--on-ground)}
  .segb:last-child{border-right:0}
  .segb.on{background:var(--accent);color:#17250a}
  @keyframes balpulse{40%{transform:scale(1.12)}}

  /* The peek of the next card is the scroll affordance now, so the nudge only
     appears on the first card (via .show) and reserves NO space otherwise — every
     other card hugs its content with nothing dangling below the tiles. */
  .nudge{align-self:center;margin-top:16px;
    font-family:'Nunito';font-weight:800;font-size:13px;color:var(--muted-g);opacity:0;transition:opacity .3s;
    pointer-events:none;display:none;flex-direction:column;align-items:center;gap:2px}
  .nudge.show{display:flex;opacity:1}
  .nudge.show.hint{opacity:.72}   /* quieter than the one you earn by picking a side */
  .nudge .arrow{font-size:18px;animation:bob 1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.nudge .arrow{animation:none}}

  /* ----------------------------------------------------------------- shells -- */
  .sheet{max-width:var(--col);margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 104px) 22px calc(env(safe-area-inset-bottom) + var(--tabh) + 28px)}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .head h1{font-size:27px;font-weight:600;margin:0;color:var(--on-ground)}
  .sub{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted-g);margin:0 0 20px}

  /* ------------------------------------------------------------------ home -- */
  /* homeTop() is a brand-row-only header (no chips, no title row), shorter than
     shellTop()'s — so the top padding here is smaller than .sheet's 104px. */
  /* Matches --feedcol, not --col: the feed's cards scale with the viewport at
     desktop widths (see the 768px/1024px/1440px breakpoints below), and the
     hero used to stay pinned at the older fixed --col, so Home read as
     narrower than the feed it sits above — two different "how wide is this
     page" answers on the same product. */
  /* Every gap from here down is owned by exactly one element (its own
     margin-top marks "a new section starts here"), using the --sp-* scale —
     see the note by --sp-1. Adjacent block margins collapse in normal flow,
     so an optional element (the claim card, the featured-markets label) can
     be skipped entirely without leaving a doubled or missing gap behind it. */
  /* Top padding clears the measured chrome, never a hardcoded guess — and does
     NOT re-add env(safe-area-inset-top), because --chromeh is a real measured
     height whose element already includes its own safe-area padding. Adding it
     again here (as this rule used to) double-counted the notch. */
  .homewrap{max-width:var(--feedcol);margin:0 auto;
    padding:calc(var(--chromeh) + var(--sp-2)) 20px calc(env(safe-area-inset-bottom) + var(--tabh) + 28px)}
  /* Home is a static page, not a stack of full-screen cards: the featured
     markets borrow the feed's card styling but must NOT borrow the feed's
     near-full-viewport min-height, or the page reads as "one card per screen"
     (feed-like) even with snap correctly disabled. Each hugs its own content —
     a secondary "try this" section under the tag CTA, not a takeover. Same
     reasoning kills scroll-snap-align: harmless without a snap container, but
     pointless here. Tight, uniform gap card-to-card — a list, not separate
     sections — the big section gap arrives via .howitworks' own margin-top. */
  .homewrap .card{min-height:auto;scroll-snap-align:none;scroll-margin-top:0;margin:0 0 var(--sp-2)}
  .homewrap .card:first-child{margin-top:0}
  /* The section label reads as a quiet caption over a secondary section, not a
     header competing with the hero above it — margin-top is the section gap
     (collapses with whatever precedes: the hero, or the claim card when it's
     showing), margin-bottom is the tight "caption to its own list" gap. */
  .homewrap .psec{text-align:center;margin:var(--sp-6) 0 var(--sp-2)}
  /* That section gap says "a new section starts here" — which is wrong when the
     label IS the start of the page. For a first-time visitor the markets
     section leads, so its label is .homewrap's first child, and 48px of empty
     ground above a four-word label is exactly the dead air the card is
     supposed to be occupying. */
  .homewrap>.psec:first-child{margin-top:0}
  .homewrap .claimcard{margin:var(--sp-6) 0 0}
  /* The market cards' own container. On mobile this is a single column — i.e.
     exactly the stack it has always been — and it exists so that DESKTOP can
     lay the same cards out in two columns without touching the card code (see
     the >=1024 rule). Gap owns the spacing here, so the cards' own
     margin-bottom is zeroed to avoid doubling it. */
  .mktgrid{display:grid;gap:var(--sp-2)}
  .mktgrid .card{margin:0}

  /* ---------------------------------------------------- the create bar -----
     The returning player's opening: ~160px that names the action and offers
     both ways to take it, then gets out of the way so the live feed starts
     inside the first screen. It replaces a near-full-viewport hero that
     explained the mechanic to people who already knew it. */
  .createbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    padding:16px 18px;margin:0 0 var(--sp-2);
    border:1.5px solid #000;border-radius:var(--r-lg);background:var(--ground-2);
    box-shadow:var(--shadow-chip)}
  .cb-copy{flex:1 1 240px;min-width:0}
  .cb-title{font-family:'Fredoka';font-weight:700;font-size:min(23px,5.4vw);line-height:1.15;
    letter-spacing:-.02em;color:var(--on-ground);margin:0}
  .cb-sub{font-family:'Nunito';font-weight:700;font-size:12.5px;line-height:1.4;
    color:var(--muted-g);margin:5px 0 0}
  .cb-actions{display:flex;align-items:center;gap:9px;flex:none}
  .cb-tag{display:inline-flex;align-items:center;gap:8px;font-family:'Nunito';font-weight:900;
    font-size:13px;color:#17250a;background:var(--accent);border:2px solid #000;
    border-radius:999px;padding:10px 16px;text-decoration:none;white-space:nowrap}
  .cb-paste{font-family:'Nunito';font-weight:900;font-size:13px;color:var(--on-ground);
    background:none;border:2px solid var(--hair-g);border-radius:999px;
    padding:10px 15px;cursor:pointer;white-space:nowrap}
  .cb-paste:hover{border-color:var(--accent)}

  /* The paste-a-link sheet's field + error. */
  /* Translucent, not var(--wash): --wash is #F3FBDA in BOTH themes while
     --on-ground flips to near-white, so the field's own text would vanish in
     dark mode. See scripts/test-contrast.ts. */
  .paste-in{width:100%;box-sizing:border-box;font-family:'Nunito';font-weight:700;font-size:14px;
    padding:12px 13px;margin:2px 0 0;border:2px solid var(--hair-g);border-radius:14px;
    background:rgba(127,127,127,.10);color:var(--on-ground)}
  .paste-in:focus{outline:none;border-color:var(--accent)}
  .paste-err{font-family:'Nunito';font-weight:800;font-size:12px;color:#b3261e;margin:8px 0 0}
  .paste-go{margin-top:10px}
  /* The sheet's second door: present, legible, and visibly not the main path. */
  .paste-own{display:block;width:100%;border:none;background:none;font-family:'Nunito';
    font-weight:700;font-size:12.5px;color:var(--muted-g);padding:10px 4px 0;cursor:pointer}
  .paste-own:hover{color:var(--on-ground);text-decoration:underline}

  /* ------------------------------------------------------- the right rail --
     Who YOU are, in two panels — calls and markets. Below the feed on mobile,
     beside it on desktop (see the >=1024 grid). */
  .homerail{display:flex;flex-direction:column;gap:var(--sp-2);margin:var(--sp-3) 0 0}
  .rpanel{border:1.5px solid #000;border-radius:var(--r-lg);background:var(--ground-2);
    padding:14px 15px;text-decoration:none;display:block;color:inherit}
  .rp-head{font-family:'Nunito';font-weight:900;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted-g);margin:0 0 8px}
  .rp-tier{display:inline-block;font-family:'Nunito';font-weight:900;font-size:12px;
    color:var(--acc-deep);background:rgba(182,240,95,.18);border:1px solid rgba(182,240,95,.55);
    border-radius:999px;padding:3px 10px;margin:0 0 8px}
  :root[data-theme="dark"] .rp-tier{color:var(--accent)}
  .rp-big{font-family:'Fredoka';font-weight:700;font-size:34px;line-height:1;
    color:var(--on-ground);display:flex;align-items:baseline;gap:7px}
  .rp-big-sm{font-size:27px}
  .rp-big small{font-family:'Nunito';font-weight:800;font-size:11.5px;color:var(--muted-g)}
  .rp-grid{display:flex;gap:18px;margin:11px 0 0}
  .rp-grid b{display:block;font-family:'Fredoka';font-weight:700;font-size:17px;color:var(--on-ground)}
  .rp-grid span{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted-g)}
  .rp-sub{display:block;font-family:'Nunito';font-weight:700;font-size:11.5px;line-height:1.4;
    color:var(--muted-g);margin:9px 0 0}
  .rp-link{display:inline-block;font-family:'Nunito';font-weight:900;font-size:12px;
    color:var(--acc-deep);text-decoration:none;margin:10px 0 0}
  :root[data-theme="dark"] .rp-link{color:var(--accent)}
  /* The creator panel is the one carrying the product's economics, so it gets
     the accent border — the only panel that does. */
  .rpanel-creator{border-color:var(--accent)}
  .rp-create{display:block;width:100%;margin:11px 0 0;font-family:'Nunito';font-weight:900;
    font-size:13px;color:#17250a;background:var(--accent);border:2px solid #000;
    border-radius:999px;padding:10px;cursor:pointer}
  /* The daily claim, demoted into the rail: a helper loop, not the reward
     loop. Its own card keeps its styling; the panel just holds it. */
  .rpanel-claim{padding:0;border:0;background:none}
  .rpanel-claim .claimcard{margin:0}
  .hero{position:relative;text-align:center}
  /* One screen, one thing on it — for a first-time visitor ONLY (.hero-first,
     added in JS when newUser is true). Real users kept saying the homepage
     read as crowded even after the tag-first rewrite — headline, demo, CTA,
     reward caption, "someone tagged this one", and a full market card were
     ALL visible at once, competing for a first-time visitor's 3 seconds. The
     fix isn't smaller type, it's fewer things: min-height floors the hero at
     (very nearly) the full first screen, so nothing after it can appear
     until the visitor scrolls. flex+center means short content doesn't hug
     the top looking unfinished — it sits where a poster's headline sits.
     The 32px slack is deliberately AFTER the -32 in the calc, not a typo: it
     keeps the hero just SHORT of the exact viewport so the very top sliver
     of the next section peeks in as a scroll cue, without reading as a
     second thing to look at (see the "someone tagged this" section's own
     margin-top for the matching gap above it).
     A RETURNING player never gets this class, on purpose: they came back
     for their streak/claim/livestrip, not to be re-onboarded, and an
     enforced near-full-viewport hero would bury exactly that content behind
     a screen they've already seen. Same element, same headline+demo+CTA,
     just without the "own the whole screen" floor under it. */
  .hero-first{min-height:calc(100dvh - var(--chromeh) - var(--sp-2) - 32px);
    display:flex;flex-direction:column;justify-content:center;align-items:center}
  /* align-items:center above is required, not decorative: a flex column's
     children default to align-items:STRETCH, which silently pulled .herocta
     to the container's full width the moment this became a flex box — it
     has no max-width to clamp it the way .tagdemo does, so it turned into a
     900px pill on desktop instead of a button. Caught by screenshot, not by
     reasoning about it — worth remembering as a general flex-column trap. */
  /* A soft lime glow seated behind the headline — the one "premium" cue a
     hackathon build skips. Pure gradient, no image, invisible on load until
     the hero's own .enter fade brings it in with everything else. Sized for
     the enlarged .hero-first block; a returning player's compact hero just
     shows the top of the same gradient, which reads fine either way. */
  .hero::before{content:"";position:absolute;top:-40px;left:50%;width:420px;height:520px;
    transform:translateX(-50%);background:radial-gradient(ellipse at center, rgba(182,240,95,.32), transparent 70%);
    filter:blur(2px);pointer-events:none;z-index:0}
  :root[data-theme="dark"] .hero::before{background:radial-gradient(ellipse at center, rgba(182,240,95,.14), transparent 70%)}
  .hero>*{position:relative;z-index:1}
  /* Headline → demo → CTA is ONE tightly-related group — the entire pitch,
     read top to bottom in one breath, sized up so it's unmistakably the
     ONLY thing on the screen rather than the biggest of several things. The
     "+50 points" reward caption that used to sit under the CTA is gone: it
     was one more stacked line competing for the same 3 seconds, and what a
     tag DOES (the demo, right above) matters more on first sight than what
     it pays. The reward still surfaces elsewhere (the fee note on every
     community card, the tag-reminder interstitial) — this screen just isn't
     the place for it anymore. */
  /* Measured, not eyeballed, and the cliff is sharper than it looks: at a
     400px phone this copy's two clauses ("Someone's wrong on X?" / "Prove
     you're right.") each fit their own line at EXACTLY 36px and neither
     does at 36.4px — there is no gentle slope to 3 lines, it is a step
     function. 38px (tried first) measured 4 lines and left zero gap above
     the tab bar; even the "safe-looking" 37px still measured 3. So the
     headline itself is NOT bigger than before — the copy is fixed (see the
     note above about "prove you're right" surviving edits), and this is
     already its ceiling for staying 2 lines on a phone. What actually
     changed the screen's weight is everything downstream of it: the demo
     roughly 20% larger, the CTA button larger still, sp-4 breathing room
     under the headline instead of sp-2, and — the biggest lever by far —
     three fewer things sharing the screen with it. */
  .herotitle{font-size:min(36px,9vw);font-weight:700;line-height:1.1;letter-spacing:-.025em;
    color:var(--on-ground);margin:0 0 var(--sp-4)}
  .herocta{display:inline-flex;align-items:center;gap:10px;font-family:'Fredoka';font-weight:600;font-size:18px;
    color:#17250a;background:linear-gradient(180deg, #c4f57a, var(--accent) 60%);
    border:1.5px solid #000;border-radius:999px;
    padding:17px 32px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.18), var(--shadow-pop);
    transition:transform .12s ease, box-shadow .12s ease}
  .herocta:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .herocta .glyphx{font-size:19px;line-height:1}
  /* The differentiator, drawn rather than argued: an X post, the @oddiefun
     reply, and what comes out the other side. Users kept reading the product
     as "another prediction market" off a feed of markets — this is the one
     element that answers "where do these markets come from" before anyone has
     to read a word of explanation, which is why it sits above the CTA and not
     in a help page. Left-aligned inside a centred column on purpose: it's a
     little scene, and centring the post text would stop it reading as a post.
     Every size below is scaled up from the original demo (a supporting
     element next to a full headline+CTA+card stack) to a co-lead (half of a
     two-thing screen) — same content, sized like it matters this much. */
  .tagdemo{max-width:360px;margin:0 auto var(--sp-4);text-align:left}
  .tagdemo-post{display:flex;gap:11px;align-items:flex-start;background:var(--ground-2);
    border:1.5px solid var(--hair-g);border-radius:16px;padding:13px 15px}
  .tagdemo-av{flex:none;width:27px;height:27px;border-radius:50%;background:var(--hair-g)}
  .tagdemo-txt{font-family:'Nunito';font-weight:700;font-size:14.5px;line-height:1.4;color:var(--on-ground)}
  /* The connectors carry the VERBS ("you tag @oddiefun", "the season plays
     out"), which is what lets the whole flow explain itself without a prose
     block above it — the arrow says what happens, the box below shows the
     result. Centred so the three boxes read as one vertical sequence. */
  .tagdemo-step{text-align:center;font-family:'Nunito';font-weight:800;font-size:13px;
    color:var(--muted-g);margin:8px 0}
  .tagdemo-step b{color:var(--acc-deep);font-weight:900}
  :root[data-theme="dark"] .tagdemo-step b{color:var(--accent)}
  /* The third beat, and the reason the other two matter: it actually settles,
     and the people who were right are named. Without this the demo shows what
     you make but never why making it is worth anything. */
  .tagdemo-done{font-family:'Nunito';font-weight:900;font-size:14.5px;color:var(--acc-deep);
    background:var(--ground-2);border:1.5px solid var(--accent);border-radius:14px;
    padding:12px 14px;text-align:center}
  :root[data-theme="dark"] .tagdemo-done{color:var(--accent)}
  .tagdemo-card{border:2px solid var(--accent);border-radius:16px;padding:13px 15px;background:var(--ground-2)}
  .tagdemo-q{display:block;font-family:'Fredoka';font-weight:600;font-size:16px;
    line-height:1.25;color:var(--on-ground);margin:0 0 10px}
  .tagdemo-odds{display:flex;gap:8px}
  /* Literal #fff, not var(--card-surface): that token flips to a dark value in
     dark mode, which put near-black text on a near-black pill here. The real
     market card's YES/NO tiles are white in BOTH themes, and this miniature
     only works if it looks like the thing it's a miniature of. */
  .tagdemo-odds span{flex:1;text-align:center;font-family:'Nunito';font-weight:900;font-size:13.5px;
    background:#fff;color:#101010;border:1.5px solid #101010;border-radius:10px;padding:7px 5px}
  /* Three beats, icon + a few words each — no paragraphs, per the brief. Each
     gets its own medallion (a soft chip circle) instead of a bare emoji
     floating in text, so the row reads as a designed sequence, not a caption.
     margin-top is the section gap (see the .homewrap note); this is also the
     one guaranteed-present element after the hero, so it's the reliable place
     to own that gap even when the claim card and featured markets are both
     absent (a signed-out cold visit with no community markets yet). */
  /* The earning loop, one glanceable line under the hero. Sized and spaced to
     be read in about a second and then ignored — it is a label, not a section,
     so it gets caption-scale type and no card, panel or icons competing with
     the hero directly above it. Wraps to two lines on very narrow screens
     rather than shrinking below a readable size. */
  /* Guest bar — a strip under the header carrying a status a newcomer has to
     actually register: you're a guest, and connecting is what stops your
     score evaporating. It used to be deliberately quiet (11.5px muted-grey
     on the page's own background) and reviewing it live that read as
     decoration rather than information — people simply didn't see it. Now it
     sits on the accent colour with ink-black text, which is the loudest
     treatment in the system SHORT of the CTA button: noticeable at a glance,
     still one slim row, still dismissible. It is not an alert and must not
     grow into one — no icon, no animation, no second line.

     Rendered as the LAST CHILD OF .top, in normal flow, not as its own fixed
     strip. That is deliberate and load-bearing: as a separate fixed element
     its `top` had to be re-measured against the header's live height, and any
     time that measurement went stale (a font swap reflowing the brand row,
     the balance pill filling in from /api/me, an orientation change) the bar
     sat at its old offset and covered the logo and points pill it was
     supposed to sit under. In flow inside the header, overlapping it is not
     an expressible state. The negative margins cancel .top's own padding so
     the strip still runs edge to edge. */
  .guestbar{display:flex;align-items:center;gap:11px;
    margin:11px -16px -12px;padding:11px 14px;
    background:var(--accent);border-top:2px solid #000}
  /* On the accent background the hairline that used to close this strip is
     redundant — the colour change already separates it from the page. Kept
     only on the feed, where .top fades to transparent and the bar would
     otherwise bleed into the first card. */
  body[data-view="feed"] .guestbar{border-bottom:2px solid #000}
  /* Ink on accent in BOTH themes, like every other accent-filled control —
     var(--on-ground) would flip to near-white in dark mode and vanish. */
  .gb-text{flex:1;min-width:0;font-family:'Nunito';font-weight:800;font-size:13px;
    line-height:1.35;color:#17250a}
  .gb-text b{font-weight:900;color:#101010}
  /* The button has to stay legible against the accent the bar now uses, so it
     inverts: ink fill, accent text. Same trick the standing panel's share
     button uses on its accent background. */
  .gb-go{flex:none;font-family:'Nunito';font-weight:900;font-size:12.5px;color:var(--accent);
    background:#101010;border:0;border-radius:999px;padding:7px 15px;cursor:pointer}
  .gb-x{flex:none;font-size:13px;line-height:1;color:#17250a;background:none;
    border:0;padding:4px 3px;cursor:pointer;opacity:.65}
  .gb-x:hover{opacity:1}
  .howitworks{display:flex;align-items:flex-start;justify-content:center;gap:2px;margin:var(--sp-6) 0 0}
  /* 84 -> 94px: the labels now name the actual actions ("Reply @oddiefun on X")
     rather than two-word jargon, and @oddiefun is a single unbreakable token
     that needs the room. Three steps + two arrows still fit inside 390px. */
  .howstep{display:flex;flex-direction:column;align-items:center;gap:9px;width:94px;
    font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);line-height:1.25;color:var(--muted-g);text-align:center}
  .howstep .howico{display:flex;align-items:center;justify-content:center;width:52px;height:52px;
    border-radius:50%;background:var(--wash);border:2px solid var(--card-line);
    font-size:22px;line-height:1;box-shadow:var(--shadow-chip)}
  :root[data-theme="dark"] .howstep .howico{background:var(--card-surface)}
  .howarrow{flex:none;color:var(--card-line);opacity:.35;font-weight:700;font-size:16px;margin-top:24px}
  /* The feed is a destination now, chosen not defaulted-into — one quiet link. */
  /* Tertiary, nearly hidden by design: tagging is the primary action, the
     featured markets are a few things to try, and browsing the catalog is the
     last resort for someone who wants it anyway — not a peer of the others,
     so its own gap (sp-4) is a step down from the sp-6 used between the
     bigger sections above it. */
  .browselink{display:block;text-align:center;font-family:'Nunito';font-weight:700;font-size:var(--fs-caption);
    color:var(--muted-g);text-decoration:none;margin:var(--sp-4) 0 0;padding:10px;opacity:.75}
  .browselink:active{opacity:.5}

  /* "Recently settled" — the landing's proof that the loop actually completes.
     Reuses the resolution-receipt language the profile's recent-calls rows and
     the notification cards already use: a compact card with a coloured left
     rail for the verdict, question first, then who was right. Never rendered
     with fabricated rows — the section is absent when nothing has settled. */
  /* A DIV, not an anchor: the card now holds two links of its own (the question
     and the "make your own call" bridge), and interactive content cannot nest
     inside an <a>. */
  .stl{display:block;border:2px solid var(--card-line);border-left-width:6px;border-radius:var(--r-md);
    background:var(--card-surface);padding:12px 14px;margin:0 0 var(--sp-1);
    box-shadow:var(--shadow-chip)}
  .stl.yes{border-left-color:#0a7d2c}
  .stl.no{border-left-color:#b00020}
  .stl-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .stl-out{flex:none;font-family:'Nunito';font-weight:900;font-size:10.5px;letter-spacing:.03em;
    padding:3px 9px;border-radius:999px}
  .stl.yes .stl-out{color:#0a5c22;background:#d7f2e0}
  .stl.no .stl-out{color:#8f1017;background:#fbdfe4}
  :root[data-theme="dark"] .stl.yes .stl-out{color:#7fe0a4;background:#0f3320}
  :root[data-theme="dark"] .stl.no .stl-out{color:#f2a3b4;background:#3a1420}
  .stl-when{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted-g);white-space:nowrap}
  .stl-q{display:block;font-family:'Nunito';font-weight:800;font-size:13.5px;line-height:1.35;
    color:var(--on-ground);text-decoration:none}
  .stl-wins{margin-top:8px;padding-top:8px;border-top:1px solid var(--hair-g);
    display:flex;flex-direction:column;gap:4px}
  .stl-win{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted-g)}
  .stl-win b{color:var(--on-ground);font-weight:900}
  .stl-win .tick{color:#0a7d2c;font-weight:900}
  :root[data-theme="dark"] .stl-win .tick{color:#7fe0a4}
  /* Everyone was wrong is a real, and frankly better, outcome to show than a
     padded row — so it gets said plainly rather than hiding the market. */
  .stl-none{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted-g);opacity:.85}
  /* The spectator-to-player bridge, at the exact moment the proof lands. Quiet
     on purpose — it's an offer, not a second CTA competing with the hero's. */
  .stl-cta{display:inline-block;margin-top:9px;font-family:'Nunito';font-weight:800;
    font-size:var(--fs-caption);color:var(--acc-deep);text-decoration:none;opacity:.9}
  :root[data-theme="dark"] .stl-cta{color:var(--acc-mid)}
  .stl-cta:active{opacity:.6}

  /* Live activity — a row of real counters over the rolling last 24h. Each
     counter is dropped when it's zero and the whole strip is dropped when none
     survive, so this can never read as "0 calls today" theatre. */
  .livestrip{display:flex;align-items:stretch;justify-content:center;gap:0;margin:var(--sp-6) 0 0;
    border:1.5px solid var(--hair-g);border-radius:var(--r-md);background:var(--card-surface);
    box-shadow:var(--shadow-chip);overflow:hidden}
  .lsi{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 8px;border-left:1px solid var(--hair-g);text-align:center}
  .lsi:first-child{border-left:0}
  .lsi-n{font-family:'Fredoka';font-weight:700;font-size:21px;line-height:1;color:var(--on-ground);
    font-variant-numeric:tabular-nums}
  .lsi-k{font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.02em;color:var(--muted-g);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  /* A live counter deserves a live cue — one dot, on the first item only. Its
     own keyframe rather than .mchip-forming's: that one pulses an amber ring,
     which reads wrong behind a lime dot. */
  .lsi:first-child .lsi-n::after{content:"";display:inline-block;width:6px;height:6px;margin-left:5px;
    border-radius:50%;background:var(--accent);vertical-align:middle;
    box-shadow:0 0 0 0 rgba(182,240,95,.6);animation:livedot 1.8s ease-out infinite}
  @keyframes livedot{0%{box-shadow:0 0 0 0 rgba(182,240,95,.6)}70%{box-shadow:0 0 0 7px rgba(182,240,95,0)}100%{box-shadow:0 0 0 0 rgba(182,240,95,0)}}
  @media (prefers-reduced-motion:reduce){.lsi:first-child .lsi-n::after{animation:none}}

  /* The streak pill. It described the CLAIM streak: consecutive days somebody
     turned up and pressed a button. What it renders now is the PICK streak,
     consecutive calls that turned out right, which is the one worth showing
     because it cannot be farmed by showing up. */
  .streakpill{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:900;
    font-size:12px;color:#7a4a00;background:#ffeec2;border:1.5px solid #e8b34a;
    border-radius:999px;padding:5px 12px}
  :root[data-theme="dark"] .streakpill{color:#f5cf6b;background:#3a2c05;border-color:#6b5312}
  .streakwrap{text-align:center;margin:var(--sp-6) 0 0}
  /* The pill owns the section gap when it renders, so the claim strip below it
     tightens up to read as one unit with it rather than two stacked sections.
     Scoped to :not([hidden]) because the wrapper is always in the DOM (a claim
     can start a streak, and the pill has to be able to appear without a
     re-render) — without this, a streakless visitor would get the tightened
     gap with nothing above it to justify it. */
  .streakwrap:not([hidden]) + .claimcard{margin-top:var(--sp-1)}

  /* "Your open calls" — the Zeigarnik hook, sitting right below the claim
     strip: two personal "you have a reason to come back" rows back to back,
     before the page moves on to aggregate/social sections. A row, not a card
     — quieter than the claim strip above it, since it's a status, not an ask. */
  .opencalls{display:flex;align-items:center;gap:11px;margin:var(--sp-2) 0 0;padding:11px 14px;
    border:1.5px solid var(--hair-g);border-radius:var(--r-md);background:var(--card-surface);
    text-decoration:none;box-shadow:var(--shadow-chip)}
  .oc-ico{flex:none;font-size:17px;line-height:1}
  .oc-text{flex:1;min-width:0;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--on-ground)}
  .oc-text b{font-weight:900}
  .oc-sub{color:var(--muted-g);font-weight:700}
  .oc-arrow{flex:none;color:var(--muted-g);font-weight:800;font-size:14px}

  /* Home's continuous-play loop: the "up next" preview after a locked call's
     CTAs, and the end-of-chain fallback into Feed. Deliberately NOT full-card
     weight — this sits right below a share/connect/teach stack that's already
     asking for attention, so it reads as a quiet next step, not competition. */
  .nextcall-prev{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
    margin-top:12px;padding:12px 14px;border:1.5px solid var(--hair-g);border-radius:var(--r-md);
    background:var(--card-surface);box-shadow:var(--shadow-chip);cursor:pointer;font:inherit}
  .ncp-cat{font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted-g)}
  .ncp-q{display:block;font-family:'Fredoka';font-weight:600;font-size:14.5px;
    color:var(--on-ground);line-height:1.3}
  .ncp-cta{display:flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:800;
    font-size:12.5px;color:#4d7a1a;margin-top:2px}
  :root[data-theme="dark"] .ncp-cta{color:var(--accent)}
  .ncp-timer{color:var(--muted-g);font-weight:700}
  .nextcall-fallback{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:12px;padding:12px 14px;border:1.5px solid var(--hair-g);border-radius:var(--r-md);
    background:var(--card-surface);box-shadow:var(--shadow-chip);text-decoration:none;
    font-family:'Nunito';font-weight:800;font-size:13px;color:var(--on-ground)}
  .nextcall-fallback .nc-arrow{flex:none;color:var(--muted-g);font-weight:800}

  /* Leaderboard teaser — three ranked callers, so a cold visitor can see a
     competition exists. Same rank/handle/edge shape as the full board it links
     to (no new metric invented for the teaser), just compact rows on the
     ground rather than the board's own white panel. */
  .topc{display:block;text-decoration:none;border:2px solid var(--card-line);border-radius:var(--r-md);
    background:var(--card-surface);overflow:hidden;box-shadow:var(--shadow-chip)}
  .topc-r{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--hair-g)}
  .topc-r:last-child{border-bottom:0}
  .topc-rank{flex:none;width:20px;font-family:'Fredoka';font-weight:700;font-size:14px;color:var(--muted-g);text-align:center}
  .topc-r:first-child .topc-rank{color:var(--acc-deep)}
  :root[data-theme="dark"] .topc-r:first-child .topc-rank{color:var(--accent)}
  .topc-who{flex:1;min-width:0;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--on-ground);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topc-edge{flex:none;font-family:'Nunito';font-weight:900;font-size:12.5px;color:var(--on-ground);
    font-variant-numeric:tabular-nums}
  .topc-edge small{display:block;font-weight:800;font-size:10px;color:var(--muted-g)}
  .topc-more{display:block;text-align:center;font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);
    color:var(--muted-g);text-decoration:none;margin:var(--sp-1) 0 0;padding:6px;opacity:.8}
  /* Says what it is, everywhere it is. These screens read as finished on purpose;
     the badge is the only thing standing between "shipped" and "mocked up". */
  .preview{display:inline-flex;align-items:center;gap:5px;flex:none;
    font-family:'Nunito';font-weight:800;font-size:11px;letter-spacing:.02em;
    padding:5px 10px 5px 8px;border-radius:999px;border:2px solid #000;background:var(--accent);color:#000}
  .preview::before{content:"";width:6px;height:6px;border-radius:50%;background:#000}

  /* Was a fixed #fff panel with a black border — four white slabs on the dark
     profile. Same shape as every other one of these: a surface pinned to one
     theme while the page moved. Theme tokens, like the cards and the sheet. */
  .tile{border:1.5px solid var(--card-line);border-radius:18px;background:var(--card-surface);
    color:var(--on-ground);padding:16px 16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num{font-family:'Nunito';font-weight:800;font-variant-numeric:tabular-nums}

  /* profile */
  /* The chosen face: a chunky sticker like everything else a thumb touches. */
  .pfav{position:relative;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
    overflow:hidden;font-size:32px;line-height:1;cursor:pointer;padding:0;margin:0 0 10px;
    background:var(--accent);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}
  .pfav img{width:100%;height:100%;object-fit:cover;display:block}
  .pfav-empty{font-family:'Fredoka';font-weight:700;color:#12140A}
  :root[data-theme="dark"] .pfav{border-color:#05060A;box-shadow:0 5px 0 rgba(0,0,0,.85)}
  .pfav:active{box-shadow:0 1px 0 rgba(0,0,0,.25);transform:translateY(4px)}
  .pfav-pen{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-size:12px;background:var(--ink);color:#fff;border:2.5px solid var(--ground)}
  .pfav--big{width:88px;height:88px;font-size:44px;margin:0 auto 14px;cursor:default}
  .pf-preview{display:flex;justify-content:center}

  /* Badges as medallions with weight, not flat discs. A badge is a thing you
     were given; it should look like an object. */
  .medal-ico{border:2.5px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.22)}
  :root[data-theme="dark"] .medal-ico{border-color:#05060A;box-shadow:0 4px 0 rgba(0,0,0,.8)}
  .medal:active .medal-ico{box-shadow:0 1px 0 rgba(0,0,0,.22);transform:translateY(3px)}

  .avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);border:1.5px solid #000;position:relative;flex:none}
  .avatar::before,.avatar::after{content:"";position:absolute;width:15px;height:15px;background:#000;border-radius:50%;top:31px}
  .avatar::before{left:19px}.avatar::after{left:50px}
  .handle{font-size:23px;font-weight:600}
  .joined{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 14px}
  .stat{border:1.5px solid #000;border-radius:20px;padding:14px 10px;text-align:center;background:#fff}
  .stat.hero{background:var(--accent)}
  .stat .v{font-size:29px;font-weight:700;line-height:1}
  .stat .k{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--acc-mid);margin-top:5px}
  .stat.hero .k{color:var(--acc-deeper)}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .badge{font-family:'Nunito';font-weight:800;font-size:12px;padding:7px 12px;border-radius:999px;
    border:2px solid #000;background:var(--wash)}
  .sect{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}

  /* positions */
  /* Ink, not the inherited muted grey: #6B7A88 on the blue chip is 2.33:1, and
     it always was — in both themes. Black on blue is what every other blue
     element uses (.navitem.on, .amt.on). */
  .side-chip{font-family:'Nunito';font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;
    border:2px solid #000;flex:none;color:var(--ink)}
  .side-chip.yes{background:var(--accent)} .side-chip.no{background:#fff}
  .q{font-size:16px;font-weight:500;line-height:1.25;margin:0 0 10px}
  .pmeta{display:flex;align-items:center;gap:8px;font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--muted)}
  .dot{width:4px;height:4px;border-radius:50%;background:#C7D3DC;flex:none}
  /* Translucent fill + adaptive ink, so the two move together. Was var(--wash)
     (light in both themes) under var(--acc-mid) (a light lime in dark) — the
     same pairing as .hedit, found by the guard the moment the accent tokens
     were added to its adaptive list. */
  .status{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:var(--acc-mid);
    background:rgba(127,127,127,.16);border-radius:999px;padding:5px 10px}
  .summary{display:flex;gap:10px;margin-bottom:16px}
  .summary .tile{flex:1;margin:0;text-align:center;padding:13px 8px}
  .summary .v{font-size:22px;font-weight:700;line-height:1}
  .summary .k{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted);margin-top:4px}

  /* Accuracy record — the four public reputation stats.
     The note that used to be here said the tiles were "the fixed white .tile,
     so text is FIXED dark to hold contrast in both themes". That stopped being
     true when .tile moved to var(--card-surface): the surface became
     theme-aware and the ink did not, so every number on this screen was a very
     dark green on a near-black card. Unreadable, and the same failure this
     file has recorded three times already, which is a hardcoded colour chosen
     for a surface that later learned to change. Dark gets its own values. */
  .trhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
  .trhead .psec{margin:0}
  .trshare{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#17250a;
    border:1.5px solid rgba(0,0,0,.28);border-radius:999px;padding:6px 13px;
    font-family:'Nunito';font-weight:900;font-size:13px;cursor:pointer}
  .trshare svg{width:15px;height:15px;fill:none;stroke:#17250a;stroke-width:2.2}
  .trshare:active{transform:scale(.96)}
  .trstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .trstats .tile{margin:0;text-align:center;padding:14px 8px}
  .trstats .v{font-size:24px;font-weight:800;line-height:1.05;color:#17250a}
  .trstats .v.topic{font-size:17px}
  .trstats .k{font-family:'Nunito';font-weight:800;font-size:11px;color:#5c6660;margin-top:5px}
  .trstats .best{font-size:11px;font-weight:800;color:#5c6660;white-space:nowrap}
  /* Chunk, same system as the feed card: the profile was the last screen still
     made of hairlines. */
  .trstats .tile{border:2.5px solid var(--card-line);box-shadow:0 5px 0 rgba(0,0,0,.18)}
  :root[data-theme="dark"] .trstats .tile{border-color:rgba(255,255,255,.14);box-shadow:0 5px 0 rgba(0,0,0,.7)}
  .trstats .v{font-family:'Fredoka';font-weight:700;font-size:30px}
  /* The money leads, so it is bigger and it is lit. Nothing else on this screen
     gets the accent fill, which is what keeps it meaning "this is the payoff". */
  .moneystats .tile.hero{background:var(--accent);border-color:var(--ink)}
  :root[data-theme="dark"] .moneystats .tile.hero{background:var(--accent);border-color:#05060A;
    box-shadow:0 5px 0 rgba(0,0,0,.85), 0 0 42px rgba(215,220,31,.22)}
  .moneystats .tile.hero .v,
  :root[data-theme="dark"] .moneystats .tile.hero .v{color:#12140A;font-size:34px}
  .moneystats .tile.hero .k,
  :root[data-theme="dark"] .moneystats .tile.hero .k{color:#3A4106}
  .moneystats .unit{font-family:'Nunito';font-weight:800;font-size:14px;margin-left:4px;opacity:.75}

  :root[data-theme="dark"] .trstats .v{color:var(--on-ground)}
  :root[data-theme="dark"] .trstats .v.topic{color:#D7DC1F}
  :root[data-theme="dark"] .trstats .k,
  :root[data-theme="dark"] .trstats .best{color:var(--muted-g)}
  /* Per-category accuracy — supporting detail below the Oddie Score, one row per
     category that has cleared its own resolved-picks threshold (the same
     "building track record" minimum, applied per category instead of globally).
     A category short of that bar is simply absent — no placeholder, no zero.
     A mini progress bar carries the % visually, not just as a number. */
  .catbreak{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
  .catrow{border:2px solid var(--card-line);border-radius:var(--r-md);
    background:var(--card-surface);padding:11px 14px;box-shadow:var(--shadow-chip)}
  .catrow-top{display:flex;align-items:baseline;gap:8px;font-family:'Nunito';font-weight:800}
  .catrow .catname{flex:1;color:var(--on-ground);font-size:13px}
  .catrow .catpct{color:var(--on-ground);font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
  .catbar{height:6px;border-radius:999px;background:var(--hair-g);margin:8px 0 6px;overflow:hidden}
  .catbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg, var(--acc-mid), var(--accent))}
  .catrow .catn{color:var(--muted-g);font-size:11px;font-weight:700;font-family:'Nunito'}

  /* ---- the trophy room: Oddie Score as a ring/gauge, badges as medallions ---- */
  /* The ring: a conic-gradient donut filled to score/1000, the number counted up
     inside it on first paint. The container drops the old flat-lime block — the
     ring itself now carries the accent, so the surrounding card can be neutral
     and let the ring read as the hero the way a gauge does on a dashboard. */
  .oscore{display:flex;align-items:center;gap:18px;background:var(--card-surface);color:var(--on-ground);
    border:2px solid var(--card-line);border-radius:var(--r-xl);padding:20px;margin-bottom:14px;
    box-shadow:var(--card-shadow)}
  .scorering{position:relative;flex:none;width:112px;height:112px;border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--score-pct,0) * 360deg), var(--hair-g) 0deg);
    box-shadow:var(--shadow-pop)}
  .scorering::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card-surface)}
  .scorering-inner{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .scorering-num{font-size:28px;font-weight:800;line-height:1;color:var(--on-ground);font-variant-numeric:tabular-nums}
  .scorering-num.building{font-size:15px}
  .scorering-lab{font-family:'Nunito';font-size:9px;font-weight:900;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted-g);margin-top:4px}
  .oscore-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
  .oscore-title{font-family:'Fredoka';font-weight:600;font-size:17px;color:var(--on-ground)}
  .oscore-desc{font-family:'Nunito';font-weight:700;font-size:11.5px;line-height:1.4;color:var(--muted-g)}
  /* Season rank — status expressed as a PLACE, a small trophy pill under the
     description rather than crammed into the ring's corner. */
  .rankpill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    font-family:'Nunito';font-weight:900;font-size:12px;color:#5c4300;background:#fff3d6;
    border-radius:999px;padding:5px 12px 5px 9px;box-shadow:var(--shadow-chip)}
  :root[data-theme="dark"] .rankpill{color:#f5cf6b;background:#3a2c05}
  /* This week's Oddie Score motion — a quiet status line, not a headline. Same
     restrained up/down language as the rank-move line below it: an accent tick
     for a gain, muted for a dip, never alarmist red — a loss here is "not this
     time", not a penalty (see .cel-badge.loss). */
  .oscore-weekly{font-family:'Nunito';font-weight:800;font-size:12px}
  .oscore-weekly.up{color:#4d7a1a}
  .oscore-weekly.down{color:var(--muted-g)}
  :root[data-theme="dark"] .oscore-weekly.up{color:var(--accent)}
  /* "you moved up 2 spots -> #14" — shown once (the server consumes it on this
     same read), so it needs no fade timer of its own; it simply isn't there on
     the next view. */
  .rankmove{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--on-ground);
    background:var(--wash);border-radius:10px;padding:6px 10px;margin-top:2px}
  .rankmove.down{color:var(--muted-g);background:transparent;padding:6px 0 0}
  :root[data-theme="dark"] .rankmove{background:#26330f}
  /* The in-session score delta chip — "+16"/"−9" pinned to the ring's corner,
     fading on its own CSS timer. Anchors on .scorering, which is already
     position:relative (the conic-gradient ring), so no extra wrapper is needed
     on either the profile ring or the celebration's bigger #celRing. */
  .score-delta{position:absolute;top:-4px;right:-4px;z-index:2;font-family:'Nunito';font-weight:900;
    font-size:12px;padding:3px 8px;border-radius:999px;box-shadow:var(--shadow-chip);
    pointer-events:none;animation:scoreDeltaFade 1.8s ease forwards}
  .score-delta.up{background:var(--accent);color:#17250a}
  .score-delta.down{background:var(--muted-g);color:var(--card-surface)}
  @keyframes scoreDeltaFade{
    0%{opacity:0;transform:translateY(3px) scale(.92)}
    12%{opacity:1;transform:translateY(0) scale(1)}
    65%{opacity:1}
    100%{opacity:0;transform:translateY(-5px) scale(.96)}
  }
  /* The score strip above the identity block. Called "the spendable play
     balance" here while there were two user numbers and one of them was spent.
     Neither is true now: calls are free, bets are SOL, and this is the single
     number the profile leads with. */
  /* Badges — earned identity as MEDALLIONS, not flat pills: a circular icon with
     a lime medal-sheen + real shadow, caption below. Same visual language as
     home's how-it-works steps (a circle behind an icon), but with more presence
     — these are achievements, not instructions. */
  .badges{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 16px}
  .medal{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;text-align:center}
  /* A locked slot is drawn, not omitted. An achievement screen that shows only
     what you already have is a receipt; the empty circles are the pull. */
  /* THE STAMP SHEET. Four per row on a phone, five once there is room: fourteen
     cells that read as one sheet with gaps rather than as a list. */
  .sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 0}
  @media (min-width:400px){.sheet-grid{grid-template-columns:repeat(5,1fr);gap:9px}}
  @media (min-width:560px){.sheet-grid{grid-template-columns:repeat(7,1fr);gap:10px}}
  .stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    aspect-ratio:1;border-radius:18px;padding:6px 4px;text-align:center;
    border:3px dotted var(--card-line);background:transparent}
  .stamp svg{width:26px;height:26px;color:var(--muted);opacity:.4}
  .stamp span{font-family:'Nunito';font-size:8.5px;font-weight:900;letter-spacing:.02em;
    line-height:1.1;color:var(--muted);opacity:.55}
  /* Earned. Same footprint, different finish: solid border, a real plate, and a
     glyph at full contrast. Nothing grows, so the sheet never reflows. */
  .stamp.got{border:3px solid var(--ink);background:var(--card-surface);box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .stamp.got svg{color:var(--on-ground);opacity:1}
  .stamp.got span{color:var(--on-ground);opacity:1}
  /* FOIL, and the rule is auditable: lime if and only if real SOL moved. That
     caps it at four cells of fourteen, which is what gives the sheet a rhythm
     instead of a wall of lime. */
  .stamp.foil{background:var(--accent);border-color:var(--ink)}
  .stamp.foil svg{color:#12140A}
  .stamp.foil span{color:#12140A}
  .shelfnote{font-family:'Nunito';font-size:11px;font-weight:800;color:var(--muted);
    text-align:center;margin:10px 0 0;letter-spacing:.02em}

  /* ---- the hero: one number, one ladder, one button ---------------------- */
  .hero1{background:var(--accent);color:#12140A;border:3px solid var(--ink);border-radius:24px;
    padding:22px 20px 20px;margin:18px 0 16px;box-shadow:0 6px 0 rgba(0,0,0,.22);text-align:center}
  .hero1-num{font-size:76px;font-weight:700;line-height:.92;color:#12140A;font-variant-numeric:tabular-nums}
  .hero1-lab{font-family:'Nunito';font-size:10px;font-weight:900;letter-spacing:.08em;color:#3A4106;margin-top:2px}
  .hero1-chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
  .hero1-chip{font-family:'Nunito';font-size:11px;font-weight:900;background:#12140A;color:var(--accent);
    border-radius:999px;padding:5px 11px}
  .hero1-chip.up{background:#12140A;color:#b6f36a}

  /* The loud ladder. Rung one is lit from the very first visit because 1x is a
     real reading on a 1x..2x scale, not a zero, which is what lets the new
     user and the veteran share ONE layout instead of two that drift apart. */
  .ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
  .rung{position:relative;overflow:hidden;border-radius:999px;padding:7px 0;
    font-family:'Nunito';font-size:11px;font-weight:900;letter-spacing:.02em;
    border:2px solid #12140A;color:#12140A;background:transparent;opacity:.34}
  .rung.on{background:#12140A;color:var(--accent);opacity:1}
  /* The next rung crawls. It is the only motion a user with nothing gets, and
     it is the difference between an empty track and a track that is waiting. */
  .rung.next{opacity:.85}
  .rung.next::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 0%,rgba(18,20,10,.20) 45%,transparent 70%);
    background-size:220% 100%;animation:crawl 2.6s linear infinite}
  @keyframes crawl{from{background-position:220% 0}to{background-position:-40% 0}}
  @media (prefers-reduced-motion:reduce){.rung.next::after{animation:none}}

  .hero1-go{display:block;width:100%;margin-top:16px;background:#12140A;color:var(--accent);
    border:0;border-radius:999px;padding:15px 18px;font-family:'Fredoka';font-size:17px;font-weight:600;
    cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .06s,box-shadow .06s}
  .hero1-go:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
  .hero1-sub{font-family:'Nunito';font-size:11.5px;font-weight:800;color:#3A4106;margin:10px 0 0}
  .ladder-lab{margin-top:18px}
  .hero1-next{font-family:'Nunito';font-size:11px;font-weight:800;color:#3A4106;margin:8px 0 0;opacity:.82}

  /* Proof chips. Absent at zero: a count nobody has earned yet is a zero
     wearing a label, and the ladder above is already the invitation. */
  .proof{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin:0 0 16px}
  .proof-c{background:var(--card-surface);border:1.5px solid var(--card-line);border-radius:14px;
    padding:11px 8px;text-align:center}
  .proof-v{font-size:22px;font-weight:700;color:var(--on-ground);font-variant-numeric:tabular-nums}
  .proof-k{font-family:'Nunito';font-size:9.5px;font-weight:900;letter-spacing:.05em;color:var(--muted);margin-top:3px}

  /* The money strip is the one surface on this page with no brand colour and no
     juice. It is real SOL: it reports, it never celebrates. */
  .mstrip{display:flex;align-items:center;gap:0;background:var(--card-surface);
    border:1.5px solid var(--card-line);border-radius:16px;padding:12px 6px;margin:0 0 16px;
    text-decoration:none;color:inherit}
  .mstrip-h{flex:1;text-align:center;padding:0 8px}
  .mstrip-h + .mstrip-h{border-left:1px solid var(--card-line)}
  .mstrip-v{font-size:17px;font-weight:600;color:var(--on-ground)}
  .mstrip-k{font-family:'Nunito';font-size:9.5px;font-weight:900;letter-spacing:.05em;color:var(--muted);margin-top:2px}
  .mstrip-one{font-family:'Nunito';font-size:11.5px;font-weight:800;color:var(--muted);padding:2px 12px;text-align:center;flex:1}

  /* Settings, collapsed. They were roughly half this page. The summary keeps a
     scent trail so the theme switcher stays findable after folding. */
  .setrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card-surface);border:1.5px solid var(--card-line);border-radius:16px;
    padding:13px 15px;margin:18px 0 0;cursor:pointer;color:var(--on-ground);
    font-family:'Nunito';font-size:12.5px;font-weight:900;letter-spacing:.02em}
  .setrow-sum{color:var(--muted);font-weight:800}
  .setbody{margin-top:12px}
  .medal-ico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:23px;line-height:1;background:radial-gradient(circle at 32% 26%, #eefccb, var(--accent) 74%);
    border:1.5px solid var(--card-line);box-shadow:var(--shadow-pop)}
  .medal-lab{font-family:'Nunito';font-weight:800;font-size:10.5px;line-height:1.25;color:var(--on-ground)}
  /* Public-profile recent-calls feed: compact rows, a win/loss rail. */
  .pcall{border:2px solid var(--card-line);border-left-width:6px;border-radius:12px;
    background:var(--card-surface);padding:10px 13px;margin-bottom:8px}
  .pcall.win{border-left-color:#0a7d2c}
  .pcall.loss{border-left-color:#b00020}
  .pcall-q{font-family:'Nunito';font-weight:800;font-size:13.5px;line-height:1.35;color:var(--on-ground)}
  .pcall-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-family:'Nunito';font-weight:800;font-size:12px}
  .pcall-side{color:var(--muted-g)}
  .pcall.win .pcall-out{color:#0a7d2c}
  .pcall.loss .pcall-out{color:#b00020}

  /* Transaction history — closed positions as instantly-readable win/loss cards.
     Same chunky-outline white surface as every tile; a coloured left rail and an
     outcome chip carry the verdict at a glance, the numbers back it up. Text is
     pinned to --ink because the surface is white in BOTH themes (contrast lesson). */
  .htile{border:1.5px solid #000;border-left-width:9px;border-radius:20px;background:#fff;color:var(--ink);
    padding:13px 15px 12px;margin-bottom:11px}
  .htile.won{border-left-color:#0f7b3d} .htile.lost{border-left-color:#b3261e} .htile.sold{border-left-color:#9aa7b2}
  .hhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .hbadge{font-family:'Nunito';font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px;border:1.5px solid #000}
  .hbadge.won{background:#d7f2e0;color:#0b5c2e} .hbadge.lost{background:#f7dbd7;color:#8f1d17} .hbadge.sold{background:#eef3f7;color:#476075}
  .hwhen{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:#7a8894}
  .htile .q{font-size:15px;margin-bottom:9px;color:var(--ink)}
  .hrow2{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-family:'Nunito';font-weight:800;font-size:12.5px;color:#5b6b77}
  .hfoot{display:flex;align-items:center;gap:12px;font-family:'Nunito';font-weight:800;font-size:13px}
  .hio{color:var(--ink);font-variant-numeric:tabular-nums}
  .hshare{margin-left:auto;width:34px;height:34px;flex:none;border:1.5px solid #000;border-radius:50%;
    background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
  .hshare:hover{background:var(--wash)}
  .hshare svg{width:15px;height:15px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* "Your standing" — the leaderboard's answer to "accuracy accumulates, so
     what?". A board whose top 20 you aren't in says nothing about you; this
     panel says exactly where you are, what tier it earns, and hands you the
     one line worth posting. It leads the screen, above the boards. */
  .standing{border:1.5px solid #000;border-radius:22px;background:var(--accent);
    padding:16px 16px 14px;margin:0 0 14px;position:relative;overflow:hidden}
  .standing-tier{display:inline-flex;align-items:center;gap:7px;font-family:'Fredoka';
    font-weight:700;font-size:21px;line-height:1.1;color:#101010}
  .standing-rank{font-family:'Fredoka';font-weight:700;font-size:40px;line-height:1;
    color:#101010;margin:6px 0 2px}
  .standing-sub{font-family:'Nunito';font-weight:800;font-size:12.5px;color:#2b3d10;line-height:1.4}
  .standing-flex{font-family:'Nunito';font-weight:800;font-size:12.5px;color:#101010;
    background:rgba(255,255,255,.62);border:1.5px solid rgba(0,0,0,.42);border-radius:12px;
    padding:8px 11px;margin:11px 0 0;line-height:1.4}
  /* Your best call: a claim, so it gets a card of its own rather than a row in
     a list of statistics. */
  .bestcall{border:1.5px solid var(--hair-g);border-radius:16px;padding:14px 15px;background:var(--card-surface)}
  .bestcall-q{font-family:'Fredoka';font-weight:600;font-size:16px;line-height:1.25;color:var(--on-ground)}
  .bestcall-line{margin-top:7px;font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted-g)}
  .bestcall-line b{color:var(--on-ground)}

  .standing-share{display:block;width:100%;margin:10px 0 0;font-family:'Nunito';font-weight:900;
    font-size:13px;color:var(--accent);background:#101010;border:0;border-radius:999px;
    padding:11px;cursor:pointer}
  .standing-share:active{opacity:.82}
  /* Unranked/provisional: the same panel, but honest — a quiet shell that says
