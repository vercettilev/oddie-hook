/* ------------------------------------------------------------------ feed -- */
async function loadFeed(){
  const scroller=document.getElementById("scroller");
  feedTop(null);
  scroller.innerHTML='<div class="state">loading the odds…</div>';
  try{
    const q=new URLSearchParams();
    if(startSlug && activeCat==="For you")q.set("start",startSlug);
    if(activeCat!=="For you")q.set("cat",activeCat);
    // Sent so the server can bias "For you" toward this device's play history
    // (signed-in users with positions). Cold devices with no history are unaffected.
    q.set("deviceId",deviceId);
    // Taste re-rank: once an anonymous visitor picks categories, the feed tilts
    // toward them (rank, not filter — the server keeps breadth visible).
    if(TASTE){const tc=tasteCats();if(tc.length)q.set("cats",tc.join(","));}
    // Fetch the daily-claim status alongside the feed so the claim card is ready
    // to render at the top on first paint (the retention hook, not a later pop-in).
    const [r,cr]=await Promise.all([
      fetch(`${API}/api/feed?${q}`),
      fetch(`${API}/api/claim?deviceId=${encodeURIComponent(deviceId)}`).catch(()=>null),
    ]);
    if(!r.ok)throw new Error("feed "+r.status);
    if(cr&&cr.ok)claim=await cr.json();
    const data=await r.json();
    feedTop(data.categories);
    renderFeed(data.items);
  }catch(e){
    scroller.innerHTML='<div class="state">couldn’t load the odds — pull to retry or check the server.</div>';
    console.error(e);
  }
}

/* After a call: which side of the room did you just join? Only said at all
 * when enough poppers called it that the percentage is a signal — below the
 * floor the line is simply absent, because "67% of poppers" meaning 2-of-3 is
 * noise dressed up as precision, and the locked state reads fine without it. */
const MIN_CROWD=10;
function socialLine(side,crowd,marketSidePct){
  const yes=crowd?.yes??0, no=crowd?.no??0, total=yes+no;
  if(total<MIN_CROWD)return "";
  const p=Math.round(100*(side==="yes"?yes:no)/total);
  const m=marketSidePct;
  if(p>=50&&m<50)return `You're with ${p}% of poppers. The market disagrees (${m}%).`;
  if(p>=50)return `You're with ${p}% of poppers — and the market (${m}%).`;
  if(m>=50)return `Only ${p}% of poppers with you — but the market is (${m}%).`;
  return `Contrarian: ${p}% of poppers and a ${m}% market against you.`;
}

// Cold-visitor onboarding. Shown only on the "For you" tab, only for a cold/
// organic visit (no permalink context — a permalink page already has the tweet
// as its explanation). Two independent rows: the tag instruction and a follow
// prompt, each persisted separately (a visitor may dismiss one but not the
// other). Both live in one snap-aligned wrap so they're visible on load.
const ONB_KEY="oddie_onboard_dismissed";    // tag-instruction strip
const FOLLOW_KEY="oddie_follow_dismissed";   // follow prompt (independent)
function onboardingCold(){ return activeCat==="For you" && !startSlug; }
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return "1";} } // fail closed → hidden
function lsSet(k){ try{localStorage.setItem(k,"1");}catch(e){} }
// The top-of-feed hooks: the daily-claim card (everyone) + the cold-visitor
// onboarding banners. All in one snap-aligned wrap so they're visible on load.
function maybeFeedTop(scroller){
  const cold=onboardingCold();
  const showTag=cold && !lsGet(ONB_KEY);
  const showFollow=cold && !lsGet(FOLLOW_KEY);
  // On a shared-market landing (/m/{slug}) the market itself must lead and sit
  // centered — so the daily-claim banner (a retention hook for the organic feed)
  // is suppressed here; it still shows on a normal feed visit.
  const showClaim=!!claim && !startSlug;
  if(!showClaim && !showTag && !showFollow)return;
  const wrap=document.createElement("div"); wrap.className="onbwrap";
  if(showClaim)wrap.appendChild(claimCard());
  const prune=()=>{ if(!wrap.querySelector(".onbstrip,.claimcard"))wrap.remove(); };
  // ONE consolidated onboarding banner: the tag instruction is the primary CTA;
  // the follow prompt rides inline as a secondary pill on the same strip (not a
  // second full banner). A single × dismisses both. A visitor who already
  // dismissed one sees only the other, still in a single compact strip.
  if(showTag || showFollow){
    const s=document.createElement("div"); s.className="onbstrip";
    // The visible hero: one headline line, integrated into the banner (not a
    // section), shown to a first-time visitor alongside the tag instruction.
    const heroHtml=showTag ? '<span class="onbhero">Tag it. Make the call. See who was right.</span>' : '';
    const tagHtml=showTag
      ? '<span class="onbtxt">tag <b>@oddiefun</b> under any claim on X — it turns into a market that keeps score</span>'
      : '<span class="onbtxt">follow to see which calls were right</span>';
    const followHtml=showFollow
      ? '<a class="fbtn" href="https://x.com/intent/follow?screen_name=oddiefun" target="_blank" rel="noopener">follow @oddiefun ↗</a>'
      : '';
    s.innerHTML=heroHtml+tagHtml+followHtml+'<button class="onbx" type="button" aria-label="Dismiss">×</button>';
    const fb=s.querySelector(".fbtn"); if(fb)fb.onclick=()=>ev("follow_click",{});
    s.querySelector(".onbx").onclick=()=>{lsSet(ONB_KEY);lsSet(FOLLOW_KEY);s.remove();prune();ev("onboard_dismiss",{});};
    wrap.appendChild(s);
  }
  scroller.appendChild(wrap);
}

// The daily-claim card. Prominent (lime, a Claim button) when claimable; quiet
// (a countdown) once claimed. The streak line is the reason to come back.
// `streakShownAbove` is set by home, which renders the streak as its own pill
// directly above this card — without it the same "🔥 N-day streak" would appear
// twice, a few pixels apart.
function claimCard(opts={}){
  const {streakShownAbove=false}=opts;
  const el=document.createElement("div");
  const st=claim.streak||0;
  // Say the streak here only when nothing else on the page is already saying it.
  const sayStreak=st>0 && !streakShownAbove;
  if(claim.claimable){
    el.className="claimcard ready";
    el.innerHTML=`<div class="cc-grow">
        <div class="cc-title">Claim your daily Oddie Points</div>
        <div class="cc-sub">${sayStreak?`🔥 ${st}-day streak — keep it alive`:st>0?"keep the streak alive":"tap to start your streak"}</div>
      </div>
      <button class="claimbtn" id="claimbtn">Claim +${claim.amount}</button>`;
    el.querySelector("#claimbtn").onclick=async(e)=>{
      const btn=e.currentTarget; btn.disabled=true; btn.textContent="…";
      try{
        const r=await fetch(`${API}/api/claim`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
        const j=await r.json();
        if(!r.ok)throw new Error("claim "+r.status);
        claim={claimable:false,nextClaimMs:j.nextClaimMs,streak:j.streak,amount:j.amount,lastClaimAt:j.lastClaimAt};
        if(typeof j.balance==="number"){balance=j.balance;paintBalance(true);}
        ev("claim_daily",{streak:j.streak,granted:j.granted});
        // Claiming can START a streak (0 -> 1), so the pill above has to be
        // brought into existence / updated, not just this card swapped.
        el.replaceWith(claimCard(opts));  // same context, so the streak isn't double-said
        if(typeof opts.onClaimed==="function")opts.onClaimed(j.streak);
        if(j.granted>0)toast(`+${j.granted} Points · 🔥 ${j.streak}-day streak`);
      }catch(err){btn.disabled=false;btn.textContent=`Claim +${claim.amount}`;}
    };
  }else{
    el.className="claimcard done";
    el.innerHTML=`<div class="cc-grow">
        <div class="cc-title">✓ Points claimed${sayStreak?` · 🔥 ${st}-day streak`:""}</div>
        <div class="cc-sub">come back for tomorrow's drop to keep the streak</div>
      </div>
      <div class="cc-next">next in ${claimWhen(claim.nextClaimMs)}</div>`;
    // A confirmation, not a standing CTA: collapse to a slim one-line pill after a
    // few seconds so it stops competing with the tag banner for space on mobile.
    setTimeout(()=>el.classList.add("cc-mini"),4000);
  }
  return el;
}

/**
 * Community markets, grouped by category with a header above each cluster —
 * previously they rendered as one flat run (a football claim next to a crypto
 * claim next to a politics claim, in whatever order calls came in). Venue
 * items keep their existing order untouched; the server already appends the
 * community block as one contiguous run in the default "For you" feed, so
 * only that run gets re-sliced into per-category clusters here.
 *
 * Ordering choice: most markets first (not most-recently-active) — simple,
 * deterministic, and doesn't require tracking a per-category last-activity
 * timestamp the server doesn't currently expose. Ties keep the server's
 * original relative order (stable sort + Map insertion order).
 */
function groupCommunityByCategory(items){
  const firstCommunityIdx=items.findIndex(m=>m.community);
  if(firstCommunityIdx===-1)return items;
  const before=items.slice(0,firstCommunityIdx);
  const communityRun=items.filter(m=>m.community);
  const after=items.slice(firstCommunityIdx).filter(m=>!m.community);
  const groups=new Map();
  communityRun.forEach(m=>{
    const k=m.topicCategory||"Other";
    if(!groups.has(k))groups.set(k,[]);
    groups.get(k).push(m);
  });
  const grouped=[];
  [...groups.entries()].sort((a,b)=>b[1].length-a[1].length).forEach(([cat,ms])=>{
    grouped.push({__catHeader:cat});
    grouped.push(...ms);
  });
  return [...before,...grouped,...after];
}

function renderFeed(items){
  const scroller=document.getElementById("scroller");
  scroller.innerHTML="";
  if(!items.length){scroller.innerHTML='<div class="state">no live markets here right now — try another category.</div>';return;}
  maybeFeedTop(scroller); // claim card + onboarding, pinned first so cards flow beneath
  // Grouping is a "For you"/all-markets thing — a single-category chip view is
  // already one category, and a permalink landing (startSlug) pins its own
  // market up top, a different flow this shouldn't disturb.
  const ordered=(activeCat==="For you" && !startSlug) ? groupCommunityByCategory(items) : items;
  // TikTok-web taste flow. An anonymous visitor gets the feed metered so the
  // personalization investment lands BEFORE the gate:
  //   no categories picked yet -> 1 free card, then the category picker
  //   categories picked         -> 1 re-ranked card, then the sign-in gate
  // Two free bets total (one per card); the gate falls on the 3rd. Signed-in /
  // allowlisted / invited visitors see the whole feed (list=ordered).
  let list=ordered, tail=null;
  if(TASTE){
    if(!tasteCats().length){list=ordered.slice(0,1);tail="picker";}
    else{list=ordered.slice(0,1);tail="gate";}
  }
  list.forEach((m,i)=>{
    if(m.__catHeader){
      const h=document.createElement("div");
      h.className="catgroup-header";
      h.textContent=m.__catHeader;
      scroller.appendChild(h);
      return;
    }
    const card=buildCard(m,i);
    // The same staggered rise+fade home uses on first paint — one motion
    // system, not a per-screen reinvention. Capped delay: a card 20 deep in
    // the feed has long finished animating by the time a swipe reaches it.
    card.classList.add("enter");card.style.animationDelay=`${Math.min(i*55,220)}ms`;
    scroller.appendChild(card);
  });
  if(tail==="picker")scroller.appendChild(buildPicker());
  else if(tail==="gate")scroller.appendChild(buildGate());
  watchDepth(scroller);
  bindDepth(scroller);
  hintFirstCard(scroller);
}

/**
 * Build one market card — question, YES/NO, picker, share, challenge, resolution
 * criteria, the whole tap-to-call interaction — and return it UNATTACHED, so a
 * caller can append it to the feed's scroller (the original use) or drop the
 * exact same tappable card into the home page's featured "Daily Call" slot.
 * `i` only needs to be unique among cards mounted TOGETHER (it seeds local
 * per-card DOM ids, always queried scoped to the card, never globally).
 */
// The metadata row: small pills with icons instead of flat grey text, so the
// state reads at a glance — a pulsing dot while a community market is still
// filling up, a clock once there's a real close date, a coin stack for a venue
// market's actual dollar volume. One function, every card (feed, permalink, home).
function metaRowHtml(m,yes){
  if(!m.community)return `<span class="mchip mchip-volume">${COIN_ICON}${money(m.volumeUsd)} in play</span>`;
  const stateChip=m.forming
    ? `<span class="mchip mchip-forming"><span class="pulsedot"></span>forming · ${m.positions} ${m.positions===1?"call":"calls"}</span>`
    : `<span class="mchip">${yes}% yes</span>`;
  const clockChip=m.closesAt?`<span class="mchip mchip-clock">${CLOCK_ICON}${closesIn(m.closesAt)}</span>`:"";
  const chain=m.onchain?`<a class="chainbadge" href="${esc(m.onchain)}" target="_blank" rel="noopener">on-chain on Solana ↗</a>`:"";
  return `<span class="commtag">community market</span>${stateChip}${clockChip}${chain}`;
}
// Home's continuous-play loop: how many markets one chain will auto-serve
// (the very first card counts as #1) before handing off to "browse more in
// Feed" instead of pulling another. Keeps Home from trying to replicate an
// infinite feed — it's a taste of the loop, not a replacement for Feed.
const HOME_LOOP_CAP=5;
// Every Nth advance in the chain, a tag reminder interstitial takes the next
// preview's place instead (see renderTagReminderInterstitial) — the loop's
// whole point is bringing attention back to tagging real claims on X, not
// just chaining in-app taps forever. chainCount%CADENCE===0 fires it after
// locks 2 and 4 for the default cap of 5, never on the very last slot (the
// cap check runs first and wins).
const HOME_TAG_REMINDER_CADENCE=2;

/** Replace a chain element (the preview, or the tag-reminder interstitial)
 *  with the next real, playable card. The ONE place the chain's card swap
 *  happens, so tap / auto-advance / swipe / "keep playing" can never drift
 *  apart on how the next card enters or where the page lands afterwards. */
function swapToNextCard(el,nextM,homeLoop,chainCount){
  const card=buildCard(nextM,homeLoop.ctx.nextIdx(),{ctx:homeLoop.ctx,chainCount:chainCount+1});
  // Same non-swipeable-list suppression the initial featured cards get — a
  // loop card is just as static a slot as they are, never a swipeable one.
  card.querySelector(".nudge")?.style.setProperty("display","none","important");
  card.classList.add("snap-in");
  el.replaceWith(card);
  // Scroll duration matched to the snap, not the page's leisurely default:
  // a 520ms glide under a 280ms card animation reads as two separate motions.
  scrollToEl(document.getElementById("scroller"),card,{offset:20,duration:260});
}

/** Swipe-up to advance, for touch. Tracks the finger while the gesture is in
 *  progress (so it feels attached rather than merely triggered), commits past
 *  a short threshold, and springs back otherwise. Everything is inline style
 *  rather than a class: the follow-the-finger transform has to win over any
 *  stylesheet rule, and mixing the two is how that kind of thing silently
 *  stops working. Passive listeners throughout — this never blocks scrolling,
 *  and a downward drag is left alone entirely so the page still scrolls. */
function attachSwipeUp(el,onCommit){
  const THRESHOLD=40, MAX_FOLLOW=70;
  let startY=null,dy=0;
  el.addEventListener("touchstart",(e)=>{startY=e.touches[0].clientY;dy=0;},{passive:true});
  el.addEventListener("touchmove",(e)=>{
    if(startY===null)return;
    dy=e.touches[0].clientY-startY;
    if(dy<0)el.style.transform=`translateY(${Math.max(dy,-MAX_FOLLOW)}px)`;
  },{passive:true});
  el.addEventListener("touchend",()=>{
    if(startY===null)return;
    const committed=dy<-THRESHOLD;
    startY=null;
    if(!committed){el.style.transform="";return;}   // spring back
    if(REDUCE_MOTION){onCommit();return;}
    el.style.transition="transform .16s ease-in, opacity .16s ease-in";
    el.style.transform=`translateY(-${MAX_FOLLOW}px)`;el.style.opacity="0";
    setTimeout(onCommit,140);
  },{passive:true});
}

/** Home's continuous-play loop, step 2: the "up next" preview appended after
 *  a locked call's CTAs (share / connect / tag-teaching — see lockedUI).
 *  `nextM` is already pulled/reserved from the shared pool by the time this
 *  renders, so the preview shows the market that's actually coming, not a
 *  placeholder. Tapping it or letting its countdown reach zero both call the
 *  same `advance` — "tap now" and "auto-advance" are one mechanism, not two
 *  competing ones. */
function renderNextCallPreview(anchor,nextM,homeLoop,chainCount){
  const SECS=5;
  const prev=document.createElement("button");
  prev.type="button";prev.className="nextcall-prev";
  prev.innerHTML=`<span class="ncp-cat">${esc(nextM.topicCategory||nextM.category)}</span>
    <span class="ncp-q trunc">${esc(nextM.question)}</span>
    <span class="ncp-cta">Next call <span class="ncp-timer">in ${SECS}s</span> →</span>`;
  anchor.after(prev);
  let secsLeft=SECS,advanced=false;
  const timerEl=prev.querySelector(".ncp-timer");
  const advance=()=>{
    if(advanced)return; advanced=true;
    clearInterval(tickId);
    swapToNextCard(prev,nextM,homeLoop,chainCount);
  };
  const tickId=setInterval(()=>{
    if(!prev.isConnected){clearInterval(tickId);return;} // navigated away mid-countdown
    secsLeft--;
    if(secsLeft<=0){advance();return;}
    if(timerEl)timerEl.textContent=`in ${secsLeft}s`;
  },1000);
  prev.onclick=advance;
  // Swipe-up as an alternative to tapping — the gesture the feed already
  // trains, reused for the chain. The preview tracks the finger while the
  // swipe is in progress so it feels attached rather than triggered, then
  // hands off to the same `advance` the tap and the timer use.
  attachSwipeUp(prev,advance);
}

/** Home's continuous-play loop, cadenced step: fires INSTEAD of the normal
 *  next-call preview every HOME_TAG_REMINDER_CADENCE locks — the loop must
 *  keep steering attention back to tagging real claims on X, not read as
 *  pure in-app consumption. `nextM` is the SAME already-reserved market the
 *  normal preview would have shown; tapping "keep playing" reveals it
 *  directly (no redundant preview-then-card step). Deliberately NOT
 *  auto-advancing like the regular preview — this is the one deliberate
 *  pause in the loop, not another fast beat, so it waits for an explicit tap. */
function renderTagReminderInterstitial(anchor,nextM,homeLoop,chainCount){
  const el=document.createElement("div");
  el.className="loop-tag-reminder";
  el.innerHTML=`<p class="onboard-teach-body">🔥 On a roll — tag a real claim on X and earn <b>+50</b> when it becomes a market.</p>
    <a class="onboard-teach-cta" href="https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}" target="_blank" rel="noopener">
      <span class="glyphx">𝕏</span> Tag @oddiefun on X</a>
    <button type="button" class="keep-playing-cta">keep playing →</button>`;
  anchor.after(el);
  // Same swap the preview uses, so the card lands identically either way.
  // Deliberately NOT swipe-enabled: this beat is the loop's one intentional
  // pause, and a gesture that skips it in a flick would undo the point of it.
  el.querySelector(".keep-playing-cta").onclick=()=>swapToNextCard(el,nextM,homeLoop,chainCount);
}

/** Home's continuous-play loop, end state: the chain hit HOME_LOOP_CAP or the
 *  reserve pool ran dry — either way there's more to call, it's just not
 *  auto-served here anymore. Same visual weight as the CTAs above it: a
 *  next step, not an error or an apology. */
function renderFeedFallback(anchor){
  const fb=document.createElement("a");
  fb.className="nextcall-fallback";fb.href="/feed";
  fb.innerHTML=`<span>Keep going — browse more in Feed</span><span class="nc-arrow">→</span>`;
  anchor.after(fb);
}

function buildCard(m,i,homeLoop){
    const yes=m.yesPct,no=100-yes;
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`
      <div class="chead">
        <div class="cat">${esc(m.topicCategory||m.category)}</div>
        <button class="shareico" aria-label="Share this market">${SHARE_ICON}</button>
      </div>
      ${m.slug===startSlug && m.sourceUrl ? `<a class="srctweet" href="${esc(m.sourceUrl)}" target="_blank" rel="noopener noreferrer">
        <span class="srctweet-ico">${X_ICON}</span>
        <span class="srctweet-body">
          <div class="srctweet-lab">Tagged from a post${m.challengeHandle?` by <b>@${esc(m.challengeHandle)}</b>`:""}</div>
          <div class="srctweet-link">View the original post on X ↗</div>
        </span>
      </a>` : ""}
      <div class="take">${esc(m.question)}</div>
      <div class="meta">${metaRowHtml(m,yes)}</div>
      <div class="duel">
        <button class="orow" data-side="yes" style="--fill:${yes}%" aria-label="Yes, ${yes} percent, pays ${fmtMult(yes)}">
          <span class="oside">YES</span>
          <span class="opct"><span class="opct-num" data-to="${yes}">${yes}</span><span class="opct-unit">%</span></span>
          <span class="opay">${fmtMult(yes)}</span>
        </button>
        <button class="orow" data-side="no" style="--fill:${no}%" aria-label="No, ${no} percent, pays ${fmtMult(no)}">
          <span class="oside">NO</span>
          <span class="opct"><span class="opct-num" data-to="${no}">${no}</span><span class="opct-unit">%</span></span>
          <span class="opay">${fmtMult(no)}</span>
        </button>
      </div>
      ${m.community && m.resolutionCriteria ? `<details class="rby"><summary>resolution criteria</summary><p class="rby-body">${esc(m.resolutionCriteria)}</p></details>` : ""}
      ${m.slug===startSlug && m.callers && m.callers.length ? `<div class="callers">
        <div class="callers-lab">Who called it</div>
        <div class="callers-list">${m.callers.map(c=>`
          <div class="caller-row">
            <span class="caller-handle">${c.handle?`@${esc(c.handle)}`:"anonymous caller"}</span>
            <span class="caller-side ${c.side}">${c.side.toUpperCase()}</span>
            <span class="caller-pct">${Math.round(c.pct)}%</span>
          </div>`).join("")}</div>
        ${m.callersTotal>m.callers.length ? `<div class="callers-more">+${m.callersTotal-m.callers.length} more</div>` : ""}
      </div>` : ""}
      ${m.slug===startSlug ? `<button class="challenge" data-challenge type="button">⚔️ Challenge the other side</button>` : ""}
      <div class="picker" id="pick${i}" hidden>
        <div class="amts">
          <button class="amt" data-v="10">10</button>
          <button class="amt" data-v="25">25</button>
          <button class="amt" data-v="50">50</button>
          <button class="amt" data-v="all">All-in</button>
          <input class="amt-in" type="number" min="1" inputmode="numeric" aria-label="custom amount">
        </div>
        <div class="pline" id="pline${i}"></div>
        <div class="pbtns">
          <button class="confirm" id="cf${i}">Confirm</button>
          <button class="pcancel" aria-label="cancel">✕</button>
        </div>
      </div>
      <div class="social" id="soc${i}"></div>
      <div class="nudge" id="nudge${i}"><span class="arrow">↑</span><span>${GESTURE} for the next take</span></div>`;
    card.dataset.slug=m.slug;card.dataset.idx=i;
    // Discovery share: "check this out". The link unfurls to the card, so the
    // text stays light — the question rides along in the preview.
    card.querySelector(".shareico").onclick=(e)=>{e.stopPropagation();
      shareMarket({slug:m.slug,text:`${m.question} · call it 👇`,source:"card",anchor:e.currentTarget});};
    // Challenge the other side: a pre-filled X intent aimed at the party the
    // claim came from (the tweet author, if we know them), else generically
    // framed. Nothing is posted — the compose window opens, they choose to send.
    const chBtn=card.querySelector("[data-challenge]");
    if(chBtn)chBtn.onclick=(e)=>{e.stopPropagation();
      const handle=(m.challengeHandle||"").replace(/^@+/,"");
      const text=(handle?`@${handle} `:"")+"You sound confident. Make the call:";
      xShare(text, `${SHARE_ORIGIN}/m/${m.slug}`, "challenge");
      ev("challenge_click",{slug:m.slug,targeted:!!handle});};
    const [y,nb]=card.querySelectorAll(".orow");
    const picker=card.querySelector("#pick"+i), line=card.querySelector("#pline"+i),
          confirmBtn=card.querySelector("#cf"+i), input=card.querySelector(".amt-in");
    let side=null, amt=10;

    /**
     * Two taps: a side, then Confirm. Everything between them is one line that
     * recomputes live, so the payout math never happens in the user's head.
     * The picker caps at the balance rather than erroring — running out of
     * tokens should read as a state, not a mistake.
     */
    const pct=()=>side==="yes"?yes:no;
    const soc=card.querySelector("#soc"+i);
    /**
     * Which control the user actually pressed, not which one happens to equal
     * the amount. With a balance of 50, `50` and `All-in` are the same number
     * and both used to light up, so "which amount is selected" had two answers.
     * A custom amount lights none of them, which is correct: the input shows it.
     */
    let chosen="10";
    const setAmt=(v)=>{
      let capped=false;
      chosen=String(v);
      if(v==="all")v=balance??1;
      v=Math.max(1,Math.floor(Number(v)||1));
      if(balance!==null&&v>balance){v=Math.max(1,balance);capped=true;}
      amt=v;
      card.querySelectorAll(".amt").forEach(b=>{
        const on=b.dataset.v===chosen;
        b.classList.toggle("on",on);
        b.setAttribute("aria-pressed",String(on));
      });
      if(balance===0){
        line.textContent="Out of tokens — nothing left to put on this one.";
        confirmBtn.disabled=true;return;
      }
      confirmBtn.disabled=false;
      const win=Math.round(amt*100/pct());
      line.textContent=`Put ${amt} → win ${win} if you're right (${(win/amt).toFixed(1)}×)`
        +(capped?" — that's everything you've got":"")
        +(balance!==null&&amt===balance&&!capped?" — all of it":"");
    };
    const openPick=(s,initAmt=10)=>{
      side=s;card.classList.add("picking");
      (s==="yes"?y:nb).classList.add("pick");(s==="yes"?nb:y).classList.add("dim");
      picker.hidden=false;input.value="";
      setAmt(initAmt);
    };
    const closePick=()=>{
      side=null;picker.hidden=true;card.classList.remove("picking");
      y.classList.remove("pick","dim");nb.classList.remove("pick","dim");
    };
    card.querySelectorAll(".amt").forEach(b=>b.onclick=()=>{input.value="";setAmt(b.dataset.v);});
    input.oninput=()=>{if(input.value)setAmt(input.value);};
    card.querySelector(".pcancel").onclick=closePick;

    /** The one true write path: POST the call, then flip the card to its locked
     *  state. Both doors — the 5s auto-commit and the picker's Confirm — land
     *  here, so the locked UI cannot drift between them. */
    const lockedUI=(s,stake,win,crowd,callId,firstEver)=>{
      y.disabled=nb.disabled=true;picker.hidden=true;card.classList.remove("picking");
      // The confirmation snap: fires exactly once, exactly HERE — the single
      // moment a call actually locks in (both the 5s auto-commit and the
      // picker's Confirm funnel through this one function), never on the
      // earlier optimistic tap that a 5s undo can still cancel.
      (s==="yes"?y:nb).classList.add("pick","locked-flash");(s==="yes"?nb:y).classList.add("dim");
      // Promise only what happens: the call is recorded; the market, not us,
      // decides when it means anything. No "we'll tell you who was right".
      soc.textContent=`Locked — ${stake} tokens on ${s.toUpperCase()}, pays ${win}. Settles when the market resolves.`;
      // ...and which side of the room they just joined. Solo action, social fact.
      const slText=crowd?socialLine(s,crowd,s==="yes"?yes:no):"";
      if(slText){
        const sl=document.createElement("div");
        sl.className="socline";
        sl.textContent=slText;
        soc.after(sl);
      }
      // The strong entry point: "I called it — what do you say?" is bet-don't-
      // argue itself. The text names their side; the link carries the market.
      const sb=document.createElement("button");
      sb.className="sharebig";sb.innerHTML=`${SHARE_ICON}<span>Share your call 🔥</span>`;
      // The personal card: mint the owner-only share link, then hand it to the
      // OS sheet. It lands on THEIR timeline — the social layer lives on X.
      sb.onclick=async(e)=>{
        const anchor=e.currentTarget;
        let url;
        if(callId){
          try{const r=await fetch(`${API}/api/position/${callId}/sharelink`,{method:"POST",
            headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
            const j=await r.json();if(j.ok)url=j.url;}catch(e){/* generic link still shares */}
        }
        // Short, confident, challenge-toned — matching the "make the call" voice
        // everywhere else, not a dry status readout. The link rides separately
        // (native share / the X intent both append it), so the ↓ just cues that
        // it's coming right after.
        shareMarket({slug:m.slug,text:`${s.toUpperCase()} at ${s==="yes"?yes:no}%. prove me wrong ↓`,source:"postcall",anchor,url});
      };
      (card.querySelector(".socline")||soc).after(sb);
      // Both post-lock CTAs stack below the locked line in the order a first-
      // timer should meet them: share the call, then (if anonymous) the save-
      // your-balance offer, then (stage 2, below) the tag-teaching moment —
      // each .after() chains off the last, so none of the three ever displaces
      // another; they're just three rows in order, all reachable by scrolling.
      let lastCta=sb;
      // One line, once, only to someone who has not connected. An offer, not a gate.
      if(!auth.accounts.length){
        const up=document.createElement("button");
        up.className="upsell";up.textContent="Connect to save your balance  +100 Oddie Points";
        up.onclick=()=>connectSheet("Keep this call when you switch devices");
        sb.after(up);
        lastCta=up;
      }
      // Stage 2 of onboarding — "now teach them the tag." Only attempted when
      // THIS call was firstEver:true (never on a returning player's calls), and
      // even then the server's claimTagTeachingMoment is the real one-shot gate:
      // best-effort, fire-and-forget, same tolerance as awardParticipation for
      // "this extra doesn't ship, the call itself already did."
      if(firstEver){
        (async()=>{
          try{
            const r=await fetch(`${API}/api/onboarding/tag-teaching-seen`,{method:"POST",
              headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
            const j=await r.json().catch(()=>({}));
            if(!j.show)return;
            const teach=document.createElement("div");
            teach.className="onboard-teach";
            teach.innerHTML=`<p class="onboard-teach-body">🎉 First call locked. Now the real move: markets here are born from X — tag <b>@oddiefun</b> under any claim and earn <b>+50</b> when it becomes a market.</p>
              <a class="onboard-teach-cta" href="https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}" target="_blank" rel="noopener">
                <span class="glyphx">𝕏</span> Tag @oddiefun on X</a>`;
            lastCta.after(teach);
          }catch(e){/* the teaching moment just doesn't fire; the call itself already locked */}
        })();
      }
      // The continuous-play loop — Home only; `homeLoop` is undefined on the
      // swipe Feed, where "next" already means "swipe", not "tap a preview".
      // Anchored off `card` itself, NOT `lastCta`: share/connect/teach are all
      // inserted INSIDE the card's own div (siblings of `soc`, a descendant of
      // `card`), which is right for them — they're part of this card's locked
      // state. The next-call preview (and the full card it later swaps into)
      // must NOT nest inside there too, or the next market renders trapped
      // inside the previous card's rounded border instead of appearing below
      // it. `card.after(...)` inserts as a sibling of `card` in the section,
      // landing right after this whole card — CTAs included — same position
      // it would occupy if it had simply been the next card in the section.
      if(homeLoop){
        const chainCount=homeLoop.chainCount;
        const nextM=chainCount<homeLoop.ctx.cap?homeLoop.ctx.pull():null;
        if(!nextM)renderFeedFallback(card);
        // Cadenced tag reminder instead of the usual preview — see
        // HOME_TAG_REMINDER_CADENCE. The cap check above always wins: this
        // never fires on the last slot, where there's nothing left to
        // "keep playing" into anyway.
        else if(chainCount%HOME_TAG_REMINDER_CADENCE===0)renderTagReminderInterstitial(card,nextM,homeLoop,chainCount);
        else renderNextCallPreview(card,nextM,homeLoop,chainCount);
      }
      card.querySelector("#nudge"+i).classList.add("show");
      card.querySelector("#nudge"+i).classList.remove("hint");
    };
    const placeNow=async(s,stake,fromPicker)=>{
      try{
        const r=await fetch(`${API}/api/market/${m.slug}/call`,{method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({side:s,tokens:stake,deviceId})});
        const j=await r.json().catch(()=>({}));
        // Put an honest reason where the user is looking: the picker line if the
        // picker's open, the social slot for a one-tap. Re-arm the controls so the
        // person can act on what we just told them.
        const reopen=()=>{
          if(fromPicker){confirmBtn.disabled=false;confirmBtn.textContent="Confirm";}
          else{y.disabled=nb.disabled=false;y.classList.remove("pick","dim");nb.classList.remove("pick","dim");}
        };
        const failLine=(txt,keepConfirmOff)=>{
          reopen();
          if(fromPicker){line.textContent=txt;if(keepConfirmOff)confirmBtn.disabled=true;}
          else soc.textContent=txt;
        };
        if(!r.ok||!j.ok){
          // The call did not go through. A one-tap optimistically deducted the
          // stake up front; give it back before we render why. (insufficient
          // overwrites this with the server's authoritative balance just below.)
          if(!fromPicker){balance=(balance??0)+stake;paintBalance();}
          // Not on the list / free taste spent — this IS the gate moment. Bring it
          // forward in place, not a picker that quietly fails.
          if(j.reason==="not_allowed"){
            picker.hidden=true;card.classList.remove("picking");
            y.disabled=nb.disabled=true;
            soc.className="social gatecard";
            soc.innerHTML=terminalGateInner();wireTerminalGate(soc);
            ev("gate_shown",{via:"taste_used",slug:m.slug,reason:GATE.reason});
            return;
          }
          // Not enough tokens — never "try again" (trying again can't make tokens).
          // Say the true number and when the next top-up lands.
          if(j.reason==="insufficient"){
            balance=j.balance;paintBalance(true);
            const when=topUpWhen(nextTopUpMs);
            if(balance>0){
              if(fromPicker){setAmt(Math.min(stake,balance));confirmBtn.textContent="Confirm";
                line.textContent=`Only ${balance} left — pick that or less. Next +200 in ${when}.`;
                confirmBtn.disabled=false;}
              else failLine(`That left you ${balance}. Tap again to call with what you've got.`);
            }else{
              failLine(`Out of tokens — next +200 in ${when}. Sell an open call to free some up now.`,true);
            }
            return;
          }
          // Structural refusals — the market, not the network. Trying again changes
          // nothing, so don't promise it will.
          if(j.reason==="unpriced"){
            failLine("This one isn't quoted right now — the odds moved to the edge. Try another market.");
            return;
          }
          if(j.reason==="unknown-market"||r.status===404){
            failLine("This market just closed — it's no longer taking calls.");
            return;
          }
          // A 5xx or an unreadable body is a server-side hiccup — genuinely
          // transient, the one refusal where "try again" is the honest answer.
          if(r.status>=500||!j.reason){
            failLine("Something went wrong on our end — give it a moment and try again.");
            return;
          }
          // Some other named refusal we didn't special-case: surface the server's
          // own words if they're human, else an honest structural note.
          failLine(j.error&&j.error.length<90?j.error:"Couldn't lock it — the market won't take that call.");
          return;
        }
        balance=j.balance;paintBalance(true);loadBalance();
        lockedUI(s,stake,Math.round(stake*100/j.pctAt),j.crowd,j.id,j.firstEver===true);
        ev("amount_confirm",{slug:m.slug,idx:i,side:s});
      }catch(e){
        // The only genuinely transient failure: we never reached the server or
        // couldn't read it. This is the one place "try again" is the truth.
        console.error(e);
        if(!fromPicker){balance=(balance??0)+stake;paintBalance();
          y.disabled=nb.disabled=false;y.classList.remove("pick","dim");nb.classList.remove("pick","dim");
          soc.textContent="Couldn't reach the server — check your connection and try again.";}
        else{confirmBtn.disabled=false;confirmBtn.textContent="Confirm";
          line.textContent="Couldn't reach the server — check your connection and try again.";}
      }
    };

    confirmBtn.onclick=()=>{
      confirmBtn.disabled=true;confirmBtn.textContent="Locking…";
      placeNow(side,amt,true);
    };

    /**
     * ONE TAP, DONE. The data said the picker was losing the most engaged
     * visitors: two side_taps, zero confirms, both abandoned within seconds —
     * not deliberating an amount, walking away from a second decision. So the
     * default path makes the call immediately at a default stake, shows the
     * result with a 5s undo, and the amount picker becomes opt-in ("change
     * amount"). Undo is honest by construction: the POST only fires when the
     * window closes (or the page is left mid-window, via sendBeacon), so an
     * undone call never existed anywhere.
     */
    const DEFAULT_STAKE=50;
    let pending=null; // {s, stake, left, timer, beacon}
    const clearPendingUI=()=>{
      y.classList.remove("pick","dim");nb.classList.remove("pick","dim");
      soc.textContent="";
    };
    const cancelPending=(refund=true)=>{
      if(!pending)return;
      clearInterval(pending.timer);PENDING_CALLS.delete(pending.beacon);
      if(refund){balance=(balance??0)+pending.stake;paintBalance();}
      pending=null;
    };
    const commitPending=()=>{
      if(!pending)return;
      const {s,stake}=pending;
      clearInterval(pending.timer);PENDING_CALLS.delete(pending.beacon);
      pending=null;
      placeNow(s,stake,false);
    };
    const pendingUI=()=>{
      const {s,stake,left}=pending;
      // The SAME payout math the locked state uses (stake * 100 / entry price),
      // shown here — during the undo window, before anything is final — so the
      // upside is visible at the moment of decision rather than only after it.
      // This used to open "Locked — …", which read as already-committed even
      // though the whole point of this window is that it isn't yet.
      const win=Math.round(stake*100/(s==="yes"?yes:no));
      soc.innerHTML=`<span class="prepay"><b>${stake} points → wins ${win}</b> if ${s.toUpperCase()} is right`
        +` <span class="prepay-mult">(${(win/stake).toFixed(1)}×)</span></span>`
        +`<button class="undo">undo (${left})</button>`
        +`<button class="chgamt">change amount</button>`;
      soc.querySelector(".undo").onclick=()=>{cancelPending();clearPendingUI();};
      soc.querySelector(".chgamt").onclick=()=>{
        const stakeNow=pending.stake;
        cancelPending();soc.textContent="";
        openPick(s,stakeNow); // the old flow, now opt-in, seeded with the default
      };
    };
    const startPending=(s)=>{
      const stake=Math.min(DEFAULT_STAKE,balance??DEFAULT_STAKE);
      if(!Number.isFinite(stake)||stake<1){ // out of tokens: the picker explains, honestly
        ev("side_tap",{slug:m.slug,idx:i,side:s});openPick(s);return;
      }
      balance-=stake;paintBalance();
      (s==="yes"?y:nb).classList.add("pick");(s==="yes"?nb:y).classList.add("dim");
      const beacon={slug:m.slug,side:s,tokens:stake};
      pending={s,stake,left:5,beacon,timer:null};
      PENDING_CALLS.add(beacon);
      pendingUI();
      pending.timer=setInterval(()=>{
        if(!pending)return;
        pending.left--;
        if(pending.left<=0)commitPending();
        else pendingUI();
      },1000);
      ev("side_tap",{slug:m.slug,idx:i,side:s});
    };

    const tap=(s)=>{
      if(y.disabled)return;
      // No rope: any tap proceeds to a vote. Anonymous visitors play with their
      // free points; the server never blocks a call. (The waitlist CTA that used
      // to sit here is gone — a seeded reply link is playable on the first tap.)
      if(card.classList.contains("picking")){ // picker open: switching sides in place, as before
        if(side===s)return;
        const keep=amt;closePick();openPick(s,keep);
        ev("side_tap",{slug:m.slug,idx:i,side:s});
        return;
      }
      if(pending){
        if(pending.s===s)return;      // same side again: the 5s clock keeps running
        cancelPending();clearPendingUI();
      }
      try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}   // tactile confirm on select
      startPending(s);
    };
    y.onclick=()=>tap("yes");
    nb.onclick=()=>tap("no");
    return card;
}

/* ------------------------------------------------- first-visit guided tour --
 * Three steps, in-page, once ever per device. Each step dims the page and
 * spotlights ONE real element that is already on screen — no mock UI, no
 * separate window, and the page underneath never moves except to scroll the
 * target into view. The server's claimGuidedTour is the only gate that decides
 * "has this device toured" (see /api/onboarding/tour-seen); this file just
 * renders whatever that says.
 *
 * Each target is resolved lazily, at the moment its step runs, rather than
 * captured up front: Home renders asynchronously and a step's element may not
 * exist at all (a cold instance with no featured markets has no card to point
 * at). A missing target skips its step instead of stranding the tour on an
 * empty spotlight.
 */
const TOUR_STEPS=[
  { find:()=>document.querySelector(".homewrap .card"),
    text:"This is a live claim. <b>Pick a side.</b>" },
  { find:()=>document.getElementById("bal")||document.querySelector(".bal"),
    text:"Calls cost points. Win them back and more when you're right." },
  { find:()=>document.querySelector(".herocta"),
    text:"The real move: tag <b>@oddiefun</b> under any claim on X — <b>+50</b> when it becomes a market." },
];

function runGuidedTour(){
  const scroller=document.getElementById("scroller");
  const catcher=document.createElement("div");catcher.className="tour-catch";
  const ring=document.createElement("div");ring.className="tour-ring";
  const tip=document.createElement("div");tip.className="tour-tip";
  // Four dim panels (top/right/bottom/left of the target) rather than one
  // panel with a hole punched in it — see .tour-mask for why.
  const masks=[0,1,2,3].map(()=>{
    const m=document.createElement("div");m.className="tour-mask";
    document.body.appendChild(m);return m;
  });
  document.body.appendChild(catcher);
  document.body.appendChild(ring);
  document.body.appendChild(tip);

  let idx=0, current=null, done=false;
  const PAD=8;
  const end=()=>{
    if(done)return; done=true;
    window.removeEventListener("resize",reposition);
    masks.forEach((m)=>m.remove());
    catcher.remove();ring.remove();tip.remove();
  };
  const reposition=()=>{ if(current&&current.isConnected)paint(); };
  const box=(el,left,top,width,height)=>{
    el.style.left=`${left}px`;el.style.top=`${top}px`;
    el.style.width=`${Math.max(0,width)}px`;el.style.height=`${Math.max(0,height)}px`;
  };

  const paint=()=>{
    const r=current.getBoundingClientRect();
    const W=window.innerWidth, H=window.innerHeight;
    // The gap the four panels leave open, clamped to the viewport so a target
    // flush against an edge doesn't produce a negative-size panel.
    const gt=Math.max(0,r.top-PAD), gl=Math.max(0,r.left-PAD);
    const gb=Math.min(H,r.bottom+PAD), gr=Math.min(W,r.right+PAD);
    box(masks[0], 0,  0,  W,      gt);        // above
    box(masks[1], 0,  gb, W,      H-gb);      // below
    box(masks[2], 0,  gt, gl,     gb-gt);     // left
    box(masks[3], gr, gt, W-gr,   gb-gt);     // right
    box(ring, gl, gt, gr-gl, gb-gt);
    const isLast=idx===TOUR_STEPS.length-1;
    tip.innerHTML=`<p class="tour-step">Step ${idx+1} of ${TOUR_STEPS.length}</p>
      <p class="tour-text">${TOUR_STEPS[idx].text}</p>
      <div class="tour-row">
        <button class="tour-skip" type="button" aria-label="Skip the tour">✕ skip</button>
        <button class="tour-next" type="button">${isLast?"start playing →":"next"}</button>
      </div>`;
    tip.querySelector(".tour-skip").onclick=end;
    tip.querySelector(".tour-next").onclick=()=>{ idx++; idx<TOUR_STEPS.length?show():end(); };
    // Below the spotlight when it fits, else above it — measured AFTER the
    // innerHTML swap so offsetHeight reflects this step's actual text length.
    const h=tip.offsetHeight, below=r.bottom+PAD+12;
    tip.style.top=`${below+h<window.innerHeight-12?below:Math.max(12,r.top-PAD-12-h)}px`;
    tip.style.left=`${Math.min(Math.max(12,r.left-PAD),Math.max(12,window.innerWidth-tip.offsetWidth-12))}px`;
  };

  const show=()=>{
    // Skip past any step whose target isn't on this page.
    while(idx<TOUR_STEPS.length&&!TOUR_STEPS[idx].find())idx++;
    if(idx>=TOUR_STEPS.length)return end();
    current=TOUR_STEPS[idx].find();
    // Bring it into view before measuring. Instant, not smooth: the spotlight
    // is positioned from a rect measured one frame later, and a 500ms smooth
    // scroll would still be moving when that measurement happens.
    const r=current.getBoundingClientRect();
    const before=scroller?scroller.scrollTop:0;
    if(scroller&&scroller.contains(current)&&(r.top<80||r.bottom>window.innerHeight-40)){
      scroller.scrollTop+=r.top-window.innerHeight*0.3;
    }
    // If the page moved, jump the ring rather than gliding it — see .nojump.
    const moved=scroller&&scroller.scrollTop!==before;
    const anim=[...masks,ring];
    if(moved)anim.forEach((el)=>el.classList.add("nojump"));
    requestAnimationFrame(()=>{
      paint();
      // Restore the glide one frame AFTER the jump has been painted, so the
      // next non-scrolling step still animates between targets.
      if(moved)requestAnimationFrame(()=>anim.forEach((el)=>el.classList.remove("nojump")));
    });
  };

  window.addEventListener("resize",reposition);
  show();
}

/** Ask the server whether this device has ever been toured; run it if not.
 *  Only ever called for a device /api/home already reported as newUser, so the
 *  two gates are AND-ed: "new enough to tour" and "not toured yet". */
async function maybeGuidedTour(){
  try{
    const r=await fetch(`${API}/api/onboarding/tour-seen`,{method:"POST",
      headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
    const j=await r.json().catch(()=>({}));
    if(j.show)runGuidedTour();
  }catch(e){/* no tour this load; nothing else depends on it */}
}

/* ------------------------------------------------------------------ home --
 * The new default at "/". Sells the product's actual chain — claim -> tag ->
 * call -> opponent -> resolution -> receipt -> reputation — instead of opening
 * on a market catalog. No gate, no extra step: this screen IS the onboarding.
 */
async function renderHome(){
  paintNav("");         // home isn't one of the 5 nav destinations — none highlighted
  homeTop();
  const scroller=document.getElementById("scroller");
  scroller.classList.remove("snap");
  // Home always opens at the top — no exceptions. Some browsers (iOS Safari and
  // in-app webviews especially) restore a prior scroll offset on a fresh load of
  // "/"; force both the internal scroller AND the window itself before anything
  // else runs, so the hero is what a first tap of a shared link actually sees.
  scroller.scrollTop=0; window.scrollTo(0,0);
  scroller.innerHTML='<div class="state">loading…</div>';
  await loadBalance().catch(()=>{}); // balance pill + streak badge, same as everywhere
  try{
    const cr=await fetch(`${API}/api/claim?deviceId=${encodeURIComponent(deviceId)}`);
    if(cr.ok)claim=await cr.json();
  }catch(e){/* claim strip just won't render; nothing else depends on it */}
  // Every data-driven section starts EMPTY and is rendered only if the server
  // actually sent rows for it — so a fetch failure, a cold database, or a
  // genuinely thin product all degrade to the section being absent. Nothing
  // here has a placeholder or a sample row to fall back to, by design.
  let featured=[], settled=[], topCallers=[], activity=null, openCalls=null, surfaceReward=50, newUser=false, featuredShown=4; // 50/4 are only pre-fetch placeholders; the block below always prefers the live values
  try{
    // deviceId unlocks the one PERSONAL section (openCalls) — every other
    // section on Home is aggregate and renders the same for anyone.
    const r=await fetch(`${API}/api/home?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok){const j=await r.json();
      // `featured` now carries MORE than the visible section shows (see
      // HOME_FEATURED_POOL server-side) — featuredShown is where the visible
      // slice ends and the continuous-play loop's reserve begins; see the
      // featured section below.
      featured=Array.isArray(j.featured)?j.featured:[];
      settled=Array.isArray(j.settled)?j.settled:[];
      topCallers=Array.isArray(j.topCallers)?j.topCallers:[];
      activity=j.activity&&typeof j.activity==="object"?j.activity:null;
      openCalls=j.openCalls&&typeof j.openCalls==="object"?j.openCalls:null;
      newUser=j.newUser===true;
      if(typeof j.surfaceReward==="number")surfaceReward=j.surfaceReward;
      if(typeof j.featuredShown==="number"&&j.featuredShown>0)featuredShown=j.featuredShown;}
  }catch(e){/* every section degrades to absent, not an error state */}

  const wrap=document.createElement("div");wrap.className="homewrap";
  wrap.innerHTML=`<div class="hero">
      <h1 class="herotitle">Tag it. Make the call.<br>See who was right.</h1>
      <p class="herosub">tag <b>@oddiefun</b> under any claim on X — it turns into a market that keeps score</p>
      <p class="incentivebig"><span class="ptsnum">+${surfaceReward}</span> points every time your tag becomes a market</p>
      <a class="herocta" href="https://x.com/intent/tweet?text=${encodeURIComponent("@oddiefun ")}" target="_blank" rel="noopener">
        <span class="glyphx">𝕏</span> Tag @oddiefun on X</a>
    </div>`;

  // An active claim streak, as its own badge above the claim strip. Farmers grind
  // streaks, and buried in the claim card's grey sub-line it was easy to miss.
  // Rendered only for a REAL streak of at least a day; the claim card is told to
  // stop repeating it so the same fact isn't stated twice in adjacent elements.
  const streakWrap=document.createElement("div");streakWrap.className="streakwrap";
  const paintStreak=(st)=>{
    const n=st||0;
    streakWrap.innerHTML=n>0?`<span class="streakpill">🔥 ${n}-day streak</span>`:"";
    streakWrap.hidden=!(n>0);
  };
  paintStreak(claim&&claim.streak);
  if(claim)wrap.appendChild(streakWrap);

  // The daily-claim strip is a retention hook, not onboarding — it belongs on
  // every screen, home included. (The tag-instruction banner is deliberately
  // NOT reused here: the hero above already carries that exact message.)
  // Claiming can start a streak (0 -> 1 day), so the pill repaints on claim.
  if(claim)wrap.appendChild(claimCard({streakShownAbove:true,onClaimed:paintStreak}));

  // "Your open calls" — the Zeigarnik hook: an unresolved prediction, visible
  // the moment they land, is a reason to come back that the daily claim isn't.
  // Hidden entirely with zero open positions — never "0 open calls" theatre.
  if(openCalls&&openCalls.count>0){
    const bare=openCalls.nextCloseAt?closesIn(openCalls.nextCloseAt).replace(/^closes in /,""):null;
    // "closing" is closesIn()'s own wording for "past due, not yet swept" — a
    // stale duration reads worse than just omitting the clause here.
    const nextClause=bare&&bare!=="closing"?` · next one resolves in ${esc(bare)}`:"";
    const row=document.createElement("a");row.className="opencalls";row.href="#/positions";
    row.innerHTML=`<span class="oc-ico">🎯</span>
      <span class="oc-text">You have <b>${openCalls.count}</b> open call${openCalls.count===1?"":"s"}${nextClause}</span>
      <span class="oc-arrow">→</span>`;
    wrap.appendChild(row);
  }

  // Live activity, Recently settled, Top callers, and the featured/first-call
  // markets are each built into a DETACHED fragment below (never appended to
  // `wrap` directly) so the SAME section-building code can be placed in either
  // order without duplicating a single line of it — only the final append
  // sequence, right before the how-it-works footer, differs by `newUser`.
  const section=(target,text,id,cls)=>{const p=document.createElement("p");p.className=cls?`psec ${cls}`:"psec";p.textContent=text;if(id)p.id=id;target.appendChild(p);};

  // Live activity — real counters over the rolling last 24h. Any counter that is
  // zero is dropped rather than shown as "0", and if none survive the strip
  // never enters the DOM: at genuinely low volume this shows less, never
  // something invented. Numbers count up on first paint.
  const counters=activity?[
    ["marketsOpen","markets open"],
    ["callsToday","calls today"],
    ["pointsWonToday","points won today"],
  ].map(([k,label])=>({label,n:Number(activity[k])||0})).filter(c=>c.n>0):[];
  let livestripEl=null;
  if(counters.length){
    livestripEl=document.createElement("div");livestripEl.className="livestrip";
    livestripEl.innerHTML=counters.map(c=>
      `<div class="lsi"><span class="lsi-n" data-to="${c.n}">0</span><span class="lsi-k">${esc(c.label)}</span></div>`).join("");
    // Deferred to after the swap into the document — countUp drives rAF against
    // a live element, and the wrap isn't attached yet at this point.
    queueMicrotask(()=>livestripEl.querySelectorAll(".lsi-n").forEach(el=>
      countUp(el,Number(el.dataset.to),{duration:800})));
  }

  // PROOF: the loop completing (Recently settled) and a competition existing
  // (Top callers). For a RETURNING player these lead the page, right after the
  // stats strip — the hero promises "see who was right", and this is what
  // actually demonstrates it. For a brand-new visitor (newUser) these move
  // below the first-call section instead: proof and social layers land better
  // AFTER a first action, not before it — see the append order below.

  // 1. Recently settled: the loop completing. Question, verdict, who was right.
  //    Each card ends with a bridge into playing — the moment the proof lands is
  //    the moment a spectator is most likely to take a side themselves.
  let settledFrag=null;
  if(settled.length){
    settledFrag=document.createDocumentFragment();
    section(settledFrag,"Recently settled");
    settled.forEach((s)=>{
      const card=document.createElement("div");
      card.className=`stl ${s.outcome}`;
      // Winners are pre-sorted by the odds they took (best call first) and
      // pre-capped server-side; winnerTotal carries the real count for "+N more".
      const wins=s.winners.map(w=>
        `<div class="stl-win">${w.handle?`<b>@${esc(w.handle)}</b>`:"anonymous caller"} called ${w.side.toUpperCase()} at ${Math.round(w.pct)}% <span class="tick">✓</span></div>`).join("");
      const more=s.winnerTotal>s.winners.length
        ? `<div class="stl-win">+${s.winnerTotal-s.winners.length} more called it right</div>` : "";
      // Nobody right is a real outcome and reads better than an empty block.
      const body=s.winnerTotal
        ? `<div class="stl-wins">${wins}${more}</div>`
        : (s.callers?`<div class="stl-wins"><div class="stl-none">nobody called this one right</div></div>`:"");
      // The bridge goes to the open markets on THIS page when there are any, and
      // falls through to the feed when there aren't. Its href is always the feed
      // so it behaves like a real link (middle-click, right-click); the smooth
      // scroll is a click-time upgrade, never a hash change — the router would
      // treat a hash as a view and navigate away.
      card.innerHTML=`
        <div class="stl-head">
          <span class="stl-out">RESOLVED ${s.outcome.toUpperCase()}</span>
          <span class="stl-when">${agoOf(s.settledAt)}</span>
        </div>
        <a class="stl-q" href="/m/${encodeURIComponent(s.slug)}">${esc(s.question)}</a>
        ${body}
        <a class="stl-cta" href="/feed">make your own call →</a>`;
      card.querySelector(".stl-cta").onclick=(e)=>{
        // #openmarkets is looked up on `wrap` (not the now-detached fragment it
        // was built from) — by click time everything below has already landed
        // in the document, in whichever order this render chose.
        const target=wrap.querySelector("#openmarkets");
        if(!target)return;           // no open markets on the page — let /feed happen
        e.preventDefault();
        scrollToEl(document.getElementById("scroller"),target);
      };
      settledFrag.appendChild(card);
    });
  }

  // 2. Top callers: a competition exists. Rank/handle/edge — the same three
  // columns the full Leaderboard's primary board shows, so the teaser and the
  // page it links to can never disagree. The server sends [] when NO caller is
  // ranked yet; one ranked caller is enough to render, because "here is the
  // person to beat" is a real competition even with a single name in it.
  let topFrag=null;
  if(topCallers.length){
    topFrag=document.createDocumentFragment();
    section(topFrag,"Top callers");
    // Hash route, same as the nav buttons — a real href so it middle-clicks and
    // right-clicks like a link, no JS interception needed.
    const box=document.createElement("a");box.className="topc";box.href="#/leaderboard";
    box.innerHTML=topCallers.map(r=>`
      <div class="topc-r">
        <div class="topc-rank">${r.rank}</div>
        <div class="topc-who">@${esc(r.handle)}</div>
        <div class="topc-edge">${pts(r.avgEdge)}<small>${r.closed} closed</small></div>
      </div>`).join("");
    topFrag.appendChild(box);
    const more=document.createElement("a");more.className="topc-more";more.href="#/leaderboard";
    more.textContent="climb the board →";
    topFrag.appendChild(more);
  }

  // "Open markets": a handful of live markets, tappable right there — the SAME
  // card + interaction code the feed uses (buildCard), so YES/NO here behaves
  // identically. Used to be a single "Daily Call" slot, which read as
  // unfinished (one market, and mislabeled "Community" when its real topic was
  // Sports) — now up to 4, each with its real topic badge (buildCard already
  // prefers topicCategory over the flattened category). The label says exactly
  // what these are: it used to read "Live right now", which promised urgency
  // that a market closing in five weeks does not have.
  let featuredFrag=null;
  if(featured.length){
    featuredFrag=document.createDocumentFragment();
    // Stage 1 of onboarding: a visitor with zero calls, ever, gets directional
    // emphasis toward the lowest-friction first action — the header names the
    // action instead of the section, and the first card gets a restrained glow
    // (see .firstcall-cue). No modal, nothing blocking; a returning player
    // (newUser===false) sees the exact same section as always. Placement is
    // ALSO keyed off this same `newUser` flag, below — the cue and the
    // reorder are never allowed to disagree about who's new.
    // The id is the settled cards' scroll target — see the .stl-cta handler.
    section(featuredFrag,newUser?"Make your first call ↓":"Open markets","openmarkets",newUser?"cue":"");
    // Only the first `featuredShown` are ever VISIBLE as their own cards —
    // the rest is the continuous-play loop's reserve pool (see
    // HOME_FEATURED_POOL server-side): lock a call on any visible card and
    // "Next call" pulls from here instead of sending the user to Feed.
    const visible=featured.slice(0,featuredShown);
    const pool=featured.slice(featuredShown);
    // Shared by reference across every visible card, so whichever one the
    // user actually locks first draws from ONE pool — a market already
    // sitting visible elsewhere on the page is pre-marked used, so the loop
    // can never hand back a duplicate of a card that's still right there.
    const usedSlugs=new Set(visible.map(x=>x.slug));
    let poolIdx=0,nextIdxCounter=featuredShown;
    const loopCtx={
      cap:HOME_LOOP_CAP,
      pull(){
        while(poolIdx<pool.length){
          const cand=pool[poolIdx++];
          if(!usedSlugs.has(cand.slug)){usedSlugs.add(cand.slug);return cand;}
        }
        return null;
      },
      nextIdx(){return nextIdxCounter++;},
    };
    visible.forEach((m,i)=>{
      const card=buildCard(m,i,{ctx:loopCtx,chainCount:1});
      if(newUser&&i===0)card.classList.add("firstcall-cue");
      // "swipe for the next take" doesn't apply — this is a short static list,
      // not a swipeable feed. Suppress it via a permanent inline !important
      // rather than removing the node: lockedUI unconditionally looks it up by
      // id after a call locks in, and a missing element there would throw
      // (silently swallowed by the pending-commit catch, which would then
      // wrongly claim "couldn't reach the server").
      card.querySelector(".nudge")?.style.setProperty("display","none","important");
      featuredFrag.appendChild(card);
    });
  }

  // The actual placement decision — everything above just BUILT sections, none
  // of it has touched `wrap` yet. A brand-new visitor gets the lowest-friction
  // action (the cued first call) immediately after the hero/claim strip they
  // already saw; stats/proof/social move below it. A returning player keeps
  // today's order — proof and social lead, since they already know the loop.
  if(newUser){
    if(featuredFrag)wrap.appendChild(featuredFrag);
    if(livestripEl)wrap.appendChild(livestripEl);
    if(settledFrag)wrap.appendChild(settledFrag);
    if(topFrag)wrap.appendChild(topFrag);
  }else{
    if(livestripEl)wrap.appendChild(livestripEl);
    if(settledFrag)wrap.appendChild(settledFrag);
    if(topFrag)wrap.appendChild(topFrag);
    if(featuredFrag)wrap.appendChild(featuredFrag);
  }

  // The three-beat "how it works" — icons + a few words each, no paragraphs.
  const how=document.createElement("div");how.className="howitworks";
  how.innerHTML=`<div class="howstep"><span class="howico">🏷️</span><span>tag a claim</span></div>
    <div class="howarrow">→</div>
    <div class="howstep"><span class="howico">☝️</span><span>make the call</span></div>
    <div class="howarrow">→</div>
    <div class="howstep"><span class="howico">🏆</span><span>see who was right</span></div>`;
  wrap.appendChild(how);

  // The feed is a destination now, not the default — one quiet link down.
  const browse=document.createElement("a");browse.className="browselink";browse.href="/feed";
  browse.textContent="browse all markets →";
  wrap.appendChild(browse);

  scroller.innerHTML="";
  scroller.appendChild(wrap);
  // A fast, staggered rise+fade down the page on first paint — the one motion
  // cue that says "designed", not "just appeared". Capped stagger so a long
  // page never reads as sluggish.
  [...wrap.children].forEach((el,idx)=>{el.classList.add("enter");el.style.animationDelay=`${Math.min(idx*55,220)}ms`;});
  // Re-assert the top after the swap: replacing innerHTML can itself nudge a
  // scroll position mid-layout on some engines, so this is the belt to the
  // suspenders above, not a duplicate of it.
  scroller.scrollTop=0; window.scrollTo(0,0);

  // First-visit guided tour — only for a device the server just told us is
  // new, and only if it has never been toured (that second gate lives in
  // claimGuidedTour). Deferred past the entrance stagger above so the
  // spotlight measures cards at their settled position, not mid-animation.
  if(newUser)setTimeout(maybeGuidedTour,420);
}

/**
 * Scroll-driven depth: the card at the snap line reads full; every card below it
 * recedes (scale + fade) so the peek is an obvious, layered stack — not a card
 * stranded in empty space. rAF-throttled, one listener per scroller.
 */
let depthRAF=null;
function applyDepth(scroller){
  const cards=scroller.querySelectorAll(".card"); if(!cards.length)return;
  const vh=scroller.clientHeight||window.innerHeight;
  const pad=parseFloat(getComputedStyle(scroller).scrollPaddingTop)||0;
  const activeLine=scroller.getBoundingClientRect().top+pad;
  cards.forEach(card=>{
    const d=card.getBoundingClientRect().top-activeLine;    // 0 at the snap line
    let scale=1, op=1;
    if(d>0){const t=Math.min(1,d/(vh*0.55)); scale=1-0.06*t; op=1-0.5*t;}      // peeking below
    else if(d<0){const t=Math.min(1,-d/(vh*0.5)); scale=1-0.04*t; op=1-0.55*t;} // scrolled above
    card.style.transform=`scale(${scale.toFixed(3)})`;
    card.style.opacity=op.toFixed(3);
  });
}
function bindDepth(scroller){
  applyDepth(scroller);
  if(scroller._depthBound)return; scroller._depthBound=true;
  const onScroll=()=>{ if(depthRAF)return; depthRAF=requestAnimationFrame(()=>{depthRAF=null;applyDepth(scroller);}); };
  scroller.addEventListener("scroll",onScroll,{passive:true});
  window.addEventListener("resize",onScroll,{passive:true});
}

/**
 * The pivot of the taste flow, now surfaced right after the FIRST card (not the
 * second) so the personalization investment lands before the gate: "what do you
 * have takes on?" — the free signal. Multi-select 1-3 of the five real feed
 * categories, Continue re-ranks the feed toward them. The picks are logged
 * (taste_pick) and stashed in sessionStorage so the reload knows to show the
 * one re-ranked card and, after it, the gate.
 */
function buildPicker(){
  const CATS=["Sports","Crypto","Politics","Culture","Tech"];
  const el=document.createElement("div");
  el.className="card intercard pickcard";
  el.innerHTML=`
    <div class="ititle">what do you have<br>takes on?</div>
    <div class="isub">pick up to 3 — we'll tune your feed</div>
    <div class="tchips">${CATS.map(c=>`<button class="tchip" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <button class="icont" disabled>Continue</button>`;
  const sel=new Set(), cont=el.querySelector(".icont");
  el.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c;
    if(sel.has(c)){sel.delete(c);b.classList.remove("on");}
    else{if(sel.size>=3)return;sel.add(c);b.classList.add("on");}
    cont.disabled=sel.size===0;
    cont.textContent=sel.size?`Continue (${sel.size})`:"Continue";
  });
  cont.onclick=()=>{
    const cats=[...sel];
    try{sessionStorage.setItem("taste_cats",cats.join(","));}catch(e){}
    ev("taste_pick",{cats:cats.join(",")});
    document.getElementById("scroller").scrollTop=0;
    loadFeed(); // reloads with ?cats= -> 1 re-ranked card, then the gate
  };
  return el;
}

/**
 * The gate, as the last card in the taste run. Not a wall dropped in front of
 * the feed — a natural next step reached after a real taste. One line, X first,
 * Google second. gate_shown fires once, when the card is built.
 */
function buildGate(){
  const el=document.createElement("div");
  el.className="card intercard gatecard";
  el.innerHTML=terminalGateInner();
  wireTerminalGate(el);
  ev("gate_shown",{via:"feed",reason:GATE.reason});
  return el;
}

/**
 * Feed depth — the Week-2 metric, instrumented now so Week 1 seeds it.
 *
 * A card counts as viewed when it is mostly on screen, not when it is rendered:
 * all forty are in the DOM from the start, so "rendered" would report every
 * session as forty cards deep. The observer fires once per card per render;
 * switching category re-renders and legitimately starts the count over, because
 * the index means "how far into THIS list".
 */
// Odds count up rather than snapping — the number settles into place as the card
// arrives. Once per number; respects reduced-motion.
const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function animateOdds(card){
  card.querySelectorAll(".opct-num").forEach(el=>{
    if(el.dataset.done)return; el.dataset.done="1";
    const to=Number(el.dataset.to)||0;
    if(REDUCED_MOTION){el.textContent=to;return;}
    // Count from an even 50 so YES and NO stay complementary while they settle —
    // the pair reads as odds resolving from even, never a momentary "doesn't add up".
    const from=50; el.textContent=from;
    const dur=560, t0=performance.now();
    const tick=(t)=>{const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);
      el.textContent=Math.round(from+(to-from)*e);
      if(p<1)requestAnimationFrame(tick);else el.textContent=to;};
    requestAnimationFrame(tick);
  });
}
function watchDepth(scroller){
  if(!("IntersectionObserver" in window))return;   // depth goes unmeasured, feed still works
  const seen=new Set();
  const io=new IntersectionObserver(entries=>{
    for(const e of entries){
      if(!e.isIntersecting)continue;
      animateOdds(e.target);                        // count the odds up as the card lands
      const idx=Number(e.target.dataset.idx);
      if(seen.has(idx))continue;
      seen.add(idx);
      ev("card_view",{slug:e.target.dataset.slug,idx});
    }
  },{root:scroller,threshold:.55});
  scroller.querySelectorAll(".card").forEach(c=>io.observe(c));
}

/**
 * Before this, the only sign that the feed continued below was a nudge you had
 * to pick a side to see — so the one screen a new arrival actually looks at was
 * the one screen with no way out of it. The first card now says so on its own,
 * quietly, and stops the moment they act on it.
 */
function hintFirstCard(scroller){
  if(hintRetired)return;
  const nudge=scroller.querySelector(".nudge");
  if(!nudge)return;
  nudge.classList.add("show","hint");
  const retire=()=>{
    if(scroller.scrollTop<24)return;   // ignore the snap's own settling jitter
    hintRetired=true;
    nudge.classList.remove("show","hint");
    scroller.removeEventListener("scroll",retire);
  };
  scroller.addEventListener("scroll",retire,{passive:true});
}

/* ---------------------------------------------------------------- shells -- */
function renderShell(view){
  const scroller=document.getElementById("scroller");
  // Positions is REAL — this device's actual calls, no Preview badge. The other
  // three stay mock until something real exists to put in them.
  if(view==="positions"){shellTop("Positions",false);loadPositions(scroller);}
  if(view==="leaderboard"){shellTop("Leaderboard",false);loadLeaderboard(scroller);}
  if(view==="alerts"){shellTop("Notifications",false);loadNotices(scroller);}
  if(view==="profile"){shellTop("Profile",false);loadProfile(scroller);}
}

// Identity block bits shared by the public and private profiles — the trophy
// room. The two-concept model shows the user their Oddie Points and their
// Oddie Score; badges + rank are IDENTITY and STATUS, never a third number.
const BADGE_ICON={founding:"🏛️",streak:"🔥",category:"🎯",rank:"📈"};
// Badges as medallions: a circular icon with a lime medal-sheen, caption below
// — screenshot-friendly the way an achievement screen is, not a flat pill row.
function badgesHtml(badges){
  if(!badges||!badges.length)return "";
  return `<div class="badges">${badges.map(b=>
    `<div class="medal" title="${esc(b.detail||b.label)}"><div class="medal-ico">${BADGE_ICON[b.kind]||"⭐"}</div><div class="medal-lab">${esc(b.label)}</div></div>`
  ).join("")}</div>`;
}
// The Oddie Score hero: a ring/gauge filled to score/1000, the number counted
// up on first paint (see the countUp() call right after each profile renders).
// id="scoreringnum" is safe to reuse across the private/public views — they
// never coexist in the DOM, same convention as #bal elsewhere in this file.
// "+16" / "−12" — a real Unicode minus on the way down, never a bare hyphen,
// so a negative delta reads as a sign rather than a stray dash.
function deltaText(n){return n>=0?`+${n}`:`−${Math.abs(n)}`}
function oscoreHtml(score,hasEnough,rank,weeklyDelta,rankMove){
  const pct=hasEnough&&score!=null?Math.max(0,Math.min(1,score/1000)):0;
  const rankChip=hasEnough&&rank?`<span class="rankpill">🏆 Top ${rank.topPct}% this season</span>`:"";
  // Both lines are ephemeral-feeling but for different reasons: weekly is
  // simply absent with nothing resolved this week (see weeklyScoreDeltaFor);
  // the rank move is a one-shot the server already marked seen by the time
  // this response landed, so it just won't be here again next view.
  const weeklyLine=weeklyDelta?`<div class="oscore-weekly ${weeklyDelta.direction}">${weeklyDelta.direction==="up"?"▲":"▼"} ${deltaText(weeklyDelta.delta)} this week</div>`:"";
  const rankMoveLine=rankMove?`<div class="rankmove ${rankMove.direction}">${rankMove.direction==="up"?"▲":"▼"} you moved ${rankMove.direction} ${rankMove.spots} spot${rankMove.spots===1?"":"s"} → #${rankMove.rank}</div>`:"";
  return `<div class="oscore">
      <div class="scorering" style="--score-pct:${pct}" id="scorering">
        <div class="scorering-inner">
          <div class="scorering-num${hasEnough?"":" building"}" id="scoreringnum">${hasEnough?"0":"building"}</div>
          <div class="scorering-lab">${hasEnough?"ODDIE SCORE":"TRACK RECORD"}</div>
        </div>
      </div>
      <div class="oscore-side">
        <div class="oscore-title">Oddie Score</div>
        <p class="oscore-desc">calibration-adjusted reputation · 500 = matches the market</p>
        ${weeklyLine}
        ${rankChip}
        ${rankMoveLine}
      </div>
    </div>`;
}
// A brief "+16"/"−9" pill pinned to the score ring's corner, fading on its own
// CSS timer (see .score-delta). Skipped under reduced motion — same convention
// as countUp: no motion at all rather than a motionless flash.
function showScoreDeltaChip(ringEl,delta){
  if(!ringEl||!delta||REDUCE_MOTION)return;
  const chip=document.createElement("span");
  chip.className=`score-delta ${delta>=0?"up":"down"}`;
  chip.textContent=deltaText(delta);
  ringEl.appendChild(chip);
  setTimeout(()=>chip.remove(),1800);
}
// The score this browser tab has already SHOWN once this page-load — private
// profile only (see the isMine guard in animateOscore below; a public profile
// can show anyone's score, and comparing it against what this tab last showed
// on ITS OWN profile would be a meaningless, wrong delta). null on a fresh
// load, and again whenever the celebration takeover reports a fresher score,
// so a private-profile view right after a celebration renders the settled
// number plainly instead of re-animating a delta the user just watched happen.
let sessionSeenScore=null;
/** Count the ring's number up to the real score, right after the profile HTML
 *  lands in the DOM. First time this session (or on the public profile, always):
 *  the plain from-zero reveal, as before. On the private profile, a SECOND
 *  reading that differs from what this tab already showed animates old→new
 *  and drops the delta chip — the score visibly moving, not silently updating. */
function animateOscore(scroller,score,hasEnough,isMine){
  if(!hasEnough||score==null)return;
  const el=scroller.querySelector("#scoreringnum");
  if(!isMine||sessionSeenScore==null){
    countUp(el,score,{duration:850});
  }else if(sessionSeenScore!==score){
    countUp(el,score,{duration:850,from:sessionSeenScore});
    showScoreDeltaChip(scroller.querySelector("#scorering"),score-sessionSeenScore);
  }else{
    el.textContent=score;
  }
  if(isMine)sessionSeenScore=score;
}
// Per-category accuracy — supporting detail BELOW the Oddie Score (the primary
// number, shown first). The server already withheld any category short of its
// own resolved-picks threshold, so every row here is qualified by construction:
// nothing to gate client-side, and no placeholder for the categories left out.
// Each row carries a mini progress bar so the % reads visually, not just as text.
function categoryBreakdownHtml(byCategory){
  if(!byCategory||!byCategory.length)return "";
  return `<p class="psec" style="margin-top:22px">By category</p>
    <div class="catbreak">${byCategory.map(c=>
      `<div class="catrow">
         <div class="catrow-top"><span class="catname">${esc(c.category)}</span><span class="catpct">${c.pct}%</span></div>
         <div class="catbar"><div class="catbar-fill" style="width:${c.pct}%"></div></div>
         <span class="catn">${c.resolved} resolved</span>
       </div>`
    ).join("")}</div>`;
}

// --- Public profile page (/@{handle}) — read-only, works fully logged out ----

    <div class="trhead"><p class="psec">Track record</p><button class="trshare" id="pubshare">${SHARE_ICON}<span>Share</span></button></div>
    ${oscoreHtml(acc.oddieScore,acc.hasEnough,rank,acc.weeklyDelta)}
    ${badgesHtml(badges)}
    <div class="trstats">
      <div class="tile"><div class="v">${esc(accVal)}</div><div class="k">ACCURACY</div></div>
      <div class="tile"><div class="v">${acc.streak}${acc.bestStreak>acc.streak?`<span class="best"> · best ${acc.bestStreak}</span>`:''}</div><div class="k">STREAK</div></div>
      <div class="tile"><div class="v topic">${esc(bestTopicVal)}</div><div class="k">BEST TOPIC</div></div>
      <div class="tile"><div class="v">${acc.resolved}</div><div class="k">RESOLVED PICKS</div></div>
    </div>
    ${!acc.hasEnough?`<p class="cnote">🌱 building track record — ${acc.resolved} of ${acc.minResolved} resolved picks. Oddie Score shows at ${acc.minResolved}.</p>`:''}
    ${categoryBreakdownHtml(acc.byCategory)}
    <p class="psec" style="margin-top:22px">Recent calls</p>
    ${calls.length?calls.map(pubCallRow).join(''):'<div class="state">No resolved calls yet.</div>'}
    <div class="pfoot"><p class="disclaimer">Oddie Points are for entertainment only. No deposits, no cash value, no real-money wagering.</p></div>
  </div>`;
  animateOscore(scroller,acc.oddieScore,acc.hasEnough,false);
  const sb=scroller.querySelector("#pubshare");
  if(sb)sb.onclick=()=>{
