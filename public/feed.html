  .dot{width:4px;height:4px;border-radius:50%;background:#C7D3DC;flex:none}
  .status{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:var(--acc-mid);
    background:var(--wash);border-radius:999px;padding:5px 10px}
  .summary{display:flex;gap:10px;margin-bottom:16px}
  .summary .tile{flex:1;margin:0;text-align:center;padding:13px 8px}
  .summary .v{font-size:22px;font-weight:700;line-height:1}
  .summary .k{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted);margin-top:4px}

  /* Accuracy record — the four public reputation stats. Tiles are the fixed
     white .tile, so text is FIXED dark to hold contrast in both themes. */
  .trhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
  .trhead .psec{margin:0}
  .trshare{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#17250a;
    border:1.5px solid rgba(0,0,0,.28);border-radius:999px;padding:6px 13px;
    font-family:'Nunito';font-weight:900;font-size:13px;cursor:pointer}
  .trshare svg{width:15px;height:15px;fill:none;stroke:#17250a;stroke-width:2.2}
  .trshare:active{transform:scale(.96)}
  .trstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .trstats .tile{margin:0;text-align:center;padding:14px 8px}
  .trstats .v{font-size:24px;font-weight:800;line-height:1.05;color:#17250a}
  .trstats .v.topic{font-size:17px}
  .trstats .k{font-family:'Nunito';font-weight:800;font-size:11px;color:#5c6660;margin-top:5px}
  .trstats .best{font-size:11px;font-weight:800;color:#5c6660;white-space:nowrap}
  /* Per-category accuracy — supporting detail below the Oddie Score, one row per
     category that has cleared its own resolved-picks threshold (the same
     "building track record" minimum, applied per category instead of globally).
     A category short of that bar is simply absent — no placeholder, no zero.
     A mini progress bar carries the % visually, not just as a number. */
  .catbreak{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
  .catrow{border:2px solid var(--card-line);border-radius:var(--r-md);
    background:var(--card-surface);padding:11px 14px;box-shadow:var(--shadow-chip)}
  .catrow-top{display:flex;align-items:baseline;gap:8px;font-family:'Nunito';font-weight:800}
  .catrow .catname{flex:1;color:var(--on-ground);font-size:13px}
  .catrow .catpct{color:var(--on-ground);font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
  .catbar{height:6px;border-radius:999px;background:var(--hair-g);margin:8px 0 6px;overflow:hidden}
  .catbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg, var(--acc-mid), var(--accent))}
  .catrow .catn{color:var(--muted-g);font-size:11px;font-weight:700;font-family:'Nunito'}

  /* ---- the trophy room: Oddie Score as a ring/gauge, badges as medallions ---- */
  /* The ring: a conic-gradient donut filled to score/1000, the number counted up
     inside it on first paint. The container drops the old flat-lime block — the
     ring itself now carries the accent, so the surrounding card can be neutral
     and let the ring read as the hero the way a gauge does on a dashboard. */
  .oscore{display:flex;align-items:center;gap:18px;background:var(--card-surface);color:var(--on-ground);
    border:2px solid var(--card-line);border-radius:var(--r-xl);padding:20px;margin-bottom:14px;
    box-shadow:var(--card-shadow)}
  .scorering{position:relative;flex:none;width:112px;height:112px;border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--score-pct,0) * 360deg), var(--hair-g) 0deg);
    box-shadow:var(--shadow-pop)}
  .scorering::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card-surface)}
  .scorering-inner{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .scorering-num{font-size:28px;font-weight:800;line-height:1;color:var(--on-ground);font-variant-numeric:tabular-nums}
  .scorering-num.building{font-size:15px}
  .scorering-lab{font-family:'Nunito';font-size:9px;font-weight:900;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted-g);margin-top:4px}
  .oscore-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
  .oscore-title{font-family:'Fredoka';font-weight:600;font-size:17px;color:var(--on-ground)}
  .oscore-desc{font-family:'Nunito';font-weight:700;font-size:11.5px;line-height:1.4;color:var(--muted-g)}
  /* Season rank — status expressed as a PLACE, a small trophy pill under the
     description rather than crammed into the ring's corner. */
  .rankpill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    font-family:'Nunito';font-weight:900;font-size:12px;color:#5c4300;background:#fff3d6;
    border-radius:999px;padding:5px 12px 5px 9px;box-shadow:var(--shadow-chip)}
  :root[data-theme="dark"] .rankpill{color:#f5cf6b;background:#3a2c05}
  /* This week's Oddie Score motion — a quiet status line, not a headline. Same
     restrained up/down language as the rank-move line below it: an accent tick
     for a gain, muted for a dip, never alarmist red — a loss here is "not this
     time", not a penalty (see .cel-badge.loss). */
  .oscore-weekly{font-family:'Nunito';font-weight:800;font-size:12px}
  .oscore-weekly.up{color:#4d7a1a}
  .oscore-weekly.down{color:var(--muted-g)}
  :root[data-theme="dark"] .oscore-weekly.up{color:var(--accent)}
  /* "you moved up 2 spots -> #14" — shown once (the server consumes it on this
     same read), so it needs no fade timer of its own; it simply isn't there on
     the next view. */
  .rankmove{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--on-ground);
    background:var(--wash);border-radius:10px;padding:6px 10px;margin-top:2px}
  .rankmove.down{color:var(--muted-g);background:transparent;padding:6px 0 0}
  :root[data-theme="dark"] .rankmove{background:#26330f}
  /* The in-session score delta chip — "+16"/"−9" pinned to the ring's corner,
     fading on its own CSS timer. Anchors on .scorering, which is already
     position:relative (the conic-gradient ring), so no extra wrapper is needed
     on either the profile ring or the celebration's bigger #celRing. */
  .score-delta{position:absolute;top:-4px;right:-4px;z-index:2;font-family:'Nunito';font-weight:900;
    font-size:12px;padding:3px 8px;border-radius:999px;box-shadow:var(--shadow-chip);
    pointer-events:none;animation:scoreDeltaFade 1.8s ease forwards}
  .score-delta.up{background:var(--accent);color:#17250a}
  .score-delta.down{background:var(--muted-g);color:var(--card-surface)}
  @keyframes scoreDeltaFade{
    0%{opacity:0;transform:translateY(3px) scale(.92)}
    12%{opacity:1;transform:translateY(0) scale(1)}
    65%{opacity:1}
    100%{opacity:0;transform:translateY(-5px) scale(.96)}
  }
  /* Oddie Points — the spendable play balance, the OTHER of the two user numbers.
     A quiet strip above the identity block so the profile leads with both. */
  .opoints{display:flex;align-items:baseline;gap:9px;border:2px solid var(--card-line);
    border-radius:16px;background:var(--card-surface);padding:12px 16px;margin-bottom:12px}
  .opoints .v{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--on-ground)}
  .opoints .k{font-family:'Nunito';font-size:12px;font-weight:800;color:var(--muted-g)}
  .opoints .k b{font-weight:900;color:var(--on-ground)}
  /* Badges — earned identity as MEDALLIONS, not flat pills: a circular icon with
     a lime medal-sheen + real shadow, caption below. Same visual language as
     home's how-it-works steps (a circle behind an icon), but with more presence
     — these are achievements, not instructions. */
  .badges{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 16px}
  .medal{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;text-align:center}
  .medal-ico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:23px;line-height:1;background:radial-gradient(circle at 32% 26%, #eefccb, var(--accent) 74%);
    border:2.5px solid var(--card-line);box-shadow:var(--shadow-pop)}
  .medal-lab{font-family:'Nunito';font-weight:800;font-size:10.5px;line-height:1.25;color:var(--on-ground)}
  /* Public-profile recent-calls feed: compact rows, a win/loss rail. */
  .pcall{border:2px solid var(--card-line);border-left-width:6px;border-radius:12px;
    background:var(--card-surface);padding:10px 13px;margin-bottom:8px}
  .pcall.win{border-left-color:#0a7d2c}
  .pcall.loss{border-left-color:#b00020}
  .pcall-q{font-family:'Nunito';font-weight:800;font-size:13.5px;line-height:1.35;color:var(--on-ground)}
  .pcall-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-family:'Nunito';font-weight:800;font-size:12px}
  .pcall-side{color:var(--muted-g)}
  .pcall.win .pcall-out{color:#0a7d2c}
  .pcall.loss .pcall-out{color:#b00020}

  /* Transaction history — closed positions as instantly-readable win/loss cards.
     Same chunky-outline white surface as every tile; a coloured left rail and an
     outcome chip carry the verdict at a glance, the numbers back it up. Text is
     pinned to --ink because the surface is white in BOTH themes (contrast lesson). */
  .htile{border:3px solid #000;border-left-width:9px;border-radius:20px;background:#fff;color:var(--ink);
    padding:13px 15px 12px;margin-bottom:11px}
  .htile.won{border-left-color:#0f7b3d} .htile.lost{border-left-color:#b3261e} .htile.sold{border-left-color:#9aa7b2}
  .hhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .hbadge{font-family:'Nunito';font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px;border:2.5px solid #000}
  .hbadge.won{background:#d7f2e0;color:#0b5c2e} .hbadge.lost{background:#f7dbd7;color:#8f1d17} .hbadge.sold{background:#eef3f7;color:#476075}
  .hwhen{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:#7a8894}
  .htile .q{font-size:15px;margin-bottom:9px;color:var(--ink)}
  .hrow2{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-family:'Nunito';font-weight:800;font-size:12.5px;color:#5b6b77}
  .hfoot{display:flex;align-items:center;gap:12px;font-family:'Nunito';font-weight:800;font-size:13px}
  .hio{color:var(--ink);font-variant-numeric:tabular-nums}
  .hshare{margin-left:auto;width:34px;height:34px;flex:none;border:2.5px solid #000;border-radius:50%;
    background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
  .hshare:hover{background:var(--wash)}
  .hshare svg{width:15px;height:15px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* leaderboard */
  .lb{border:3px solid #000;border-radius:22px;overflow:hidden;background:#fff}
  .lb .r{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:2px solid var(--bar)}
  .lb .r:last-child{border-bottom:0}
  .lb .r.you{background:var(--wash)}
  .rank{width:30px;text-align:center;font-family:'Nunito';font-weight:800;font-size:14px;color:var(--muted);flex:none}
  /* `podium`, not `top`: `.top` is the fixed page header, and a rank div wearing
     that class inherits position:fixed;top:0;left:0 and flies to the corner. */
  .rank.podium{width:27px;height:27px;line-height:23px;border-radius:50%;
    background:var(--accent);border:2px solid #000;color:#000;font-size:12.5px}
  .mini{width:34px;height:34px;border-radius:50%;background:var(--accent);border:2px solid #000;position:relative;flex:none}
  .mini::before,.mini::after{content:"";position:absolute;width:6px;height:6px;background:#000;border-radius:50%;top:12px}
  .mini::before{left:7px}.mini::after{left:19px}
  .who{font-family:'Nunito';font-weight:800;font-size:14px}
  .acc{font-family:'Nunito';font-weight:800;font-size:13px;color:var(--acc-mid);text-align:right;flex:none}
  /* A negative reputation that renders in the brand's friendly teal is not a
     measurement, it is a compliment. .acc set the colour and won on specificity. */
  .acc.up{color:#0f7b3d} .acc.down{color:#b3261e} .acc.flat{color:var(--muted)}
  .acc small{display:block;font-weight:700;font-size:11px;color:var(--muted)}

  /* notifications */
  .note{display:flex;gap:12px;padding:14px 0;border-bottom:2px solid var(--bar)}
  .note:last-child{border-bottom:0}
  .nicon{width:38px;height:38px;border-radius:50%;border:2.5px solid #000;background:var(--wash);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .nicon.win{background:var(--accent)}
  .ntext{font-family:'Nunito';font-weight:700;font-size:14px;line-height:1.35}
  .ntext b{font-weight:800}
  .nwhen{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted);margin-top:3px}

  /* Settlement as a postable moment. White tile in both themes (contrast lesson),
     a coloured rail for the verdict, and a share button that's loud for a win and
     a shrug for a loss — never a token reward (a paid share is spam, and rewards
     are what let the farm in; the win itself is the reason to post). */
  .ncard{border:3px solid #000;border-left-width:9px;border-radius:18px;background:#fff;color:var(--ink);
    padding:14px 15px 15px;margin-bottom:11px}
  .ncard.win{border-left-color:#0f7b3d} .ncard.loss{border-left-color:#b3261e}
  .nctop{display:flex;align-items:center;gap:8px;margin-bottom:8px}

  .ncshare:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .ncshare.win{background:var(--accent)} .ncshare.loss{background:#fff}
  .ncshare svg{width:16px;height:16px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .unread{width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #000;align-self:center;flex:none}

  /* --------------------------------------------------------------- mobile nav -- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
    background:var(--ground-2);border-top:2.5px solid var(--line-g);
    padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;background:none;border:0;cursor:pointer;height:var(--tabh);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:'Nunito';font-weight:800;font-size:10px;color:var(--muted-g);padding:0}
  .tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.1;
    stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--on-ground)}
  .tab.on svg{stroke:var(--on-ground)}
  .tab.on .ico{background:var(--accent);border-radius:999px}
  .ico{padding:2px 12px;display:flex;align-items:center;justify-content:center}

  /* ------------------------------------------------------------------ desktop -- */
  /* Mobile ends at 430px; nothing above changes below that width. From 768px the
     shell assembles itself: a rail on the left, the card column contained in a
     framed sheet, and the brand — dot grid, oversized eyes — taking the space the
     column doesn't need, instead of leaving it blank. */
  @media (min-width:768px){
    /* Desktop = the mobile app, dead-centre: ONE column (chips + cards + peek of
       the next), the nav in a centred bottom bar, and a quiet atmospheric ground
       doing equal work on both sides. No offset rail, nothing overflowing. */
    body{background:var(--feed-ground);overflow:hidden}
    /* The column was pinned at a fixed 500px regardless of viewport, so a wide
       monitor read as mostly empty margin either side. Let it breathe with the
       viewport instead — scales up to a sensible cap so cards never stretch
       into a thin-content, all-whitespace layout, but a lot less floats. */
    body{--feedcol:min(560px, 62vw)}
    /* .top is in normal flow here (not fixed, like on mobile), so it already
       occupies its own space above the scroller — .homewrap doesn't also need
       mobile's ~82px clearance for a fixed header it doesn't have. That extra
       padding was dead air between the header rule and the hero headline. */
    .homewrap{padding-top:calc(env(safe-area-inset-top) + var(--sp-4))}
    /* A soft lime glow seated high in the viewport, fading into the ground colour
       below it — same recipe as .hero::before, just sized for the whole page
       rather than one headline. Reads as atmosphere, not a technical grid. */
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 900px 560px at 50% -8%, rgba(182,240,95,.20), transparent 70%)}
    :root[data-theme="dark"] body::before{
      background:radial-gradient(ellipse 900px 560px at 50% -8%, rgba(182,240,95,.10), transparent 70%)}
    .rail,.side,.watermark,.railnav{display:none}

    /* Materialise the shell into a single centred column. */
    .app{display:flex;justify-content:center;height:100dvh;position:relative;z-index:1}
    .stage{display:contents}
    .frame{display:flex;flex-direction:column;width:calc(var(--feedcol) + 44px);max-width:100%;height:100dvh}

    /* Header in flow at the top of the column. Chips WRAP so every category is
       visible; header and scroller share a 22px inset, so chips and card align to
       the exact same left/right bounds. */
    .top{position:static;background:transparent;border-bottom:none;padding:16px 22px 10px}
    .top-in{max-width:none;margin:0;padding:0}
    .top .brand{display:flex;justify-content:flex-start;gap:9px;margin:0 0 13px 2px}
    .chips{flex-wrap:wrap;overflow:visible;gap:8px}

    /* Same physical card object as mobile — content-hug, filling the column; the
       22px side padding gives the soft shadow room (the scroller would clip it).
       The next card peeks + recedes below. */
    /* scroll-snap-type is scoped to .scroller.snap ONLY (matches the mobile rule) —
       it used to apply unconditionally here, which leaked feed-style snap-scroll
       onto every other view at desktop widths, home included. A static page must
       scroll like a static page: no snap container, no bounce-to-next-section. */
    .scroller{height:auto;flex:1;min-height:0;
      scroll-padding-top:6px;padding:0 22px calc(var(--tabh) + 24px)}
    .scroller.snap{scroll-snap-type:y mandatory}
    .sheet{max-width:none;padding:26px 26px 34px}
    .card{width:100%;max-width:none;margin:0 0 18px;scroll-margin-top:6px;min-height:auto;padding:26px 26px 24px}
    .card:first-child{margin-top:2px}
    .onbwrap{width:100%;max-width:none;margin:2px 0 14px;scroll-margin-top:6px}
    .chead{margin-bottom:2px}
    .opct{font-size:44px}
    .oside{font-size:13px}
    .opay{font-size:12px}
    .take{font-size:34px}
    .nudge{margin-top:18px}

    /* Nav: a centred bottom bar aligned to the column, not a full-width stretch. */
    .tabs{display:flex;left:50%;right:auto;transform:translateX(-50%);
      width:var(--feedcol);max-width:calc(100% - 40px);
      border:2.5px solid var(--line-g);border-bottom:0;border-radius:20px 20px 0 0;overflow:hidden}
  }

  /* Wide screens: the nav becomes a LEFT sidebar (Twitter/X pattern), filling the
     empty region beside the centred column instead of a bottom bar. The rail is
     fixed and out of flow, so .app reserves its 218px with padding-left — the
     column then centres in the space actually left over, not the full viewport,
     which used to read as the column drifting left of true-center with a huge
     dead patch on the right. The column also widens further on very wide
     monitors, same reasoning as the 768px step: less floating whitespace.
     (58vw, not the 46vw this used to be: at exactly 1024px that resolved to
     ~471px — NARROWER than the 768px step's own 560px cap one pixel to the
     left of this breakpoint, a visible dip right at the boundary. 58vw clears
     560 at 1024 so the column only ever grows crossing a breakpoint.) */
  @media (min-width:1024px){
    body{--feedcol:min(660px, 58vw)}
    .app{padding-left:218px}
    .rail{display:flex;position:fixed;left:0;top:0;z-index:16;height:100dvh;width:218px;box-sizing:border-box;
      flex-direction:column;gap:26px;padding:26px 18px}
    .rail .brand{display:flex;justify-content:flex-start;align-items:center;gap:9px;flex-wrap:wrap;row-gap:9px;margin:0 0 0 6px}
    .rail .brand .bal{margin-left:0}
    .railnav{display:flex;flex-direction:column;gap:6px}
    .navitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;cursor:pointer;
      border:2.5px solid transparent;background:none;font-family:'Fredoka';font-size:15px;font-weight:500;
      color:var(--on-ground);width:100%;text-align:left}
    .navitem svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.1;
      stroke-linecap:round;stroke-linejoin:round;flex:none}
    .navitem:hover{background:var(--ground-2)}
    .navitem.on{background:var(--accent);border-color:#000;color:#000;font-weight:600}
    .railfoot{display:block;margin-top:auto;font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g)}
    .top .brand{display:none}     /* the rail carries the wordmark + balance + toggle */
    .tabs{display:none}           /* no bottom bar on desktop */
    .scroller{padding-bottom:26px}
  }

  /* A large monitor (1440px+) still had the 660px cap from the step above —
     comfortably readable, but narrow enough that a market card's question
     routinely wrapped to 3 lines where the extra room would settle it at 2,
     and left enough slack beside the rail that the column read as adrift
     rather than confidently sized for the space. */
  @media (min-width:1440px){
    body{--feedcol:min(760px, 53vw)}
  }


  /* Short windows — an iPhone SE, or a laptop with the browser chrome eating the
     height. Shrink the type, never the top padding: the header is ~98px tall on
     mobile and the stack is measured from the card's top edge, so trimming that
     padding walks the category chip straight under the chips row. */
  @media (max-height:680px) and (max-width:767px){
    .opct{font-size:min(44px,12vw)}
    .take{font-size:min(26px,6.5vw)}
    .duel{gap:9px}
  }
  @media (max-height:760px) and (min-width:768px){
    .opct{font-size:40px}
    .take{font-size:30px}
    .nudge{margin-top:14px}
  }

<script>
const API=""; // same origin

/* ------------------------------------------------------- token balance -- */
/**
 * Virtual tokens, nothing else. Every device starts with 100, server-side; the
 * number in the header is the server's, not a local guess — a second tab or a
 * reload always shows what the database says. `balance` is null until /api/me
 * answers, and the picker treats null as "unknown, let the server enforce".
 */
let balance=null, nextTopUpMs=null, claim=null, pickStreak=0;
// Identity extras from /api/me, for the private profile: earned badges and the
// season rank. Cached from the same call that fills the balance pill.
let myBadges=[], myRank=null;
let myHandle=null, myHandleEditable=true;
// "14h", "40m", "any moment" — the wait until the next daily claim opens.
function claimWhen(ms){
  if(ms===null||ms===undefined)return "soon";
  const h=Math.floor(ms/3600000);
  if(h>=1)return `${h}h`;
  const m=Math.floor(ms/60000);
  return m>=1?`${m}m`:"any moment";
}
async function loadBalance(){
  try{
    const r=await fetch(`${API}/api/me?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok){const w=await r.json();balance=w.tokens;nextTopUpMs=w.nextTopUpMs;if(w.claim)claim=w.claim;
      if(typeof w.pickStreak==="number")pickStreak=w.pickStreak;
      myBadges=w.badges||[];myRank=w.rank||null;
      myHandle=w.handle??myHandle;myHandleEditable=w.handleEditable!==false;paintBalance();}
  }catch(e){/* header just shows no pill; the server still enforces */}
}
/** "in 7h", "in 40m", "soon" — never a bare number of milliseconds. */
function topUpIn(ms){
  if(ms===null||ms===undefined)return "";
  const h=Math.floor(ms/3600000);
  if(h>=1)return `+200 in ${h}h`;
  const m=Math.floor(ms/60000);
  return m>=1?`+200 in ${m}m`:"+200 soon";
}
// Just the "when", for prose: "21h", "40m", "any minute now".
function topUpWhen(ms){
  if(ms===null||ms===undefined)return "soon";
  const h=Math.floor(ms/3600000);
  if(h>=1)return `${h}h`;
  const m=Math.floor(ms/60000);
  return m>=1?`${m}m`:"any minute now";
}
// A device at 0 is not locked out. If it holds open calls it can sell for tokens
// right now; either way the daily top-up is coming. Say so, gently.
function zeroNote(d){
  if(d.tokens>0)return "";
  if(d.open.length)
    return `<div class="znote">Out of free Oddie Points — but not stuck. <b>Sell an open call</b> below at its live price to free some up, or <b>claim your daily Points</b> on the feed.</div>`;
  return `<div class="znote">Out of Oddie Points for now — <b>claim your daily Points</b> on the feed to top back up, then come back tomorrow for more. Nothing lost but a little time.</div>`;
}
function paintBalance(pulse){
  if(balance===null)return;
  // The pill is the only permanent door to sign-in. It opens a sheet; it never
  // blocks anything behind it.
  document.querySelectorAll(".bal").forEach(el=>{
    if(el.dataset.wired)return;
    el.dataset.wired="1";
    el.setAttribute("role","button");
    el.setAttribute("aria-label","Save your balance across devices");
    el.onclick=()=>connectSheet();
  });
  // Two pills — the mobile header's and the desktop rail's. Same number always.
  // The top-up line only appears when it can do something for you: at the floor
  // there is nothing to count down to, and a countdown to nothing is a nag.
  const tip=topUpIn(nextTopUpMs);
  document.querySelectorAll(".bal").forEach(el=>{
    el.innerHTML=`🪙 ${balance} <span class="ptslbl">Points</span>${tip?` <span class="topup">${tip}</span>`:""}`;
    if(pulse){el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse");}
    // Persistent pick-streak badge as visible identity, right beside the balance.
    // Shown only at 2+ (a 1 isn't a streak); it disappears the moment a wrong
    // pick breaks the run (server sends pickStreak 0/1 → no badge, no false comfort).
    let badge=el.nextElementSibling;
    if(!badge||!badge.classList||!badge.classList.contains("streakbadge")){
      badge=document.createElement("span");badge.className="streakbadge";el.after(badge);
    }
    if(pickStreak>=2){badge.textContent=`🔥 ${pickStreak}`;badge.title=`${pickStreak}-pick streak`;badge.style.display="";}
    else{badge.style.display="none";}
  });
}
/* ------------------------------------------------------------------- theme --
 * Auto by default, overridable, remembered. Three states rather than two: a
 * person who never touched it should keep following their phone when it flips
 * at sunset, and "Auto" is the only way to say that once you have offered a
 * manual choice at all.
 *
 * The theme is a property of this browser, not of the account. It is also, very
 * deliberately, not a property of the shared card: /card/*.svg is rendered on
 * the server from market data and never sees this value.
 */
const THEME_KEY="oddie_theme";
const systemDark=()=>matchMedia("(prefers-color-scheme:dark)").matches;
function themeMode(){ try{ return localStorage.getItem(THEME_KEY)||"auto"; }catch(e){ return "auto"; } }
function resolvedTheme(){ const m=themeMode(); return (m==="dark"||(m==="auto"&&systemDark()))?"dark":"bright"; }
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.4 19.6l1.6-1.6M18 6l1.6-1.6"/></svg>';
// Show the mode a tap will deliver: a moon while bright, a sun while dark.
function paintThemeToggle(){
  const to=resolvedTheme()==="dark"?SUN:MOON;
  document.querySelectorAll(".themetog").forEach(b=>{ if(b.innerHTML!==to)b.innerHTML=to; });
}
function paintTheme(){
  document.documentElement.dataset.theme=resolvedTheme();
  paintThemeToggle();
}
function setTheme(mode){
  try{ mode==="auto" ? localStorage.removeItem(THEME_KEY) : localStorage.setItem(THEME_KEY,mode); }catch(e){}
  paintTheme();
}
// One tap commits the opposite of whatever is on screen now. The header button is
// re-rendered with each view, so the click is delegated rather than bound.
document.addEventListener("click",e=>{
  const t=e.target.closest && e.target.closest(".themetog");
  if(!t)return;
  e.preventDefault();
  setTheme(document.documentElement.dataset.theme==="dark"?"bright":"dark");
});
// Follow the system while — and only while — nobody has overridden it.
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(themeMode()==="auto")paintTheme(); });
paintThemeToggle();

/* -------------------------------------------------------- optional identity --
 * Sign-in is an upgrade and never a wall. The only always-visible entry is the
 * balance pill; the rest are offers, taken or ignored. Nothing here gates the
 * feed, a call, a sell, or the leaderboard.
 */
let auth={accounts:[],providers:[]};
async function loadAuth(){
  try{
    const r=await fetch(`${API}/api/auth/me?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok)auth=await r.json();
  }catch(e){/* anonymous is the default, not the failure */}
}
const PROV={twitter:{glyph:"𝕏",label:"Connect X",cls:"x",why:"connect your identity"},
            google:{glyph:"G",label:"Connect Google",cls:"",why:"save across devices"}};

/** X first: it is the identity. Google second: it is the backup. */
function connectSheet(reason){
  const linked=new Set(auth.accounts.map(a=>a.provider));
  const buttons=(auth.providers.length?auth.providers:[{provider:"twitter",available:false},{provider:"google",available:false}])
    .map(({provider,available})=>{
      const p=PROV[provider];
      if(linked.has(provider))return `<button class="cbtn" disabled><span class="glyph">${p.glyph}</span>Connected</button>`;
      if(!available)return `<button class="cbtn" disabled title="not configured"><span class="glyph">${p.glyph}</span>${p.label} — unavailable</button>`;
      return `<button class="cbtn ${p.cls}" data-connect="${provider}"><span class="glyph">${p.glyph}</span>${p.label}</button>`;
    }).join("");
  const dim=document.createElement("div");
  dim.className="cdim";
  dim.innerHTML=`<div class="csheet" role="dialog" aria-label="Connect an account">
    <h3>${esc(reason||"Save your balance across devices")}</h3>
    <p>Connect once and your Oddie Points, calls and reputation follow you to any browser. <b>+100 Oddie Points</b>, once.</p>
    ${buttons}
    <p class="cnote">We never post anything. Signing in on a browser that already
      has anonymous Oddie Points will load your account instead — that browser's Points stay with it.</p>
    <p class="disclaimer">Oddie Points are for entertainment only. No deposits, no cash value, no real-money wagering.</p>
    <button class="cclose">Not now</button>
  </div>`;
  dim.onclick=(e)=>{ if(e.target===dim)dim.remove(); };
  dim.querySelector(".cclose").onclick=()=>dim.remove();
  dim.querySelectorAll("[data-connect]").forEach(b=>b.onclick=()=>{
    location.href=`${API}/api/auth/${b.dataset.connect}/start?deviceId=${encodeURIComponent(deviceId)}`;
  });
  document.body.appendChild(dim);
}

/** Coming back from a provider: say what happened, once, then clean the URL. */
function authReturn(){
  const q=new URLSearchParams(location.search);
  const connected=q.get("connected"), err=q.get("auth_error");
  if(!connected&&!err)return;
  const bonus=Number(q.get("bonus")||0);
  const msg=err?`Couldn't connect (${err}). Nothing changed.`
    :bonus>0?`Connected. +${bonus} Oddie Points — your balance now follows you.`
    :`Connected. Your account is loaded on this browser.`;
  history.replaceState(null,"",location.pathname+location.hash);
  const el=document.createElement("div");
  el.className="state";el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 18px);z-index:70;background:#fff;border:3px solid #000;border-radius:16px;padding:10px 16px;max-width:88vw";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),5200);
}

// Pointer type, not screen width: nobody swipes a laptop, and a phone plugged
// into a monitor is still a phone.
const GESTURE=matchMedia("(pointer:coarse)").matches?"swipe":"scroll";
const COARSE=matchMedia("(pointer:coarse)").matches;

/**
 * One-tap calls whose 5s undo window hasn't closed yet. If the person leaves
 * the page mid-window, the UI already said "Locked", so the promise is kept
 * here: every still-pending call is committed via sendBeacon on the way out.
 * (An undo removes the entry, so an undone call is never sent from anywhere.)
 */
const PENDING_CALLS=new Set();
addEventListener("pagehide",()=>{
  for(const p of PENDING_CALLS){
    const body=new Blob([JSON.stringify({side:p.side,tokens:p.tokens,deviceId})],{type:"application/json"});
    try{navigator.sendBeacon(`${API}/api/market/${p.slug}/call`,body);}catch(e){}
  }
  PENDING_CALLS.clear();
});

/* ---------------------------------------------------------------- sharing -- */
// The shareable link is always the public apex, whatever origin served this page
// — that is the only host whose /m/[slug] permalink unfurls to the PNG card.
const SHARE_ORIGIN=location.origin.includes("oddie.fun")?location.origin:"https://oddie.fun";
const SHARE_ICON='<svg viewBox="0 0 24 24"><path d="M12 15V3M12 3 8 7M12 3l4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
const X_ICON='<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23.3 22H16.9l-5-6.5-5.7 6.5H2.9l8.1-9.3L2 2h6.6l4.5 6 5.8-6Zm-1.1 18.2h1.7L7.1 3.7H5.3l12.5 16.5Z"/></svg>';
// The metadata-row chip icons — same outline language as SHARE_ICON, sized by
// .mchip svg. CLOCK_ICON = close time; COIN_ICON = real venue volume.
const CLOCK_ICON='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
const COIN_ICON='<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>';

let toastT=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el=document.createElement("div");el.className="toast";el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600);
}

// Mobile hands off to the OS sheet (WhatsApp/X/iMessage/copy, the UI they know).
// Desktop, where Web Share is thin, gets a three-item menu of its own.
async function shareMarket({slug,text,source,anchor,url}){
  url=url||`${SHARE_ORIGIN}/m/${slug}`;
  ev("share_open",{slug,source});
  if(COARSE && navigator.share){
    try{ await navigator.share({text,url}); ev("share_done",{slug,source,via:"native"}); }
    catch(e){ /* the user dismissed the sheet — not an error */ }
    return;
  }
  shareMenu({url,text,slug,source,anchor});
}

// Direct X post-intent for the reputation shares (settlement notification +
// profile). Pre-fills the text and appends the link; X lets them edit before
// posting. Reusable as-is once we automate posting.

/* ------------------------------------------------- anonymous device id -- */
/**
 * A random opaque string, minted once and kept in localStorage. It is NOT a
 * login and NOT a user: there is no account behind it, nothing a person typed
 * is ever attached to it, and clearing site data destroys it for good. It exists
 * so Week 1 can tell one returning browser from two new ones.
 *
 * localStorage first, cookie as the fallback — Safari in Private mode and some
 * in-app browsers (which is where a link from X lands) throw on setItem rather
 * than returning null. If both are unavailable the id lives for the page's
 * lifetime only: an unmeasurable session still gets a working feed.
 */
// Some browsers restore the previous scroll offset on a fresh load of "/" (most
// commonly iOS Safari / in-app browsers after backgrounding). That fights the
// requirement that home always opens at the top — take manual control up front,
// once, before anything renders. try/catch: not every embedded webview exposes it.
try{if("scrollRestoration" in history)history.scrollRestoration="manual";}catch(e){}

const DID_KEY="oddie_did";
const deviceId=(()=>{
  const mint=()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now().toString(36));
  try{
    const hit=localStorage.getItem(DID_KEY);
    if(hit)return hit;
    const id=mint();localStorage.setItem(DID_KEY,id);return id;
  }catch(e){/* storage blocked — fall through to the cookie */}
  try{
    const hit=document.cookie.match(/(?:^|;\s*)oddie_did=([^;]+)/);
    if(hit)return decodeURIComponent(hit[1]);
    const id=mint();
    document.cookie=`${DID_KEY}=${encodeURIComponent(id)};path=/;max-age=31536000;samesite=lax`;
    return id;
  }catch(e){/* cookies blocked too */}
  return mint(); // this session only; the feed still works, it just isn't counted twice
})();

/* ------------------------------------------------------------- events -- */
/**
 * Four events, fire-and-forget. sendBeacon survives the page being closed mid
 * request, which is exactly when the last card_view of a session fires; fetch
 * with keepalive is the fallback. Nothing here blocks the UI, and a failed send
 * is silent by design — analytics must never be able to break the feed.
 */
function ev(name,props={}){
  const body=JSON.stringify({name,deviceId,...props});
  try{
    if(navigator.sendBeacon){
      navigator.sendBeacon(`${API}/api/ev`,new Blob([body],{type:"application/json"}));
      return;
    }
  }catch(e){/* fall through */}
  try{fetch(`${API}/api/ev`,{method:"POST",headers:{"content-type":"application/json"},body,keepalive:true});}catch(e){}
}

function money(n){return n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${Math.round(n)}`}
function fmtMult(p){return (100/p).toFixed(1)+"×"}
/* Community-market meta: how long until it closes, in the two largest units.
 * "closes in 12d 4h" beats a timestamp — nobody does date math mid-swipe. */
function closesIn(iso){
  if(!iso)return "";
  const ms=new Date(iso).getTime()-Date.now();
  if(!(ms>0))return "closing";
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), mi=Math.floor(ms%36e5/6e4);
  return d>0?`closes in ${d}d ${h}h`:h>0?`closes in ${h}h ${mi}m`:`closes in ${mi}m`;
}
function esc(s){return s.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}
function n(x){return x.toLocaleString("en-US")}
// Animated count-up — cheap, tasteful motion for a hero number (Oddie Score,
// points, resolved counts) on first paint. Skipped entirely under
// prefers-reduced-motion; the element just shows the final value immediately.
const REDUCE_MOTION=matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el,to,opts={}){
  if(!el||!Number.isFinite(to))return;
  if(REDUCE_MOTION){el.textContent=(opts.fmt||String)(to);return;}
  const dur=opts.duration||700, from=opts.from||0, start=performance.now();
  const ease=(t)=>1-Math.pow(1-t,3); // easeOutCubic — fast start, gentle settle
  const step=(now)=>{
    const t=Math.min(1,(now-start)/dur);
    const val=Math.round(from+(to-from)*ease(t));
    el.textContent=(opts.fmt||String)(val);
    if(t<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/**
 * Smooth-scroll an element to the top of its scrolling container.
 *
 * Hand-rolled rather than scrollIntoView({behavior:"smooth"}) because the target
 * lives in a NESTED overflow container: scrollIntoView walks every scrollable
 * ancestor, so it also nudges the document, and its resting position is decided
 * by scroll-padding rather than by us. Driving #scroller.scrollTop directly is
 * the same thing renderHome already does to reset to the top, keeps the landing
 * offset explicit, and reuses countUp's easeOutCubic so the two bits of motion
 * on the page match. Degrades to an instant jump under prefers-reduced-motion.
 */
function scrollToEl(container,el,{duration=520,offset=8}={}){
  if(!container||!el)return;
  const to=Math.max(0,Math.min(
    el.getBoundingClientRect().top-container.getBoundingClientRect().top+container.scrollTop-offset,
    container.scrollHeight-container.clientHeight));
  const from=container.scrollTop;
  if(REDUCE_MOTION||Math.abs(to-from)<2){container.scrollTop=to;return;}
  const start=performance.now(), ease=(t)=>1-Math.pow(1-t,3);
  const step=(now)=>{
    const t=Math.min(1,(now-start)/duration);
    container.scrollTop=from+(to-from)*ease(t);
    if(t<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* -------------------------------------------------------------- routing --
   Hash routes, not paths. oddie.fun points straight at this one service, so real
   paths would work too — but the hash keeps client views (positions, leaderboard,
   profile) purely in the browser, no server round-trip. The hash never leaves it. */
const VIEWS=NAV.map(([k])=>k);
// Both permalink shapes: /m/{slug} is canonical, /market/{slug} lives on in old links.
const startSlug=(location.pathname.match(/^\/(?:m|market)\/([^/]+)/)||[])[1]||"";
// Public profile page: /@{handle}. A path route, like the market permalink.
const profileHandle=(location.pathname.match(/^\/@([^/?#]+)/)||[])[1]||"";
// The homepage: bare "/", nothing else. Sells the chain (tag -> call -> who was
// right) instead of showing the feed — oddie.fun is no longer a redirect to it.
const isHomePath=location.pathname==="/";
let activeCat=new URLSearchParams(location.search).get("cat")||"For you";

// Permalink landing → log one device-attributed page view for the wedge metrics
// (click→pick). Fire-and-forget; a failure never affects the page.
if(startSlug){
  try{fetch(`${API}/api/pageview`,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({slug:startSlug,deviceId})});}catch(e){}
}

function currentView(){
  const h=location.hash.replace(/^#\/?/,"");
  return VIEWS.includes(h)?h:"feed";
}

function paintNav(view){
  document.getElementById("railnav").innerHTML=NAV.map(([k,label])=>
    `<button class="navitem${k===view?" on":""}" data-go="${k}">${svg(k)}<span>${label}</span></button>`).join("");
  document.getElementById("tabs").innerHTML=NAV.map(([k,label])=>

       <span class="ico">${svg(k)}</span><span>${k==="alerts"?"Alerts":label}</span></button>`).join("");
  document.querySelectorAll("[data-go]").forEach(b=>{
    b.onclick=()=>{location.hash=b.dataset.go==="feed"?"#/feed":"#/"+b.dataset.go};
  });
}

function render(){
  // A /@{handle} path renders the public profile, independent of the hash router.
  if(profileHandle){document.body.dataset.view="profile";renderPublicProfile();return;}
  // The bare homepage — but only while no hash has taken over (tapping a nav tab
  // from home sets #/feed etc., which must render normally on top of "/").
  if(isHomePath && !location.hash){document.body.dataset.view="home";renderHome();return;}
  const view=currentView();
  document.body.dataset.view=view;   // the header's backdrop keys off this
  paintNav(view);
  const scroller=document.getElementById("scroller");
  scroller.scrollTop=0;
  if(view==="feed"){scroller.classList.add("snap");loadFeed();}
  else{scroller.classList.remove("snap");renderShell(view);}
}
