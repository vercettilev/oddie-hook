  // Live activity, Recently settled, Top callers, and the featured/first-call
  // markets are each built into a DETACHED fragment below (never appended to
  // `wrap` directly) so the SAME section-building code can be placed in either
  // order without duplicating a single line of it — only the final append
  // sequence, right before the how-it-works footer, differs by `newUser`.
  const section=(target,text,id,cls)=>{const p=document.createElement("p");p.className=cls?`psec ${cls}`:"psec";p.textContent=text;if(id)p.id=id;target.appendChild(p);};

  // The "N markets open / calls today / predictions won today" counter strip
  // and the "Recently settled" proof section both used to render here. Both
  // are CUT — reviewed live and judged dull: the counters were three numbers
  // with no stake in them for the reader, and the settled cards recapped
  // other people's finished business at the exact moment the page is trying
  // to get YOU to make a call. `activity` and `settled` are still fetched
  // from /api/home (other surfaces read the same payload) — they just no
  // longer render on Home.

  // PROOF that a competition exists (Top callers). For a RETURNING player this
  // leads the page; for a brand-new visitor it moves below the first-call
  // section — the social layer lands better AFTER a first action than before
  // it. See the append order below.

  // Top callers: a competition exists. Rank/handle/edge — the same three
  // columns the full Leaderboard's primary board shows, so the teaser and the
  // page it links to can never disagree. The server sends [] when NO caller is
  // ranked yet; one ranked caller is enough to render, because "here is the
  // person to beat" is a real competition even with a single name in it.
  let topFrag=null;
  if(topCallers.length){
    topFrag=document.createDocumentFragment();
    section(topFrag,"Loudest right now");
    // Hash route, same as the nav buttons — a real href so it middle-clicks and
    // right-clicks like a link, no JS interception needed.
    const box=document.createElement("a");box.className="topc";box.href="#/leaderboard";
    box.innerHTML=topCallers.map(r=>`
      <div class="topc-r">
        <div class="topc-rank">${r.rank}</div>
        <div class="topc-who">@${esc(r.handle)}</div>
        <div class="topc-edge">${Number(r.oddies)||0}<small>${r.loudMultiplier>1?`🔥 ${r.loudMultiplier}x`:"oddies"}</small></div>
      </div>`).join("");
    topFrag.appendChild(box);
    const more=document.createElement("a");more.className="topc-more";more.href="#/leaderboard";
    more.textContent="climb the board →";
    topFrag.appendChild(more);
  }

  // "Open markets": a handful of live markets, tappable right there — the SAME
  // card + interaction code the feed uses (buildCard), so YES/NO here behaves
  // identically. Used to be a single "Daily Call" slot, which read as
  // unfinished (one market, and mislabeled "Community" when its real topic was
  // Sports) — now up to 4, each with its real topic badge (buildCard already
  // prefers topicCategory over the flattened category). The label says exactly
  // what these are: it used to read "Live right now", which promised urgency
  // that a market closing in five weeks does not have.
  let featuredFrag=null;
  if(featured.length){
    featuredFrag=document.createDocumentFragment();
    // Stage 1 of onboarding: a visitor with zero calls, ever, gets directional
    // emphasis toward the lowest-friction first action — the header names the
    // action instead of the section, and the first card gets a restrained glow
    // (see .firstcall-cue). No modal, nothing blocking; a returning player
    // (newUser===false) sees the exact same section as always. Placement is
    // ALSO keyed off this same `newUser` flag, below — the cue and the
    // reorder are never allowed to disagree about who's new.
    // The id is the settled cards' scroll target — see the .stl-cta handler.
    // The label does positioning work, not just navigation. "Someone tagged
    // this one" says the market below was CREATED by a person tagging an
    // argument — the same thing the hero just showed — so the sample reads as
    // the output of the mechanic rather than as inventory on an exchange.
    // That distinction is the entire difference between this and Polymarket,
    // and it costs four words to make.
    // "Markets people tagged", not "Open markets". The neutral label let the
    // grid read as a standalone exchange sitting under an unrelated hero —
    // two products stacked. Naming the ACTION that produced these markets
    // makes the section an extension of the tag mechanic instead of a
    // competing one, and it costs three words.
    section(featuredFrag,newUser?"Someone tagged this one, try it":"Markets people tagged","openmarkets",newUser?"cue":"");
    // Only the first `featuredShown` are ever VISIBLE as their own cards —
    // the rest is the continuous-play loop's reserve pool (see
    // HOME_FEATURED_POOL server-side): lock a call on any visible card and
    // "Next call" pulls from here instead of sending the user to Feed.
    // A fresh visitor sees exactly ONE. Four stacked cards is a list of
    // markets to bet on no matter what the label above it says, and that
    // impression is the whole problem being fixed here. One is a "try it",
    // four is an exchange. Nothing is lost: the other three don't disappear,
    // they fall into the continuous-play pool below, so locking this one
    // pulls the next straight in. Returning players, who already know what
    // the product is, keep the full set.
    const shown=newUser?1:featuredShown;
    const visible=featured.slice(0,shown);
    const pool=featured.slice(shown);
    // Shared by reference across every visible card, so whichever one the
    // user actually locks first draws from ONE pool — a market already
    // sitting visible elsewhere on the page is pre-marked used, so the loop
    // can never hand back a duplicate of a card that's still right there.
    const usedSlugs=new Set(visible.map(x=>x.slug));
    let poolIdx=0,nextIdxCounter=shown;   // `shown`, not featuredShown — see the slice above
    const loopCtx={
      cap:HOME_LOOP_CAP,
      pull(){
        while(poolIdx<pool.length){
          const cand=pool[poolIdx++];
          if(!usedSlugs.has(cand.slug)){usedSlugs.add(cand.slug);return cand;}
        }
        return null;
      },
      nextIdx(){return nextIdxCounter++;},
    };
    // The cards go in their own container rather than straight into .homewrap
    // as loose siblings, so desktop can lay them out as a GRID (see .mktgrid).
    // On a wide viewport a single 760px column of stacked cards left ~460px of
    // dead margin either side; two columns use that room for actual markets
    // instead of empty ground. On mobile the grid is a single column, i.e.
    // exactly the stack it always was.
    const grid=document.createElement("div");grid.className="mktgrid";
    visible.forEach((m,i)=>{
      const card=buildCard(m,i,{ctx:loopCtx,chainCount:1});
      if(newUser&&i===0)card.classList.add("firstcall-cue");
      // "swipe for the next take" doesn't apply — this is a short static list,
      // not a swipeable feed. Suppress it via a permanent inline !important
      // rather than removing the node: lockedUI unconditionally looks it up by
      // id after a call locks in, and a missing element there would throw
      // (silently swallowed by the pending-commit catch, which would then
      // wrongly claim "couldn't reach the server").
      card.querySelector(".nudge")?.style.setProperty("display","none","important");
      grid.appendChild(card);
    });
    featuredFrag.appendChild(grid);
  }

  // The actual placement decision — everything above just BUILT sections, none
  // of it has touched `wrap` yet. A brand-new visitor gets the lowest-friction
  // action (the cued first call) immediately after the hero/claim strip they
  // already saw; stats/proof/social move below it. A returning player keeps
  // today's order — proof and social lead, since they already know the loop.
  if(newUser){
    // Tag mechanic first, one sample market second, everything else below.
    // This deliberately reverses the previous card-first order: leading with
    // playable markets made three separate users read the whole product as a
    // Polymarket clone, because a list of markets to bet on is exactly what
    // that is. The card stays — it's still the cheapest possible first action
    // — but as ONE market underneath the mechanic that produced it, not as
    // the top of a feed.
    wrap.appendChild(hero);
    if(featuredFrag)wrap.appendChild(featuredFrag);
    wrap.appendChild(claimFrag);
    if(topFrag)wrap.appendChild(topFrag);
  }else{
    // RETURNING: create bar, then the live feed, immediately. Everything that
    // is about the viewer rather than about the markets — their two scores,
    // their streak, the daily claim — moves into the right rail on desktop
    // and below the feed on mobile. The claim strip in particular was the
    // second-loudest object on the page, which framed Oddie as a play-money
    // faucet; the real reward loop is create -> people trade -> you earn.
    wrap.appendChild(hero);
    const mainCol=document.createElement("div");mainCol.className="homemain";
    if(featuredFrag)mainCol.appendChild(featuredFrag);
    if(topFrag)mainCol.appendChild(topFrag);
    wrap.appendChild(mainCol);
    wrap.appendChild(buildRail(me,creator,claimFrag,openCalls,topCreators));
  }

  // The three-beat "how it works" — icons + a few words each, no paragraphs.
  const how=document.createElement("div");how.className="howitworks";
  // Same plain voice as the guided tour, and deliberately the same words: the
  // tour says "Reply @oddiefun", "Tap YES or NO" and "guess right", so this row
  // says exactly that too. It used to read "tag a claim / make the call / see
  // who was right", which asked a first-time reader to already know what a
  // "claim" is here and what "making a call" means — the two nouns the rest of
  // onboarding just stopped using.
  how.innerHTML=`<div class="howstep"><span class="howico">🏷️</span><span>Reply @oddiefun on X</span></div>
    <div class="howarrow">→</div>
    <div class="howstep"><span class="howico">☝️</span><span>Tap YES or NO</span></div>
    <div class="howarrow">→</div>
    <div class="howstep"><span class="howico">🏆</span><span>See who guessed right</span></div>`;
  wrap.appendChild(how);

  // The feed is a place to hang out, not what the product IS — so the link to
  // it stays the quietest thing on the page, and says what's actually down
  // there: other people's tags. "browse all markets" framed the feed as the
  // destination and the product as a market list, which is the exact
  // impression this page is now built to avoid.
  const browse=document.createElement("a");browse.className="browselink";browse.href="/feed";
  browse.textContent="see what else people have tagged →";
  wrap.appendChild(browse);

  scroller.innerHTML="";
  scroller.appendChild(wrap);
  // A fast, staggered rise+fade down the page on first paint — the one motion
  // cue that says "designed", not "just appeared". Capped stagger so a long
  // page never reads as sluggish.
  [...wrap.children].forEach((el,idx)=>{el.classList.add("enter");el.style.animationDelay=`${Math.min(idx*55,220)}ms`;});
  // Re-assert the top after the swap: replacing innerHTML can itself nudge a
  // scroll position mid-layout on some engines, so this is the belt to the
  // suspenders above, not a duplicate of it.
  scroller.scrollTop=0; window.scrollTo(0,0);
  // Card-view tracking AND the live tote-board poll (see updateCardOdds) both
  // ride this one observer. loadFeed already wired it for the swipe Feed;
  // Home is where community markets — the ones with a real, moving pool —
  // actually live, so it needs the exact same hookup, not a separate one.
  watchDepth(scroller);

  // The guided tour used to fire here for new devices. Removed — see the
  // tombstone comment where its code lived. A new visitor's onboarding is
  // the page itself: hero demo, cued card, and moment-of-spend feedback.
}

/**
 * Scroll-driven depth: the card at the snap line reads full; every card below it
 * recedes (scale + fade) so the peek is an obvious, layered stack — not a card
 * stranded in empty space. rAF-throttled, one listener per scroller.
 */
let depthRAF=null;
function applyDepth(scroller){
  const cards=scroller.querySelectorAll(".card"); if(!cards.length)return;
  const vh=scroller.clientHeight||window.innerHeight;
  const pad=parseFloat(getComputedStyle(scroller).scrollPaddingTop)||0;
  const activeLine=scroller.getBoundingClientRect().top+pad;
  cards.forEach(card=>{
    // The end card is exempt. Depth exists to say WHICH market you are on among
    // many; the last slide is not a market and has no next one to defer to.
    // It also sits last, so it can never reach the snap line (nothing follows
    // it to scroll against) and would otherwise be permanently dimmed — the one
    // card in the feed that should land at full strength.
    if(card.classList.contains("endcard")){card.style.transform="";card.style.opacity="";return;}
    const d=card.getBoundingClientRect().top-activeLine;    // 0 at the snap line
    let scale=1, op=1;
    if(d>0){const t=Math.min(1,d/(vh*0.55)); scale=1-0.06*t; op=1-0.5*t;}      // peeking below
    else if(d<0){const t=Math.min(1,-d/(vh*0.5)); scale=1-0.04*t; op=1-0.55*t;} // scrolled above
    card.style.transform=`scale(${scale.toFixed(3)})`;
    card.style.opacity=op.toFixed(3);
  });
}
function bindDepth(scroller){
  applyDepth(scroller);
  if(scroller._depthBound)return; scroller._depthBound=true;
  const onScroll=()=>{ if(depthRAF)return; depthRAF=requestAnimationFrame(()=>{depthRAF=null;applyDepth(scroller);}); };
  scroller.addEventListener("scroll",onScroll,{passive:true});
  window.addEventListener("resize",onScroll,{passive:true});
}

/**
 * The pivot of the taste flow, now surfaced right after the FIRST card (not the
 * second) so the personalization investment lands before the gate: "what do you
 * have takes on?" — the free signal. Multi-select 1-3 of the five real feed
 * categories, Continue re-ranks the feed toward them. The picks are logged
 * (taste_pick) and stashed in sessionStorage so the reload knows to show the
 * one re-ranked card and, after it, the gate.
 */
function buildPicker(){
  const CATS=["Sports","Crypto","Politics","Culture","Tech"];
  const el=document.createElement("div");
  el.className="card intercard pickcard";
  el.innerHTML=`
    <div class="ititle">what do you have<br>takes on?</div>
    <div class="isub">pick up to 3 and we'll tune your feed</div>
    <div class="tchips">${CATS.map(c=>`<button class="tchip" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <button class="icont" disabled>Continue</button>`;
  const sel=new Set(), cont=el.querySelector(".icont");
  el.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c;
    if(sel.has(c)){sel.delete(c);b.classList.remove("on");}
    else{if(sel.size>=3)return;sel.add(c);b.classList.add("on");}
    cont.disabled=sel.size===0;
    cont.textContent=sel.size?`Continue (${sel.size})`:"Continue";
  });
  cont.onclick=()=>{

}

/**
 * The gate, as the last card in the taste run. Not a wall dropped in front of
 * the feed — a natural next step reached after a real taste. One line, X first,
 * Google second. gate_shown fires once, when the card is built.
 */
function buildGate(){
  const el=document.createElement("div");
  el.className="card intercard gatecard";
  el.innerHTML=terminalGateInner();
  wireTerminalGate(el);
  ev("gate_shown",{via:"feed",reason:GATE.reason});
  return el;
}

/**
 * Feed depth — the Week-2 metric, instrumented now so Week 1 seeds it.
 *
 * A card counts as viewed when it is mostly on screen, not when it is rendered:
 * all forty are in the DOM from the start, so "rendered" would report every
 * session as forty cards deep. The observer fires once per card per render;
 * switching category re-renders and legitimately starts the count over, because
 * the index means "how far into THIS list".
 */
// Odds count up rather than snapping — the number settles into place as the card
// arrives. Once per number; respects reduced-motion.
const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function animateOdds(card){
  card.querySelectorAll(".opct-num").forEach(el=>{
    if(el.dataset.done)return; el.dataset.done="1";
    const to=Number(el.dataset.to)||0;
    if(REDUCED_MOTION){el.textContent=to;return;}
    // Count from an even 50 so YES and NO stay complementary while they settle —
    // the pair reads as odds resolving from even, never a momentary "doesn't add up".
    const from=50; el.textContent=from;
    const dur=560, t0=performance.now();
    const tick=(t)=>{const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);
      el.textContent=Math.round(from+(to-from)*e);
      if(p<1)requestAnimationFrame(tick);else el.textContent=to;};
    requestAnimationFrame(tick);
  });
}
/**
 * The tote-board: YES/NO odds are a live parimutuel pool now (see poolPct in
 * markets.ts), not a number fixed at market creation, so the card has to be
 * able to move without a reload. Two triggers, no push channel — this app has
 * none, so these are the two moments that are actually free: the caller's own
 * action already round-trips to the server (its response is reused, not a
 * second fetch), and the one card currently on screen is polled for anyone
 * ELSE's calls while it's the thing being looked at. Every other off-screen
 * card is deliberately left alone; the next fetch (a fresh render) is what
 * catches those up, exactly like any other data on this page.
 *
 * Never a hard snap: this animates from whatever is CURRENTLY displayed to
 * the fresh value, sharing animateOdds' easeOutCubic tween — a shift reads as
 * the market moving, not the UI glitching. A WeakMap token per card means a
 * second update arriving mid-animation (the poll landing right as the user's
 * own call resolves, say) supersedes the first cleanly instead of the two
 * fighting over the same text node.
 */
const liveOddsAnim=new WeakMap();
function updateCardOdds(card,rawYesPct){
  const yesPct=Math.max(1,Math.min(99,Math.round(rawYesPct)));
  const yesEl=card.querySelector('.orow[data-side="yes"]'), noEl=card.querySelector('.orow[data-side="no"]');
  if(!yesEl||!noEl)return;
  const yesNum=yesEl.querySelector(".opct-num"), noNum=noEl.querySelector(".opct-num");
  const fromYes=Number(yesNum.textContent);
  if(!Number.isFinite(fromYes)||fromYes===yesPct)return; // nothing moved — no animation to run, no jitter to cause
  const paint=(y)=>{
    const n=Math.max(1,Math.min(99,Math.round(y)));
    yesNum.textContent=n; noNum.textContent=100-n;
    yesEl.style.setProperty("--fill",`${n}%`); noEl.style.setProperty("--fill",`${100-n}%`);
    yesEl.querySelector(".opay").textContent=fmtMult(n); noEl.querySelector(".opay").textContent=fmtMult(100-n);
    yesEl.setAttribute("aria-label",`Yes, ${n} percent, pays ${fmtMult(n)}`);
    noEl.setAttribute("aria-label",`No, ${100-n} percent, pays ${fmtMult(100-n)}`);
  };
  if(REDUCED_MOTION){paint(yesPct);return;}
  const token={};liveOddsAnim.set(card,token);
  const dur=650,t0=performance.now();
  const tick=(t)=>{
    if(liveOddsAnim.get(card)!==token)return; // superseded by a newer update mid-flight — stop, don't fight it
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    paint(fromYes+(yesPct-fromYes)*e);
    if(p<1)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// Trigger 2 of 2: poll the ONE card currently in view, so the pool's own
// motion (someone else's call, not yours) still shows up while you're looking
// at it. 5s — frequent enough to feel alive, not so tight it reads as
// hammering the server for a number that mostly doesn't move tick to tick.
let liveOddsPoll=null; // {card, timer} — at most one card polls at a time
const LIVE_ODDS_POLL_MS=5000;
function stopLiveOddsPoll(){
  if(!liveOddsPoll)return;
  clearInterval(liveOddsPoll.timer);liveOddsPoll=null;
}
function startLiveOddsPoll(card){
  if(liveOddsPoll){
    if(liveOddsPoll.card===card)return; // already the active card
    stopLiveOddsPoll();
  }
  const slug=card.dataset.slug;
  if(!slug)return;
  const tick=async()=>{
    if(!card.isConnected){stopLiveOddsPoll();return;} // self-heals if the leave event was missed
    try{
      const r=await fetch(`${API}/api/market/${encodeURIComponent(slug)}`);
      if(!r.ok)return;
      const j=await r.json();
      // THE CHAIN OWNS THE PRICE ON A COMMUNITY CARD. /api/market returns the
      // stored play-era yesPct, which is 50 on every bot-minted market, and
      // this poll was repainting it over the vault odds chain.js had just
      // written: the card animated back to a 50/50 nobody set, every five
      // seconds. data-chain-pool is chain.js's own marker ("live" when the
      // vault has money, "empty" when it does not), so its presence means the
      // number is already answered by the only source that can answer it.
      if(card.dataset.chainPool)return;
      if(typeof j?.market?.yesPct==="number")updateCardOdds(card,j.market.yesPct);
    }catch(e){/* one missed tick; the next one just tries again */}
  };
  liveOddsPoll={card,timer:setInterval(tick,LIVE_ODDS_POLL_MS)};
}

function watchDepth(scroller){
  if(!("IntersectionObserver" in window))return;   // depth goes unmeasured, feed still works
  const seen=new Set();
  const io=new IntersectionObserver(entries=>{
    for(const e of entries){
      if(!e.isIntersecting){
        if(liveOddsPoll&&liveOddsPoll.card===e.target)stopLiveOddsPoll();
        continue;
      }
      animateOdds(e.target);                        // count the odds up as the card lands
      const idx=Number(e.target.dataset.idx);
      if(!seen.has(idx)){seen.add(idx);ev("card_view",{slug:e.target.dataset.slug,idx});}
      startLiveOddsPoll(e.target);                   // ...then start watching it for live moves
    }
  },{root:scroller,threshold:.55});
  scroller.querySelectorAll(".card").forEach(c=>io.observe(c));
}

/**
 * Before this, the only sign that the feed continued below was a nudge you had
 * to pick a side to see — so the one screen a new arrival actually looks at was
 * the one screen with no way out of it. The first card now says so on its own,
 * quietly, and stops the moment they act on it.
 */
function hintFirstCard(scroller){
  if(hintRetired)return;
  const nudge=scroller.querySelector(".nudge");
  if(!nudge)return;
  nudge.classList.add("show","hint");
  const retire=()=>{
    if(scroller.scrollTop<24)return;   // ignore the snap's own settling jitter
    hintRetired=true;
    nudge.classList.remove("show","hint");
    scroller.removeEventListener("scroll",retire);
  };
  scroller.addEventListener("scroll",retire,{passive:true});
}

function renderShell(view){

/**
 * The creator dashboard: every market this device tagged, with the per-market
 * numbers that answer "did making that one pay off?". Rows link to the market.
 * The empty state TEACHES rather than apologises — the whole reason a
 * zero-market creator lands here is to find out how to have markets.
 */
async function loadMyMarkets(scroller){
  scroller.innerHTML='<div class="state">checking your markets…</div>';
  try{
    const r=await fetch(`${API}/api/my-markets?deviceId=${encodeURIComponent(deviceId)}`);
    if(!r.ok)throw new Error("my-markets "+r.status);
    const {markets}=await r.json();
    if(!markets.length){
      scroller.innerHTML=`<div class="sheet"><div class="mm-empty">
        <p class="mm-empty-big">You haven't tagged a market yet.</p>
        <p class="mm-empty-sub">Reply <b>@oddiefun</b> under any post on X. The market it becomes is yours, and you earn <b>2%</b> when it resolves with people on it.</p>
        <button class="rp-create" type="button">+ Create a market</button>
      </div></div>`;
      scroller.querySelector(".rp-create").onclick=()=>openPasteSheet();
      return;
    }
    const totalFees=markets.reduce((a,m)=>a+(m.feesEarned||0),0);
    scroller.innerHTML=`<div class="sheet">
      <div class="mm-total"><b>+${totalFees}</b> earned in creator fees · ${markets.length} market${markets.length===1?"":"s"}</div>
      <div class="mm-list">${markets.map(m=>`
        <a class="mm-row" href="/m/${encodeURIComponent(m.slug)}">
          <span class="mm-q">${esc(displayTitle(m.question))}</span>
          <span class="mm-meta">${m.resolvedOutcome
            ?`resolved ${m.resolvedOutcome.toUpperCase()}${m.feesEarned?` · you earned +${m.feesEarned}`:""}`
            :`${m.poolTokens} in play · ${m.callers} caller${m.callers===1?"":"s"}${m.closesAt?` · ${closesIn(m.closesAt)}`:""}`}</span>
        </a>`).join("")}</div>
    </div>`;
  }catch(e){
    console.error(e);
    scroller.innerHTML='<div class="state">couldn’t load your markets. Try again in a moment.</div>';
  }
}

// Identity block bits shared by the public and private profiles — the trophy
// room. The two-concept model shows the user their predictions balance and
// their Oddie Score; badges + rank are IDENTITY and STATUS, never a third number.
const BADGE_ICON={founding:"🏛️",streak:"🔥",category:"🎯",rank:"📈"};
// Badges as medallions: a circular icon with a lime medal-sheen, caption below
// — screenshot-friendly the way an achievement screen is, not a flat pill row.
/**
 * THE HERO. One number, one ladder, one button.
 *
 * This screen used to be six section headers, four separate zeros and two
 * paragraphs of prose, with the only real motivator (1x to 2x) written out as a
 * sentence and the only real reward shown only after it was already won. A
 * control beats a sentence, and a lit first rung beats a hidden ladder.
 *
 * The ladder is why the new user and the veteran can share ONE layout: 1x is a
 * real reading on a 1x..2x scale, not a zero, so nothing here needs an empty
 * mode that drifts out of sync with the real one.
 *
 * id="scoreringnum" MUST stay on the number: animateOscore writes through it,
 * and countUp guards a null element, so losing it fails silently rather than
 * loudly.
 */
// Each rung, and the thing that buys the NEXT one. A bare row of 1x 1.25x 1.5x
// 2x says nothing: the sentence that used to explain the multiplier was deleted
// with loudNextHtml, which left four numbers floating with no subject. The row
// now carries its own subject above it and the price of the next rung below it,
// which is still two short elements rather than the paragraph it replaced.
// Thresholds mirror loudMultiplierOf in economy.ts.
const LOUD_RUNGS=[
  {m:1,    unlocks:"Post about oddie on X to reach 1.25x"},
  {m:1.25, unlocks:"Three cleared posts in 30 days reaches 1.5x"},
  {m:1.5,  unlocks:"Win a week's Loudest to reach 2x"},
  {m:2,    unlocks:"Top of the ladder. Your markets earn double."},
];
function heroHtml(acc,rank,firstTagPays){
  const score=Number(acc&&acc.oddieScore)||0;
  const mult=Math.max(1,Number(acc&&acc.loudMultiplier)||1);
  const wd=acc&&acc.weeklyDelta;
  const chips=[
    acc&&acc.tier?`<span class="hero1-chip">🏆 ${esc(acc.tier.label)}</span>`:"",
    rank&&rank.topPct!=null?`<span class="hero1-chip">Top ${rank.topPct}%</span>`:"",
    wd?`<span class="hero1-chip up">▲ ${deltaText(wd.delta)} this week</span>`:"",
  ].filter(Boolean).join("");
  const cur=LOUD_RUNGS.filter(r=>r.m<=mult).length;   // 1..4, never 0
  const ladder=LOUD_RUNGS.map((r,i)=>{
    const on=i<cur, next=i===cur;                      // exactly one crawling rung
    return `<div class="rung${on?" on":""}${next?" next":""}">${r.m}x</div>`;
  }).join("");
  const nextUp=LOUD_RUNGS[Math.min(cur,LOUD_RUNGS.length)-1].unlocks;
  const sub=score>0
    ? "Every market you tag pays you 2% of its pool."
    : `Your first tag pays ${firstTagPays} oddies.`;
  return `<div class="hero1">
    <div class="hero1-num" id="scoreringnum">${score}</div>
    <div class="hero1-lab">ODDIES</div>
    ${chips?`<div class="hero1-chips">${chips}</div>`:""}
    <p class="hero1-lab ladder-lab">YOUR MARKETS EARN ${mult}x</p>
    <div class="ladder" role="group" aria-label="Loud ladder, rung ${cur} of 4. Your markets earn ${mult} times. ${nextUp}">${ladder}</div>
    <p class="hero1-next">${nextUp}</p>
    <button class="hero1-go" id="herogo" type="button">Tag a post on X</button>
    <p class="hero1-sub">${sub}</p>
  </div>`;
}

/** The three facts that prove the number. Absent at zero, because a count
 *  nobody has earned yet is just a zero wearing a label. */
function proofHtml(acc,rank,earn){
  const made=Number(acc&&acc.marketsCreated)||0;
  // NOT tradersReached: it counts rows in the dead play-token table and is
  // permanently 0. The honest reach figure is the SOL actually staked in the
  // markets you started, which the earnings fetch already sums off chain.
  const pooled=Number(earn&&earn.ok&&earn.pooledLamports)||0;
  if(!made&&!pooled&&!rank)return "";
  const c=[];
  if(made)c.push([made,"MARKETS TAGGED"]);
  if(pooled)c.push([`${SOL(pooled)}`,"SOL IN THEM"]);
  if(rank)c.push([rank.topPct!=null?`Top ${rank.topPct}%`:`#${rank.rank}`,
                  rank.topPct!=null?"THIS SEASON":`OF ${rank.total}`]);
  return `<div class="proof">${c.map(([v,k])=>
    `<div class="proof-c"><div class="proof-v">${v}</div><div class="proof-k">${k}</div></div>`).join("")}</div>`;
}

/** Real SOL. The only surface here with no brand colour and no motion: it
 *  reports, it never celebrates, and it never prints a 0.000 at somebody. */
function moneyStripHtml(earn){
  const has=earn&&earn.ok&&(Number(earn.earnedLamports)>0||Number(earn.pooledLamports)>0);
  const body=has
    ? `<div class="mstrip-h"><div class="mstrip-v">${SOL(earn.earnedLamports)} SOL</div><div class="mstrip-k">EARNED IN FEES</div></div>
       <div class="mstrip-h"><div class="mstrip-v">${SOL(earn.pooledLamports)} SOL</div><div class="mstrip-k">IN YOUR MARKETS</div></div>`
    : `<div class="mstrip-one">Your 2% lands here when a market you tagged resolves.</div>`;
  return `<a class="mstrip" href="#/mymarkets">${body}</a>`;
}

/**
 * THE STAMP SHEET.

 * The old shelf was four circles with a colour emoji in each. Two of the four
 * were computed from market_call and could never be awarded, a third was drawn
 * client-side and never produced by the server at all, so it read "1 of 4"
 * forever. And a colour emoji renders differently on every platform, so it
 * cannot carry a brand.
 *
 * Fourteen flat single-colour stamps built from five primitives (disc, bar,
 * wedge, chevron, square). Three finishes, and the difference is finish, never
 * size:
 *   FOIL  lime plate, ink glyph. Exactly the four where real SOL moved.
 *   INK   card plate, full-contrast glyph. Earned, quiet, equal in weight.

function shelfHtml(list){
  const items=Array.isArray(list)?list:[];
  if(!items.length)return "";
  const got=items.filter(a=>a.earned).length;
  const cells=items.map(a=>{

      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${g}</svg>
      <span>${esc(a.name)}</span>

    <p class="shelfnote">${got} of ${items.length} on the sheet</p>`;
}

// The Oddie Score hero: a ring/gauge filled to score/1000, the number counted
// up on first paint (see the countUp() call right after each profile renders).
// id="scoreringnum" is safe to reuse across the private/public views — they
// never coexist in the DOM, same convention as #bal elsewhere in this file.
// "+16" / "−12" — a real Unicode minus on the way down, never a bare hyphen,
// so a negative delta reads as a sign rather than a stray dash.
function deltaText(n){return n>=0?`+${n}`:`−${Math.abs(n)}`}
// A brief "+16"/"−9" pill pinned to the score ring's corner, fading on its own
// CSS timer (see .score-delta). Skipped under reduced motion — same convention
// as countUp: no motion at all rather than a motionless flash.
function showScoreDeltaChip(ringEl,delta){
  if(!ringEl||!delta||REDUCE_MOTION)return;
  const chip=document.createElement("span");
  chip.className=`score-delta ${delta>=0?"up":"down"}`;
  chip.textContent=deltaText(delta);
  ringEl.appendChild(chip);
  setTimeout(()=>chip.remove(),1800);
}
// The score this browser tab has already SHOWN once this page-load — private
// profile only (see the isMine guard in animateOscore below; a public profile
// can show anyone's score, and comparing it against what this tab last showed
// on ITS OWN profile would be a meaningless, wrong delta). null on a fresh
// load, and again whenever the celebration takeover reports a fresher score,
// so a private-profile view right after a celebration renders the settled
// number plainly instead of re-animating a delta the user just watched happen.
let sessionSeenScore=null;
/** Count the ring's number up to the real score, right after the profile HTML
 *  lands in the DOM. First time this session (or on the public profile, always):
 *  the plain from-zero reveal, as before. On the private profile, a SECOND
 *  reading that differs from what this tab already showed animates old→new
 *  and drops the delta chip — the score visibly moving, not silently updating. */
function animateOscore(scroller,score,hasEnough,isMine){
  // A zero score is a real reading on a loudness ladder, not a missing one, so
  // it counts up to 0 and stays there rather than leaving the ring blank.
  score=Number(score)||0;
  const el=scroller.querySelector("#scoreringnum");
  if(!isMine||sessionSeenScore==null){
    countUp(el,score,{duration:850});
  }else if(sessionSeenScore!==score){
    countUp(el,score,{duration:850,from:sessionSeenScore});
    showScoreDeltaChip(scroller.querySelector("#scorering"),score-sessionSeenScore);
  }else{
    el.textContent=score;
  }
  if(isMine)sessionSeenScore=score;
}


/**
 * What the loud multiplier is, and what moves it.
 *
 * A badge that only appears once earned tells the people who have it something
 * they already know and the people who do not nothing at all. The rung ABOVE
 * where you stand is the part that changes behaviour, so this line always
 * names it.
 */
/* WHAT YOU BROUGHT IN — the loud half of a profile, which had no place on it.
 *
 * Everything above this on the page measures how well you PREDICT. Nothing
 * measured what the product actually runs on: markets you put here, and the
 * people who showed up to play them. That axis existed on the home rail and on
 * the creator board, which are the two places you look at everyone else, and
 * was missing from the one page you open to look at yourself.
 *
 * "People reached" is the number worth returning for, and it is the only one on
 * the profile that moves while you are away: your accuracy changes when YOU
 * call, your reach changes when OTHER people do. That is the honest version of
 * a reason to come back, and it is the same number the 2% is paid on, so the
 * incentive and the metric are the same object rather than two claims that have
 * to agree.
 *
 * Rendered at zero rather than hidden. A zero next to a sentence describing the
 * payoff is the clearest statement of what to do next; hiding the block would
 * leave someone who has never tagged with no idea the axis exists. Same
 * reasoning the creator panel on the home rail already follows. */
const SOL=(l)=>{const n=(Number(l)||0)/1e9;return n>=1?n.toFixed(2):n>0?n.toFixed(3):"0";};



// What a person brags about, in one place. Three separate Share buttons each
// built their own accuracy sentence, and when accuracy died all three published
// "null% accuracy" to X under the user's name. One source now, and it can only
// say things the ladder actually knows.
function loudBrag(acc){
  if(!acc)return "";
  const made=Number(acc.marketsCreated)||0, mult=Number(acc.loudMultiplier)||1;
  if(made>0){
    const p=[`${made} market${made===1?"":"s"} tagged`];
    if(mult>1)p.push(`${mult}x loud`);
    return p.join(" · ");
  }
  const sc=Number(acc.oddieScore)||0;
  return sc>0?`${sc} oddies earned`:"";
}

/**
 * Real rows: this device's calls, straight from the server. Potential win is
 * computed from the odds AT LOCK TIME (pct_at), so a position never appears to
 * change value because the market moved afterwards. Everything is pending —
 * resolution doesn't exist yet and the copy says only that.
 */
/**
 * Positions is the screen the exit decision is made on, so it has to show the
 * two numbers that decision is made from: what you paid, and what it is worth
 * now. Everything else here is derived from those.
 *
 * Reputation sits at the top rather than the bottom because it is the score,
 * and because it is allowed to be negative — a screen that only ever shows a
 * green number is not measuring anything.
 */
async function loadPositions(scroller){
  scroller.innerHTML='<div class="state">loading your calls…</div>';
  try{
    const r=await fetch(`${API}/api/positions?deviceId=${encodeURIComponent(deviceId)}`);
    if(!r.ok)throw new Error("positions "+r.status);
    const d=await r.json();
    balance=d.tokens;paintBalance();
    if(!d.open.length && !d.closed.length){
      scroller.innerHTML=`<div class="sheet">
        <p class="sub">Your calls on this device land here.</p>
        <div class="state">Nothing yet. Open the feed and put SOL on one.</div>
      </div>`;
      return;
    }
    // History newest-first, and the running totals derived from it: net predictions
    // won/lost across every closed position, and a win rate over the ones that
    // actually SETTLED (a sold-early exit is neither a win nor a loss).
    const history=[...d.closed].sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt));
    const net=history.reduce((s,p)=>s+(p.proceeds-p.tokens),0);
    const settledArr=history.filter(p=>p.exitPct===100||p.exitPct===0);
    const wins=settledArr.filter(p=>p.exitPct===100).length;
    const winRate=settledArr.length?Math.round(100*wins/settledArr.length):null;
    const netStr=`${net>0?"+":net<0?"−":"±"}${Math.abs(net)}`;
    scroller.innerHTML=`<div class="sheet">
      <p class="sub">Your calls on this device. Sell any time at the market's current odds, or hold to resolution.</p>
      ${repHTML(d.overall,d.byCategory)}
      <div class="summary">
        <div class="tile"><div class="v num ${cls(net)}">${netStr}</div><div class="k">NET TOKENS</div></div>
        <div class="tile"><div class="v num">${winRate===null?"—":winRate+"%"}</div><div class="k">${settledArr.length?`WIN RATE · ${wins}/${settledArr.length}`:"WIN RATE"}</div></div>
      </div>
      ${d.open.length?`<h2 class="psec">Open · ${d.open.length}</h2>${d.open.map(openHTML).join("")}`:""}
      ${history.length?`<h2 class="psec">History · ${history.length}</h2>${history.map(historyHTML).join("")}`:""}
    </div>`;
    scroller.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>sellPosition(b,scroller));
    // The victory/defeat card — resolution (or an early exit) as content, out to
    // their timeline. Every closed row is shareable, not just the settled ones.
    scroller.querySelectorAll("[data-share]").forEach(b=>b.onclick=async(e)=>{
      const side=b.dataset.side.toUpperCase(), entry=b.dataset.entry, exit=b.dataset.exit, kind=b.dataset.kind;
      let url,slug;
      try{const r=await fetch(`${API}/api/position/${b.dataset.share}/sharelink`,{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
        const j=await r.json();if(j.ok){url=j.url;slug=(url.match(/market\/([^?]+)/)||[])[1];}}catch(err){}
      if(!url)return;
      const text=kind==="won"?`called ${side} at ${entry}% — and it hit`
        :kind==="lost"?`took ${side} at ${entry}% — market said no`
        :`sold my ${side} — in at ${entry}%, out at ${exit}%`;
      shareMarket({slug,url,anchor:e.currentTarget,source:"settled",text});
    });
  }catch(e){
    console.error(e);
    scroller.innerHTML='<div class="state">couldn’t load your calls. Try again in a moment.</div>';
  }
}

/** Percentage points, always signed. +0 is a real answer and reads as "flat". */
const pts=(n)=>`${n>0?"+":n<0?"−":"±"}${Math.abs(Math.round(n*10)/10)}%`;
const cls=(n)=>n>0?"up":n<0?"down":"flat";

function repHTML(overall,byCat){
  if(overall.avgEdge===null)
    return `<div class="rep"><div class="repnum flat">—</div>
      <div class="repwho"><b>Reputation</b><span>Close a position to get a number. It can go down.</span></div></div>`;
  const tag=overall.provisional
    ? `<span class="prov">🌱 provisional · ${overall.closed}/10</span>`
    : `<span class="prov done">${overall.closed} closed</span>`;
  const cats=byCat.filter(c=>c.avgEdge!==null).slice(0,3)
    .map(c=>`<span class="catedge ${cls(c.avgEdge)}">${esc(c.category)} ${pts(c.avgEdge)}</span>`).join("");
  return `<div class="rep">
    <div class="repnum ${cls(overall.avgEdge)}">${pts(overall.avgEdge)}</div>
    <div class="repwho"><b>Reputation</b><span>average edge per call ${tag}</span>
      ${cats?`<div class="cats">${cats}</div>`:""}</div>
  </div>`;
}

function openHTML(p){
  const live = p.nowPct!==null;
  // "Called YES at 39% · now 44% ↑ (+5%)" — the whole hold-or-sell argument,
  // in one line, in the order you'd say it out loud.
  const track = live
    ? `Called ${p.side.toUpperCase()} at ${p.entryPct}% · now ${p.nowPct}% ${p.edgeNow>0?"↑":p.edgeNow<0?"↓":"→"} <b class="${cls(p.edgeNow)}">${pts(p.edgeNow)}</b>`
    : `Called ${p.side.toUpperCase()} at ${p.entryPct}% · the venue isn't quoting this right now`;
  return `<div class="tile">
    <p class="q">${esc(displayTitle(p.question))}</p>
    <div class="pmeta">
      <span class="side-chip ${p.side}">${p.side.toUpperCase()}</span>
      <span class="num">called at ${p.entryPct}%</span>
      <span class="status">open</span>
    </div>
    <p class="track">${track}</p>
  </div>`;
  // The stake line and the Sell button are gone with the cost of a call. A
  // free position stakes nothing, so "1 prediction" described nothing and
  // selling could only ever return zero — a button that cannot do anything
  // for anyone. What an open call has instead is the thing that always
  // mattered: the price it was taken at, which is what the record is scored
  // against. Closing still exists server-side for old positions.
}

/**
 * One row of history. The verdict is the loud part — a coloured chip and a rail,
 * "called it ✓" / "market said no" / "sold early" — and the ledger (entry→exit,
 * predictions in→out, edge) sits under it for anyone who wants the receipt. Every row
 * is shareable, win OR loss: the defeat card is as much a part of the game as the
 * victory one. exit 100 = your side resolved true, 0 = false, anything between =
 * you sold before it settled; the market's own YES/NO follows from your side.
 */
function historyHTML(p){
  const settled=p.exitPct===100||p.exitPct===0;
  const won=p.exitPct===100;
  const kind=settled?(won?"won":"lost"):"sold";
  const badge={won:"called it ✓",lost:"market said no",sold:"sold early"}[kind];
  const marketYes=(p.side==="yes")===won; // only meaningful when settled
  const how=settled?`resolved ${marketYes?"YES":"NO"}`:"sold early";
  const delta=p.proceeds-p.tokens;
  const deltaStr=`${delta>0?"+":delta<0?"−":"±"}${Math.abs(delta)}`;
  return `<div class="htile ${kind}">
    <div class="hhead">
      <span class="hbadge ${kind}">${badge}</span>
      <span class="hwhen">${agoOf(p.closedAt)}</span>
    </div>
    <p class="q">${esc(p.question)}</p>
    <div class="hrow2">
      <span class="side-chip ${p.side}">${p.side.toUpperCase()}</span>
      <span>${p.entryPct}% → ${p.exitPct}% · ${how}</span>
    </div>
    <div class="hfoot">
      <span class="hio">${p.tokens} → ${p.proceeds} predictions <b class="${cls(delta)}">${deltaStr}</b></span>
      <span class="${cls(p.edge)}">edge ${pts(p.edge)}</span>
      <button class="hshare" data-share="${p.id}" data-side="${p.side}" data-entry="${p.entryPct}" data-exit="${p.exitPct}" data-kind="${kind}" aria-label="Share this call">${SHARE_ICON}</button>
    </div>
  </div>`;
}

/**
 * Sell. The button is disabled the instant it is pressed, because the second
 * press would be a second sale of the same position — the server refuses it,
 * but a UI that lets you try is a UI that looks broken when it does.
 */
async function sellPosition(btn,scroller){
  const id=btn.dataset.sell;
  btn.disabled=true;btn.textContent="Selling…";
  let j={};
  try{
    const r=await fetch(`${API}/api/position/${id}/sell`,{method:"POST",
      headers:{"content-type":"application/json"},body:JSON.stringify({deviceId})});
    j=await r.json().catch(()=>({reason:"server-error"}));
    if(r.ok&&j.ok){
      balance=j.balance;paintBalance(true);
      ev("sell",{slug:null,side:null});
      showSellResult(btn,j,scroller); // a visible, satisfying result — not a silent re-render
      return;
    }
  }catch(e){console.error(e);j={reason:"network"};}
  // Two kinds of failure. TRANSIENT ones (odds refreshing, a server hiccup, a
  // dropped connection) are worth another tap, so the button re-enables and says
  // so. STRUCTURAL ones (the market isn't trading, the row is already gone) will
  // NOT change on a retry — inviting one is the lie we're removing — so they
  // replace the button with an honest, non-clickable note.
  const TRANSIENT={"stale-odds":"Odds are refreshing. Tap to try again.",
    "server-error":"Something went wrong. Tap to try again.",
    "network":"Couldn't reach the server. Tap to try again."};
  const STRUCTURAL={
    "unpriced":"This market isn't quoted right now, so you can't sell until it's trading again.",
    "no-entry-price":"No entry price on record for this one, so it can't be priced to sell.",
    "already-closed":"Already sold.","not-found":"That position is gone.",
    "not_allowed":"Selling isn't available on this account yet."};
  if(TRANSIENT[j.reason]){btn.textContent=TRANSIENT[j.reason];btn.disabled=false;return;}
  const note=document.createElement("p");
  note.className="sellnote";
  note.textContent=STRUCTURAL[j.reason]||"Couldn't sell this position right now.";
  btn.replaceWith(note);
}

/**
 * The close, made visible. Selling used to just silently re-render the screen;
 * now the tap lands on a result — "Sold ✓ 50 → 74 predictions (+48%)", the edge on the
 * record — the same beat as the one-tap call's locked state. No confirm dialog
 * (the sell already happened); a Done button and a 6s timer both fold it back
 * into History, where the row now lives.
 */
function showSellResult(btn,j,scroller){
  const stake=j.stake, proceeds=j.proceeds, delta=proceeds-stake;
  const pct=stake?Math.round((proceeds/stake-1)*100):0;
  const tone=delta>0?"up":delta<0?"down":"flat";
  const el=document.createElement("div");
  el.className="sellresult "+tone;
  el.innerHTML=`
    <div class="srtop"><span class="srtick">Sold ✓</span>
      <span class="srdelta ${tone}">${delta>0?"+":delta<0?"−":"±"}${Math.abs(delta)}</span></div>
    <div class="srnums">${stake} → <b>${proceeds}</b> predictions · <b class="${tone}">${pct>0?"+":pct<0?"−":"±"}${Math.abs(pct)}%</b></div>
    <div class="srsub">edge ${pts(j.edge)} recorded${delta>0?" — nice exit 🎯":delta<0?" — cut it, no shame":""}</div>
    <button class="srdone">Done</button>`;
  btn.replaceWith(el);
  let done=false;
  const finish=()=>{if(done)return;done=true;loadPositions(scroller);};
  el.querySelector(".srdone").onclick=finish;
  setTimeout(finish,6000);
}


/**
 * Real standings, ranked by average edge — the same number Positions shows you.
 * Not by predictions won: a leaderboard of that is a leaderboard of who started
 * earliest and called most often, which is a fact about time, not about judgement.
 *
 * Provisional players are listed and marked, never hidden. They sort below
 * everyone whose number has settled, so two lucky scalps cannot take the top.
 */
let lbTab="edge";
async function loadLeaderboard(scroller){
  scroller.innerHTML='<div class="state">counting edges…</div>';
  try{
    const r=await fetch(`${API}/api/leaderboard?deviceId=${encodeURIComponent(deviceId)}`);
    if(!r.ok)throw new Error("leaderboard "+r.status);
    const data=await r.json();
    // Same one-shot rank-movement fetch as the private profile — visiting
    // EITHER counts as "you looked at your standing", so whichever the user
    // opens first consumes it; the other then correctly shows nothing.
    try{const rr=await fetch(`${API}/api/rank-movement?deviceId=${encodeURIComponent(deviceId)}`);if(rr.ok)data.rankMove=(await rr.json()).movement;}catch(e){}
    renderLb(scroller,data);
  }catch(e){
    console.error(e);
    scroller.innerHTML='<div class="state">couldn’t load the standings. Try again in a moment.</div>';
  }
}
/**
 * "Your standing" — where the viewer actually is, what tier that earns, and
 * the line they'd post. This is the payoff surface for accuracy: the boards
 * below show who's winning, this shows what being right has made YOU.
 *
 * Three honest states, never a flattering fourth:
 *   - tiered: the claimable noun ("Loudest"), the percentile, the brag, share.
 *   - ranked but untiered: the rank, and what it takes to reach the next tier.
 *   - provisional: how many more resolved calls before any of it counts.
 */
function standingHtml(you){
  if(!you) return "";
  const share=(txt)=>`<button class="standing-share" data-standing-share="${esc(txt)}">Post this to X</button>`;
  // The empty state used to count down resolved calls to a rank. Nothing
  // resolves calls any more, so it was a countdown that could never reach zero.
  // One tag is the whole entry price, so it says that instead.
  if(!you.hasEnough){
    return `<div class="standing pending">
      <div class="standing-tier">Not on the board yet</div>
      <div class="standing-sub">Tag <b>@oddiefun</b> under an argument on X. <b>One market</b> puts you on it.</div>
    </div>`;
  }
  const pct=you.rank?you.rank.topPct:null;
  const tier=you.tier;
  const line=`${you.flexLine} — oddie.fun/@${you.handle}`;
  if(tier){
    return `<div class="standing">
      <div class="standing-tier">🏆 ${esc(tier.label)}</div>
      <div class="standing-rank">${pct!=null?`Top ${pct}%`:"Ranked"}</div>
      <div class="standing-sub">${pct!=null
        ?`#${you.rank.rank} of ${you.rank.total} ranked callers`
        :(you.rank?`#${you.rank.rank} of ${you.rank.total} ranked · ${esc(tier.blurb)}`:esc(tier.blurb))}</div>
      <div class="standing-flex">${esc(you.flexLine)}</div>
      ${share(line)}
    </div>`;
  }
  // Ranked, no tier yet. It used to say "beat the odds you take to earn Proven
  // Caller", pointing at a badge that no longer exists by a route that no
  // longer works. The entry rung is tagging, so it names that.
  return `<div class="standing pending">
    <div class="standing-tier">On the board</div>
    <div class="standing-rank">${pct!=null?`Top ${pct}%`:"Ranked"}</div>
    <div class="standing-sub">${pct!=null?`#${you.rank.rank} of ${you.rank.total} · `:""}Tag <b>@oddiefun</b> on X to climb.</div>
    <div class="standing-flex">${esc(you.flexLine)}</div>
  </div>`;
}

/* Two boards, two virtues: oddies = how loud you have been, creators = what
   your markets have paid you. The accuracy and streak boards are gone with the
   play economy that fed them. */
function renderLb(scroller,data){
  const row=(r,inner)=>`
    <div class="r${r.you?" you":""}">
      <div class="rank${r.rank<=3?" podium":""}">${r.rank}</div>
      <div class="mini"></div>
      <div class="grow"><div class="who trunc">@${esc(r.handle)}${r.you?" · you":""}</div></div>
      ${inner}
    </div>`;
  const bodies={
    // Ranked by ODDIES, which is what makes this a loudness board rather than
    // an accuracy one: calling, tagging, the crowd your market pulls in and
    // the posts you make about oddie all land in that number. The sub-line
    // says so plainly, because a board that pays for something without naming
    // it is a board nobody plays toward. The 🔥 badge appears only where a
    // multiplier has been EARNED — a permanent "1×" would read as a penalty.
    edge:{sub:"Ranked by oddies. Tag a market and it pays the most, then the crowd it pulls in, then every post you make about it. 🔥 is a loud streak.",
      empty:"Nobody is on the board yet. Tag @oddiefun on X and it is yours.",
      rows:data.rows,html:(r)=>row(r,`<div class="acc ${r.oddies>0?"up":"flat"}">${r.oddies??0}<small>${r.loudMultiplier>1?`🔥 ${r.loudMultiplier}x loud`:"oddies"}</small></div>`)},
    // The Accurate and Streak boards are gone. Both ranked play positions, and
    // real money moved to the chain: nothing writes those rows any more, so the
    // two tabs were permanently empty invitations to do something the product
    // had stopped offering.
    creators:{sub:"Ranked by creator fees earned. 2% of every market you tag, paid when it resolves. Markets created breaks ties.",
      empty:"Nobody has created a market yet. Tag a post on X and this board is yours.",
      rows:data.creators,html:(r)=>row(r,`<div class="acc ${r.earnings>0?"up":"flat"}">+${r.earnings}<small>${r.marketsCreated} market${r.marketsCreated===1?"":"s"}</small></div>`)},
  };
  const b=bodies[lbTab];
  const rm=data.rankMove;
  const rankMoveLine=rm?`<div class="rankmove ${rm.direction}" style="margin-bottom:12px">${rm.direction==="up"?"▲":"▼"} you moved ${rm.direction} ${rm.spots} spot${rm.spots===1?"":"s"} → #${rm.rank}</div>`:"";

/* Real events only. A row exists because a market this device holds resolved —
 * nothing invented, nothing "watched on your behalf" that isn't. */
function agoOf(iso){
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<90)return "just now";
  const m=Math.floor(s/60); if(m<60)return `${m}m ago`;
  const h=Math.floor(m/60); if(h<24)return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

/**
 * A settlement, as a moment worth posting. A win is loud — green rail, the payout
 * as a hero number, a prominent "Share your call 🔥". A loss is honest, not hidden:
 * "market said no", and a share button that's a shrug, not a trophy — losers post
 * too when the framing is funny rather than shaming. Any non-settle notice falls
 * back to the quiet row. The share needs a callId (the personal card); older
 * notices without one still render, just without the button.
 */
// Icon by kind for the quiet, non-settlement rows — a market resolving is a
// visually different event from "someone joined against you", so they read at
// a glance in the same list rather than blurring into one generic ✅.
const NOTICE_ICON={opposite_side:"⚔️",closing_soon:"⏰",creator_fee:"💰"};
function noticeCardHTML(n){
  const win=n.kind==="settle_win", loss=n.kind==="settle_loss";
  if(!win && !loss){
    return `<div class="tile" style="padding:2px 16px"><div class="note">
      <div class="nicon">${NOTICE_ICON[n.kind]||"✅"}</div>
      <div class="grow"><div class="ntext">${esc(n.body)}</div><div class="nwhen">${agoOf(n.at)}</div></div></div></div>`;
  }
  const share=n.slug
    ? `<button class="ncshare ${win?"win":"loss"}" data-nshare data-slug="${esc(n.slug)}" data-odds="${n.oddsPct??""}" data-outcome="${n.outcome??""}" data-win="${win?1:0}">${SHARE_ICON}<span>Share to X</span></button>`
    : "";
  return `<div class="ncard ${win?"win":"loss"}">
    <div class="nctop">
      <span class="ncbadge ${win?"win":"loss"}">${win?"🎉 you called it":"🙃 market said no"}</span>
      <span class="ncwhen">${agoOf(n.at)}</span>
    </div>
    ${win?`<div class="ncpay">+${n.delta} predictions</div>`:""}
    <p class="ncbody">${esc(n.body)}</p>
    ${share}
  </div>`;
}

/**
 * Profile is real now, and small. It answers exactly two questions: who is this
 * browser, and what has it done. The mock handle, the streak and the badges are
 * gone — none of them were true, and a screen that shows an invented "5-day
 * streak" next to a real reputation teaches the reader to distrust both.

let myEarnings=null, earningsPending=false;
/** Fetched once per load and repainted when it lands. The chain read is the
 *  slowest thing on this screen, so the record must render without waiting for
 *  it, and the guard is what stops the repaint from starting another fetch. */
function fetchEarnings(scroller){
  if(earningsPending||myEarnings)return;
  earningsPending=true;
  fetch(`${API}/api/me/earnings?deviceId=${encodeURIComponent(deviceId)}`)
    .then(r=>r.json()).then(j=>{

      myEarnings=j;
      if(document.body.dataset.view==="profile")loadProfile(scroller);
    }).catch(()=>{}).finally(()=>{earningsPending=false;});
}

/**
 * The velvet rope, client side. /feed without a pass -> back to the landing
 * (the waitlist). /market/[slug] stays viewable for everyone — the share loop
 * must not die — but the call flow swaps to "join the waitlist to play".
 * ?invite=1 (the invite email's link) shows the sign-in step instead of
 * bouncing, so an invited person can actually get through the door.
 * The server enforces the same gate on /call and /sell regardless.
 */
let GATE={allowed:false,reason:"signed_out"};
let TASTE=false; // anonymous free-taste mode: card -> picker -> card -> gate (2 free bets)
/**
 * The categories this visitor said they have takes on. Persisted in
 * localStorage, not sessionStorage: a taste is a standing preference, and
 * storing it per-tab meant every return visit re-ranked the feed from scratch and
 * the picker's answer was silently thrown away on close. sessionStorage is
 * still read as a fallback so anyone mid-session when this shipped keeps
 * their picks.
 */
const TASTE_CATS_KEY="oddie_taste_cats";
const tasteCats=()=>{
  try{
    const v=localStorage.getItem(TASTE_CATS_KEY)||sessionStorage.getItem("taste_cats")||"";
    return v.split(",").filter(Boolean);
  }catch(e){return [];}
};
const setTasteCats=(cats)=>{
  const v=cats.join(",");
  try{localStorage.setItem(TASTE_CATS_KEY,v);}catch(e){}
  try{sessionStorage.setItem("taste_cats",v);}catch(e){}
};
// The sign-in redirect, shared by the invite screen, the in-feed gate card and
// the "free taste spent" moment. `p` is the provider (twitter | google); it is
// also the gate_signin label, so the funnel can see which button converts.
function startAuth(p){
  ev("gate_signin",{cat:p});
  // A sign-in that starts on a market permalink must land back ON that market —
  // the person came to play this one. The server validates it's a local path.
  const ret=IS_MARKET_PAGE?`&return=${encodeURIComponent(location.pathname)}`:"";
  location.href=`${API}/api/auth/${p}/start?deviceId=${encodeURIComponent(deviceId)}${ret}`;
}
// The gate itself: one line of copy, X first (prominent, black), Google second.
// Reused verbatim by the interstitial card and the free-taste-spent handler so
// the two never drift. gate_shown fires once, at the caller, with its `via`.
function gateInner(){
  // The THIRD place that listed providers by hand, and the third to fall behind:
  // it offered X and Google while the product had three, exactly as the profile
  // did. It reads from PROV now, so the marks, the wording and the SET of
  // providers are the same here as on the sheet, the profile and the landing.
  //
  // The verbs differ from the sheet on purpose — this is a gate, not a settings
  // screen, so it says "sign in with" rather than "continue with".
  const btns=gateButtons();
  return `<div class="gmark"></div>
    <div class="ititle">keep calling, sign in</div>
    <div class="gatecard-btns" style="width:100%;max-width:320px;margin-top:4px">${btns}</div>
    <p class="cnote" style="max-width:300px">Free to play. Virtual predictions, nothing to cash out. Your call is saved to this device.</p>`;
}
function wireGate(root){ wireConnect(root,"data-p",b=>startAuth(b.dataset.p)); }

// The OTHER terminal gate: signed in, but the identity isn't on the list yet.
// Same position in the flow (the last card, after the taste) — the honest room,
// with hold-my-spot for Google users and the X-handle note for the rest.
function notListedInner(){
  const ident=GATE.identity||GATE.email||"your account";
  const hasEmail=!!GATE.email;
  return `<div class="gmark"></div>
    <div class="ititle" style="font-size:min(23px,5.6vw)">almost — invites<br>are rolling out</div>
    <p class="cnote" style="max-width:340px;margin:2px auto 0">You're signed in as <b>${esc(ident)}</b>.
      ${GATE.provider==="twitter"?"That X account":"That address"} isn't on the beta list yet — spots open gradually, and the list is the way in.</p>
    ${hasEmail
      ? `<button class="cbtn" id="gjoin" style="margin:16px auto 0;max-width:320px">Hold my spot on the waitlist</button><p class="cnote" id="gmsg" style="min-height:0"></p>`
      : `<p class="cnote" style="max-width:340px;margin:14px auto 0">Your spot is tracked by your X handle — we'll open it up soon. Want an email heads-up? Add one on <a href="/about" style="color:var(--link-g)">the about page</a>.</p>`}`;
}
function wireNotListed(root){
  const gj=root.querySelector("#gjoin");
  if(!gj)return;
  gj.onclick=async(e)=>{
    const b=e.currentTarget;b.disabled=true;b.textContent="Saving…";
    const msg=root.querySelector("#gmsg");
    try{
      const r=await fetch(`${API}/api/waitlist`,{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({email:GATE.email})});
      const j=await r.json().catch(()=>({}));
      msg.innerHTML=r.ok
        ? `You're on the list${j.position?` — <b>#${j.position}</b> in line`:""}. We'll email <b>${esc(GATE.email)}</b> the moment a spot opens.`
        : "Couldn't save. Try again in a moment.";
      b.textContent=r.ok?"Spot held ✓":"Hold my spot on the waitlist";
      if(!r.ok)b.disabled=false;
    }catch(err){msg.textContent="Couldn't reach the waitlist. Try again.";b.disabled=false;b.textContent="Hold my spot on the waitlist";}

}
// One dispatcher for the terminal gate, so the interstitial card and the
// free-taste-spent moment always agree. Sign-in for the signed-out; the
// not-listed room for the signed-in-but-unlisted. allowlist_denied fires here,
// at the gate — the denial that matters happens AFTER the taste, not before it.
function terminalGateInner(){return GATE.reason==="not_allowlisted"?notListedInner():gateInner();}
function wireTerminalGate(root){
  if(GATE.reason==="not_allowlisted"){wireNotListed(root);ev("allowlist_denied",{});}
  else wireGate(root);
}
const IS_MARKET_PAGE=location.pathname.startsWith("/m/")||location.pathname.startsWith("/market/");
const IS_INVITE=new URLSearchParams(location.search).get("invite")==="1";
// Render the WHOLE feed, skipping the taste interleaving. A preview/audit switch
// only: the call-rope still holds (tap shows the waitlist, the server 403s), so
// this reveals layout, never access. The layout audit navigates with it so every
// card — including the pathological long-question one — actually exists to measure.
const FULL=new URLSearchParams(location.search).get("full")==="1";
async function checkGate(){
  try{
    const r=await fetch(`${API}/api/gate?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok)GATE=await r.json();
  }catch(e){/* gate unreachable: fail closed for /feed, open for /market views */}
  if(GATE.allowed)return true;
  if(IS_MARKET_PAGE)return true; // viewable; the call flow handles the rope

  const scroller=document.getElementById("scroller");

  // The one deliberate exception to taste-first: a targeted invite link. Someone
  // we explicitly invited (and who is signed out) gets the sign-in step directly
  // rather than being re-teased with a taste they were already promised through.
  if(IS_INVITE && GATE.reason==="signed_out"){
    // Built from PROV like every other sign-in surface. This one was the FOURTH
    // screen to list providers by hand, and the guard in test-providers.ts found
    // it while being written — which is the whole reason that test exists.
    scroller.innerHTML=`<div class="sheet" style="text-align:center;padding-top:56px">
      <p class="sub" style="font-size:16px">you're invited. sign in to open the feed:</p>
      <div class="gatecard-btns" style="width:100%;max-width:320px;margin:14px auto 0">${gateButtons()}</div>
      <p class="cnote">Free to play. Virtual predictions, nothing to cash out.</p></div>`;
    wireGate(scroller);
    return false;
  }

  // TikTok-web entry: the feed IS the landing, and the gate is the LAST thing,
  // never the first. EVERYONE not already through — signed out OR signed in but
  // not on the list yet — gets the same taste: two free cards, one free call,
  // the category picker, three re-ranked cards, and only THEN the terminal gate.
  // Being signed in must not cost the taste; allowlist status only decides which
  // gate (sign-in vs. "not on the list yet") renders at the end. ?full=1 opts
  // out (preview/audit). renderFeed reads TASTE and does the interleaving.
  if(!FULL)TASTE=true;
  return true;
}

/* -------------------------------------------------- resolution celebration --
 * The emotional peak: a device that opens (or is already open) with resolved
 * positions it hasn't been SHOWN the outcome of yet gets a full-screen
 * takeover instead of learning it only from the flat notice line. Checked
 * once at boot, independent of hash routing — it layers ON TOP of whatever
 * render() produces rather than replacing it, so it works from a cold open on
 * any URL (a notification link into /m/{slug}, /feed, home, anywhere).
 *
 * Deliberately NOT gated on sign-in: deviceId already persists calls, notices,
 * accuracy and streak for every device whether or not it ever links an
 * account (see Positions/Accuracy/Leaderboard, none of which gate on auth) —
 * gating the one moment that pays off that whole reputation system behind
 * sign-in would be the one inconsistent exception, not a safer default.
 */
let celebrateQueue=[], celebrateIdx=0;
/** Above this many unseen resolutions, one digest replaces the sequence. Three
 *  is about where tapping through stops feeling like a reward and starts
 *  feeling like clearing a queue. */
const CELEBRATE_MAX_SEQUENCE=3;
// Guards the whole check+render, not just the fetch: boot can legitimately run
// this more than once in some embedding contexts (e.g. a host page that
// re-invokes the boot sequence without a real navigation), and without this a
// second call would fetch a still-unseen batch and stack a duplicate takeover
// on top of the first. One check per page life is the contract.
let celebrationsChecked=false;

async function checkCelebrations(){
  if(celebrationsChecked)return;
  celebrationsChecked=true;
  try{
    const r=await fetch(`${API}/api/celebrations?deviceId=${encodeURIComponent(deviceId)}`);
    if(!r.ok)return;
    const j=await r.json();
    const rows=Array.isArray(j.celebrations)?j.celebrations:[];
    if(!rows.length)return;
    // Wins first, per the brief; stable otherwise (Array.sort is stable), so
    // within each group they stay in the resolution order the server sent.
    celebrateQueue=rows.slice().sort((a,b)=>(a.won===b.won?0:a.won?-1:1));
    celebrateIdx=0;
    // A BACKLOG IS NOT A CELEBRATION.
    //
    // The takeover is built for the emotional peak of a call landing, and it
    // marks the batch seen only when someone reaches the end or presses the ×.
    // That is right for one or two. It is hostile for twenty-two: closing the
    // tab partway through is the normal thing to do, "seen means shown" then
    // keeps the whole batch unseen, and the modal returns on every single load
    // until somebody clicks through the lot. Which is what happened.
    //
    // So past a handful it stops being a sequence and becomes one receipt: what
    // resolved, how much of it you got right, and a way to the detail. Same
    // information, one dismissal, and the peak is preserved for the case it was
    // designed for.
    if(celebrateQueue.length>CELEBRATE_MAX_SEQUENCE)renderCelebrationDigest();
    else renderCelebration();
  }catch(e){/* the celebration just doesn't fire this load; nothing else depends on it */}
}

/** The ONLY place unseen celebrations become seen — always a full batch, fired
 *  from the × or from finishing the sequence, never from fetching. A device
 *  that closes the tab mid-sequence sees the remainder again next time, which
 *  is correct: "seen" means shown, not sent. */
function markCelebrationsSeen(){
  if(!celebrateQueue.length)return;
  const noticeIds=celebrateQueue.map(c=>c.noticeId);
  const body=JSON.stringify({deviceId,noticeIds});
  // sendBeacon over fetch: this fires from the SAME dismiss action a user might
  // immediately follow by closing the tab (the celebration is, by design, the
  // very last thing on screen). The same "must survive page unload" reasoning
  // PENDING_CALLS' pagehide handler already uses — a fire-and-forget fetch
  // that gets cancelled mid-flight is indistinguishable from this celebration
  // replaying forever, since seen_at never gets written either way.
  try{
    if(navigator.sendBeacon&&navigator.sendBeacon(`${API}/api/celebrations/seen`,new Blob([body],{type:"application/json"})))return;
  }catch(e){/* fall through to fetch */}
  fetch(`${API}/api/celebrations/seen`,{method:"POST",headers:{"content-type":"application/json"},body,keepalive:true}).catch(()=>{});
}
function closeCelebration(){
  document.getElementById("celebrateDim")?.remove();
  markCelebrationsSeen();
  celebrateQueue=[];celebrateIdx=0;
}

/** The backlog case: one card, everything in it, gone in one tap. */
function renderCelebrationDigest(){
  document.getElementById("celebrateDim")?.remove();
  const rows=celebrateQueue, n=rows.length;
  const won=rows.filter(c=>c.won).length;

  const dim=document.createElement("div");dim.className="celebrate-dim";dim.id="celebrateDim";
  const card=document.createElement("div");card.className=`celebrate-card ${won>0?"win":"loss"}`;
  card.innerHTML=`
    <button class="celebrate-x" type="button" aria-label="Close">✕</button>
    <div class="celebrate-body">
      <div class="cel-badge ${won>0?"win":"loss"}">While you were away</div>
      <div class="cel-q">${n} of your calls resolved</div>
      <div class="cel-callrow">
        <span class="cel-side yes">${won} right</span>
        <span class="cel-resolved">${n-won} wrong</span>
      </div>

      <div class="cel-ctas">
        <button class="cel-cta share" type="button" id="celDigestGo">See them all</button>
      </div>
    </div>
    <button class="celebrate-next" type="button">Done</button>`;
  dim.appendChild(card);
  document.body.appendChild(dim);
  card.querySelector(".celebrate-x").onclick=closeCelebration;
  card.querySelector(".celebrate-next").onclick=closeCelebration;
  card.querySelector("#celDigestGo").onclick=()=>{closeCelebration();location.hash="#/positions";};
  ev("celebrate_digest",{count:n,won:won});
}

function renderCelebration(){
  document.getElementById("celebrateDim")?.remove();
  const c=celebrateQueue[celebrateIdx];
  if(!c){closeCelebration();return;}
  const n=celebrateQueue.length, isLast=celebrateIdx===n-1;
  const scoreKnown=c.scoreAfter!=null;

  const dim=document.createElement("div");dim.className="celebrate-dim";dim.id="celebrateDim";
  const card=document.createElement("div");card.className=`celebrate-card ${c.won?"win":"loss"}`;
  card.innerHTML=`
    <button class="celebrate-x" type="button" aria-label="Close">✕</button>
    ${n>1?`<div class="celebrate-dots">${celebrateQueue.map((_,i)=>`<span class="${i===celebrateIdx?"on":""}"></span>`).join("")}</div>`:""}
    ${c.won?'<div class="celebrate-confetti" id="celConfetti" aria-hidden="true"></div>':""}
    <div class="celebrate-body">
      <div class="cel-badge ${c.won?"win":"loss"}">${c.won?"CALLED IT ✓":"Not this time"}</div>
      <div class="cel-q">${esc(c.question)}</div>
      <div class="cel-callrow">
        <span class="cel-side ${c.side}">${c.side.toUpperCase()} at ${c.oddsPct}%</span>
        ${!c.won?`<span class="cel-resolved">resolved ${c.outcome.toUpperCase()}</span>`:""}
      </div>

      ${scoreKnown?`
      <div class="cel-oscore">
        <div class="scorering big" id="celRing" style="--score-pct:${c.scoreBefore/1000}">
          <div class="scorering-inner">
            <div class="scorering-num" id="celScoreNum">${c.scoreBefore}</div>
            <div class="scorering-lab">ODDIES</div>
          </div>
        </div>
      </div>`:""}
      ${c.won&&c.streakExtended?`<div class="cel-streak">🔥 ${c.streakAfter}-call streak</div>`:""}
      ${c.won?`
      <div class="cel-ctas">
        <button class="cel-cta share" type="button">Share your call ✓</button>
        <button class="cel-cta challenge" type="button">Challenge someone</button>
      </div>`:""}
    </div>
    <button class="celebrate-next" type="button">${isLast?"Done":`Next (${celebrateIdx+2}/${n})`}</button>`;
  dim.appendChild(card);
  document.body.appendChild(dim);

  const advance=()=>{
    if(isLast)closeCelebration();
    else{celebrateIdx++;renderCelebration();}
  };
  card.querySelector(".celebrate-x").onclick=closeCelebration;
  card.querySelector(".celebrate-next").onclick=advance;
  // Tap the body (not a button inside it) also advances — the "tap through" the
  // brief asks for; the explicit button above covers keyboard/screen-reader use.
  card.querySelector(".celebrate-body").onclick=(e)=>{ if(!e.target.closest("button"))advance(); };
  // A light left-swipe does the same on touch. Forward-only: the queue has no
  // "back", so a right-swipe is simply ignored rather than wired to nothing.
  let touchX=null;
  card.addEventListener("touchstart",(e)=>{touchX=e.touches[0].clientX;},{passive:true});
  card.addEventListener("touchend",(e)=>{
    if(touchX==null)return;
    const dx=e.changedTouches[0].clientX-touchX; touchX=null;
    if(dx<-40)advance();
  },{passive:true});

  // The score moved either way — "show what their score did" is explicit in
  // the brief for a loss too, not just a win. Runs for both; only the CTAs and
  // confetti are win-exclusive.
  if(scoreKnown)animateCelebrationScore(card,c.scoreBefore,c.scoreAfter);

  if(c.won){
    // Same resolution-receipt language loadNotices already uses for the flat
    // notice's own share button — one copy convention for "I called it",
    // whether the tap came from here or from Notifications.
    card.querySelector(".cel-cta.share").onclick=()=>{
      const text=`called it at ${c.oddsPct}% → resolved ${c.outcome.toUpperCase()}. +${c.proceeds} predictions on oddie`;
      xShare(text, myHandle?`${SHARE_ORIGIN}/@${myHandle}`:`${SHARE_ORIGIN}/m/${c.slug}`, "celebrate_share");
    };
    // Same targeting + intent pattern as the permalink's "Challenge the other
    // side" button — aimed at the market's source tweet author when known.
    card.querySelector(".cel-cta.challenge").onclick=()=>{
      const handle=(c.challengeHandle||"").replace(/^@+/,"");
      const text=(handle?`@${handle} `:"")+`called it at ${c.oddsPct}% — resolved ${c.outcome.toUpperCase()}. Think you can call the next one?`;
      xShare(text, `${SHARE_ORIGIN}/m/${c.slug}`, "celebrate_challenge");
      ev("challenge_click",{slug:c.slug,targeted:!!handle,source:"celebrate"});
    };
    spawnConfetti(document.getElementById("celConfetti"));
  }
}

/** The ring's conic-gradient sweep and the number count up together, same
 *  easing as countUp() — a --score-pct custom property isn't natively
 *  animatable via CSS transition without @property, so this drives both by
 *  hand in one rAF loop instead of half-animating with countUp() alone. */
function animateCelebrationScore(card,from,to){
  const ring=card.querySelector("#celRing"), numEl=card.querySelector("#celScoreNum");
  // The celebration is the FIRST place a resolution's score change is ever
  // shown, so it's also where sessionSeenScore starts — a private-profile view
  // later this session compares against this, not against a stale pre-resolution
  // number (see animateOscore).
  sessionSeenScore=to;
  if(REDUCE_MOTION){
    ring?.style.setProperty("--score-pct",to/1000);
    if(numEl)numEl.textContent=to;
    return;
  }
  if(ring&&from!==to)showScoreDeltaChip(ring,to-from);
  const dur=900,start=performance.now(),ease=(t)=>1-Math.pow(1-t,3);
  const step=(now)=>{
    const t=Math.min(1,(now-start)/dur), val=from+(to-from)*ease(t);
    ring?.style.setProperty("--score-pct",(val/1000).toFixed(4));
    if(numEl)numEl.textContent=Math.round(val);
    if(t<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/** Confined to the card (CSS clips via overflow:hidden on .celebrate-card.win),
 *  not the viewport — restrained, per the brief, not a screen-wide cannon. */
function spawnConfetti(container){
  if(!container||REDUCE_MOTION)return;
  const colors=["#D7DC1F","#f5cf6b","#7fe0a4","#f2a3b4","#ffffff"];
  for(let i=0;i<28;i++){
    const p=document.createElement("span");p.className="confetti-piece";
    const delay=Math.random()*220, dur=900+Math.random()*500, rot=360+Math.random()*360;
    p.style.left=(Math.random()*100)+"%";
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=delay+"ms";
    p.style.animationDuration=dur+"ms";
    p.style.setProperty("--rot",rot+"deg");
    container.appendChild(p);
    setTimeout(()=>p.remove(),delay+dur+50);
  }
}

/* ------------------------------------------------------ first-visit welcome --
 * FOMO's onboarding rule, borrowed deliberately: ask for identity up front,
 * never require it. Shown once per browser, and only at the app's own front
 * door (/feed, no hash). Every other arrival is somebody mid-errand: /m/{slug}
 * and /@handle came from a shared link and must land on the thing that was
 * shared, /feed#/... is a deep link into a view, and a connected account has
 * nothing to be welcomed into. It also defers to connectInvite and authReturn,
 * which handle someone who arrived already mid-sign-in.
 *
 * The seen flag is written when the sheet is SHOWN, not when it is dismissed:
 * a welcome that re-arms itself until you comply is a nag wearing a greeting's
 * clothes. In private browsing, where the flag cannot be written, it never
 * shows at all, because showing it on every visit is the same nag.
 */
function maybeWelcome(){
  if(location.pathname!=="/feed"||location.hash)return;
  if(auth.accounts.length)return;
  try{
    if(localStorage.getItem("oddie_welcomed"))return;
    localStorage.setItem("oddie_welcomed","1");
  }catch(e){return;}
  connectSheet(null,{welcome:true});
}

(async()=>{
  const ok=await checkGate();
  if(ok){
    try{sessionStorage.removeItem("gate_oauth");}catch(e){}
    render();loadAuth().then(loadBalance).then(()=>{ if(!connectInvite()&&!authReturn())maybeWelcome(); });
    checkCelebrations(); // independent of render()/routing — layers on top, never blocks
    initChainLayer(); // fire-and-forget, opt-in real-stakes layer — see its own doc comment
  }
})();

// One per page load, not per category switch — a chip is not a new arrival.
// `slug` carries the door they came through, so "arrived from a tweet" can be
// separated from "opened /feed directly".
ev("feed_view", startSlug ? { slug: startSlug } : {});
</script>
