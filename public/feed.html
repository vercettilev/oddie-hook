<title>oddie</title>
<meta name="color-scheme" content="light dark">
<!-- Favicon + touch/PWA icons. Absolute paths: oddie.fun points straight at this
     Express service on Railway, which serves the icons from ./public. One origin,
     no proxy in front, so a favicon can't 404 on a forgotten rewrite. -->
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest?v=2">
<meta name="theme-color" content="#D7DC1F">
<meta name="description" content="Oddie turns any claim on X into a market and keeps score of who's actually right. Tag @oddiefun under any claim.">
<!-- SHARE-PREVIEW-BLOCK-START
     The bare oddie.fun / feed link's card. A market permalink (/m/[slug],
     /market/[slug]) needs this GONE, not merely outranked: marketPageHtml()
     (src/server.ts) used to just inject its own og/twitter tags right after
     <title> and leave this block sitting further down, on the assumption
     that "the per-market ones come first, so they win." That assumption was
     never checked against X and was wrong there. A real reply's card
     unfurled as this generic banner (68%/32% placeholder odds, no question)
     instead of the market's own card. Nine properties end up duplicated
     with conflicting values (og:type/site_name/title/description/image,
     twitter:card/title/description/image) whenever both blocks are present,
     and which one a given crawler honors isn't something this file can
     assume. marketPageHtml() now regex-strips everything between these two
     markers before injecting its own tags, so a market page ships exactly
     one value per property, never two competing ones. Keep this whole
     comment-to-comment span as one contiguous block: the strip is a single
     regex across these exact marker strings. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="oddie">
<meta property="og:title" content="Someone's wrong on X? Prove you're right.">
<meta property="og:description" content="Oddie turns any claim on X into a market and keeps score of who's actually right. Tag @oddiefun.">
<meta property="og:image" content="https://oddie.fun/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Someone's wrong on X? Prove you're right.">
<meta name="twitter:description" content="Oddie turns any claim on X into a market and keeps score of who's actually right. Tag @oddiefun.">
<meta name="twitter:image" content="https://oddie.fun/og.png">
<!-- SHARE-PREVIEW-BLOCK-END -->
<script>
  /* Before any CSS is applied, so the page never flashes the wrong theme at
     someone who chose dark. A stored choice wins; otherwise follow the system.
     Wrapped because private browsing can throw on localStorage access. */
  (function(){
    var t=null; try{ t=localStorage.getItem("oddie_theme"); }catch(e){}
    var dark = t==="dark" || (t!=="bright" && matchMedia("(prefers-color-scheme:dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "bright";
  })();
</script>
<!-- Brand fonts, SELF-HOSTED. No Google Fonts link, no preconnect, no third
     party in the critical path at all: the faces ship from this origin, so a
     blocked, slow or unreachable fonts.googleapis.com can no longer leave the
     page stuck on a fallback face.
     Each file is the VARIABLE font (what Google actually served — the four
     per-weight URLs it returned were byte-identical), so one file per family
     per subset covers every weight the CSS below asks for. The declared
     `font-weight` RANGES are deliberately clamped to the exact set Google was
     serving (Fredoka 400-700, Nunito 400-800) so rendering is unchanged: a
     rule asking for Fredoka 800/900 or Nunito 900 clamps to the top of the
     range here, exactly as it clamped to the heaviest available face before.
     latin-ext is kept because market questions carry Turkish text (ş, ğ, İ)
     that the latin subset alone does not cover. -->
<style>
  @font-face{font-family:'Fredoka';font-style:normal;font-weight:400 700;font-display:swap;
    src:url('/fonts/fredoka-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Fredoka';font-style:normal;font-weight:400 700;font-display:swap;
    src:url('/fonts/fredoka-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:400 800;font-display:swap;
    src:url('/fonts/nunito-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:400 800;font-display:swap;
    src:url('/fonts/nunito-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}


  /* Two families of colour, and the whole dark theme is the line between them.
   *
   * SURFACE tokens paint the things that carry the brand: a white fill inside a
   * chunky black outline. `--white`, `--ink`, `--wash`, `--bar`, `--accent` and
   * `--muted` belong to that family and DO NOT MOVE between themes. The YES/NO
   * rows, the tiles, the picker, the sheets and the desktop frame are all made
   * of them, so they look identical in both themes — which is the point. The
   * shared card on X is white with a black outline, and the app agrees with it.
   *
   * GROUND tokens paint what is behind and around those objects: the page, the
   * header, the tab bar, the rail, and any text that sits directly on them with
   * no surface underneath. Only these change.
   *
   * A rule that reaches for `--muted` inside a white tile is right. A rule that
   * reaches for it on the ground is a bug in dark mode — that is what `--muted-g`
   * is for. */
  :root{--accent:#D7DC1F;--ink:#000;--white:#fff;--muted:#6B7A88;--wash:#F7F9DC;--bar:#E7EDF2;
    --acc-deep:#5A6109; --acc-mid:#6B720E; --acc-deeper:#454A06;
    /* ground, bright */
    --ground:#fff; --ground-wide:#F6F9E0; --ground-2:#fff; --fade:#fff;
    /* --muted-g darkened #6B7A88 -> #5E6975: the old value FAILED WCAG AA on
       both bright-theme surfaces it actually sits on — 4.30:1 on the card
       (--card-surface #FBFDF6) and 3.80:1 on the feed ground (#E9F2D2), against
       a 4.5:1 floor. It carries the market card's status chips, .social, .psec
       and the section labels, all small text, so it was the one real contrast
       failure on the card. Now 5.46:1 / 4.82:1 — passing with headroom rather
       than scraping the line. Dark theme was already fine (5.64:1). */
    --on-ground:#000; --muted-g:#5E6975; --line-g:#000; --hair-g:#E7EDF2;
    --chip-bg:#fff; --chip-bd:#E3E8A6; --link-g:#5E660B;

    --col:560px;      /* the card column, shared by the header and the cards */
    --feedcol:500px;  /* the centred feed column (chips + cards) on every width */
    --rail:248px;     /* desktop left nav */
    --tabh:62px;      /* mobile bottom tab bar */
    /* Feed depth: the card is an elevated GROUND panel the white SURFACE tiles
       float on. `--feed-ground` sits behind the card so it reads as liftable. */
    --feed-ground:#ECEFD6; --card-surface:#FBFCF4; --card-line:#D3D8BE;
    --card-shadow:0 2px 5px rgba(35,55,15,.05), 0 12px 26px rgba(45,65,20,.11), 0 30px 56px rgba(45,65,20,.08);
    /* The fixed chrome's REAL height — the header PLUS the guest bar when it's
       showing, because the bar renders INSIDE .top rather than as its own
       fixed strip. That structure is the actual fix for the bar overlapping
       the header: in normal flow inside the header it cannot cover it, no
       matter what either one's height does. measureChrome() overwrites this
       with the measured px on every layout change; the literal below is only
       the pre-JS first-paint fallback. Everything that has to clear the
       chrome derives from this ONE value, so there is a single number to get
       right instead of three hardcoded guesses drifting apart (this used to
       be a 96px guess here, an 82px guess on .homewrap, and a separately
       measured inline `top` on the bar — all for the same ~70px header). */
    --chromeh:calc(env(safe-area-inset-top) + 70px);
    --feedtop:calc(var(--chromeh) + 26px);
    /* ---------------------------------------------------------- design system --
       One radius scale, one shadow scale, one type scale — reused across home,
       feed cards, permalink, profile and the og cards so nothing competes for
       attention that shouldn't. Hero text (questions, the Oddie Score) is the
       one thing allowed to be big; everything else steps down deliberately. */
    --r-xs:10px; --r-sm:14px; --r-md:18px; --r-lg:24px; --r-xl:30px;
    --shadow-chip:0 1px 2px rgba(30,45,10,.07), 0 3px 8px rgba(30,45,10,.06);
    --shadow-pop:0 2px 6px rgba(30,45,10,.09), 0 10px 24px rgba(40,60,15,.14);
    --fs-hero:min(38px,9.5vw); --fs-title:22px; --fs-body:15px; --fs-label:13px; --fs-caption:11.5px;
    /* Spacing scale, 8px base — every gap on a static page (Home first; the
       feed's own card-to-card rhythm has its own reasons and stays as-is)
       should be one of these, not a one-off value picked by eye. sp-1/2 group
       tightly-related content (a headline and its subtext); sp-4/5/6 separate
       distinct sections, largest gap for the biggest jump in the page. */
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:40px; --sp-6:48px}

  /* Deep, slightly warm near-black. Not #000: pure black next to a 4px pure-black
   * outline erases the outline, and the outline IS the brand. The ground has to
   * be dark enough that a white card reads as lit, and far enough from the ink
   * that the ink still draws. */
  /* Setting a ground colour on <body> poisons every surface that never declared
   * its own: a white tile inherited near-white text and its question vanished.
   * Surfaces carry the ink, always, in both themes. If you add a boxed element,
   * add it here — the audit checks contrast on the ones that exist. */
  .orow,.tile,.stat,.rep,.acct,.csheet,.seg,.segb,.promo,.lb,.bal,
  .cbtn,.sellbtn,.avatar{color:var(--ink)}
  .cbtn.x{color:#fff}

  :root[data-theme="dark"]{
    --ground:#050605; --ground-wide:#030403; --ground-2:#101110; --fade:#050605;
    --on-ground:#F4F4F1; --muted-g:#9A9A92; --line-g:#2C2C2A; --hair-g:#232322;
    --chip-bg:transparent; --chip-bd:#545A12; --link-g:#DDE45F;
    /* On near-black the deep olives go invisible; the ground-level accent text
       (balance top-up, payout lines, stat keys) lifts to a light lime instead. */
    --acc-deep:#C6CE45; --acc-mid:#D7DC1F; --acc-deeper:#E4EA7B;
    /* Elevated card panel sits above the deeper feed ground; heavier shadow. */
    --feed-ground:#020302; --card-surface:#121310; --card-line:#2A2B27;
    --card-shadow:0 3px 10px rgba(0,0,0,.5), 0 22px 50px rgba(0,0,0,.62);
    --shadow-chip:0 1px 2px rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.3);
    --shadow-pop:0 2px 8px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--on-ground);font-family:'Fredoka',system-ui,sans-serif;overscroll-behavior:none}

  /* ---------------------------------------------------------------- shell -- */
  /* Mobile is one column and nothing else: `display:contents` dissolves the app
     grid and the frame, so .top keeps floating over a full-bleed scroller exactly
     as it always has. The desktop rules below are the only thing that assembles
     a rail / frame / aside layout out of the same markup. */
  .app,.frame{display:contents}
  .rail,.side,.watermark{display:none}

  .top{position:fixed;top:0;left:0;right:0;z-index:15;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--ground-2)}
  /* Only the feed wants the fade — a card runs edge to edge under it. The shells
     are lists, and a list sliding under a translucent gradient just looks broken. */
  /* On the feed the ground is a tint so the elevated card reads as liftable, and
     the header fades from that same tint (no seam as a card scrolls under it). */
  body[data-view="feed"]{background:var(--feed-ground)}
  body[data-view="feed"] .top{background:linear-gradient(var(--feed-ground) 74%, transparent)}
  body:not([data-view="feed"]) .top{border-bottom:1.5px solid var(--hair-g)}
  .top-in{max-width:var(--col);margin:0 auto;padding:0 6px}
  .brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
  /* Same treatment as the landing's wordmark and the landing headline: the
     brand colour over a hard pink offset. --no is not a token in this file (the
     NO colour is written literally wherever it appears), so the pink is literal.
     The LETTERFORM changes by theme and the shadow does not: this file's default
     :root IS the bright theme, and lime on a pale ground is close to invisible,
     so bright gets --acc-deep, the same dark lime every other text-on-light
     surface here uses. Matching the headline means keeping the relationship,
     brand colour over pink, not repeating a hex onto a ground it cannot survive. */
  .brand b{font-size:21px;font-weight:600;color:var(--acc-deep);text-shadow:2px 2px 0 #FF2D78}
  :root[data-theme="dark"] .brand b{color:var(--accent)}
  /* The logo+wordmark, now a real link home — grouped so the two keep their own
     8px gap (matching the old flat layout) while acting as one tap target. */
  /* The mark has always linked home; it just never LOOKED like it did, so
     nobody tried it. A hover lift is the whole fix — the destination was
     already there, only the affordance was missing. */
  .brandlink{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;
    cursor:pointer;transition:opacity .14s ease, transform .14s ease}
  .brandlink:hover{opacity:.78;transform:translateY(-1px)}
  .brandlink:active{opacity:.82;transform:none}
  @media (prefers-reduced-motion:reduce){ .brandlink{transition:opacity .14s ease} .brandlink:hover{transform:none} }

  /* The mark IS the logo — the Oddie ghost on its lime tile, baked into the art.
     A rounded square (app-icon shape), not a circle, so it reads as the same tile
     people see as the favicon and home-screen icon. `cover` fills the square. */
  .ghost{width:30px;height:30px;border-radius:7px;background:var(--mark) center/cover no-repeat;flex:none}
  /* A bigger centred mark for the taste interstitials (gate / not-listed). */
  .gmark{width:60px;height:60px;border-radius:13px;margin:0 auto 14px;background:var(--mark) center/cover no-repeat}

  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  /* Scroll affordance: a fade on the right edge hints the row keeps going. It
     fades out (.at-end) once there's nothing left to reveal, so it never sits on
     top of the final chip. Matches the header surface (--ground-2). */
  .chip{flex:none;font-family:'Nunito';font-weight:800;font-size:12px;padding:7px 13px;border-radius:999px;
    border:1.5px solid var(--chip-bd);background:var(--chip-bg);color:var(--muted-g);cursor:pointer;white-space:nowrap;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .18s ease, color .18s ease, border-color .18s ease}
  .chip:active{transform:scale(.93)}
  /* Category header above each cluster of community markets in the grouped
     "For you" feed — same quiet label language as .psec ("Daily Call"),
     left-aligned since it sits inline in a scrolling list, not a page section.
     Not a snap stop (the swipe feed's own cards are) — it rides along with
     the first card of its cluster. */
  .catgroup-header{font-family:'Nunito';font-weight:800;font-size:13px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted-g);margin:22px 2px 10px;scroll-snap-align:none}
  /* The line between "someone tagged this" and "nobody has yet". It has to read
     as a boundary rather than a label, so it carries a rule and a sentence —
     the sentence is where the feed says what the product is FOR. */
  /* Same column geometry as .card — a divider that starts at the viewport edge
     while every card is centred reads as a broken row rather than a boundary. */
  /* A snap stop of its own. It used to be align:none, which was harmless while
     cards left room to spare — the header rode along in the slack at the bottom
     of a card's screen. Now that a card fills its band exactly, mandatory snap
     jumps straight from card to card and a non-snapping element between them is
     never landed on: the two section labels, which are the whole reason a
     visitor can tell an oddie market from a venue listing, would scroll past
     unread. Two extra stops in a fifty-card feed is the right price for that. */
  .feedsplit{width:min(var(--feedcol), calc(100% - 24px));margin:26px auto 12px;
    scroll-snap-align:start}
  /* The last slide. A feed made of tags has to END in the act that fills it,
     or running out reads as "there is nothing here" instead of "your turn". */
  .endcard{display:grid;place-content:safe center;text-align:center;padding:28px 22px}
  .endhero{font-family:'Fredoka';font-weight:600;font-size:27px;line-height:1.2;color:var(--on-ground)}
  .endsub{font-family:'Nunito';font-weight:700;font-size:14px;line-height:1.5;
    color:var(--muted-g);margin:12px 0 20px;max-width:34ch;margin-inline:auto}
  .endbtn{display:inline-block;font-family:'Nunito';font-weight:900;font-size:15px;
    color:#000;background:var(--accent);border:1.5px solid var(--line-g);border-radius:999px;
    padding:13px 24px;text-decoration:none}
  .endbtn:active{transform:translateY(1px)}
  .endnote{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted-g);margin-top:14px}
  .feedsplit hr{border:0;border-top:1.5px dashed var(--hair-g);margin:0 0 10px}
  .feedsplit b{display:block;font-family:'Nunito';font-weight:900;font-size:13px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted-g)}
  .feedsplit span{display:block;font-family:'Nunito';font-weight:700;font-size:12.5px;
    line-height:1.45;color:var(--muted-g);margin-top:3px}
  /* Satisfying switch: the active chip fills solid accent and gives a little pop. */
  .chip.on{color:#000;border-color:var(--accent);background:var(--accent);transform:scale(1.05);
    box-shadow:0 2px 8px rgba(120,165,40,.35)}
  /* Community markets: honest signal + the on-chain proof badge. Both are filled
     SURFACE chips (backgrounds fixed across themes) with FIXED dark text, so they
     hold AA in both themes — the old --muted-g / --link-g text turned pale-on-pale
     and near-invisible on the dark card. commtag is neutral grey; the credibility
     badge keeps the lime tint. */
  .commtag{display:inline-block;font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.02em;
    padding:3px 9px;border-radius:999px;background:var(--bar);color:#48525d}
  /* "tagged by @someone" — the provenance chip that ties a market back to the
     person who made it exist. Accent-tinted so it reads as the card's
     identity rather than another neutral metadata pill: a market ON Oddie is
     defined by having a tagger, and this is where the grid says so. Sits
     first in the meta row. */
  .commtag-by{display:inline-flex;align-items:center;gap:5px;font-size:11px;
    background:rgba(182,240,95,.18);color:var(--acc-deep);
    border:1px solid rgba(182,240,95,.55)}
  :root[data-theme="dark"] .commtag-by{color:var(--accent)}
  /* Acid noir: the lit things are the ones that move money. Restrained on
     purpose; a working surface with glow on everything is a working surface
     with glow on nothing. */
  :root[data-theme="dark"] .claimbtn{box-shadow:0 0 26px rgba(215,220,31,.35)}
  :root[data-theme="dark"] .orow.pick{box-shadow:0 6px 0 rgba(0,0,0,.22), 0 0 30px rgba(215,220,31,.4)}
  :root[data-theme="dark"] .bal{box-shadow:0 0 18px rgba(215,220,31,.14)}
  :root[data-theme="dark"] .chain-side.on{box-shadow:0 0 24px rgba(215,220,31,.35)}
  /* Venue markets: a deliberately COOL, low-contrast chip naming the source.
     They have no tagger, so they must not borrow the accent that means
     "someone tagged this" — the visual difference is the point, and it's what
     keeps them secondary to community cards in the same grid. */
  /* var(--bar) is #E7EDF2 in BOTH themes, and the dark override then put LIGHT
     ink (#9aa6b2) on it — measured 2.31:1, under the 4.5 floor for text this
     size. Third variant of the same trap: the first two paired fixed light with
     an adaptive token, this one paired it with a hardcoded light hex, which is
     why the guard walked past it. Translucent fill, adaptive ink, one rule. */
  .mchip-sourced{background:rgba(127,127,127,.16);color:var(--muted-g);box-shadow:none;
    font-size:11px;letter-spacing:.02em}
  /* Movement. Same translucent-fill construction as .mchip-sourced above, and
     for the same reason: a fill that is semi-transparent composites over
     whichever ground it lands on, so it cannot become the theme-FIXED
     background the contrast guard exists to catch. The inks are the duel's own
     yes/no colours, and they are stated per theme rather than adaptively — the
     light values (#5A6109 / #B23B2B) are the ones .orow uses, and the dark ones
     lift to stay legible on the dark card without going neon. Reusing the
     buttons' palette is what makes "the line moved up" and "YES" read as the
     same direction without a legend. */
  .mchip-delta{background:rgba(127,127,127,.14);box-shadow:none;font-size:11px;
    letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .mchip-delta.up{color:#5A6109;background:rgba(215,220,31,.20)}
  .mchip-delta.down{color:#B23B2B;background:rgba(255,107,90,.14)}
  :root[data-theme="dark"] .mchip-delta.up{color:#D7DC1F;background:rgba(215,220,31,.12)}
  :root[data-theme="dark"] .mchip-delta.down{color:#FF8B78;background:rgba(255,107,90,.12)}
  /* Discovery modes — the row above the category chips. Mode answers "show me
     what's happening" (For You / Trending / New / Resolving Soon), category
     answers "about what"; two axes, two rows. The active mode is the one
     accent-filled control in the header, same treatment as every selected
     state in the system. */

  /* Sidebar discovery links — same .navitem chassis, a small dot instead of an
     icon so they read as one family of lenses rather than five more sections. */
  .navsort-dot{width:7px;height:7px;border-radius:50%;background:var(--hair-g);flex:none;margin:0 7px}
  .navsort.on .navsort-dot{background:#000}

  /* Top creators — the rail's ranked teaser. */
  .rp-toplist{display:flex;flex-direction:column;gap:8px;margin:2px 0 0}
  .rp-toprow{display:flex;align-items:center;gap:9px}
  .rp-toprow b{flex:none;width:16px;font-family:'Fredoka';font-weight:700;font-size:13px;color:var(--muted-g)}
  .rp-topwho{flex:1;min-width:0;font-family:'Nunito';font-weight:800;font-size:13px;
    color:var(--on-ground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-topval{flex:none;text-align:right;font-family:'Nunito';font-weight:900;font-size:12.5px;color:var(--acc-deep)}
  :root[data-theme="dark"] .rp-topval{color:var(--accent)}
  .rp-topval small{display:block;font-weight:700;font-size:10px;color:var(--muted-g)}

  /* My Markets — the creator dashboard. */
  .mm-total{font-family:'Nunito';font-weight:800;font-size:13px;color:var(--muted-g);margin:0 0 12px}
  .mm-total b{font-family:'Fredoka';font-weight:700;font-size:17px;color:var(--acc-deep)}
  :root[data-theme="dark"] .mm-total b{color:var(--accent)}
  .mm-list{display:flex;flex-direction:column;gap:9px}
  .mm-row{display:block;padding:12px 14px;border:2px solid var(--hair-g);border-radius:16px;
    text-decoration:none;background:var(--ground-2)}
  .mm-row:hover{border-color:var(--accent)}
  .mm-q{display:block;font-family:'Fredoka';font-weight:600;font-size:15px;line-height:1.3;
    color:var(--on-ground);margin:0 0 4px}
  .mm-meta{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g)}
  .mm-empty{text-align:center;padding:26px 8px}
  .mm-empty-big{font-family:'Fredoka';font-weight:600;font-size:19px;color:var(--on-ground);margin:0 0 8px}
  .mm-empty-sub{font-family:'Nunito';font-weight:700;font-size:13px;line-height:1.5;
    color:var(--muted-g);max-width:340px;margin:0 auto 14px}

  /* The velocity chip. Warm, not lime — lime already means "tagged by" on this
     same row, and two accent chips side by side would flatten the distinction
     between provenance and activity. Only rendered when the count is > 0. */
  .mchip-hot{background:rgba(255,138,60,.16);color:#a4460b;box-shadow:none;
    border:1px solid rgba(255,138,60,.42);font-size:11px}
  :root[data-theme="dark"] .mchip-hot{color:#ffb37a}
  .chainbadge{display:inline-flex;align-items:center;gap:4px;font-family:'Nunito';font-weight:800;
    font-size:10.5px;letter-spacing:.02em;color:#3c570b;text-decoration:none;white-space:nowrap;
    padding:3px 10px 3px 8px;border-radius:999px;background:var(--wash)}
  .chainbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 1.5px rgba(0,0,0,.22)}
  .chainbadge:active{transform:scale(.94)}
  /* The metadata row, as small pills with icons instead of flat grey text — the
     state ("forming", "closes in Nd", "$X in play") reads at a glance instead
     of competing with the question for attention at the same weight. One chip
     component, three uses. Text stays FIXED dark on a FIXED light chip surface
     (same AA rule as .commtag/.chainbadge — the surface never adapts to theme,
     so the text can't either). */
  /* Same move for the family: var(--wash) is light in both themes, so every one
     of these read as a pale tablet stuck on a dark card. A translucent fill sits
     on whatever surface it lands on and the ink follows the theme with it. */
  .mchip{display:inline-flex;align-items:center;gap:5px;font-family:'Nunito';font-weight:800;
    font-size:12px;letter-spacing:.01em;color:var(--on-ground);white-space:nowrap;
    padding:4px 10px 4px 8px;border-radius:999px;background:rgba(127,127,127,.16);box-shadow:none}
  .mchip svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  /* Forming: a live pulsing dot says "still filling up" without a word doing the
     work — the same visual language a status indicator uses everywhere else. */
  .mchip-forming{color:#5c4300;background:#fff3d6}
  .mchip-forming .pulsedot{width:7px;height:7px;border-radius:50%;background:#e0a300;flex:none;
    box-shadow:0 0 0 0 rgba(224,163,0,.55);animation:pulsedot 1.8s ease-out infinite}
  :root[data-theme="dark"] .mchip-forming{color:#f5cf6b;background:#3a2c05}
  @keyframes pulsedot{0%{box-shadow:0 0 0 0 rgba(224,163,0,.55)}70%{box-shadow:0 0 0 7px rgba(224,163,0,0)}100%{box-shadow:0 0 0 0 rgba(224,163,0,0)}}
  @media (prefers-reduced-motion:reduce){.mchip-forming .pulsedot{animation:none}}
  /* Resolution criteria — kept for transparency but SECONDARY: a collapsed row
     UNDER the YES/NO buttons, not a headline block above them. The question and
     the tap targets lead; the full settlement wording is one tap away. */
  .rby{margin:12px 0 0}
  .rby>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-family:'Nunito';font-weight:800;font-size:11.5px;letter-spacing:.01em;
    color:var(--muted-g);padding:3px 0;user-select:none}
  .rby>summary::-webkit-details-marker{display:none}
  .rby>summary::before{content:"›";font-weight:900;font-size:14px;line-height:1;
    transition:transform .15s ease;display:inline-block}
  .rby[open]>summary::before{transform:rotate(90deg)}
  .rby-body{margin:8px 0 2px;font-family:'Nunito';font-weight:700;font-size:12px;line-height:1.45;
    color:var(--muted-g);border-left:2px solid var(--hair-g);padding-left:11px}
  /* The activity strip: what's riding on this market, under the YES/NO. Sits
     on the card's own surface with hairline dividers rather than in a box —
     it's metadata about the object, not a second object. Only ever renders
     the figures we actually have (see statsRowHtml); columns are dropped, not
     zero-filled. */
  .statsrow{display:flex;align-items:stretch;gap:0;margin:11px 0 0;
    border-top:1.5px solid var(--hair-g);padding:9px 0 0}
  .st-cell{flex:1;min-width:0;text-align:center;padding:0 6px;
    border-left:1.5px solid var(--hair-g)}
  .st-cell:first-child{border-left:0;text-align:left;padding-left:0}
  .st-cell b{display:block;font-family:'Fredoka';font-weight:700;font-size:16px;
    line-height:1.1;color:var(--on-ground)}
  .st-cell span{font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.02em;
    color:var(--muted-g)}
  /* The creator's cut is the one figure here that's money-shaped, so it's the
     one that gets the accent. */
  .st-earn b{color:var(--acc-deep)}
  :root[data-theme="dark"] .st-earn b{color:var(--accent)}

  /* Creator fee — an INCENTIVE, not a disclosure. This was 11px muted-grey
     body text (a footnote apologising for a deduction); reviewed live it read
     as fine print nobody would ever notice, which is exactly backwards: the
     fee is the reason to go and tag a market of your own, and it is the one
     thing on the card that money-motivated users should see. Now an
     accent-bordered strip with the rate as the loud part. Deliberately not a
     full accent FILL — that's reserved for the guest bar and the primary CTA,
     and three accent blocks on one card is noise. */
  /* A TRANSLUCENT accent tint, not var(--wash): --wash is light in both themes
     while --on-ground flips to near-white in dark mode, so the first version
     of this rule rendered near-white text on a near-white chip — a measured
     1.06 contrast ratio. A translucent fill sits on whatever the card's own
     background is, so the tint and the text adapt together instead of one
     flipping without the other. Same trap as the tagdemo pills; different
     token, identical failure. */
  .fee-note{display:flex;align-items:center;gap:8px;margin:10px 0 0;
    padding:8px 11px;border:1.5px solid var(--accent);border-radius:12px;
    background:rgba(182,240,95,.14);
    font-family:'Nunito';font-weight:800;font-size:12px;line-height:1.35;color:var(--on-ground)}
  .fee-note b{font-family:'Fredoka';font-weight:700;font-size:15px;color:var(--acc-deep);
    flex:none;letter-spacing:-.01em}
  :root[data-theme="dark"] .fee-note b{color:var(--accent)}
  /* The RECEIPT variant — a settled market where the tagger was actually
     paid. Solid accent border and a filled number: this one is a fact, not a
     promise, and it should look more certain than the forward-looking version
     it replaces on resolved cards. */
  .fee-note-paid{border-color:var(--accent);background:rgba(182,240,95,.22)}
  .fee-note-paid b{font-size:17px}
  /* -------------------------------------------- the source post, in-card --
     The claim a market was made from, shown as a post. Sits between the
     provenance chips and the question so post -> market reads top to bottom
     as one object: this is the thing being argued about, and directly under
     it is the question it became. Recessed (inset surface, no shadow) so it
     reads as quoted context rather than a second card competing with the
     one it lives inside. */
  .xpost-link{display:block;text-decoration:none;color:inherit}
  /* A TRANSLUCENT ink wash, never var(--wash): that token stays light in both
     themes while the text colour flips near-white in dark, which is a 1.06
     contrast ratio — invisible. Third time this exact pairing has bitten;
     scripts/test-contrast.ts now fails the build on it. A translucent fill
     sits on the card's own background so both adapt together. */
  .xpost{margin:0 0 11px;padding:10px 12px;border-radius:14px;
    background:rgba(127,127,127,.10);border:1.5px solid var(--hair-g)}
  .xpost-link:hover .xpost{border-color:var(--accent)}
  .xp-head{display:flex;align-items:center;gap:7px;margin:0 0 6px}
  .xp-av{width:20px;height:20px;border-radius:50%;background:var(--hair-g);flex:none}
  .xp-who{font-family:'Nunito';font-weight:900;font-size:12px;color:var(--on-ground);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .xp-at{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .xp-x{margin-left:auto;font-size:12px;color:var(--muted-g);flex:none}
  /* Three lines max — this is context for the question below it, never the
     headline. A long thread-opener must not push the YES/NO off the card. */
  .xp-text{margin:0;font-family:'Nunito';font-weight:700;font-size:13px;line-height:1.4;
    color:var(--on-ground);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden}

  /* Source tweet — permalink-only, sits above the question. Same surface/line
     tokens as the elevated card itself, not a competing block. */
  .srctweet{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:9px 12px;
    border-radius:var(--r-md);background:var(--card-surface);border:1.5px solid var(--hair-g);
    box-shadow:var(--shadow-chip);text-decoration:none}
  .srctweet-ico{flex:none;width:26px;height:26px;border-radius:50%;background:var(--card-line);
    display:flex;align-items:center;justify-content:center}
  .srctweet-ico svg{width:13px;height:13px;fill:var(--card-surface)}
  .srctweet-body{min-width:0;flex:1}
  .srctweet-lab{font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);color:var(--muted-g);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srctweet-lab b{color:var(--on-ground);font-weight:900}
  .srctweet-link{font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);color:var(--muted-g);
    display:inline-flex;align-items:center;gap:3px;margin-top:1px}
  /* "Who called what" — visually secondary, small rows below YES/NO. */
  .callers{margin:12px 0 0}
  .callers-lab{font-family:'Nunito';font-weight:800;font-size:var(--fs-caption);color:var(--muted-g);
    margin:0 0 6px}
  .callers-list{display:flex;flex-direction:column;gap:5px}
  .caller-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);
    background:var(--card-surface);border:1px solid var(--hair-g);font-family:'Nunito'}
  .caller-handle{flex:1;min-width:0;font-weight:800;font-size:12.5px;color:var(--on-ground);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .caller-side{flex:none;font-weight:900;font-size:10.5px;letter-spacing:.02em;padding:2px 7px;
    border-radius:999px}
  .caller-side.yes{color:#1f7a3f;background:#dff5e6}
  .caller-side.no{color:#a3283d;background:#fbdfe4}
  :root[data-theme="dark"] .caller-side.yes{color:#7fe0a4;background:#0f3320}
  :root[data-theme="dark"] .caller-side.no{color:#f2a3b4;background:#3a1420}
  .caller-pct{flex:none;font-weight:800;font-size:11.5px;color:var(--muted-g);min-width:30px;text-align:right}
  .callers-more{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);
    margin:5px 2px 0}
  /* Challenge the other side — a core mechanic on the market page: a pre-filled
     X intent aimed at the claim's author. Secondary to YES/NO (outlined, not the
     lime primary), full width below them. Hidden once a side is being confirmed. */
  .challenge{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;
    margin:12px 0 0;font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--on-ground);
    background:transparent;border:2px solid var(--card-line);border-radius:14px;padding:11px 14px;
    cursor:pointer;transition:transform .1s ease,background .15s ease}
  .challenge:hover{background:var(--ground-2)}
  .challenge:active{transform:scale(.97)}
  /* Cold-visitor onboarding. A snap-aligned WRAP is the key: the scroller uses
     scroll-snap mandatory, which otherwise snaps straight to the first card on
     load and hides these above the fold. Making the wrap the first snap point
     (scroll-snap-align:start, inset by the scroller's scroll-padding-top) lands the viewport ON
     it at load — visible with no scroll. Carries the header clearance while
     present; when both rows are dismissed, .card:first-child reclaims it.
     Two distinct rows, dismissed independently. */
  .onbwrap{width:min(var(--feedcol), calc(100% - 24px));margin:var(--feedtop) auto 12px;
    display:flex;flex-direction:column;gap:8px;
    scroll-snap-align:start}
  /* tag instruction — fixed dark text on the fixed pale-lime wash (AA in both
     themes, same rule as .rby / .chainbadge). */
  /* One consolidated strip: primary tag instruction, with the follow pill riding
     inline as a secondary element (wrapping under the text on narrow screens
     rather than becoming a second banner). */
  :root[data-theme="dark"] .onbstrip{
    background:var(--card-surface);border-color:var(--card-line);color:var(--on-ground)}
  .onbstrip{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:var(--wash);
    border:2px solid var(--card-line);border-radius:16px;padding:11px 14px;
    box-shadow:var(--card-shadow);font-family:'Nunito';font-weight:800;
    font-size:13px;line-height:1.35;color:#3c570b}
  /* The hero headline — one line, full width at the top of the banner. The
     positioning a first-timer reads on load; kept to a single tight line so it
     adds ~one line of height, not a section. */
  .onbstrip .onbhero{flex-basis:100%;font-family:'Fredoka';font-weight:600;
    font-size:16px;line-height:1.1;letter-spacing:-.01em;color:#17250a}
  .onbstrip .onbtxt{flex:1 1 60%;min-width:0}
  .onbstrip b{font-weight:900}
  .fbtn{flex:0 0 auto;text-decoration:none;background:var(--accent);color:#17250a;
    font-family:'Nunito';font-weight:900;font-size:12.5px;border-radius:999px;
    padding:6px 12px;white-space:nowrap;border:1.5px solid rgba(0,0,0,.28)}
  .fbtn:active{transform:scale(.95)}
  .onbx{flex:0 0 auto;border:none;background:transparent;color:currentColor;font-size:20px;
    line-height:1;cursor:pointer;padding:0 2px;font-weight:900;opacity:.6}
  .onbx:hover{opacity:1}
  .onbx:active{transform:scale(.9)}
  /* Daily claim — a secondary retention hook, deliberately quieter than the tag
     CTA (the primary action, with the points incentive, is what should hit the
     eye first). Used to fill solid --accent at full card size, the same
     brightness and near the same size as the CTA button — the two competed for
     "first thing you do here". Now a pale wash card with a small filled pill,
     not a second bright block. Fixed dark text on the fixed wash surface holds
     contrast in both themes, same rule as .mchip. */
  /* The status strip. Deliberately quieter than a card: it is a read, not an
     ask, and it sits above the first market without competing with it. */
  .ystrip{display:flex;gap:8px;margin:0 0 10px}
  .ystrip-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;
    border:1.5px solid var(--card-line);border-radius:14px;background:var(--card-surface);
    padding:9px 12px;text-decoration:none}
  .ystrip-b:hover{border-color:var(--accent)}
  .ystrip-n{font-family:'Fredoka';font-weight:600;font-size:19px;line-height:1;color:var(--accent)}
  .ystrip-k{font-family:'Nunito';font-weight:800;font-size:10.5px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted-g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .claimcard{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 13px;
    border:1.5px solid var(--hair-g);font-family:'Nunito'}
  .claimcard.ready{background:var(--wash);color:#3c4550}
  /* Same translucent-tint rule as everywhere else in this file: --wash is light
     in BOTH themes on purpose (about thirty rules pair it with fixed dark ink),
     so it cannot simply be flipped. These two strips get a dark surface of their
     own instead, and their ink follows the theme with it. */
  :root[data-theme="dark"] .claimcard.ready{
    background:rgba(215,220,31,.08);border:1px solid rgba(215,220,31,.22);color:var(--on-ground)}
  .claimcard.done{background:var(--card-surface);color:var(--on-ground)}
  .cc-grow{flex:1;min-width:0}
  .cc-title{font-weight:900;font-size:13px;line-height:1.2}
  .cc-sub{font-weight:800;font-size:11.5px;margin-top:3px;opacity:.85}
  .cc-next{flex:0 0 auto;font-weight:900;font-size:12px;color:var(--muted-g);white-space:nowrap}
  /* The claimed confirmation collapses to a slim line after a few seconds — it's
     a receipt, not a standing CTA, so it shouldn't hold full banner height. */
  .claimcard.done{transition:padding .3s ease}
  .claimcard.done.cc-mini{padding:6px 12px}
  .claimcard.done.cc-mini .cc-sub{display:none}
  .claimcard.done.cc-mini .cc-title{font-size:12px}
  .claimbtn{flex:0 0 auto;border:1.5px solid rgba(0,0,0,.18);background:var(--accent);color:#17250a;
    font-family:'Nunito';font-weight:900;font-size:12.5px;border-radius:999px;padding:7px 13px;cursor:pointer}
  .claimbtn:active{transform:scale(.96)}
  .claimbtn:disabled{opacity:.6}

  /* The scroller is the feed when it snaps and a plain page when it doesn't. */
  .scroller{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scroll-padding-top:var(--feedtop);scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .scroller.snap{scroll-snap-type:y mandatory}
  /* scroll-padding-top above is the ONLY header inset, deliberately.
     Every snap target — .card, .onbwrap, .feedsplit — also carried
     scroll-margin-top:var(--feedtop), and the two ADD: the container insets the
     snapport by 94px and the target outsets itself by another 94, so a snapped
     card came to rest 188px down instead of 94. That is the "cards aren't
     centred" report: every card sat one --feedtop too low, which left the
     previous card's tail visible above it and pushed its own footer toward the
     tab bar. Measured on production before the fix — scrollTop forced to 700,
     snap settled it at 572.5, card top 186px inside the scrollport.
     Container-level is the right single mechanism here: one fixed header
     overlays the scrollport, so one declaration should describe it for every
     kind of target rather than each target restating it. */
  .state{height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Nunito';font-weight:800;color:var(--muted-g);text-align:center;padding:24px}

  /* ------------------------------------------------------------------ feed -- */
  /* The card is a physical object: an elevated panel inset from the ground, with
     a soft layered shadow, refined corners and a hairline outline. It fills the
     visible band and centres its content, so one card is one screen and a swipe
     moves to the next.
     (This comment used to say the card sized itself "to leave the next card's
     edge peeking below (feed, not single screen)" — the opposite of the rule
     directly under it. The min-height had already been changed to fill the band;
     only the sentence was left behind. The peek is gone on purpose: .nudge is
     what says there is more below.) */
  .card{scroll-snap-align:start;position:relative;
    width:min(var(--feedcol), calc(100% - 24px));margin:0 auto 18px;
    /* Fill the visible band — the viewport minus the fixed header and the bottom
       tab bar — and CENTER the content within it, so the question and the YES/NO
       tap targets always land fully visible around the middle of the screen, with
       no scrolling or guessing. `safe center` falls back to top-alignment if the
       content is ever taller than the band (tiny phone + long question), so the
       question can never be clipped under the header.

       svh, NOT dvh. This said "dvh tracks X's in-app browser chrome as it
       grows/shrinks", which is true and is exactly the problem: dvh is the
       viewport RIGHT NOW, so a card laid out while X's toolbar was hidden is
       sized to the tall viewport, and the moment the toolbar slides back in
       that card is taller than the screen it is snapped to — the YES/NO buttons
       end up under the tab bar. Reported from an iPhone in the X in-app
       browser, where the card fit in mobile Safari.
       svh is the SMALL viewport: the height with all browser chrome showing. It
       is the only one of the three that answers "will this always fit", which is
       the question a snapped full-screen card is asking. It also keeps the snap
       geometry still: dvh moves every snap point while the user is scrolling. */
    min-height:calc(100svh - var(--feedtop) - var(--tabh) - env(safe-area-inset-bottom) - 30px);
    display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:0;
    background:var(--card-surface);border:1.5px solid var(--card-line);border-radius:var(--r-xl);
    box-shadow:var(--card-shadow);padding:24px 22px 22px;overflow:hidden;
    transform-origin:center center;will-change:transform,opacity;
    /* Scroll-driven depth (scale+fade) is set inline by the scroll handler; the
       short ease keeps it smooth between coarse scroll frames. */
    transition:transform .16s ease-out, opacity .16s ease-out, box-shadow .3s ease}
  .card:first-child{margin-top:var(--feedtop)}
  /* A layered surface, not a flat tile: a soft diagonal sheen across the top —
     the one "this was designed" cue a card gets for free, at rest, no motion.
     Very low-alpha so it reads as depth, not a visible stripe. */
  .card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(155deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 26%);
    border-radius:inherit}
  :root[data-theme="dark"] .card::before{background:linear-gradient(155deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 26%)}
  .card>*{position:relative;z-index:1}
  /* Stage 1 onboarding: a restrained pulse on the FIRST open-market card for a
     zero-position visitor — directional emphasis, not a modal, not a flashing
     "look here". A static ring (no pulse) under reduced motion still marks the
     card; it just doesn't move. */
  .firstcall-cue{border-color:var(--accent);
    box-shadow:var(--card-shadow), 0 0 0 3px rgba(182,240,95,.35)}
  @media (prefers-reduced-motion: no-preference){
    .firstcall-cue{animation:firstcallPulse 2.4s ease-in-out infinite}
  }
  @keyframes firstcallPulse{
    0%,100%{box-shadow:var(--card-shadow), 0 0 0 3px rgba(182,240,95,.35)}
    50%{box-shadow:var(--card-shadow), 0 0 0 7px rgba(182,240,95,.12)}
  }
  .scroller{padding-bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 10px)}
  /* Secondary tier — the category tag recedes below the hero question. Its
     background is the FIXED pale-lime --wash (same in both themes), so the text
     must be a FIXED solid dark, not the ground-adaptive --acc-mid (which lifted
     to light lime on dark and went pale-on-pale). One component, every category. */
  .cat{align-self:flex-start;font-family:'Nunito';font-weight:800;font-size:11px;letter-spacing:.03em;
    text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--wash);color:#201d16}
  /* Status chips. These sit ABOVE the question, not between it and the buttons.
     They used to sit below it, which put a two-row band of metadata directly in
     the path from "read the question" to "pick a side" — the single biggest
     source of scan-clutter on the card, because the eye had to cross it twice.
     Grouped up here they read as one metadata cluster with the category chip,
     and the question then runs uninterrupted into the YES/NO row. */
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--muted-g);margin:10px 0 14px}
  .pshare{font-family:'Nunito';font-weight:800;font-size:11.5px;color:#000;background:var(--accent);
    border:2px solid #000;border-radius:999px;padding:3px 12px;margin-left:8px;cursor:pointer;vertical-align:1px}
  .waitcta{display:inline-block;font-family:'Fredoka';font-weight:600;font-size:14px;color:#000;
    background:var(--accent);border:1.5px solid #000;border-radius:16px;padding:9px 15px;
    text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.16)}
  /* the post-call belonging line */
  .socline{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--link-g);margin-top:7px}
  /* The hero: the question commands — dramatically larger than every supporting
     element, which all sit at ~11-13px. That size gap is the hierarchy.
     Tuned for READING, not just for display. This is the one place in the app
     where the brand's display treatment (very tight tracking, near-solid
     leading, heavy weight) met a long, wrapping, multi-line sentence — and a
     market question routinely runs five lines on a phone. Compressing letters
     by -.025em and setting 1.07 leading is right for a logo or a "+50", and
     actively hard to parse here, especially in a rounded face like Fredoka
     where tight tracking makes adjacent words start to merge. So: tracking
     relaxed to a whisper (-.005em) instead of a squeeze, leading opened to 1.3
     so wrapped lines separate, and weight dropped 600 -> 500, which still reads
     confident at 35px but stops a five-line question reading as a wall.
     Deliberately scoped to `.take` alone — the logo, short headlines and the
     stat numbers keep the display treatment that suits them.
     The breakpoint overrides below (768px / short-phone / short-desktop) set
     ONLY font-size; because line-height is a unitless ratio and letter-spacing
     is in em, both scale from that automatically, so these three values apply
     consistently everywhere without being restated.
     Spacing carries the hierarchy too: the gaps used to be near-uniform
     (14/14/24/12 measured), so nothing on the card looked more important than
     anything else. The question now owns the largest gap on the card — it runs
     straight into the buttons with real air, while the metadata above hugs
     itself tight. Same total: the margins were rebalanced, not added to. */
  .take{font-size:min(35px,9vw);font-weight:500;line-height:1.3;letter-spacing:-.005em;
    color:var(--on-ground);margin:0 0 20px}
  /* The question is the ONLY part of a card whose height varies. Everything else
     — chips, the YES/NO duel, the footers — is fixed at ~366px, and the card's
     min-height gives the content roughly 230px to put the question in. A short
     question uses 3 lines of that; the 110-character venue questions this feed
     carries ("Will the Federal Reserve decrease interest rates by 25 bps after
     the September 2026 meeting?") used 6, overflowed the band by ~90px, and were
     the reason a card did not fit its own screen.
     So the type steps down with length, exactly as renderCard.ts steps the PNG's
     question size down until the block fits its band. Set from the question's
     length in buildCard rather than by breakpoint, because the thing that varies
     is the sentence, not the phone. */
  .take-m{font-size:min(29px,7.6vw)}
  .take-s{font-size:min(24px,6.3vw);line-height:1.28}
  .social{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted-g);margin:12px 0 0;min-height:16px}
  /* The upside, at the moment of decision. This line renders during the 5s
     undo window — BEFORE the call is final — so it leads with what they stand
     to win rather than restating what they staked. Full-strength ink and its
     own line: it's the reason to go through with it, not a caption. */
  .social .prepay{display:block;color:var(--on-ground);font-size:13.5px;margin-bottom:7px}
  .social .prepay b{font-weight:900}
  .social .prepay .prepay-mult{color:var(--muted-g);font-weight:700}
  /* the 5s undo window after a one-tap call: undo is a real button, change-amount a quiet link */
  .social .undo{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--ink);
    background:var(--wash);border:1.5px solid var(--ink);border-radius:999px;
    padding:4px 13px;margin-left:8px;cursor:pointer;font-variant-numeric:tabular-nums}
  .social .undo:active{transform:scale(.96)}
  .social .chgamt{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--link-g);
    background:none;border:0;padding:4px 2px;margin-left:10px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px}

  /* ---- taste-flow interstitials: the category picker and the sign-in gate.
     Same card surface, but content is centred instead of bottom-anchored, so a
     step in the feed reads as a moment, not a market. Both themes inherit the
     card tokens above. */
  .intercard{justify-content:center;align-items:center;text-align:center;gap:0}
  .ititle{font-family:'Fredoka';font-weight:600;font-size:min(26px,6.6vw);line-height:1.15;
    color:var(--on-ground);margin:0 0 8px}
  .isub{font-family:'Nunito';font-weight:700;font-size:13.5px;color:var(--muted-g);margin:0 0 22px}
  .tchips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 26px;max-width:340px}
  .tchip{font-family:'Nunito';font-weight:800;font-size:15px;padding:11px 18px;border-radius:999px;
    border:1.5px solid var(--chip-bd);background:var(--chip-bg);color:var(--on-ground);cursor:pointer;
    transition:transform .08s}
  .tchip:active{transform:scale(.96)}
  .tchip.on{color:#000;border-color:var(--accent);background:var(--accent)}
  .icont{font-family:'Fredoka';font-weight:600;font-size:16px;color:#000;background:var(--accent);
    border:1.5px solid #000;border-radius:16px;padding:12px 30px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .icont:disabled{opacity:.4;box-shadow:none;cursor:default}
  .gatecard .cbtn{max-width:320px}

  /* The odds, both of them. A lone giant "60%" made the reader derive the other
     side, and a "win 1.7×" stranded on a button 200px away made them pair the two
     halves of one fact back together. Each row is now one side's whole story, in
     reading order: which side, how likely, what it pays.

     The row IS the bar. A separate split bar above said the same thing twice, so
     it folded into the rows: each one fills to its own percentage, and the number
     sits on top of the fill it describes. `--fill` comes in per-card, inline. */
  /* A decisive binary, not a survey. Two side-by-side SURFACE tiles (white with
     the brand's chunky outline, both themes). At rest each is clean — side label,
     the odds as a big number, the multiplier as small supporting info; a thin
     accent meter along the bottom is the only nod to the split. On tap the chosen
     tile SPRINGS to a solid accent fill and lifts (tactile locked state) while the
     other recedes. `--fill` (per-side odds, inline) drives only the rest-state
     meter. The number keeps its white-stroke halo so it reads on white AND on the
     accent fill. */
  .duel{display:flex;flex-direction:row;gap:12px;margin-top:6px}
  /* Real-stakes ("skin in the game") — only ever created by chain.js, which
     only ever loads when the server's flag is on (see initChainLayer). These
     rules sit here inert, exactly like any other unused class, whenever the
     feature is off: nothing about a stylesheet rule is user-facing on its own. */
  .chain-cta{display:block;margin:8px auto 0;font-family:'Nunito';font-weight:800;font-size:11.5px;
    color:var(--muted-g);background:none;border:1.5px dashed var(--hair-g);border-radius:999px;
    padding:5px 12px;cursor:pointer}
  .chain-wallet{font-family:'Nunito';font-weight:700;font-size:12.5px;color:var(--muted);margin:0 0 10px}
  /* The question the stake is going on, at the top of the sheet where a title
     belongs. Clamped: a long market question must not push YES/NO off a phone
     screen, which is the one thing this sheet exists to show. */
  .chain-q{font-family:'Fredoka';font-weight:700;font-size:19px;line-height:1.22;
    letter-spacing:-.015em;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden}

  .chain-side-row{display:flex;gap:8px;margin-bottom:12px}
  .chain-side{flex:1;font:inherit;font-weight:800;font-size:15px;padding:13px 0;cursor:pointer;
    border:1.5px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink)}
  .chain-side.on{background:var(--accent);border-width:3.5px}
  /* YES and NO are the same two words, in the same two colours, as the buttons
     on the card behind this sheet and the demo card on the landing page. They
     were both plain white here, so the one control that decides the direction
     of the bet was the only place in the product where the sides looked alike. */
  /* Both sides are SOLID at rest, exactly as they are on the card this sheet
     opened from. The first version tinted the unselected side, which made the
     one you had not picked look like a button that does not work: the same
     "outlined reads as disabled" mistake the feed card made, repeated one
     screen later and at the moment money is actually being committed.
     Selection is carried by weight instead: the chosen side keeps its full
     colour, its offset and a white ring; the other dims and sits flat. */
  :root[data-theme="dark"] .chain-side{border:3px solid #05060A;
    box-shadow:0 5px 0 rgba(0,0,0,.9);transition:opacity .16s ease, box-shadow .16s ease, transform .16s ease}
  :root[data-theme="dark"] .chain-side[data-side="yes"]{background:#D7DC1F;color:#3A4106;opacity:.5}
  :root[data-theme="dark"] .chain-side[data-side="no"]{background:#FF2D78;color:#5C0020;opacity:.5}
  :root[data-theme="dark"] .chain-side.on{opacity:1;outline:3px solid rgba(255,255,255,.9);outline-offset:2px}
  :root[data-theme="dark"] .chain-side[data-side="yes"].on{box-shadow:0 5px 0 rgba(0,0,0,.9), 0 0 34px rgba(215,220,31,.45)}
  :root[data-theme="dark"] .chain-side[data-side="no"].on{box-shadow:0 5px 0 rgba(0,0,0,.9), 0 0 34px rgba(255,45,120,.42)}
  :root[data-theme="dark"] .chain-side:active{box-shadow:0 1px 0 rgba(0,0,0,.9);transform:translateY(4px)}

  /* The amount step, labelled. Unlabelled pills reading "0.05 0.1 0.25 …" next
     to YES/NO read as a second row of choices rather than as a quantity. */
  .chain-amt-lab{font-family:'Nunito';font-weight:800;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted-g);margin:0 0 6px}
  /* Preset stakes. A number pad between deciding and betting is the slowest
     part of the flow and the one place people reconsider, so the common
     amounts are one tap and typing is the fallback, not the default. */
  .chain-amt-row{display:flex;gap:6px;margin-bottom:8px}
  .chain-chip{flex:1;font:inherit;font-weight:800;font-size:12.5px;padding:9px 0;cursor:pointer;
    border:1.5px solid var(--hair-g);border-radius:999px;background:var(--white);color:var(--ink);
    white-space:nowrap}
  .chain-chip.on{background:var(--accent);border-color:var(--ink);border-width:2.5px}
  .chain-chip--other{flex:0 0 auto;padding-left:14px;padding-right:14px}
  :root[data-theme="dark"] .chain-chip{background:var(--ground-2);color:var(--on-ground);
    border:2.5px solid rgba(255,255,255,.18);box-shadow:0 4px 0 rgba(0,0,0,.8)}
  :root[data-theme="dark"] .chain-chip.on{background:#D7DC1F;color:#3A4106;border-color:#05060A}
  :root[data-theme="dark"] .chain-chip:active{box-shadow:0 1px 0 rgba(0,0,0,.8);transform:translateY(3px)}
  .chain-amt{display:block;width:100%;font:inherit;font-size:16px;font-weight:700;padding:9px 10px;
    margin-bottom:8px;border:1.5px solid var(--ink);border-radius:12px;background:var(--white);
    box-sizing:border-box;text-align:center;color:var(--ink)}
  .chain-amt[hidden]{display:none}
  /* The one button that commits money, sized like it. .claimbtn is shaped for
     a flex row on a card, where flex:0 0 auto is right; dropped into the sheet
     it renders as a small left-aligned control competing with "Not now" for
     attention. Full width, and it goes last so nothing sits between deciding
     and doing. */
  .chainsheet #chainstake{display:block;width:100%;flex:none;margin-top:2px}
  .chain-line{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--acc-deep);min-height:16px;margin-bottom:8px}
  .chain-err{font-family:'Nunito';font-weight:700;font-size:12px;color:#c0392b;margin:6px 0 0}
  .chain-sig{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted);margin:6px 0 14px}
  .chain-sig a{color:var(--link-g)}
  .chain-pool-odds{display:flex;gap:8px;margin:0 0 12px}
  /* Translucent fill: --wash stays #F3FBDA in dark mode while --muted-g and
     the <b> inside (--on-ground) both lighten, which put pale text on a pale
     chip. Pre-existing, found by scripts/test-contrast.ts. */
  .chain-pool-side{flex:1;font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--muted-g);
    background:rgba(127,127,127,.10);border:1.5px solid var(--hair-g);border-radius:12px;padding:8px 10px;text-align:center}
  .chain-pool-side b{display:block;font-family:'Fredoka';font-weight:700;font-size:18px;color:var(--on-ground);margin:2px 0}
  .chain-pool-side small{color:var(--acc-deep)}
  .chain-pool-empty{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted-g);margin:0 0 12px}
  .chain-fee-note{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);
    margin:10px 0 4px;text-align:center;line-height:1.45}
  /* The claim prompt on Positions — money you're owed, so it's allowed to be
     the loudest thing on that screen. Removes itself entirely when there is
     nothing to collect (see refreshClaimable): a standing "no winnings" row
     is clutter, and this must never imply a payout that isn't there. */
  .chain-claimcheck{border:1.5px solid #000;border-radius:18px;background:var(--accent);
    padding:12px 13px;margin:0 0 14px}
  .cc-row{display:flex;align-items:center;gap:10px}
  .cc-text{flex:1;font-family:'Nunito';font-weight:800;font-size:12.5px;color:#101010;line-height:1.35}
  .cc-go{flex:none;font-family:'Nunito';font-weight:900;font-size:12px;color:var(--accent);
    background:#101010;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
  .cc-head{font-family:'Fredoka';font-weight:700;font-size:16px;color:#101010;margin:0 0 9px;
    display:flex;align-items:center;gap:8px}
  /* A drawn marker, not an emoji: colour emoji render differently on every
     platform and cannot carry a brand, so the head wears a solid brand square
     that looks the same everywhere. */
  .cc-head::before{content:"";flex:none;width:11px;height:11px;background:#101010;border-radius:2px}
  .cc-item{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;
    background:rgba(255,255,255,.66);border:1.5px solid rgba(0,0,0,.4);border-radius:12px;
    padding:9px 11px;margin:0 0 7px}
  .cc-item:last-child{margin-bottom:0}
  .cc-q{font-family:'Nunito';font-weight:800;font-size:12.5px;color:#101010;line-height:1.3}
  .cc-meta{grid-column:1;font-family:'Nunito';font-weight:700;font-size:11px;color:#2b3d10}
  .cc-claim{grid-column:2;grid-row:1/3;font-family:'Nunito';font-weight:900;font-size:12px;
    color:var(--accent);background:#101010;border:0;border-radius:999px;padding:8px 15px;cursor:pointer}
  .orow{--fill:50%;flex:1 1 0;position:relative;overflow:hidden;isolation:isolate;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    min-height:122px;padding:15px 8px 18px;border-radius:20px;border:1.5px solid var(--card-line);background:var(--card-surface);
    cursor:pointer;font-family:inherit;box-shadow:none;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, opacity .2s ease}
  .orow:active{transform:translateY(1px) scale(.985)}
  .orow:disabled{cursor:default}
  .orow>*{position:relative;z-index:2}
  /* The accent FILL: a layer that springs up from the bottom on tap — the "fill",
     not an instant background swap. overflow clips its spring overshoot. The odds
     are the big number; no sub-bar (it read as a half-rendered stub). */
  .orow::before{content:"";position:absolute;inset:0;z-index:1;background:var(--accent);
    transform:scaleY(0);transform-origin:bottom center;
    transition:transform .34s cubic-bezier(.34,1.55,.5,1)}
  .oside{font-family:'Fredoka';font-size:13px;font-weight:700;letter-spacing:.05em;color:#6B7A88;text-transform:uppercase}
  .opct{font-size:min(42px,11vw);font-weight:700;line-height:1;letter-spacing:-.02em;
    color:#141414;-webkit-text-stroke:2.5px #fff;paint-order:stroke fill;font-variant-numeric:tabular-nums;text-align:center}
  .opct-unit{font-size:.48em;font-weight:700;vertical-align:.42em;margin-left:1px}
  .opay{font-family:'Nunito';font-weight:800;font-size:12px;color:#4d6e10;white-space:nowrap}
  /* Tapped: the fill springs up, the tile lifts — a crisp, tactile locked state. */
  .orow.pick{transform:scale(1.02);box-shadow:0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(120,165,40,.4)}
  .orow.pick::before{transform:scaleY(1)}
  .orow.pick .oside{color:#25340a}
  .orow.pick .opay{color:#31480a}

  /* DARK THEME: the app's own language, brought to the landing's.
     .orow ships a hardcoded white fill and a 3.5px black border — the chunky
     look the light theme is built around — which on a black page reads as two
     grey slabs and as a different product from the front door. Overridden only
     under [data-theme="dark"], so the bright theme keeps every value it was
     designed and contrast-checked with.
     The sides also stop being identical: yes takes the brand chartreuse, no
     the same coral the landing uses, both as translucent tints over whatever
     the card's own surface is — never a fixed fill, which is the trap that has
     bitten this file three times. */
  /* BRIGHT THEME, same language as dark and as the landing.
     .orow used to be a 3.5px black outline with a hard offset shadow — the
     chunky treatment the rest of the bright theme is built on, and the loudest
     thing between the front door and the product. It is now a hairline card,
     with yes and no carrying the same two brand colours they carry everywhere
     else, as translucent tints so they sit on whatever surface is under them.
     The dark overrides below restate the same rules at dark-theme values. */
  /* Solid here too. The bright theme was built on a chunky black outline and
     had drifted to the same translucent tints the dark one had, which is the
     SaaS look arrived at from the other direction: two pale panes where there
     should be two buttons. Hypercasual applies to both themes; only the
     cyberpunk half (black ground, neon floor, glow) is dark-only. */
  .orow{border:3px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.22)}
  .orow[data-side="yes"]{background:var(--accent)}
  .orow[data-side="no"]{background:#FF2D78}
  .orow[data-side="yes"] .oside{color:#3A4106}
  .orow[data-side="no"] .oside{color:#5C0020}
  .orow[data-side="no"] .opay{color:#6B0026}
  .orow[data-side="yes"] .opay{color:#4A520A}
  .orow[data-side="no"] .opct{color:#2B0010;-webkit-text-stroke:0}
  .orow[data-side="yes"] .opct{color:#12140A;-webkit-text-stroke:0}
  .orow:active{box-shadow:0 2px 0 rgba(0,0,0,.22);transform:translateY(4px) scale(.99)}

  /* DARK, TAKE THREE, and this time the chunk stays.
   *
   * The note above records the first two attempts and both were half right.
   * The original was a 3.5px BLACK outline with a hard offset: chunky, and
   * invisible on a black page, which is why it became two grey slabs. The fix
   * was to drop to translucent tints, which restored legibility and threw away
   * the weight, leaving two faint panes that look like the disabled state of a
   * button rather than the two halves of a bet.
   *
   * On a dark ground the chunk does not come from the outline. It comes from
   * the FILL. Solid lime and solid pink, dark ink on top, a dark outline for
   * the edge and a hard offset underneath: the same treatment as the demo card
   * on the landing, and the same one the share card has always used. The two
   * surfaces are now literally the same object.
   */
  :root[data-theme="dark"] .orow{
    border:3px solid #05060A;box-shadow:0 6px 0 rgba(0,0,0,.9)}
  :root[data-theme="dark"] .orow[data-side="yes"]{background:var(--accent);border-color:#05060A}
  :root[data-theme="dark"] .orow[data-side="no"]{background:#FF2D78;border-color:#05060A}
  :root[data-theme="dark"] .orow[data-side="yes"] .oside{color:#3A4106}
  :root[data-theme="dark"] .orow[data-side="no"] .oside{color:#5C0020}
  :root[data-theme="dark"] .orow:active{box-shadow:0 2px 0 rgba(0,0,0,.9);transform:translateY(4px) scale(.99)}
  /* The numbers and their fixed ink. .opct is #141414 with a WHITE 2.5px stroke
     — near-black type outlined in white, which is legible on the light theme's
     white tile and all but invisible the moment the tile went dark: the fill
     vanished into the background and only the outline was left. .opay is a deep
     olive with the same problem. Both are given theme-aware values here rather
     than being changed at source, so the bright theme keeps exactly what it was
     contrast-checked with. */
  :root[data-theme="dark"] .opct{color:#12140A;-webkit-text-stroke:0}
  :root[data-theme="dark"] .orow[data-side="no"] .opct{color:#2B0010}
  :root[data-theme="dark"] .orow[data-side="yes"] .opay{color:#4A520A}
  :root[data-theme="dark"] .orow[data-side="no"] .opay{color:#6B0026}
  /* Same fix, same reason: a near-black heading inside a strip that is now dark. */
  :root[data-theme="dark"] .onbstrip .onbhero{color:var(--on-ground)}
  /* ------------------------------------ chunk, on the surfaces that earn it --
   * Same rule as the landing: the objects a thumb acts on get the weight, and
   * the metadata around them stays light. Chunk on everything is chunk on
   * nothing, and the chips are read, not pressed.
   */
  :root[data-theme="dark"] .card{
    border:2.5px solid rgba(255,255,255,.14);box-shadow:0 10px 0 rgba(0,0,0,.55)}
  /* The teaching strip is an object too: a sticker laid on the feed, not a
     panel bolted into it. */
  :root[data-theme="dark"] .onbstrip{
    border:2.5px solid rgba(255,255,255,.16);box-shadow:0 6px 0 rgba(0,0,0,.7)}
  /* Anything that signs, connects or spends. A hairline rectangle is what a
     settings row looks like, and these are the opposite of a settings row. */
  :root[data-theme="dark"] .cbtn{
    border:2.5px solid rgba(255,255,255,.2);border-radius:14px;
    box-shadow:0 5px 0 rgba(0,0,0,.8)}
  :root[data-theme="dark"] .cbtn:hover:not(:disabled){border-color:var(--accent)}
  :root[data-theme="dark"] .cbtn:active:not(:disabled){box-shadow:0 1px 0 rgba(0,0,0,.8);transform:translateY(4px)}
  :root[data-theme="dark"] .cbtn:disabled{box-shadow:none;border-color:rgba(255,255,255,.1)}
  /* The button that puts SOL down, in the same language as the YES/NO it
     follows. */
  :root[data-theme="dark"] .claimbtn{
    border:3px solid #05060A;box-shadow:0 6px 0 rgba(0,0,0,.9), 0 0 40px rgba(215,220,31,.3)}
  :root[data-theme="dark"] .claimbtn:active:not(:disabled){
    box-shadow:0 2px 0 rgba(0,0,0,.9);transform:translateY(4px)}

  .orow.dim{opacity:.4;transform:scale(.955)}
  :root[data-theme="dark"] .orow.dim{opacity:.5}
  /* The confirmation snap: one quick ring-flash the instant a call locks in — the
     "juice" on the single most important tap in the product. A ring (not a fill
     swap, that already happened) expands and fades once, tasteful not gaudy. */
  .orow.locked-flash::after{content:"";position:absolute;inset:-3px;z-index:3;border-radius:inherit;
    border:1.5px solid var(--accent);opacity:0;pointer-events:none;
    animation:lockring .6s cubic-bezier(.2,.7,.3,1)}
  @keyframes lockring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.14)}}

  /* Shared entrance: a fast, staggered rise+fade — cards, badges, medallions,
     stat rows all use this ONE motion so the product feels like one system
     rather than every screen inventing its own animation. */
  @keyframes enterUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .enter{animation:enterUp .42s cubic-bezier(.2,.7,.3,1) backwards}

  /* The continuous-play chain's card swap — deliberately NOT .enter. A chain
     advance is a snap, not an arrival: it travels further (a real slide, not a
     10px settle), lands faster (.28s vs .42s), and overshoots slightly before
     settling so it reads as spring-loaded rather than faded-in. Home's chain is
     the only place this is used; every other entrance stays on .enter so the
     rest of the product still moves as one system. */
  @keyframes snapIn{
    0%{opacity:0;transform:translateY(30px) scale(.98)}
    55%{opacity:1;transform:translateY(-4px) scale(1.006)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .snap-in{animation:snapIn .28s cubic-bezier(.22,1.15,.36,1) backwards}
  /* The swipe-up exit is driven entirely from JS (inline transform/opacity, so
     it can track the finger frame by frame) — see attachSwipeUp. Nothing to
     declare here; the class exists only so the gesture is greppable from CSS. */
  .nextcall-prev{touch-action:pan-y}

  @media (prefers-reduced-motion:reduce){
    .orow,.orow::after,.orow::before,.card{transition:none}
    .orow.locked-flash::after{animation:none;display:none}
    .enter{animation:none}
    .snap-in{animation:none}
  }

  /* The balance pill keeps its pale-lime fill (a SURFACE token) in BOTH themes,
     so in dark mode its number and top-up note must stay dark to read on it. */
  [data-theme="dark"] .bal{color:#000}
  [data-theme="dark"] .topup{color:#8aa63a}

  /* In the flow, under the buttons. Floated above them it landed in the same strip
     as the prepay line ("+N predictions if right") and sat on top of it. Kept in
     the layout at opacity 0 so nothing reflows when it fades in. */
  /* The score pill. Class name says .bal for the same reason renderCard's
     --white does: renaming it would touch every call site and every stylesheet
     rule for no behaviour change, and the comment is cheaper than the churn.
     It is a score, not a balance, and it must never look like money: the only
     money in oddie is SOL in a wallet this app never holds. */
  .bal{margin-left:8px;font-family:'Nunito';font-weight:800;font-size:13.5px;
    padding:4px 11px;border:1.5px solid var(--ink);border-radius:999px;
    background:var(--wash);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bal[hidden]{display:none}   /* an empty pill still draws its border and padding */
  .bal.pulse{animation:balpulse .45s ease}
  /* The unit label under the number. It read "left", from when the pill counted
     a spendable allowance; it reads "score" now, because nothing here is spent
     and an allowance nobody draws down is just a number wearing a costume. */
  .ptslbl{font-size:9.5px;font-weight:800;opacity:.62;letter-spacing:.03em;text-transform:uppercase}
  /* Pick-streak badge — visible identity beside the balance. Small, warm, fixed
     colours (holds contrast in both themes); only rendered at streak 2+. */
  .streakbadge{display:inline-flex;align-items:center;margin-left:6px;vertical-align:middle;
    font-family:'Nunito';font-weight:900;font-size:12px;line-height:1;color:#7a3b00;
    background:#ffd8a8;border:2px solid var(--ink);border-radius:999px;padding:3px 8px;white-space:nowrap}

  /* One tap, bright<->dark, always in the top bar — no menu, no label. It shows the
     mode you'll GET: a moon in bright, a sun in dark. "Auto" still lives in Profile
     for people who want to follow the system; tapping here just commits a choice. */
  .themetog{width:34px;height:34px;flex:none;margin-left:8px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:1.5px solid var(--line-g);background:transparent;
    color:var(--on-ground);cursor:pointer}
  .themetog svg{width:18px;height:18px;stroke:currentColor;fill:none;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .themetog:hover{background:var(--ground-2)}
  .themetog:active{transform:scale(.92)}

  /* Zero-balance nudge: reframes the wait so a busted device reads as "resting",
     not "locked out". A light wash surface, so it holds in both themes. */
  .znote{background:var(--wash);border:1.5px solid var(--accent);border-radius:16px;
    padding:12px 14px;margin-bottom:16px;font-family:'Nunito';font-weight:700;
    font-size:13px;line-height:1.45;color:var(--ink)}
  .znote b{font-weight:800}

  /* positions: reputation, live tracking, the sell button */
  .rep{display:flex;align-items:center;gap:14px;border:1.5px solid #000;border-radius:22px;
    background:var(--wash);padding:14px 16px;margin-bottom:16px}
  /* The score is allowed to be red. That is the whole point of measuring it. */
  .repnum{font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;flex:none}
  .repwho{display:flex;flex-direction:column;gap:2px;font-family:'Nunito';font-size:12.5px;color:var(--muted);font-weight:700}
  .repwho b{font-family:'Baloo 2','Nunito',sans-serif;font-size:15px;color:#000;font-weight:700}
  .prov{margin-left:6px;font-weight:800;color:#8a6d1f}
  .prov.done{color:var(--muted)}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .catedge{font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;border:2px solid var(--bar);background:#fff}
  .up{color:#0f7b3d} .down{color:#b3261e} .flat{color:var(--muted)}
  .catedge.up{border-color:#bfe6cd} .catedge.down{border-color:#f0c6c2}
  .psec{font-size:14px;font-weight:700;margin:20px 0 10px;color:var(--muted-g);
    font-family:'Nunito';font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  /* Stage 1 onboarding: the section header itself becomes the cue for a
     zero-position visitor ("Make your first call ↓") — same weight/size as
     every other section label, just accent-colored so it reads as a nudge,
     not an alert. */
  .psec.cue{color:#4d7a1a}
  :root[data-theme="dark"] .psec.cue{color:var(--accent)}
  .track{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45}
  .track b{font-weight:800}
  .sellbtn{font:inherit;font-weight:700;font-size:15px;width:100%;margin-top:11px;padding:10px 0;cursor:pointer;
    border:1.5px solid var(--ink);border-radius:14px;background:var(--white)}
  .sellbtn:hover{background:var(--wash)}
  .sellbtn:disabled{opacity:.55;cursor:default}
  /* Honest, non-clickable replacement for the Sell button when a retry is pointless. */
