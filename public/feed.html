     what's still missing instead of a tier nobody earned. */
  /* A TRANSLUCENT fill, not var(--wash). --wash is light in BOTH themes while
     the tier/rank text below is var(--on-ground), which flips to near-white —
     so in dark mode the heading was near-white on cream and simply not there.
     Fourth time this pairing has bitten this file; the first three were caught
     inside one rule, this one hid across two (background here, colour on a
     descendant), which is the hole test-contrast now covers. */
  /* NO fill in bright, a faint one in dark, and the border does the work in both.
     Any grey wash here darkens the light ground under .standing-sub, and
     --muted-g was tuned against the UNWASHED ground (4.82:1): at .10 the sub
     measured 4.31, at .06 it measured 4.49 — still under the 4.5 floor, by a
     hundredth. Chasing the opacity was the wrong move; removing it puts the
     text back on the surface its colour was chosen for. Dark has no such
     problem, so it keeps a panel. */
  .standing.pending{background:none;border-color:var(--hair-g)}
  :root[data-theme="dark"] .standing.pending{background:rgba(255,255,255,.06)}
  .standing.pending .standing-tier,.standing.pending .standing-rank{color:var(--on-ground)}
  .standing.pending .standing-sub{color:var(--muted-g)}

  /* leaderboard */
  .lb{border:1.5px solid #000;border-radius:22px;overflow:hidden;background:#fff}
  .lb .r{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:2px solid var(--bar)}
  .lb .r:last-child{border-bottom:0}
  .lb .r.you{background:var(--wash)}
  .rank{width:30px;text-align:center;font-family:'Nunito';font-weight:800;font-size:14px;color:var(--muted);flex:none}
  /* `podium`, not `top`: `.top` is the fixed page header, and a rank div wearing
     that class inherits position:fixed;top:0;left:0 and flies to the corner. */
  .rank.podium{width:27px;height:27px;line-height:23px;border-radius:50%;
    background:var(--accent);border:2px solid #000;color:#000;font-size:12.5px}
  .mini{width:34px;height:34px;border-radius:50%;background:var(--accent);border:2px solid #000;position:relative;flex:none}
  .mini::before,.mini::after{content:"";position:absolute;width:6px;height:6px;background:#000;border-radius:50%;top:12px}
  .mini::before{left:7px}.mini::after{left:19px}
  .who{font-family:'Nunito';font-weight:800;font-size:14px}
  .acc{font-family:'Nunito';font-weight:800;font-size:13px;color:var(--acc-mid);text-align:right;flex:none}
  /* A negative reputation that renders in the brand's friendly teal is not a
     measurement, it is a compliment. .acc set the colour and won on specificity. */
  .acc.up{color:#0f7b3d} .acc.down{color:#b3261e} .acc.flat{color:var(--muted)}
  .acc small{display:block;font-weight:700;font-size:11px;color:var(--muted)}

  /* notifications */
  .note{display:flex;gap:12px;padding:14px 0;border-bottom:2px solid var(--bar)}
  .note:last-child{border-bottom:0}
  .nicon{width:38px;height:38px;border-radius:50%;border:1.5px solid #000;background:var(--wash);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .nicon.win{background:var(--accent)}
  .ntext{font-family:'Nunito';font-weight:700;font-size:14px;line-height:1.35}
  .ntext b{font-weight:800}
  .nwhen{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted);margin-top:3px}

  /* Settlement as a postable moment. White tile in both themes (contrast lesson),
     a coloured rail for the verdict, and a share button that's loud for a win and
     a shrug for a loss — never a token reward (a paid share is spam, and rewards
     are what let the farm in; the win itself is the reason to post). */
  .ncard{border:1.5px solid #000;border-left-width:9px;border-radius:18px;background:#fff;color:var(--ink);
    padding:14px 15px 15px;margin-bottom:11px}
  .ncard.win{border-left-color:#0f7b3d} .ncard.loss{border-left-color:#b3261e}
  .nctop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ncbadge{font-family:'Nunito';font-weight:800;font-size:12.5px;padding:4px 11px;border-radius:999px;border:1.5px solid #000}
  .ncbadge.win{background:#d7f2e0;color:#0b5c2e} .ncbadge.loss{background:#f7dbd7;color:#8f1d17}
  .ncwhen{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:#7a8894}
  .ncpay{font-family:'Fredoka';font-weight:700;font-size:30px;line-height:1;color:#0f7b3d;margin:2px 0 8px;font-variant-numeric:tabular-nums}
  .ncbody{font-family:'Nunito';font-weight:700;font-size:13px;line-height:1.4;color:var(--ink);margin:0 0 13px}
  .ncshare{display:inline-flex;align-items:center;gap:8px;font-family:'Fredoka';font-weight:600;font-size:15px;color:#000;
    border:1.5px solid #000;border-radius:14px;padding:9px 17px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .08s}
  .ncshare:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .ncshare.win{background:var(--accent)} .ncshare.loss{background:#fff}
  .ncshare svg{width:16px;height:16px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .unread{width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #000;align-self:center;flex:none}

  /* --------------------------------------------------------------- mobile nav -- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
    background:var(--ground-2);border-top:1.5px solid var(--line-g);
    padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;background:none;border:0;cursor:pointer;height:var(--tabh);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:'Nunito';font-weight:800;font-size:10px;color:var(--muted-g);padding:0}
  .tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.1;
    stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--on-ground)}
  .tab.on svg{stroke:var(--on-ground)}
  .tab.on .ico{background:var(--accent);border-radius:999px}
  .ico{padding:2px 12px;display:flex;align-items:center;justify-content:center}

  /* ------------------------------------------------------------------ desktop -- */
  /* Mobile ends at 430px; nothing above changes below that width. From 768px the
     shell assembles itself: a rail on the left, the card column contained in a
     framed sheet, and the brand — dot grid, oversized eyes — taking the space the
     column doesn't need, instead of leaving it blank. */
  @media (min-width:768px){
    /* Desktop = the mobile app, dead-centre: ONE column (chips + cards + peek of
       the next), the nav in a centred bottom bar, and a quiet atmospheric ground
       doing equal work on both sides. No offset rail, nothing overflowing. */
    body{background:var(--feed-ground);overflow:hidden}
    /* The column was pinned at a fixed 500px regardless of viewport, so a wide
       monitor read as mostly empty margin either side. Let it breathe with the
       viewport instead — scales up to a sensible cap so cards never stretch
       into a thin-content, all-whitespace layout, but a lot less floats. */
    body{--feedcol:min(560px, 62vw)}
    /* .top is in normal flow here (not fixed, like on mobile), so it already
       occupies its own space above the scroller — .homewrap doesn't also need
       mobile's ~82px clearance for a fixed header it doesn't have. That extra
       padding was dead air between the header rule and the hero headline. */
    .homewrap{padding-top:calc(env(safe-area-inset-top) + var(--sp-4))}
    /* A soft lime glow seated high in the viewport, fading into the ground colour
       below it — same recipe as .hero::before, just sized for the whole page
       rather than one headline. Reads as atmosphere, not a technical grid. */
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 900px 560px at 50% -8%, rgba(182,240,95,.20), transparent 70%)}
    :root[data-theme="dark"] body::before{
      background:radial-gradient(ellipse 900px 560px at 50% -8%, rgba(182,240,95,.10), transparent 70%)}
    .rail,.side,.watermark,.railnav{display:none}

    /* Materialise the shell into a single centred column. */
    .app{display:flex;justify-content:center;height:100dvh;position:relative;z-index:1}
    .stage{display:contents}
    .frame{display:flex;flex-direction:column;width:calc(var(--framecol, var(--feedcol)) + 44px);max-width:100%;height:100dvh}

    /* Header in flow at the top of the column. Chips WRAP so every category is
       visible; header and scroller share a 22px inset, so chips and card align to
       the exact same left/right bounds. */
    .top{position:static;background:transparent;border-bottom:none;padding:16px 22px 10px}
    /* Desktop drops the edge-to-edge stripe entirely. Full-bleed is right on a
       phone, where the bar is one line in a narrow column and reads as a
       status strip under the header. Given a wide viewport that same rule
       made it the single widest element on screen — 804px at a 1440
       viewport, 56% of the width and 84px WIDER than the market card it sits
       above — so the loudest thing on the page was a dismissible notice.
       Here it collapses to a content-width pill that hugs its own text: same
       information, same dismiss, a fraction of the presence. width:max-content
       is what stops it stretching to the column; the max-width keeps a long
       string from ever out-running the card below it. */
    .guestbar{margin:2px auto 0;width:max-content;max-width:100%;
      padding:6px 6px 6px 15px;gap:9px;
      border:2px solid #000;border-radius:999px;background:var(--accent)}
    body[data-view="feed"] .guestbar{border-bottom:2px solid #000}
    /* The verbose half of the sentence. On a phone it's the whole point — the
       bar has a full row to itself and nothing else competes. In a compact
       pill it's what forces the pill back to stripe-width, and the Connect
       button beside it already names the action, so desktop keeps the status
       and drops the explanation (still on the element's title for hover). */
    .gb-long{display:none}
    .gb-text{flex:none;font-size:12.5px}
    .top-in{max-width:none;margin:0;padding:0}
    .top .brand{display:flex;justify-content:flex-start;gap:9px;margin:0 0 13px 2px}
    .chips{flex-wrap:wrap;overflow:visible;gap:8px}

    /* Same physical card object as mobile — content-hug, filling the column; the
       22px side padding gives the soft shadow room (the scroller would clip it).
       The next card peeks + recedes below. */
    /* scroll-snap-type is scoped to .scroller.snap ONLY (matches the mobile rule) —
       it used to apply unconditionally here, which leaked feed-style snap-scroll
       onto every other view at desktop widths, home included. A static page must
       scroll like a static page: no snap container, no bounce-to-next-section. */
    .scroller{height:auto;flex:1;min-height:0;
      scroll-padding-top:6px;padding:0 22px calc(var(--tabh) + 24px)}
    .scroller.snap{scroll-snap-type:y mandatory}
    .sheet{max-width:none;padding:26px 26px 34px}
    .card{width:100%;max-width:none;margin:0 0 18px;scroll-margin-top:6px;min-height:auto;padding:26px 26px 24px}
    .card:first-child{margin-top:2px}
    .onbwrap{width:100%;max-width:none;margin:2px 0 14px;scroll-margin-top:6px}
    .chead{margin-bottom:2px}
    .opct{font-size:44px}
    .oside{font-size:13px}
    .opay{font-size:12px}
    .take{font-size:34px}
    .nudge{margin-top:18px}

    /* Nav: a centred bottom bar aligned to the column, not a full-width stretch. */
    .tabs{display:flex;left:50%;right:auto;transform:translateX(-50%);
      width:var(--feedcol);max-width:calc(100% - 40px);
      border:1.5px solid var(--line-g);border-bottom:0;border-radius:20px 20px 0 0;overflow:hidden}
  }

  /* Wide screens: the nav becomes a LEFT sidebar (Twitter/X pattern), filling the
     empty region beside the centred column instead of a bottom bar. The rail is
     fixed and out of flow, so .app reserves its 218px with padding-left — the
     column then centres in the space actually left over, not the full viewport,
     which used to read as the column drifting left of true-center with a huge
     dead patch on the right. The column also widens further on very wide
     monitors, same reasoning as the 768px step: less floating whitespace.
     (58vw, not the 46vw this used to be: at exactly 1024px that resolved to
     ~471px — NARROWER than the 768px step's own 560px cap one pixel to the
     left of this breakpoint, a visible dip right at the boundary. 58vw clears
     560 at 1024 so the column only ever grows crossing a breakpoint.) */
  @media (min-width:1024px){
    /* DESKTOP READS AS A LIST, NOT A DECK.
       The card fills the viewport by design — that is the swipe mechanic, and on
       a phone it is right: one take, one decision, thumb at the bottom. On a
       1440px screen the same rule puts ONE 500px-wide card in the middle of an
       otherwise empty page, which is the "confusing / too much space" complaint.
       Here the card is as tall as its content, several fit at once, and the page
       reads as markets you can scan. Nothing about the mobile feed changes. */
    .card{min-height:0;padding:20px 22px 18px;margin-bottom:14px}
    .card:first-child{margin-top:calc(var(--feedtop) - 6px)}
    /* Snap belongs to the swipe. Without the full-height card there is nothing
       to snap TO, and keeping it makes a mouse wheel jump between cards. */
    .scroller.snap{scroll-snap-type:none}
    .card{scroll-snap-align:none}
    /* The nudge is swipe language too. `.nudge.show` is what the script sets, and
       two classes beat one — matching the specificity is the whole fix. */
    .nudge,.nudge.show{display:none}
    /* The sort row duplicates the rail one-for-one at this width: For You,
       Trending, New, Resolving Soon are already the rail's first four items and
       highlight in step with it. Two identical controls stacked is not a choice,
       it is noise — so the chips are hidden where the rail exists, and kept
       below this breakpoint where they are the ONLY way to switch. */
    body{--feedcol:min(660px, 58vw)}
    /* HOME only: the column carrying the market cards widens well past
       --feedcol, because reviewed live at 1440 the page was a 760px strip of
       content with ~460px of empty ground either side — it read as unused,
       not as breathing room. --homewide is what the card GRID gets; prose
       and single-object sections stay at --homenarrow, because a headline or
       a claim strip stretched to 1100px is worse than one that's centred,
       not better. So the space gets used by more MARKETS, not by longer
       lines. .homewrap itself is not touched at other widths, and the feed
       view keeps --feedcol exactly as before. */
    /* The frame is hard-sized to --feedcol + 44px, so widening .homewrap alone
       does nothing — its parent clamps it first. --framecol is the override
       hook: set on the HOME view only, it widens the shell column; every other
       view leaves it unset and falls back to --feedcol exactly as before, so
       the swipe feed keeps its reading-width column untouched. */
    body[data-view="home"]{--framecol:min(1120px, calc(100vw - 218px - 120px))}
    .homewrap{--homenarrow:660px;max-width:100%}
    /* Everything that isn't the card grid stays at reading width and centred.
       :not(.mktgrid) is what lifts this to (0,2,0) so it beats the earlier
       `.homewrap .psec` margin shorthand that would otherwise pin section
       labels to the left edge of the now-much-wider column. */
    .homewrap>*:not(.mktgrid){max-width:var(--homenarrow);margin-left:auto;margin-right:auto}
    /* Two columns, not three: at this width three cards would each be ~360px,
       narrower than the mobile card they're supposed to be the desktop
       version of, and the question text would wrap worse than it does today. */
    .homewrap>.mktgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}

    /* RETURNING-player home becomes feed + rail. The create bar spans the top,
       the feed takes the room, and the viewer's own numbers sit beside it
       instead of pushing markets below the fold. Scoped to :has(.homerail) so
       the new-user layout (no rail, single centred column) is untouched. */
    .homewrap:has(.homerail){display:grid;grid-template-columns:minmax(0,1fr) 300px;
      gap:0 var(--sp-3);align-items:start}
    .homewrap:has(.homerail)>.createbar{grid-column:1 / -1;max-width:none}
    .homewrap:has(.homerail)>.homemain{grid-column:1;min-width:0;max-width:none}
    .homewrap:has(.homerail)>.homerail{grid-column:2;margin:0;position:sticky;top:var(--sp-2)}
    /* Anything else still parked directly on .homewrap (how-it-works, the

    .homewrap:has(.homerail)>.howitworks,
    .homewrap:has(.homerail)>.browselink{grid-column:1;max-width:none}
    /* Inside the narrower feed column the card grid drops back to one column:
       two ~250px cards would be worse than one comfortable one. */

    .app{padding-left:218px}
    .rail{display:flex;position:fixed;left:0;top:0;z-index:16;height:100dvh;width:218px;box-sizing:border-box;
      flex-direction:column;gap:26px;padding:26px 18px}
    .rail .brand{display:flex;justify-content:flex-start;align-items:center;gap:9px;flex-wrap:wrap;row-gap:9px;margin:0 0 0 6px}
    .rail .brand .bal{margin-left:0}
    .railnav{display:flex;flex-direction:column;gap:6px}
    /* The one filled control in the sidebar — creating is the product's first
       layer and should look like it, not like a sixth navigation row. */
    .navcreate{font-family:'Fredoka';font-weight:600;font-size:15px;color:#101010;
      background:var(--accent);border:1.5px solid #000;border-radius:16px;
      padding:12px 14px;cursor:pointer;text-align:center;margin:0 0 8px}
    .navcreate:active{transform:translateY(1px)}
    .navgroup{margin:16px 0 4px;padding:0 14px;color:var(--muted-g);
      font-family:'Nunito';font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .navgroup:first-of-type{margin-top:14px}
    .navitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;cursor:pointer;
      border:1.5px solid transparent;background:none;font-family:'Fredoka';font-size:15px;font-weight:500;
      color:var(--on-ground);width:100%;text-align:left}
    .navitem svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.1;
      stroke-linecap:round;stroke-linejoin:round;flex:none}
    .navitem:hover{background:var(--ground-2)}
    .navitem.on{background:var(--accent);border-color:#000;color:#000;font-weight:600}
    .railfoot{display:block;margin-top:auto;font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g)}
    .top .brand{display:none}     /* the rail carries the wordmark + balance + toggle */
    .tabs{display:none}           /* no bottom bar on desktop */
    .scroller{padding-bottom:26px}
  }

  /* A large monitor (1440px+) still had the 660px cap from the step above —
     comfortably readable, but narrow enough that a market card's question
     routinely wrapped to 3 lines where the extra room would settle it at 2,
     and left enough slack beside the rail that the column read as adrift
     rather than confidently sized for the space. */
  @media (min-width:1440px){
    body{--feedcol:min(760px, 53vw)}
  }


  /* Short windows — an iPhone SE, or a laptop with the browser chrome eating the
     height. Shrink the type, never the top padding: the header is ~98px tall on
     mobile and the stack is measured from the card's top edge, so trimming that
     padding walks the category chip straight under the chips row. */
  /* The whole length ladder steps down together, not a blanket .take.
     A single `.take{font-size:…}` here has the same specificity as .take-m and
     .take-s and sits LATER in the sheet, so it silently overrode both: on a
     short screen every question rendered at one size again, which is the height
     where fitting matters most. Measured at 375x660 (about what X's in-app
     browser leaves): 9 of 51 cards were still taller than their band.
     Padding and the question's bottom margin come in too — on a short screen
     the air is what there is least of, and trimming it costs nothing that a
     clipped YES/NO button does not cost more. */
  @media (max-height:680px) and (max-width:767px){
    .opct{font-size:min(44px,12vw)}
    .take{font-size:min(28px,7vw);margin-bottom:12px}
    /* take-m is pulled down near take-s here rather than kept a step above it.
       The thresholds are tuned for a tall screen, where a 100-character
       question at the middle size is comfortable; on a short one it was the
       single remaining overflow. */
    .take-m{font-size:min(21px,5.5vw)}
    .take-s{font-size:min(20px,5.3vw);line-height:1.26}
    .duel{gap:9px}
    .card{padding:16px 18px 16px}
    /* Out of flow. The nudge is a hint that another card is below, and on a
       short screen its own 44px was what pushed that card past the bottom of
       the screen — the affordance for the next card was hiding the current
       one's buttons. It overlays the card's bottom edge instead of taking a
       row, so it still points down without costing height. */
    .nudge{position:absolute;left:0;right:0;bottom:6px;margin:0;pointer-events:none}
  }
  @media (max-height:760px) and (min-width:768px){
    .opct{font-size:40px}
    .take{font-size:30px}
    .nudge{margin-top:14px}
  }

<script>
const API=""; // same origin
/* The mirrored economy constants are gone with the economy they described.
   They existed for an optimistic UI that deducted before the server answered,
   and the comment above them promised they mirrored economy.ts exactly. They
   did not: CALL_COST sat at 1 here against 0 on the server, so a tap drew the
   balance down by one and the next /api/me snapped it back. Nothing reads them
   now, which is the only reason that drift never cost anybody anything. */

/* -------------------------------------- real-stakes layer (opt-in, gated) --
 * "Skin in the game" — an entirely optional, separate layer for putting real
 * SOL behind a call, built on the same devnet pari-mutuel program the admin
 * panel already mints markets on. It is OFF by default: this fetch is the
 * ONLY thing that runs unconditionally, and it does nothing visible — no
 * button, no wallet prompt, no real-money copy exists anywhere until the
 * server's own ONCHAIN_ENABLED flag answers true. Off, this page renders
 * identically to a build that never had this feature at all.
 */
let CHAIN_ENABLED=false;
async function initChainLayer(){
  try{
    const r=await fetch(`${API}/api/chain/status`);
    if(!r.ok)return;
    const j=await r.json();
    if(!j.enabled)return;
    CHAIN_ENABLED=true;
    const s=document.createElement("script");
    s.src="/chain.js";
    // The cluster travels with the flag that turned this on, so chain.js never
    // has to name a network itself. It used to hardcode "Solana devnet", which
    // would tell somebody spending real money they were on a test net the day
    // the server moved.
    s.onload=()=>window.OddieChain&&window.OddieChain.init(j.cluster);
    document.head.appendChild(s);
  }catch(e){/* real-stakes is optional; the core product never depends on this */}
}

/* --------------------------------------------------- predictions balance -- */
/**
 * Virtual predictions, nothing else. Every device starts with a small handful,
 * server-side; the number in the header is the server's, not a local guess —
 * a second tab or a reload always shows what the database says. `balance` is
 * null until /api/me answers.
 */
let balance=null, oddies=0, pickStreak=0, myAvatarStamp=null;
// Identity extras from /api/me, for the private profile: earned badges and the
// season rank. Cached from the same call that fills the balance pill.
let myBadges=[], myRank=null;
let myHandle=null, myHandleEditable=true;
// "14h", "40m", "any moment" — the wait until the next daily claim opens.
let myOpenCalls=null, myCreator=null;
async function loadBalance(){
  try{
    const r=await fetch(`${API}/api/me?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok){const w=await r.json();balance=w.tokens;if(typeof w.oddies==="number")oddies=w.oddies;
      myAvatarStamp=w.avatarStamp??null;
      if(typeof w.pickStreak==="number")pickStreak=w.pickStreak;
      myBadges=w.badges||[];myRank=w.rank||null;
      myHandle=w.handle??myHandle;myHandleEditable=w.handleEditable!==false;
      myOpenCalls=w.openCalls||null;myCreator=w.creator||null;
      paintBalance();paintStatusStrip();}
  }catch(e){/* header just shows no pill; the server still enforces */}
}
/**
 * YOUR STATUS, at the top of the feed.
 *
 * The three facts a returning player opens the app to check were spread across
 * three different destinations: open positions on Positions, fees earned on My
 * markets, resolutions in Notifications. None of them were on the screen the
 * app actually opens on, so the feed answered "what is happening in the world"
 * and never "what is happening to me".
 *
 * One line, three numbers, each a link to the page that owns it. Every number
 * is REAL and each is omitted when it has nothing to say — a strip of zeroes on
 * a fresh device is noise, and it is also the loudest possible way to tell
 * someone they have done nothing yet.
 */
/**
 * Paint (or repaint) the strip wherever the feed's top block is.
 *
 * /api/me resolves after the first render — boot is render(), then
 * loadAuth().then(loadBalance) — so the strip cannot be built during the render
 * that puts the feed on screen. It is inserted when its data arrives instead,
 * and re-inserted on every later paint so a balance refresh keeps it current.
 */
function paintStatusStrip(){
  const scroller=document.getElementById("scroller");
  if(!scroller||document.body.dataset.view!=="feed")return;
  scroller.querySelector(".ystrip")?.remove();
  const strip=statusStrip();
  if(!strip)return;
  let wrap=scroller.querySelector(".onbwrap");
  if(!wrap){
    // Nothing else wanted the slot this load; the strip gets it on its own.
    wrap=document.createElement("div");wrap.className="onbwrap";
    scroller.prepend(wrap);
  }
  wrap.prepend(strip);
}

function statusStrip(){
  const bits=[];
  const open=myOpenCalls&&myOpenCalls.count>0?myOpenCalls.count:0;
  const made=myCreator&&myCreator.marketsCreated>0?myCreator.marketsCreated:0;
  const fees=myCreator&&myCreator.earnings>0?myCreator.earnings:0;
  if(open)bits.push({go:"#/positions",n:open,k:open===1?"open call":"open calls"});
  if(made)bits.push({go:"#/mymarkets",n:made,k:made===1?"market you made":"markets you made"});
  if(fees)bits.push({go:"#/mymarkets",n:fees,k:"earned in fees"});
  if(!bits.length)return null;
  const el=document.createElement("div");el.className="ystrip";
  el.innerHTML=bits.map(b=>
    `<a class="ystrip-b" href="${b.go}"><span class="ystrip-n">${b.n}</span><span class="ystrip-k">${b.k}</span></a>`
  ).join("");
  return el;
}

function paintBalance(pulse){
  if(balance===null)return;
  // The pill is the only permanent door to sign-in. It opens a sheet; it never
  // blocks anything behind it.
  document.querySelectorAll(".bal").forEach(el=>{
    if(el.dataset.wired)return;
    el.dataset.wired="1";
    el.setAttribute("role","button");
    el.setAttribute("aria-label","Your oddie score. Sign in to keep it across devices.");
    el.onclick=()=>connectSheet();
  });
  // Two pills — the mobile header's and the desktop rail's. Same number always.
  // The refill line only appears when it can do something for you: with a full
  // balance there is nothing to count down to, and a countdown to nothing is a nag.
  document.querySelectorAll(".bal").forEach(el=>{
    // A SCORE, and it has to read as one now.
    //
    // The unit is NAMED, not implied: "5 LEFT" made a newcomer ask "5 what?"
    // as their first question. It counted predictions once, honest while a
    // call cost one. A call became free, so the number could only go up and
    // bought nothing, and it was already closer to a score than a balance.
    //
    // Real money finished the argument. The only spendable thing in oddie is
    // SOL in a wallet oddie never touches, so a coin glyph and a count in the
    // top-left corner of a betting app reads as "here is your money" and is
    // wrong twice: it is not money, and the number beside it is not what you
    // could bet. The trophy and the word "score" are doing load-bearing work,
    // not decoration.
    //
    // The chip used to print a 0 for a newcomer, on the argument that an honest
    // zero beats a fake allowance. That argument still holds against a fake
    // number; it does not hold against showing nothing. A brand-new player met
    // four separate zeros across one screen, and this was one of them, sitting
    // beside a profile hero that already says the same thing bigger. So the
    // chip is earned: it appears with the first oddie, which makes its arrival
    // a small reward instead of a standing reminder.
    el.hidden=!(Number(oddies)>0);
    el.innerHTML=`🏆 ${oddies} <span class="ptslbl">score</span>`;
    if(pulse){el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse");}
    // Persistent pick-streak badge as visible identity, right beside the balance.
    // Shown only at 2+ (a 1 isn't a streak); it disappears the moment a wrong
    // pick breaks the run (server sends pickStreak 0/1 → no badge, no false comfort).
    let badge=el.nextElementSibling;
    if(!badge||!badge.classList||!badge.classList.contains("streakbadge")){
      badge=document.createElement("span");badge.className="streakbadge";el.after(badge);
    }
    if(pickStreak>=2){badge.textContent=`🔥 ${pickStreak}`;badge.title=`${pickStreak}-pick streak`;badge.style.display="";}
    else{badge.style.display="none";}
  });
}

/** The spend receipt: float a "−1" off every visible balance pill. Fire-and-
 *  forget; the span removes itself when its animation ends (or via the
 *  timeout under reduced motion, where the CSS hides it instantly). */
function flashBalanceSpend(){
  document.querySelectorAll(".bal").forEach(el=>{
    if(!el.offsetParent)return;                 // hidden pill (other breakpoint)
    const f=document.createElement("span");
    f.className="balspend";f.textContent="−1";
    f.addEventListener("animationend",()=>f.remove());
    el.appendChild(f);
    setTimeout(()=>f.remove(),1200);            // reduced-motion fallback cleanup
  });
}
/* ------------------------------------------------------------------- theme --
 * Auto by default, overridable, remembered. Three states rather than two: a
 * person who never touched it should keep following their phone when it flips
 * at sunset, and "Auto" is the only way to say that once you have offered a
 * manual choice at all.
 *
 * The theme is a property of this browser, not of the account. It is also, very
 * deliberately, not a property of the shared card: /card/*.svg is rendered on
 * the server from market data and never sees this value.
 */
const THEME_KEY="oddie_theme";
const systemDark=()=>matchMedia("(prefers-color-scheme:dark)").matches;
function themeMode(){ try{ return localStorage.getItem(THEME_KEY)||"auto"; }catch(e){ return "auto"; } }
function resolvedTheme(){ const m=themeMode(); return (m==="dark"||(m==="auto"&&systemDark()))?"dark":"bright"; }
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.4 19.6l1.6-1.6M18 6l1.6-1.6"/></svg>';
// Show the mode a tap will deliver: a moon while bright, a sun while dark.
function paintThemeToggle(){
  const to=resolvedTheme()==="dark"?SUN:MOON;
  document.querySelectorAll(".themetog").forEach(b=>{ if(b.innerHTML!==to)b.innerHTML=to; });
}
function paintTheme(){
  document.documentElement.dataset.theme=resolvedTheme();
  paintThemeToggle();
}
function setTheme(mode){
  try{ mode==="auto" ? localStorage.removeItem(THEME_KEY) : localStorage.setItem(THEME_KEY,mode); }catch(e){}
  paintTheme();
}
// One tap commits the opposite of whatever is on screen now. The header button is
// re-rendered with each view, so the click is delegated rather than bound.
document.addEventListener("click",e=>{
  const t=e.target.closest && e.target.closest(".themetog");
  if(!t)return;
  e.preventDefault();
  setTheme(document.documentElement.dataset.theme==="dark"?"bright":"dark");
});
// Follow the system while — and only while — nobody has overridden it.
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(themeMode()==="auto")paintTheme(); });
paintThemeToggle();

/* -------------------------------------------------------- optional identity --
 * Sign-in is an upgrade and never a wall. The only always-visible entry is the
 * balance pill; the rest are offers, taken or ignored. Nothing here gates the
 * feed, a call, a sell, or the leaderboard.
 */
let auth={accounts:[],providers:[]};
async function loadAuth(){
  try{
    const r=await fetch(`${API}/api/auth/me?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok)auth=await r.json();
  }catch(e){/* anonymous is the default, not the failure */}
  paintGuestBar(); // the one place auth is known — so the bar can never go stale
}

/* --------------------------------------------------------------- guest bar --
 * An anonymous device keeps its predictions, calls and score — but only in THIS
 * browser, and nothing on screen ever said so. Someone who has never linked an
 * account has no reason to suspect their score is not saved somewhere, which
 * is the worst possible thing to discover late.
 *
 * Dismissible, but not permanently: it comes back once they have played a few
 * more times, because the cost of losing a record grows with the size of it.
 * Keyed off a LOCAL call counter rather than anything server-side — this is a
 * nudge, not an accounting record, and it must work before any account exists.
 */
const GUEST_DISMISSED_AT="oddie_guest_dismissed_at";
const GUEST_CALLS="oddie_guest_calls";
const GUEST_REAPPEAR_AFTER=3;   // calls placed after a dismissal before it returns
function guestNum(k){ try{return Number(localStorage.getItem(k))||0;}catch(e){return 0;} }
function guestSet(k,v){ try{localStorage.setItem(k,String(v));}catch(e){} }
/** Called once per locked call, so "actions since dismissal" is countable. */
function bumpGuestCalls(){ guestSet(GUEST_CALLS,guestNum(GUEST_CALLS)+1); paintGuestBar(); }
function guestBarSuppressed(){
  let raw=null; try{raw=localStorage.getItem(GUEST_DISMISSED_AT);}catch(e){return true;}
  if(raw===null)return false;                                   // never dismissed
  return guestNum(GUEST_CALLS)-Number(raw) < GUEST_REAPPEAR_AFTER;
}

/**
 * The ONE number every "clear the fixed chrome" offset is derived from: the
 * real, rendered height of #top — which includes the guest bar, since the bar
 * is a child of it (see the .guestbar CSS note for why). Published as
 * --chromeh; --feedtop and .homewrap's top padding both calc() off it, so a
 * header that changes height moves the content offset with it instead of
 * leaving a hardcoded guess behind.
 *
 * Called on every event that can change the header's height. It's cheap (one
 * getBoundingClientRect + one setProperty) and idempotent, so over-calling it
 * is free and under-calling it is the only real failure mode — which is why
 * the observers below are deliberately redundant rather than minimal.
 */
function measureChrome(){
  const hdr=document.getElementById("top");
  if(!hdr)return;
  const h=hdr.getBoundingClientRect().height;
  if(h>0)document.documentElement.style.setProperty("--chromeh",`${Math.round(h)}px`);
}
// A resize on the header itself is the general case; the two below are the
// specific ones a ResizeObserver has been observed to miss or report late (a
// self-hosted font finishing its swap and reflowing the brand row, and a
// viewport/orientation change). Each is independently sufficient — no single
// API is the one thing standing between the chrome and the content under it.
if(typeof ResizeObserver!=="undefined"){
  const ro=new ResizeObserver(measureChrome);
  const startRO=()=>{const hdr=document.getElementById("top");if(hdr)ro.observe(hdr);measureChrome();};
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",startRO);
  else startRO();
}
window.addEventListener("resize",measureChrome);
window.addEventListener("orientationchange",measureChrome);
document.fonts?.ready?.then(measureChrome).catch(()=>{});

function paintGuestBar(){
  const bar=document.getElementById("guestbar");
  const show=!auth.accounts.length&&!guestBarSuppressed()&&guestNum(GUEST_CALLS)>0;
  if(!show){ bar?.remove(); measureChrome(); return; }
  if(bar)return;                                                // already up
  const el=document.createElement("div");
  el.id="guestbar";el.className="guestbar";
  // .gb-long is the explanatory half, hidden at the desktop breakpoint where
  // the bar becomes a compact pill (see the .guestbar override there). The
  // title carries the full sentence regardless, so nothing is only-visible on
  // one breakpoint. aria-label on the wrapper keeps the screen-reader text
  // complete even when the span is display:none.
  el.title="Connect X or Google to keep your score.";
  el.innerHTML=`<span class="gb-text" aria-label="Browsing as guest. Connect X or Google to keep your score."
      >Browsing as guest<span class="gb-long">. <b>Connect X or Google</b> to keep your score.</span></span>
    <button class="gb-go" type="button">Connect</button>
    <button class="gb-x" type="button" aria-label="Dismiss">✕</button>`;
  // Into the header itself, not the body — see the .guestbar CSS note. The
  // header grows by the bar's height, measureChrome picks that up, and every
  // content offset follows. No second position to keep in sync.
  const hdr=document.getElementById("top");
  (hdr||document.body).appendChild(el);
  el.querySelector(".gb-go").onclick=()=>connectSheet("Keep your score");
  el.querySelector(".gb-x").onclick=()=>{
    guestSet(GUEST_DISMISSED_AT,guestNum(GUEST_CALLS));
    el.remove(); measureChrome();
  };
  measureChrome();
}
/* The provider marks, in ONE place, matching the landing's sign-up band exactly.
   Google's is its published four-colour geometry — a sign-in button carrying a
   home-made approximation of that mark reads as a phishing page. Phantom's is their own
   published mark, served from /phantomlogo.png.
   X keeps the glyph: it is a typographic mark and renders correctly at this size.
   Everything that offers a provider reads from this object — the sheet, the gate
   card and the profile — so the three can no longer drift apart, which is exactly
   how the profile ended up offering two providers when the product had three. */
const GMARK='<svg class="pmark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>';
const PMARK='<img class="pmark" src="/phantomlogo.png" alt="" width="19" height="19">';
const PROV={twitter:{glyph:"𝕏",label:"Continue with X",cls:"x",why:"connect your identity"},
            google:{glyph:GMARK,label:"Continue with Google",cls:"",why:"save across devices"},
            phantom:{glyph:PMARK,label:"Continue with Phantom",cls:"",why:"sign in with your wallet"}};
/** The GATE's provider buttons. Same list, same marks, different verb: a gate
 *  says "sign in with", a settings sheet says "continue with". Unavailable
 *  providers are dropped here rather than shown disabled — a gate is asking for
 *  a decision, and a dead option is not one. */
function gateButtons(){
  const NAME={twitter:"X",google:"Google",phantom:"Phantom"};
  return (auth.providers.length?auth.providers:[{provider:"twitter",available:true},{provider:"google",available:true},{provider:"phantom",available:true}])
    .filter(({available})=>available!==false)
    .map(({provider})=>{
      const pr=PROV[provider]; if(!pr)return "";
      return `<button class="cbtn ${pr.cls}" data-p="${provider}"><span class="glyph">${pr.glyph}</span>Sign in with ${NAME[provider]||provider}</button>`;
    }).join("");
}

/** The provider buttons, built once and used by every surface that offers them. */
function provButtons(){
  const linked=new Set(auth.accounts.map(a=>a.provider));
  // "(coming soon)" is a statement about the SERVER's configuration, so it may
  // only be made when the server has actually answered. The fallback used to
  // claim twitter and google were unavailable whenever auth.providers was
  // empty, which is also true while /api/auth/me is still in flight and when
  // that fetch fails. Both are live, so a slow network made two working
  // sign-ins read as unbuilt features.
  const known=auth.providers.length>0;
  return (known?auth.providers:[{provider:"twitter"},{provider:"google"},{provider:"phantom"}])
    .map(({provider,available})=>{
      const p=PROV[provider]; if(!p)return "";
      if(linked.has(provider))return `<button class="cbtn" disabled><span class="glyph">${p.glyph}</span>Connected</button>`;
      if(!known)return `<button class="cbtn" disabled><span class="glyph">${p.glyph}</span>${p.label}</button>`;
      if(!available)return `<button class="cbtn" disabled title="not configured"><span class="glyph">${p.glyph}</span>${p.label} (coming soon)</button>`;
      return `<button class="cbtn ${p.cls}" data-connect="${provider}"><span class="glyph">${p.glyph}</span>${p.label}</button>`;
    }).join("");
}

/**
 * Phantom sign-in. A SIGNATURE, not a transaction.
 *
 * The wallet is asked to sign a sentence the server issued; that sentence says
 * in its own text that it authorises nothing, and signMessage cannot move funds
 * even if it did. Nothing here touches the real-money layer in chain.js — this
 * is the same identity slot X and Google fill.
 *
 * The message is never sent back. The server verifies against the copy it
 * stored, so there is no version of this exchange where the browser gets to
 * choose what was signed.
 */
/**
 * Wire a set of sign-in buttons. THE ONE PLACE that knows Phantom is different.
 *
 * There were three hand-copied versions of this, and the copy on the Profile
 * screen had lost its Phantom branch: it sent "phantom" to
 * /api/auth/phantom/start, which is not an OAuth provider, so the server
 * bounced it to auth_error=unknown_provider and the button did nothing but
 * throw you back to the feed. It has been dead since the first commit, and it
 * is the ONLY wallet button a signed-out visitor can reach from Profile.
 *
 * Both ends were valid code, which is why nothing caught it. So the branch now
 * lives in one function and the call sites cannot drift apart again.
 */
function wireConnect(root, attr, go){
  root.querySelectorAll(`[${attr}]`).forEach(b=>b.onclick=()=>{
    // Phantom signs IN PLACE. It has no redirect to hand off to, so it can
    // never go down the OAuth path the others take.
    if(b.dataset[attr==="data-p"?"p":"connect"]==="phantom")return connectPhantom(b);
    go(b);
  });
}

async function connectPhantom(btn){
  const p=window.solana;
  if(!p||!p.isPhantom){
    // Not an error state worth a modal: they simply do not have it.
    btn.textContent="Phantom not found";btn.disabled=true;
    return;
  }
  const label=btn.textContent;
  btn.disabled=true;btn.textContent="Check your wallet…";
  try{
    const {publicKey}=await p.connect();
    const address=publicKey.toString();

    const cr=await fetch(`${API}/api/auth/wallet/challenge?deviceId=${encodeURIComponent(deviceId)}&address=${encodeURIComponent(address)}`);
    if(!cr.ok)throw new Error("challenge");
    const {nonce,message}=await cr.json();

    const signed=await p.signMessage(new TextEncoder().encode(message),"utf8");
    // Phantom hands back raw bytes; hex keeps it ASCII-safe over JSON without
    // pulling a base58 encoder into the page for one call.
    const sig=[...new Uint8Array(signed.signature)].map(b=>b.toString(16).padStart(2,"0")).join("");

    const vr=await fetch(`${API}/api/auth/wallet/verify`,{
      method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({deviceId,address,nonce,signature:sig}),
    });
    const out=await vr.json().catch(()=>({}));
    if(!vr.ok)throw new Error(out.error||"verify");

    // Same landing as the OAuth return, so all three paths say the same thing.
    location.href=`/feed?connected=phantom#/profile`;
  }catch(e){
    // A user closing Phantom's popup lands here too, and that is not a failure
    // worth shouting about — put the button back and let them try again.
    btn.disabled=false;btn.textContent=label;
    const rejected=e&&(e.code===4001||/reject|denied|cancel/i.test(e.message||""));
    if(!rejected)toast("Couldn't connect that wallet. Nothing changed.");
  }
}

/** X first: it is the identity. Google second: it is the backup.
 *  opts.welcome is the first-visit variant: same buttons, but it introduces
 *  the product instead of assuming you know it, and its dismiss says
 *  "I'll do this later" because skipping is a first-class outcome, not a
 *  failure to convert.
 *
 *  The old body promised "+5 predictions" for connecting and closed on a
 *  disclaimer that there was no real-money wagering. Both were written for the
 *  play-token era and both are false now: nothing is granted for signing in,
 *  and a position is real SOL. Worse, the bonus line kept reading a constant
 *  the economy cleanup deleted, so opening this sheet threw a ReferenceError:
 *  the code that says "nothing reads them now" was wrong about this one
 *  surface, and no test executes this file to notice. A sheet that asks for
 *  trust is the last place copy gets to be stale.
 */
function connectSheet(reason,opts){
  const welcome=!!(opts&&opts.welcome);
  const buttons=provButtons();
  const dim=document.createElement("div");
  dim.className="cdim";
  dim.innerHTML=`<div class="csheet" role="dialog" aria-label="Connect an account">
    <h3>${esc(welcome?"Prove you're right.":(reason||"Keep your record"))}</h3>
    <p>${welcome
      ?"Arguments on X become real-money markets here. Connect once and your calls, your markets and what they earn you follow you to any browser."
      :"Connect once and your record, your markets and your fees follow you to any browser."}</p>
    ${buttons}
    <p class="cnote">We never post anything. Signing in on a browser that already
      has an anonymous record loads your account instead; that record stays with this browser.</p>
    <button class="cclose">${welcome?"I'll do this later":"Not now"}</button>
  </div>`;
  dim.onclick=(e)=>{ if(e.target===dim)dim.remove(); };
  dim.querySelector(".cclose").onclick=()=>dim.remove();
  wireConnect(dim,"data-connect",b=>{
    location.href=`${API}/api/auth/${b.dataset.connect}/start?deviceId=${encodeURIComponent(deviceId)}`;
  });
  document.body.appendChild(dim);
}

/** Coming back from a provider: say what happened, once, then clean the URL. */
/**
 * ?connect=<provider> — an invitation handed over from the landing page.
 *
 * The landing has no device id (it deliberately never mints one) so it cannot
 * start a sign-in itself; it links here instead and the app performs. X and
 * Google are a redirect we can fire immediately; Phantom needs a click of its
 * own, because a wallet popup that opens without one is indistinguishable from
 * a drive-by prompt — so that case opens the sheet with the reason showing.
 */
function connectInvite(){
  const q=new URLSearchParams(location.search);
  const want=q.get("connect");
  if(!want)return false;
  // Clean the URL first: whatever happens next, a reload must not re-fire this.
  history.replaceState(null,"",location.pathname+location.hash);
  if(auth.accounts.some(a=>a.provider===want))return false;   // already connected
  if(want==="twitter"||want==="google"){
    const avail=auth.providers.find(p=>p.provider===want);
    if(avail&&avail.available===false)return false;           // not configured: fall through quietly
    location.href=`${API}/api/auth/${want}/start?deviceId=${encodeURIComponent(deviceId)}`;
    return true;
  }
  if(want==="phantom"){ connectSheet("Connect your wallet to keep your record"); return true; }
  connectSheet();
  return true;
}

function authReturn(){
  const q=new URLSearchParams(location.search);
  const connected=q.get("connected"), err=q.get("auth_error");
  if(!connected&&!err)return false;
  const msg=err?`Couldn't connect (${err}). Nothing changed.`
    :`Connected. Your record follows you now.`;
  history.replaceState(null,"",location.pathname+location.hash);
  const el=document.createElement("div");
  el.className="state";// Theme tokens, not #fff/#000. This one lives in an inline style string
  // rather than the stylesheet, which is why the sweep over <style> did not
  // reach it — it was the single fixed-white surface left in the app, and it
  // only ever appears right after a sign-in, so nobody was likely to catch it.
  el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 18px);z-index:70;background:var(--card-surface);color:var(--on-ground);border:1.5px solid var(--card-line);border-radius:16px;padding:10px 16px;max-width:88vw";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),5200);
  return true;
}

/**
 * One-tap calls whose 5s undo window hasn't closed yet. If the person leaves
 * the page mid-window, the UI already said "Locked", so the promise is kept
 * here: every still-pending call is committed via sendBeacon on the way out.
 * (An undo removes the entry, so an undone call is never sent from anywhere.)
 */
const PENDING_CALLS=new Set();
addEventListener("pagehide",()=>{
  for(const p of PENDING_CALLS){
    const body=new Blob([JSON.stringify({side:p.side,tokens:p.tokens,deviceId})],{type:"application/json"});
    try{navigator.sendBeacon(`${API}/api/market/${p.slug}/call`,body);}catch(e){}
  }
  PENDING_CALLS.clear();
});

// Mobile hands off to the OS sheet (WhatsApp/X/iMessage/copy, the UI they know).
// Desktop, where Web Share is thin, gets a three-item menu of its own.
async function shareMarket({slug,text,source,anchor,url}){
  url=url||`${SHARE_ORIGIN}/m/${slug}`;
  ev("share_open",{slug,source});
  if(COARSE && navigator.share){
    try{ await navigator.share({text,url}); ev("share_done",{slug,source,via:"native"}); }
    catch(e){ /* the user dismissed the sheet — not an error */ }
    return;
  }
  shareMenu({url,text,slug,source,anchor});
}

// "I posted about oddie — here's the link." The post goes into a review queue;
// approval pays +150 oddies, the week's best +300 on top. ONE currency, one
// name: everything the product pays lands in oddies, and no UI string may
// name a second unit. Requires a linked X account and the post must be the
// submitter's own — the server enforces both; this sheet carries the answer.
function loudClaim(source){
  ev("loud_claim_open",{source});
  document.querySelectorAll(".sdim,.lsheet").forEach(n=>n.remove());
  const dim=document.createElement("div");dim.className="sdim";
  const sh=document.createElement("div");sh.className="lsheet";
  sh.style.cssText="position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,92vw);background:var(--ground-2);border:1.5px solid var(--line-g);border-radius:16px;padding:16px;box-shadow:0 18px 44px rgba(13,60,90,.24)";
  sh.innerHTML=`
    <div style="font-family:'Nunito';font-weight:900;font-size:15px;color:var(--on-ground)">Earn oddies for posting</div>
    <div style="font-family:'Nunito';font-weight:700;font-size:12.5px;color:var(--muted-g);line-height:1.45;margin:6px 0 10px">
      Posted about oddie on X? Paste the post's link. A cleared post earns <b>+150 oddies</b>,
      and the week's best earn <b>+300</b> on top.</div>
    <input id="loudurl" type="url" inputmode="url" autocapitalize="off" spellcheck="false"
      placeholder="https://x.com/you/status/…"
      style="width:100%;box-sizing:border-box;font-family:'Nunito';font-weight:700;font-size:16px;color:var(--on-ground);background:var(--ground);border:1.5px solid var(--line-g);border-radius:10px;padding:10px 12px">
    <button id="loudsend"
      style="width:100%;margin-top:8px;font-family:'Nunito';font-weight:900;font-size:14px;color:#000;background:var(--accent);border:1.5px solid var(--line-g);border-radius:10px;padding:11px;cursor:pointer">Submit for review</button>
    <div id="loudmsg" style="font-family:'Nunito';font-weight:700;font-size:12px;line-height:1.4;margin-top:8px;color:var(--muted-g)"></div>
    <div id="loudmine" style="margin-top:4px"></div>`;
  const close=()=>{dim.remove();sh.remove();document.removeEventListener("keydown",onKey);};
  const onKey=(e)=>{if(e.key==="Escape")close();};
  dim.onclick=close;document.addEventListener("keydown",onKey);
  document.body.appendChild(dim);document.body.appendChild(sh);

  const mine=async()=>{
    try{
      const r=await fetch(`/api/loud/mine?deviceId=${encodeURIComponent(deviceId)}`);
      const j=await r.json();
      // The multiplier line: where "posting upgrades the printer" is TAUGHT.
      // Always present — at 1× it names the next rung, above 1× it brags.
      const msg=sh.querySelector("#loudmsg");
      if(msg&&!msg.textContent&&typeof j.multiplier==="number"){
        msg.innerHTML=j.multiplier>1
          ?`🔥 your play earns <b>${j.multiplier}×</b> oddies right now (${j.weeklyWinIn30d?"weekly loudest win":`${j.clearedIn30d} cleared post${j.clearedIn30d===1?"":"s"} in 30d`})`
          :`cleared posts also multiply your play earnings: 1 post → 1.25× · 3 → 1.5× · weekly loudest → 2×`;
      }
      const posts=(j.posts||[]).slice(0,5);
      if(!posts.length)return;
      const label={pending:"in review",approved:"+150 ✓",rejected:"not counted"};
      sh.querySelector("#loudmine").innerHTML=posts.map(p=>`
        <div style="display:flex;justify-content:space-between;gap:10px;font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);padding:4px 0">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.url.replace(/^https:\/\//,"")}</span>
          <span style="flex:none;${p.status==="approved"?"color:var(--acc-deep)":""}">${label[p.status]||p.status}</span>
        </div>`).join("");
    }catch(e){}
  };
  mine();

  sh.querySelector("#loudsend").onclick=async()=>{
    const inp=sh.querySelector("#loudurl"),msg=sh.querySelector("#loudmsg"),btn=sh.querySelector("#loudsend");
    const url=inp.value.trim();
    if(!url){inp.focus();return;}
    btn.disabled=true;btn.textContent="Sending…";
    try{
      const r=await fetch("/api/loud/submit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({deviceId,url})});
      const j=await r.json().catch(()=>({}));
      if(j.ok){
        ev("loud_submit",{source});
        inp.value="";msg.textContent="";
        toast("Sent · +150 oddies when it clears review");
        mine();
      }else{
        msg.textContent=j.error||"couldn't submit that link.";
      }
    }catch(e){msg.textContent="couldn't submit. Try again.";}
    finally{btn.disabled=false;btn.textContent="Submit for review";}
  };
}

/* ------------------------------------------------- anonymous device id -- */
/**
 * A random opaque string, minted once and kept in localStorage. It is NOT a
 * login and NOT a user: there is no account behind it, nothing a person typed
 * is ever attached to it, and clearing site data destroys it for good. It exists
 * so Week 1 can tell one returning browser from two new ones.
 *
 * localStorage first, cookie as the fallback — Safari in Private mode and some
 * in-app browsers (which is where a link from X lands) throw on setItem rather
 * than returning null. If both are unavailable the id lives for the page's
 * lifetime only: an unmeasurable session still gets a working feed.
 */
// Some browsers restore the previous scroll offset on a fresh load of "/" (most
// commonly iOS Safari / in-app browsers after backgrounding). That fights the
// requirement that home always opens at the top — take manual control up front,
// once, before anything renders. try/catch: not every embedded webview exposes it.
try{if("scrollRestoration" in history)history.scrollRestoration="manual";}catch(e){}

const DID_KEY="oddie_did";
const deviceId=(()=>{
  const mint=()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now().toString(36));
  try{
    const hit=localStorage.getItem(DID_KEY);
    if(hit)return hit;
    const id=mint();localStorage.setItem(DID_KEY,id);return id;
  }catch(e){/* storage blocked — fall through to the cookie */}
  try{
    const hit=document.cookie.match(/(?:^|;\s*)oddie_did=([^;]+)/);
    if(hit)return decodeURIComponent(hit[1]);
    const id=mint();
    document.cookie=`${DID_KEY}=${encodeURIComponent(id)};path=/;max-age=31536000;samesite=lax`;
    return id;
  }catch(e){/* cookies blocked too */}
  return mint(); // this session only; the feed still works, it just isn't counted twice
})();

/**
 * Four events, fire-and-forget. sendBeacon survives the page being closed mid
 * request, which is exactly when the last card_view of a session fires; fetch
 * with keepalive is the fallback. Nothing here blocks the UI, and a failed send
 * is silent by design — analytics must never be able to break the feed.
 */
function ev(name,props={}){
  const body=JSON.stringify({name,deviceId,...props});
  try{
    if(navigator.sendBeacon){
      navigator.sendBeacon(`${API}/api/ev`,new Blob([body],{type:"application/json"}));
      return;
    }
  }catch(e){/* fall through */}
  try{fetch(`${API}/api/ev`,{method:"POST",headers:{"content-type":"application/json"},body,keepalive:true});}catch(e){}
}

// stake refund plus a bonus. See src/store/economy.ts for the full rationale.

/* Community-market meta: how long until it closes, in the two largest units.
 * "closes in 12d 4h" beats a timestamp — nobody does date math mid-swipe. */
function closesIn(iso){
  if(!iso)return "";
  const ms=new Date(iso).getTime()-Date.now();
  if(!(ms>0))return "closing";
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), mi=Math.floor(ms%36e5/6e4);
  return d>0?`closes in ${d}d ${h}h`:h>0?`closes in ${h}h ${mi}m`:`closes in ${mi}m`;
}
function esc(s){return s.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}

// Animated count-up — cheap, tasteful motion for a hero number (Oddie Score,
// points, resolved counts) on first paint. Skipped entirely under
// prefers-reduced-motion; the element just shows the final value immediately.
const REDUCE_MOTION=matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el,to,opts={}){
  if(!el||!Number.isFinite(to))return;
  if(REDUCE_MOTION){el.textContent=(opts.fmt||String)(to);return;}
  const dur=opts.duration||700, from=opts.from||0, start=performance.now();
  const ease=(t)=>1-Math.pow(1-t,3); // easeOutCubic — fast start, gentle settle
  const step=(now)=>{
    const t=Math.min(1,(now-start)/dur);
    const val=Math.round(from+(to-from)*ease(t));
    el.textContent=(opts.fmt||String)(val);
    if(t<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/**
 * Smooth-scroll an element to the top of its scrolling container.
 *
 * Hand-rolled rather than scrollIntoView({behavior:"smooth"}) because the target
 * lives in a NESTED overflow container: scrollIntoView walks every scrollable
 * ancestor, so it also nudges the document, and its resting position is decided
 * by scroll-padding rather than by us. Driving #scroller.scrollTop directly is
 * the same thing renderHome already does to reset to the top, keeps the landing
 * offset explicit, and reuses countUp's easeOutCubic so the two bits of motion
 * on the page match. Degrades to an instant jump under prefers-reduced-motion.
 */
function scrollToEl(container,el,{duration=520,offset=8}={}){
  if(!container||!el)return;
  const to=Math.max(0,Math.min(
    el.getBoundingClientRect().top-container.getBoundingClientRect().top+container.scrollTop-offset,
    container.scrollHeight-container.clientHeight));
  const from=container.scrollTop;
  if(REDUCE_MOTION||Math.abs(to-from)<2){container.scrollTop=to;return;}
  const start=performance.now(), ease=(t)=>1-Math.pow(1-t,3);
  const step=(now)=>{
    const t=Math.min(1,(now-start)/duration);
    container.scrollTop=from+(to-from)*ease(t);
    if(t<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* After a call: which side of the room did you just join? Only said at all
 * when enough poppers called it that the percentage is a signal — below the
 * floor the line is simply absent, because "67% of poppers" meaning 2-of-3 is
 * noise dressed up as precision, and the locked state reads fine without it. */
const MIN_CROWD=10;
// Display-time title normalization for grouped/outcome markets — the client
// copy of src/title.ts's displayTitle, same three rules: "— Yes" is redundant
// with the YES button and drops; "— No" is LEFT ALONE (yesPct prices the NO
// outcome as this market's yes side, stripping would flip the meaning);
// "Title — Outcome" becomes "Title: Outcome?" so it reads as a question.
// Display only: slugs, matching and share URLs all keep the raw question.
function displayTitle(q){
  const i=q.lastIndexOf(" — ");
  if(i<0)return q;
  const title=q.slice(0,i).trim(), outcome=q.slice(i+3).trim();
  if(!title||!outcome)return q;
  const low=outcome.toLowerCase();
  if(low==="yes")return title;
  if(low==="no")return q;
  return `${title.endsWith("?")?title.slice(0,-1).trimEnd():title}: ${outcome}?`;
}

function socialLine(side,crowd,marketSidePct){
  const yes=crowd?.yes??0, no=crowd?.no??0, total=yes+no;
  if(total<MIN_CROWD)return "";
  const p=Math.round(100*(side==="yes"?yes:no)/total);
  const m=marketSidePct;
  if(p>=50&&m<50)return `You're with ${p}% of poppers. The market disagrees (${m}%).`;
  if(p>=50)return `You're with ${p}% of poppers — and the market (${m}%).`;
  if(m>=50)return `Only ${p}% of poppers with you — but the market is (${m}%).`;
  return `Contrarian: ${p}% of poppers and a ${m}% market against you.`;
}

// Cold-visitor onboarding. Shown only on the "For you" tab, only for a cold/
// organic visit (no permalink context — a permalink page already has the tweet
// as its explanation). Two independent rows: the tag instruction and a follow
// prompt, each persisted separately (a visitor may dismiss one but not the

const ONB_KEY="oddie_onboard_dismissed";    // tag-instruction strip
const FOLLOW_KEY="oddie_follow_dismissed";   // follow prompt (independent)
function onboardingCold(){ return activeCat==="For you" && !startSlug; }
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return "1";} } // fail closed → hidden
function lsSet(k){ try{localStorage.setItem(k,"1");}catch(e){} }
// The top-of-feed hooks: the daily-claim card (everyone) + the cold-visitor
// onboarding banners. All in one snap-aligned wrap so they're visible on load.
function maybeFeedTop(scroller){
  const cold=onboardingCold();
  // On a shared-market landing (/m/{slug}) the market itself must lead and sit
  // centered — so the daily-claim banner (a retention hook for the organic feed)
  // is suppressed here; it still shows on a normal feed visit.
  //
  // ONE PROMPT AT A TIME, NOT TWO STACKED.
  //
  // The tag banner has this slot to itself. It used to share it with the daily
  // claim card, and the rule was that the claim led when claimable because it
  // expired and the banner did not. Nothing expires here any more, so the
  // arbitration went with the claim.
  const showTag=cold && !lsGet(ONB_KEY);
  const showFollow=cold && !lsGet(FOLLOW_KEY);
  if(!showTag && !showFollow)return;   // the strip inserts itself later, see paintStatusStrip
  const wrap=document.createElement("div"); wrap.className="onbwrap";
  const prune=()=>{ if(!wrap.querySelector(".onbstrip,.claimcard,.ystrip"))wrap.remove(); };
  // ONE consolidated onboarding banner: the tag instruction is the primary CTA;
  // the follow prompt rides inline as a secondary pill on the same strip (not a
  // second full banner). A single × dismisses both. A visitor who already
  // dismissed one sees only the other, still in a single compact strip.
  if(showTag || showFollow){
    const s=document.createElement("div"); s.className="onbstrip";
    // The visible hero: one headline line, integrated into the banner (not a
    // section), shown to a first-time visitor alongside the tag instruction.
    const heroHtml=showTag ? `<span class="onbhero">Someone's wrong on X? Prove you're right.</span>` : '';
    const tagHtml=showTag
      ? '<span class="onbtxt">tag <b>@oddiefun</b> under any claim on X and it turns into a market anyone can bet on</span>'
      : '<span class="onbtxt">follow to see which calls were right</span>';
    const followHtml=showFollow
      ? '<a class="fbtn" href="https://x.com/intent/follow?screen_name=oddiefun" target="_blank" rel="noopener">follow @oddiefun ↗</a>'
      : '';
    s.innerHTML=heroHtml+tagHtml+followHtml+'<button class="onbx" type="button" aria-label="Dismiss">×</button>';
    const fb=s.querySelector(".fbtn"); if(fb)fb.onclick=()=>ev("follow_click",{});
    s.querySelector(".onbx").onclick=()=>{lsSet(ONB_KEY);lsSet(FOLLOW_KEY);s.remove();prune();ev("onboard_dismiss",{});};
    wrap.appendChild(s);
