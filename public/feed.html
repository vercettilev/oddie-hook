<!-- Favicon + touch/PWA icons. Absolute paths: oddie.fun points straight at this
     Express service on Railway, which serves the icons from ./public. One origin,
     no proxy in front, so a favicon can't 404 on a forgotten rewrite. -->

<script>
  /* Before any CSS is applied, so the page never flashes the wrong theme at
     someone who chose dark. A stored choice wins; otherwise follow the system.
     Wrapped because private browsing can throw on localStorage access. */
  (function(){
    var t=null; try{ t=localStorage.getItem("oddie_theme"); }catch(e){}
    var dark = t==="dark" || (t!=="bright" && matchMedia("(prefers-color-scheme:dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "bright";
    /* Experimental theme, PARAM-ONLY. ?theme=lime renders this one page load
       with the lime accent + ghost logo; nothing is stored, so any link without
       the param is the real brand. (Also scrubs the short-lived persisted
       preview an earlier build wrote, so no browser stays accidentally limed.) */
    try{
      localStorage.removeItem("oddie_brand");
      if(new URLSearchParams(location.search).get("theme")==="lime")
        document.documentElement.dataset.brand="lime";
    }catch(e){}
  })();
</script>

<style>

  /* Two families of colour, and the whole dark theme is the line between them.
   *
   * SURFACE tokens paint the things that carry the brand: a white fill inside a
   * chunky black outline. `--white`, `--ink`, `--wash`, `--bar`, `--blue` and
   * `--muted` belong to that family and DO NOT MOVE between themes. The YES/NO
   * rows, the tiles, the picker, the sheets and the desktop frame are all made
   * of them, so they look identical in both themes — which is the point. The
   * shared card on X is white with a black outline, and the app agrees with it.
   *
   * GROUND tokens paint what is behind and around those objects: the page, the
   * header, the tab bar, the rail, and any text that sits directly on them with
   * no surface underneath. Only these change.
   *
   * A rule that reaches for `--muted` inside a white tile is right. A rule that
   * reaches for it on the ground is a bug in dark mode — that is what `--muted-g`
   * is for. */

   * outline erases the outline, and the outline IS the brand. The ground has to
   * be dark enough that a white card reads as lit, and far enough from the ink
   * that the ink still draws. */
  /* Setting a ground colour on <body> poisons every surface that never declared
   * its own: a white tile inherited near-white text and its question vanished.
   * Surfaces carry the ink, always, in both themes. If you add a boxed element,
   * add it here — the audit checks contrast on the ones that exist. */
  .orow,.tile,.stat,.rep,.acct,.picker,.csheet,.seg,.segb,.promo,.lb,.bal,
  .cbtn,.amt,.amt-in,.confirm,.pcancel,.sellbtn,.avatar{color:var(--ink)}
  .cbtn.x{color:#fff}

  :root[data-theme="dark"]{
    --ground:#17141C; --ground-wide:#110F16; --ground-2:#1D1924; --fade:#17141C;
    --on-ground:#F3EFF6; --muted-g:#9C93AC; --line-g:#332C40; --hair-g:#2A2434;
    --chip-bg:transparent; --chip-bd:#3A3348; --link-g:#7FD0FF;
    --dots:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--on-ground);font-family:'Fredoka',system-ui,sans-serif;overscroll-behavior:none}

  /* ---------------------------------------------------------------- shell -- */
  /* Mobile is one column and nothing else: `display:contents` dissolves the app
     grid and the frame, so .top keeps floating over a full-bleed scroller exactly
     as it always has. The desktop rules below are the only thing that assembles
     a rail / frame / aside layout out of the same markup. */
  .app,.frame{display:contents}
  .rail,.side,.watermark{display:none}

  .top{position:fixed;top:0;left:0;right:0;z-index:15;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--ground-2)}
  /* Only the feed wants the fade — a card runs edge to edge under it. The shells
     are lists, and a list sliding under a translucent gradient just looks broken. */
  body[data-view="feed"] .top{background:linear-gradient(var(--fade) 72%, transparent)}
  body:not([data-view="feed"]) .top{border-bottom:2.5px solid var(--hair-g)}
  .top-in{max-width:var(--col);margin:0 auto;padding:0 6px}
  .brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
  .brand b{font-size:21px;font-weight:600}

  /* The mark IS the logo now — its blue circle and eyes are baked into the art,
     so the element is just a sized, clipped surface painting --mark. */
  .ghost{width:30px;height:30px;border-radius:50%;background:var(--mark) center/contain no-repeat;flex:none}
  /* A bigger centred mark for the taste interstitials (gate / not-listed). */
  .gmark{width:60px;height:60px;margin:0 auto 14px;background:var(--mark) center/contain no-repeat}

  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font-family:'Nunito';font-weight:800;font-size:12px;padding:7px 13px;border-radius:999px;
    border:2px solid var(--chip-bd);background:var(--chip-bg);color:var(--muted-g);cursor:pointer;white-space:nowrap}
  .chip.on{color:#000;border-color:var(--blue);background:var(--wash)}

  /* The scroller is the feed when it snaps and a plain page when it doesn't. */
  .scroller{height:100dvh;overflow-y:auto;scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .scroller.snap{scroll-snap-type:y mandatory}
  .state{height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Nunito';font-weight:800;color:var(--muted-g);text-align:center;padding:24px}

  /* ------------------------------------------------------------------ feed -- */
  .card{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;
    padding:110px 22px calc(env(safe-area-inset-bottom) + var(--tabh) + 16px);position:relative;
    max-width:var(--col);margin:0 auto}
  .cat{align-self:flex-start;font-family:'Nunito';font-weight:800;font-size:12px;padding:6px 12px;
    border-radius:999px;background:var(--wash);color:var(--acc-mid);margin-bottom:auto}
  .meta{font-family:'Nunito';font-weight:700;font-size:14px;color:var(--muted-g);margin-bottom:14px}
  .pshare{font-family:'Nunito';font-weight:800;font-size:11.5px;color:#000;background:var(--blue);
    border:2px solid #000;border-radius:999px;padding:3px 12px;margin-left:8px;cursor:pointer;vertical-align:1px}
  .waitcta{display:inline-block;font-family:'Fredoka';font-weight:600;font-size:14px;color:#000;
    background:var(--blue);border:3px solid #000;border-radius:16px;padding:9px 15px;
    text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.16)}
  /* the post-call belonging line */
  .socline{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--link-g);margin-top:7px}
  .take{font-size:min(28px,7vw);font-weight:600;line-height:1.15;color:var(--on-ground);margin:0 0 14px}
  .social{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted-g);margin:12px 0 0;min-height:16px}
  /* the 5s undo window after a one-tap call: undo is a real button, change-amount a quiet link */
  .social .undo{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--ink);
    background:var(--wash);border:2.5px solid var(--ink);border-radius:999px;
    padding:4px 13px;margin-left:8px;cursor:pointer;font-variant-numeric:tabular-nums}
  .social .undo:active{transform:scale(.96)}
  .social .chgamt{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--link-g);
    background:none;border:0;padding:4px 2px;margin-left:10px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px}

  /* ---- taste-flow interstitials: the category picker and the sign-in gate.
     Same card surface, but content is centred instead of bottom-anchored, so a
     step in the feed reads as a moment, not a market. Both themes inherit the
     card tokens above. */
  .intercard{justify-content:center;align-items:center;text-align:center;gap:0}
  .ititle{font-family:'Fredoka';font-weight:600;font-size:min(26px,6.6vw);line-height:1.15;
    color:var(--on-ground);margin:0 0 8px}
  .isub{font-family:'Nunito';font-weight:700;font-size:13.5px;color:var(--muted-g);margin:0 0 22px}
  .tchips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 26px;max-width:340px}
  .tchip{font-family:'Nunito';font-weight:800;font-size:15px;padding:11px 18px;border-radius:999px;
    border:2.5px solid var(--chip-bd);background:var(--chip-bg);color:var(--on-ground);cursor:pointer;
    transition:transform .08s}
  .tchip:active{transform:scale(.96)}
  .tchip.on{color:#000;border-color:var(--blue);background:var(--blue)}
  .icont{font-family:'Fredoka';font-weight:600;font-size:16px;color:#000;background:var(--blue);
    border:3px solid #000;border-radius:16px;padding:12px 30px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .icont:disabled{opacity:.4;box-shadow:none;cursor:default}
  .gatecard .cbtn{max-width:320px}

  /* The odds, both of them. A lone giant "60%" made the reader derive the other
     side, and a "win 1.7×" stranded on a button 200px away made them pair the two
     halves of one fact back together. Each row is now one side's whole story, in
     reading order: which side, how likely, what it pays.

     The row IS the bar. A separate split bar above said the same thing twice, so
     it folded into the rows: each one fills to its own percentage, and the number
     sits on top of the fill it describes. `--fill` comes in per-card, inline. */
  .duel{display:flex;flex-direction:column;gap:11px}
  .orow{--fill:0%;
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
    width:100%;text-align:left;padding:10px 18px 12px;border-radius:22px;border:4px solid #000;
    background:linear-gradient(90deg, var(--blue) var(--fill), #fff var(--fill));
    cursor:pointer;transition:.12s;font-family:inherit}
  .orow:active{transform:scale(.985)}
  .orow:disabled{cursor:default}
  .oside{font-size:21px;font-weight:600;color:#000;width:46px}
  /* The number straddles the fill line, so it must read on the blue AND the white
     at once. A near-black fill does exactly that — 10:1 on the blue, 18:1 on the
     white — and a thin WHITE outline (paint-order:stroke fill, so it sits behind
     the fill as a halo) separates the black from the blue where they meet. Over
     the white half that halo is invisible, so the digit is a uniform black
     everywhere: nothing to shimmer on the seam, no pill to patch it. Holds at 4%
     and 94%, both themes. The shared SVG card uses the same treatment. */
  .opct{justify-self:center;
    font-size:min(50px,13vw);font-weight:700;line-height:1;letter-spacing:-.01em;
    color:#141414;-webkit-text-stroke:3px #fff;paint-order:stroke fill;
    font-variant-numeric:tabular-nums;text-align:center}
  .opay{font-family:'Nunito';font-weight:800;font-size:13.5px;color:var(--acc-deep);white-space:nowrap}
  /* Picked: the row goes solid, overriding the gradient rather than --fill, which
     arrives inline and would win. */
  .orow.pick{background:var(--blue)}
  .orow.dim{opacity:.35}
  /* On a dark ground the same .35 turns a white row into mud. It has to read as
     "the side you didn't take", not as a rendering fault. */
  :root[data-theme="dark"] .orow.dim{opacity:.55}

  /* ----------------------------------------------------- experimental theme --
   * ?theme=lime, param-only: lives exactly as long as the URL carries it.
   * No storage, no default change, and shared cards never read any of this. */
  [data-brand="lime"] .ghost{border-radius:0;background:transparent;border:0;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><path d=%22M32 5 C17 5 9 17 9 30 L9 53 L15 47.5 L21 54 L27 47.5 L33 54 L39 47.5 L45 54 L51 47.5 L55 52 L55 30 C55 17 47 5 32 5 Z%22 fill=%22white%22 stroke=%22black%22 stroke-width=%225%22 stroke-linejoin=%22round%22/><circle cx=%2235%22 cy=%2227%22 r=%224%22 fill=%22black%22/><circle cx=%2246%22 cy=%2227%22 r=%224%22 fill=%22black%22/><path d=%22M36 38 Q43 43 49 36%22 stroke=%22black%22 stroke-width=%224.5%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>');background-size:contain;background-repeat:no-repeat;background-position:center;
    width:30px;height:30px}
  [data-brand="lime"] .ghost::before,[data-brand="lime"] .ghost::after{display:none}

  /* Full rebrand: lime replaces the blue accent system. PLACEHOLDER GREEN —
   * swap --blue here for the exact hex extracted from the logo. */
  [data-brand="lime"]{
    --blue:#C6F53C; --wash:#F3FBDA;
    --acc-deep:#4d6e10; --acc-mid:#5d8318; --acc-deeper:#3c570b;
    --link-g:#55781a; --chip-bd:#DDF0B0; --dots:rgba(64,90,10,.08);
    --ground-wide:#F4FBE3;
  }
  /* On near-black the same lime goes muddy; push it electric. */
  [data-theme="dark"][data-brand="lime"]{
    --blue:#D4FF4D; --wash:#EFFFC2;
    --acc-deep:#a8d84a; --acc-mid:#b7e558; --acc-deeper:#c8f06a;
    --link-g:#CDF56B; --chip-bd:#4a5a20; --dots:rgba(214,255,90,.05);
  }
  [data-theme="dark"][data-brand="lime"] .topup{color:#8aa63a}
  [data-theme="dark"][data-brand="lime"] .bal{color:#000}

  /* In the flow, under the buttons. Floated above them it landed in the same strip
     as the "You bet 10 → win 32 tokens" line and sat on top of it. Kept in the
     layout at opacity 0 so nothing reflows when it fades in. */
  /* balance pill — small and friendly, never a dollar sign anywhere near it */
  .bal{margin-left:8px;font-family:'Nunito';font-weight:800;font-size:13.5px;
    padding:4px 11px;border:2.5px solid var(--ink);border-radius:999px;
    background:var(--wash);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bal.pulse{animation:balpulse .45s ease}

  /* One tap, bright<->dark, always in the top bar — no menu, no label. It shows the
     mode you'll GET: a moon in bright, a sun in dark. "Auto" still lives in Profile
     for people who want to follow the system; tapping here just commits a choice. */
  .themetog{width:34px;height:34px;flex:none;margin-left:8px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:2.5px solid var(--line-g);background:transparent;
    color:var(--on-ground);cursor:pointer}
  .themetog svg{width:18px;height:18px;stroke:currentColor;fill:none;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .themetog:hover{background:var(--ground-2)}
  .themetog:active{transform:scale(.92)}

  /* Zero-balance nudge: reframes the wait so a busted device reads as "resting",
     not "locked out". A light wash surface, so it holds in both themes. */
  .znote{background:var(--wash);border:2.5px solid var(--blue);border-radius:16px;
    padding:12px 14px;margin-bottom:16px;font-family:'Nunito';font-weight:700;
    font-size:13px;line-height:1.45;color:var(--ink)}
  .znote b{font-weight:800}

  /* positions: reputation, live tracking, the sell button */
  .rep{display:flex;align-items:center;gap:14px;border:3px solid #000;border-radius:22px;
    background:var(--wash);padding:14px 16px;margin-bottom:16px}
  /* The score is allowed to be red. That is the whole point of measuring it. */
  .repnum{font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;flex:none}
  .repwho{display:flex;flex-direction:column;gap:2px;font-family:'Nunito';font-size:12.5px;color:var(--muted);font-weight:700}
  .repwho b{font-family:'Baloo 2','Nunito',sans-serif;font-size:15px;color:#000;font-weight:700}
  .prov{margin-left:6px;font-weight:800;color:#8a6d1f}
  .prov.done{color:var(--muted)}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .catedge{font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;border:2px solid var(--bar);background:#fff}
  .up{color:#0f7b3d} .down{color:#b3261e} .flat{color:var(--muted)}
  .catedge.up{border-color:#bfe6cd} .catedge.down{border-color:#f0c6c2}
  .psec{font-size:14px;font-weight:700;margin:20px 0 10px;color:var(--muted-g);
    font-family:'Nunito';font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  .track{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45}
  .track b{font-weight:800}
  .sellbtn{font:inherit;font-weight:700;font-size:15px;width:100%;margin-top:11px;padding:10px 0;cursor:pointer;
    border:3px solid var(--ink);border-radius:14px;background:var(--white)}
  .sellbtn:hover{background:var(--wash)}
  .sellbtn:disabled{opacity:.55;cursor:default}
  /* Honest, non-clickable replacement for the Sell button when a retry is pointless. */
  .sellnote{font-family:'Nunito';font-weight:700;font-size:12.5px;line-height:1.4;color:var(--muted-g);margin:11px 0 0}
  /* The sell result — the close made visible, same beat as the locked call state.
     Sits inside a white tile, so text is --ink; a tinted panel carries the tone. */
  .sellresult{margin-top:12px;border:3px solid #000;border-radius:14px;padding:12px 14px;background:var(--wash);color:var(--ink)}
  .sellresult.up{background:#e7f6ec;border-color:#0f7b3d} .sellresult.down{background:#fbe9e7;border-color:#b3261e}
  .srtop{display:flex;align-items:center;justify-content:space-between}
  .srtick{font-family:'Fredoka';font-weight:600;font-size:17px;color:var(--ink)}
  .srdelta{font-family:'Fredoka';font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
  .srdelta.up{color:#0f7b3d} .srdelta.down{color:#b3261e} .srdelta.flat{color:var(--muted)}
  .srnums{font-family:'Nunito';font-weight:800;font-size:14px;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
  .srnums .up{color:#0f7b3d} .srnums .down{color:#b3261e} .srnums .flat{color:var(--muted)}
  .srsub{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted);margin-top:5px}
  .srdone{margin-top:10px;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--ink);
    border:2.5px solid #000;border-radius:999px;background:#fff;padding:6px 18px;cursor:pointer}
  .srdone:active{transform:scale(.97)}
  .tile.closed{background:var(--wash)}
  .status.closed{color:var(--muted)}
  /* The countdown rides inside the pill, quieter than the number it refills. */
  .topup{font-weight:800;font-size:11px;color:var(--acc-mid);opacity:.85;margin-left:5px}

  /* connect sheet — the only auth surface, and it is never in the way */
  .bal{cursor:pointer}
  .cdim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;
    display:flex;align-items:flex-end;justify-content:center}
  .csheet{width:100%;max-width:var(--col);background:var(--white);
    border:3px solid #000;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
  @media (min-width:721px){ .cdim{align-items:center} .csheet{border-radius:24px} }
  .csheet h3{font-size:22px;margin:0 0 6px;font-weight:700}
  .csheet p{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.45}
  .cbtn{font:inherit;font-weight:700;font-size:16px;width:100%;padding:13px 0;margin-bottom:10px;cursor:pointer;
    border:3px solid var(--ink);border-radius:16px;background:var(--white);display:flex;align-items:center;justify-content:center;gap:9px}
  .cbtn.x{background:#000;color:#fff}
  .cbtn:disabled{opacity:.45;cursor:default}
  .cbtn .glyph{font-weight:800;font-size:17px}
  .cclose{font:inherit;font-weight:700;font-size:14px;width:100%;padding:9px 0;cursor:pointer;
    border:0;background:none;color:var(--muted)}
  .cnote{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);margin:2px 0 12px;line-height:1.4}
  .csheet .cnote{color:var(--muted)}   /* inside a white sheet, the surface grey is right */

  /* the one subtle line under a locked call */
  .upsell{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--link-g);
    background:none;border:0;padding:6px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* --- sharing ----------------------------------------------------------------
   * Two entry points. The card icon is discovery ("check this out"); the button
   * after a call locks is the wedge itself ("I called it — what do you say?").  */
  /* cat chip on the left, share icon on the right; this row carries the
     margin-bottom:auto that used to live on .cat, so the take still drops down. */
  .chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:auto}
  .chead .cat{margin-bottom:0}
  .shareico{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:2.5px solid var(--line-g);background:var(--ground);
    color:var(--on-ground);cursor:pointer;padding:0}
  .shareico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .shareico:hover{background:var(--ground-2)}
  .shareico:active{transform:scale(.9)}
  /* The strong one: a solid blue call-to-action, on-brand, under the locked line. */
  .sharebig{display:inline-flex;align-items:center;gap:8px;margin-top:10px;
    font-family:'Fredoka';font-weight:600;font-size:14px;color:#000;
    background:var(--blue);border:3px solid #000;border-radius:16px;padding:9px 15px;cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.16)}
  .sharebig svg{width:17px;height:17px;stroke:#000;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .sharebig:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
  /* Desktop fallback menu (no native share sheet). */
  .sdim{position:fixed;inset:0;z-index:80}
  .smenu{position:fixed;z-index:81;min-width:190px;background:var(--ground-2);
    border:3px solid var(--line-g);border-radius:16px;padding:6px;
    box-shadow:0 18px 44px rgba(13,60,90,.24)}
  .smenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    font-family:'Nunito';font-weight:800;font-size:13.5px;color:var(--on-ground);
    background:none;border:0;border-radius:11px;padding:10px 12px;cursor:pointer}
  .smenu button:hover{background:var(--ground)}
  .smenu svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px);transform:translateX(-50%);z-index:90;
    background:#fff;color:#000;border:3px solid #000;border-radius:14px;padding:9px 15px;max-width:88vw;
    font-family:'Nunito';font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(13,60,90,.2)}

  /* the handle: who this stream is called */
  .hrow{display:flex;align-items:center;gap:10px;border:3px solid #000;border-radius:22px;
    background:var(--wash);padding:13px 16px;margin-bottom:12px;color:var(--ink)}
  .hname{font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:18px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hkind{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted);flex:none}
  .hedit{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--acc-mid);background:none;border:0;
    padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;flex:none}
  .hin{flex:1;min-width:0;font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:17px;
    border:2.5px solid #000;border-radius:12px;padding:7px 11px;background:#fff;color:#000}
  .hsave{font-family:'Fredoka';font-weight:600;font-size:13.5px;color:#000;background:var(--blue);
    border:2.5px solid #000;border-radius:12px;padding:8px 13px;cursor:pointer;flex:none}
  .herr{font-family:'Nunito';font-weight:800;font-size:12px;color:#b3261e;margin:-6px 4px 10px}

  /* profile, once it is real */

     the question under the sticky chips bar; the presets showed with none

  .picker{display:flex;flex-direction:column;gap:10px;margin-top:12px;

  .amt.on{background:var(--blue);border-width:3.5px;box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
  .amt-in{font:inherit;font-size:16px;font-weight:700;width:74px;padding:8px 10px;

  .card.picking .opct{font-size:30px;-webkit-text-stroke-width:2px}
  .card.picking .orow{padding:6px 16px 8px}
  .card.picking .oside{font-size:17px}

  .card.picking .social{display:none}

  @media (max-height:680px){ .card.picking .opct{font-size:26px} }

  .nudge{align-self:center;margin-top:14px;

  .side-chip{font-family:'Nunito';font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;

  .acc.up{color:#0f7b3d} .acc.down{color:#b3261e} .acc.flat{color:var(--muted)}

    display:flex;align-items:center;justify-content:center;font-size:17px}
  .nicon.win{background:var(--blue)}
  .ntext{font-family:'Nunito';font-weight:700;font-size:14px;line-height:1.35}
  .ntext b{font-weight:800}
  .nwhen{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted);margin-top:3px}

  /* Settlement as a postable moment. White tile in both themes (contrast lesson),
     a coloured rail for the verdict, and a share button that's loud for a win and
     a shrug for a loss — never a token reward (a paid share is spam, and rewards
     are what let the farm in; the win itself is the reason to post). */
  .ncard{border:3px solid #000;border-left-width:9px;border-radius:18px;background:#fff;color:var(--ink);
    padding:14px 15px 15px;margin-bottom:11px}
  .ncard.win{border-left-color:#0f7b3d} .ncard.loss{border-left-color:#b3261e}
  .nctop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ncbadge{font-family:'Nunito';font-weight:800;font-size:12.5px;padding:4px 11px;border-radius:999px;border:2.5px solid #000}
  .ncbadge.win{background:#d7f2e0;color:#0b5c2e} .ncbadge.loss{background:#f7dbd7;color:#8f1d17}
  .ncwhen{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:#7a8894}
  .ncpay{font-family:'Fredoka';font-weight:700;font-size:30px;line-height:1;color:#0f7b3d;margin:2px 0 8px;font-variant-numeric:tabular-nums}
  .ncbody{font-family:'Nunito';font-weight:700;font-size:13px;line-height:1.4;color:var(--ink);margin:0 0 13px}
  .ncshare{display:inline-flex;align-items:center;gap:8px;font-family:'Fredoka';font-weight:600;font-size:15px;color:#000;
    border:3px solid #000;border-radius:14px;padding:9px 17px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .08s}
  .ncshare:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.2)}

  .ncshare svg{width:16px;height:16px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .unread{width:8px;height:8px;border-radius:50%;background:var(--blue);border:2px solid #000;align-self:center;flex:none}

  /* --------------------------------------------------------------- mobile nav -- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
    background:var(--ground-2);border-top:2.5px solid var(--line-g);
    padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;background:none;border:0;cursor:pointer;height:var(--tabh);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:'Nunito';font-weight:800;font-size:10px;color:var(--muted-g);padding:0}
  .tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.1;
    stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--on-ground)}
  .tab.on svg{stroke:var(--on-ground)}
  .tab.on .ico{background:var(--blue);border-radius:999px}
  .ico{padding:2px 12px;display:flex;align-items:center;justify-content:center}

  /* ------------------------------------------------------------------ desktop -- */
  /* Mobile ends at 430px; nothing above changes below that width. From 768px the

  @media (min-width:768px){

    .app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100dvh;position:relative;z-index:1}

      background:var(--blue);opacity:.17;z-index:0}
    .watermark::before,.watermark::after{content:"";position:absolute;top:210px;width:66px;height:66px;
      border-radius:50%;background:#0B3A56;opacity:.5}
    .watermark::before{left:120px}.watermark::after{left:280px}

    .rail{display:flex;flex-direction:column;gap:28px;padding:26px 20px;position:sticky;top:0;height:100dvh}
    /* The 248px rail can't hold wordmark + pill + toggle on one line, so let it
       wrap: "oddie" on top, the balance pill and its toggle on the line below.
       Wrapping (not a wider rail) keeps the frame from shifting. */
    .rail .brand{justify-content:flex-start;margin:0 0 0 8px;flex-wrap:wrap;row-gap:9px}
    .rail .brand .bal{margin-left:0}
    .railnav{display:flex;flex-direction:column;gap:6px}
    .navitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;cursor:pointer;

      color:var(--on-ground);width:100%;text-align:left}
    .navitem svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.1;
      stroke-linecap:round;stroke-linejoin:round;flex:none}
    .navitem:hover{background:var(--ground-2)}

    .railfoot{margin-top:auto;font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-g);line-height:1.5}

    .stage{display:flex;align-items:center;justify-content:center;padding:34px 28px}
    /* The frame is the phone: it is FEED BACKGROUND, not a card, so it takes the
       ground. It used to hardcode #fff, which in dark mode put --on-ground text
       on a white sheet — the desktop half of the surface-ink bug, invisible to a
       check that measured text against `body`. */
    .frame{display:flex;flex-direction:column;width:min(100%,620px);
      height:min(920px, calc(100dvh - 68px));background:var(--ground);
      border:4px solid var(--line-g);border-radius:34px;overflow:hidden;
      box-shadow:0 26px 60px rgba(13,60,90,.16)}

    /* Inside the frame the header is a real sibling, not a floating overlay: the
       scroller starts where the header stops, so no card has to reserve space for it. */
    .top{position:static;background:var(--ground);border-bottom:2.5px solid var(--hair-g);padding:16px 22px 14px}
    .top-in{max-width:none;padding:0}
    .top .brand{display:none}          /* the rail carries the wordmark */
    .scroller{height:auto;flex:1;min-height:0}
    .card{max-width:none;padding:34px 34px 30px}
    .sheet{max-width:none;padding:26px 26px 34px}

    /* Dead-centring a ~390px stack in a 780px frame still reads as sunken once the

       the nudge is. flex-basis 0 and shrinkable: on a frame too short to hold the

    .card::before{content:"";flex:1 1 0;min-height:0}
    .card::after{content:"";flex:1.9 1 0;min-height:0}
    .chead{margin-bottom:22px}         /* on desktop the spacers centre; kill the auto */
    .opct{font-size:64px}
    .oside{font-size:23px;width:52px}
    .opay{font-size:15px}
    .take{font-size:30px}
    .orow{padding:12px 22px 14px}
    .nudge{margin-top:22px}
  }

  @media (min-width:1200px){

    .side{display:flex;flex-direction:column;justify-content:center;padding:34px 28px 34px 0}
    .promo{border:3.5px solid #000;border-radius:28px;background:#fff;padding:22px}

<script>
const API=""; // same origin

/* ------------------------------------------------------- token balance -- */
/**
 * Virtual tokens, nothing else. Every device starts with 100, server-side; the
 * number in the header is the server's, not a local guess — a second tab or a
 * reload always shows what the database says. `balance` is null until /api/me
 * answers, and the picker treats null as "unknown, let the server enforce".

let balance=null, nextTopUpMs=null;
let myHandle=null, myHandleEditable=true;
async function loadBalance(){
  try{
    const r=await fetch(`${API}/api/me?deviceId=${encodeURIComponent(deviceId)}`);
    if(r.ok){const w=await r.json();balance=w.tokens;nextTopUpMs=w.nextTopUpMs;

  }catch(e){/* header just shows no pill; the server still enforces */}
}
/** "in 7h", "in 40m", "soon" — never a bare number of milliseconds. */
function topUpIn(ms){
  if(ms===null||ms===undefined)return "";
  const h=Math.floor(ms/3600000);
  if(h>=1)return `+200 in ${h}h`;
  const m=Math.floor(ms/60000);
  return m>=1?`+200 in ${m}m`:"+200 soon";
}
// Just the "when", for prose: "21h", "40m", "any minute now".
function topUpWhen(ms){
  if(ms===null||ms===undefined)return "soon";
  const h=Math.floor(ms/3600000);
  if(h>=1)return `${h}h`;
  const m=Math.floor(ms/60000);
  return m>=1?`${m}m`:"any minute now";
}
// A device at 0 is not locked out. If it holds open calls it can sell for tokens
// right now; either way the daily top-up is coming. Say so, gently.
function zeroNote(d){
  if(d.tokens>0)return "";
  const when=topUpWhen(d.nextTopUpMs);
  if(d.open.length)
    return `<div class="znote">Out of free tokens — but not stuck. <b>Sell an open call</b> below at its live price to free some up, or your next <b>+200</b> lands in ${when}.</div>`;
  return `<div class="znote">Out of tokens for now — your next <b>+200</b> lands in ${when}, and each day tops you back toward 1,000. Nothing lost but a little time.</div>`;
}
function paintBalance(pulse){
  if(balance===null)return;
  // The pill is the only permanent door to sign-in. It opens a sheet; it never
  // blocks anything behind it.
  document.querySelectorAll(".bal").forEach(el=>{
    if(el.dataset.wired)return;
    el.dataset.wired="1";
    el.setAttribute("role","button");
    el.setAttribute("aria-label","Save your balance across devices");
    el.onclick=()=>connectSheet();
  });
  // Two pills — the mobile header's and the desktop rail's. Same number always.
  // The top-up line only appears when it can do something for you: at the floor
  // there is nothing to count down to, and a countdown to nothing is a nag.
  const tip=topUpIn(nextTopUpMs);
  document.querySelectorAll(".bal").forEach(el=>{
    el.innerHTML=`🪙 ${balance}${tip?` <span class="topup">${tip}</span>`:""}`;
    if(pulse){el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse");}
  });
}

/* ------------------------------------------------- anonymous device id -- */
/**
 * A random opaque string, minted once and kept in localStorage. It is NOT a
 * login and NOT a user: there is no account behind it, nothing a person typed
 * is ever attached to it, and clearing site data destroys it for good. It exists
 * so Week 1 can tell one returning browser from two new ones.
 *
 * localStorage first, cookie as the fallback — Safari in Private mode and some
 * in-app browsers (which is where a link from X lands) throw on setItem rather
 * than returning null. If both are unavailable the id lives for the page's
 * lifetime only: an unmeasurable session still gets a working feed.
 */
const DID_KEY="oddie_did";
const deviceId=(()=>{
  const mint=()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now().toString(36));
  try{
    const hit=localStorage.getItem(DID_KEY);
    if(hit)return hit;
    const id=mint();localStorage.setItem(DID_KEY,id);return id;
  }catch(e){/* storage blocked — fall through to the cookie */}
  try{
    const hit=document.cookie.match(/(?:^|;\s*)oddie_did=([^;]+)/);
    if(hit)return decodeURIComponent(hit[1]);
    const id=mint();
    document.cookie=`${DID_KEY}=${encodeURIComponent(id)};path=/;max-age=31536000;samesite=lax`;
    return id;
  }catch(e){/* cookies blocked too */}
  return mint(); // this session only; the feed still works, it just isn't counted twice
})();

/* ------------------------------------------------------------- events -- */
/**
 * Four events, fire-and-forget. sendBeacon survives the page being closed mid
 * request, which is exactly when the last card_view of a session fires; fetch
 * with keepalive is the fallback. Nothing here blocks the UI, and a failed send
 * is silent by design — analytics must never be able to break the feed.
 */
function ev(name,props={}){
  const body=JSON.stringify({name,deviceId,...props});
  try{
    if(navigator.sendBeacon){
      navigator.sendBeacon(`${API}/api/ev`,new Blob([body],{type:"application/json"}));
      return;
    }
  }catch(e){/* fall through */}
  try{fetch(`${API}/api/ev`,{method:"POST",headers:{"content-type":"application/json"},body,keepalive:true});}catch(e){}
}
