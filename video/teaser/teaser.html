// The whole film is render(t, frame): a pure function of time, drawn on one canvas.
// Served over http (render.mjs starts a server; or `npx serve` at the repo root):

const TL = await (await fetch('timeline.json')).json();

const BEAT = 60 / TL.bpm, BAR = 4 * BEAT;

// ---------- time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const easeOutCubic = x => 1 - (1 - x) ** 3;
const easeInCubic = x => x ** 3;
const easeInOut = x => x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;

// The logo tile is a ghost on flat #FCF604. Colour-to-alpha against that yellow, keeping the
// black outline, white body and pink shadow solid, then trim to the ghost.
function keyTile(img) {
  const w = img.width, h = img.height, cv = layer(w, h), x = cv.getContext('2d');
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, w, h), p = d.data;
  const Yc = [252, 246, 4], REF = [[0, 0, 0], [255, 255, 255], [255, 45, 120]];
  const V = REF.map(f => f.map((v, i) => v - Yc[i])), VV = V.map(v => v[0] ** 2 + v[1] ** 2 + v[2] ** 2);
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0; i < p.length; i += 4) {
    const dr = p[i] - Yc[0], dg = p[i + 1] - Yc[1], db = p[i + 2] - Yc[2];
    let best = 1e12, bt = 1, bk = 0;
    for (let k = 0; k < 3; k++) {
      const v = V[k]; let tt = (dr * v[0] + dg * v[1] + db * v[2]) / VV[k]; tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
      const e = (dr - tt * v[0]) ** 2 + (dg - tt * v[1]) ** 2 + (db - tt * v[2]) ** 2;
      if (e < best) { best = e; bt = tt; bk = k; }
    }
    if (best < 45 * 45) {
      if (bt < 0.08) { p[i + 3] = 0; continue; }
      if (bt < 0.97) { const f = REF[bk]; p[i] = f[0]; p[i + 1] = f[1]; p[i + 2] = f[2]; p[i + 3] = Math.round(bt * 255); }
    }
    const px = (i >> 2) % w, py = (i >> 2) / w | 0;
    if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
  }
  x.putImageData(d, 0, 0);
  const out = layer(x1 - x0 + 1, y1 - y0 + 1); out.getContext('2d').drawImage(cv, -x0, -y0);
  return out;
}

function silhouette(img, color) {

}
const SHADOW = {};
for (const k of ['called', 'decide', 'cooking', 'hero', 'judge', 'w', 'tag', 'rocket']) SHADOW[k] = silhouette(IMG[k], 'rgba(0,0,0,0.35)');

// ---------- drawing helpers ----------
function fillBg(c, color) { c.fillStyle = color; c.fillRect(-W, -H, W * 3, H * 3); }
function glowSpot(c, x, y, r, hex, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(hex, a)); g.addColorStop(1, rgba(hex, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}
function put(c, img, x, y, s = 1, rot = 0, alpha = 1, sx = 1, sy = 1) {
  if (alpha <= 0 || s <= 0) return;
  c.save(); c.globalAlpha *= alpha; c.translate(x, y); if (rot) c.rotate(rot); c.scale(s * sx, s * sy);
  c.drawImage(img, -img.width / 2, -img.height / 2); c.restore();
}
function glyph(c, key, cx, cy, size, color, rot = 0) {
  const [ox, oy, fill] = GLYPH_BOX[key], k = size / 24 / fill;
  c.save(); c.translate(cx, cy); if (rot) c.rotate(rot); c.scale(k, k); c.translate(-ox, -oy);
  c.fillStyle = color; c.fill(GLYPH[key], 'evenodd'); c.restore();
}

const cache = new Map();
function memo(key, make) { let v = cache.get(key); if (!v) { v = make(); cache.set(key, v); } return v; }

// A text sprite, drawn once and reused: stroke under fill, optional blur for glows.
function textSprite(str, o) {
  return memo('t' + JSON.stringify([str, o]), () => {
    const size = o.size, fam = o.fam || 'Anton', weight = o.weight || '', sw = o.sw || 0, blur = o.blur || 0;
    const font = `${weight} ${size}px ${fam}`.trim(), track = (o.track || 0) + 'px';
    const mc = layer(2, 2).getContext('2d'); mc.font = font; mc.letterSpacing = track;
    const tw = mc.measureText(str).width;
    const pad = Math.ceil(sw + blur * 3 + size * 0.1);
    const cv = layer(tw + pad * 2, size * 1.3 + pad * 2), x = cv.getContext('2d');
    x.font = font; x.letterSpacing = track; x.textAlign = 'center'; x.textBaseline = 'middle';
    if (blur) x.filter = `blur(${blur}px)`;
    const cx = cv.width / 2 + (o.track || 0) / 2, cy = cv.height / 2 + size * (fam === 'Anton' ? 0.035 : 0.02);
    if (o.stroke && sw) { x.lineJoin = 'round'; x.lineWidth = sw * 2; x.strokeStyle = o.stroke; x.strokeText(str, cx, cy); }
    if (o.fill) { x.fillStyle = o.fill; x.fillText(str, cx, cy); }
    cv.tw = tw; cv.pad = pad;
    return cv;
  });
}
function fitSize(str, maxW, maxSize, fam = 'Anton', weight = '') {
  return memo('f' + [str, maxW, maxSize, fam, weight].join('|'), () => {
    const mc = layer(2, 2).getContext('2d'); mc.font = `${weight} 100px ${fam}`.trim();
    return Math.min(maxSize, Math.floor(100 * maxW / mc.measureText(str).width));
  });
}
// Display type: optional glow, a stepped 3D extrusion, then the face.
function bigText(c, str, x, y, o) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  const base = { size: o.size, fam: o.fam, weight: o.weight, sw: o.sw || 0, track: o.track };
  c.save(); c.globalAlpha *= a; c.translate(x, y); if (o.rot) c.rotate(o.rot); const s = o.s ?? 1; c.scale(s, s);
  if (o.glow) {
    const g = textSprite(str, { ...base, fill: o.glow, stroke: o.glow, blur: o.glowBlur || 28 });
    c.save(); c.globalAlpha *= o.glowA ?? 0.7; c.drawImage(g, -g.width / 2, -g.height / 2); c.restore();
  }
  if (o.ext) {
    const back = textSprite(str, { ...base, fill: o.extColor, stroke: o.sw ? o.extColor : null });
    const [dx, dy] = o.dir || [1, 1.1];
    for (let i = o.ext; i >= 1; i--) c.drawImage(back, -back.width / 2 + dx * i, -back.height / 2 + dy * i);
  }

}
function marquee(c, str, y, size, speed, t, o) {
  const sp = textSprite(str, { size, fam: o.fam, fill: o.fill, stroke: o.stroke, sw: o.sw, track: o.track });
  const period = sp.tw + size * 0.5;
  let x = -(((t * speed) % period) + period) % period - period;
  c.save(); c.globalAlpha *= o.alpha ?? 1;
  for (; x < W + period; x += period) c.drawImage(sp, x - sp.pad, y - sp.height / 2);

function burst(c, cx, cy, n, color, rot) {
  const R = 2800, step = Math.PI * 2 / n;
  c.fillStyle = color; c.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * step;
    c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    c.lineTo(cx + Math.cos(a + step / 2) * R, cy + Math.sin(a + step / 2) * R); c.closePath();
  }

}
function speedLines(c, cx, cy, n, r0, seed, color) {
  const R = 2600; c.fillStyle = color; c.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rnd(seed * 3.17 + i * 7.31) * Math.PI * 2, w = 0.004 + rnd(seed * 1.3 + i * 2.9) * 0.014;
    const r1 = r0 * (0.75 + rnd(seed * 5.1 + i) * 0.7);
    c.moveTo(cx + Math.cos(a - w) * R, cy + Math.sin(a - w) * R);
    c.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);

  }

function shockwave(c, x, y, dt, color = WHT, maxR = 1500, dur = 0.55, width = 70) {
  if (dt < 0 || dt > dur) return;

  c.save(); c.globalAlpha = (1 - p) ** 1.2; c.lineWidth = width * (1 - p) + 2; c.strokeStyle = color;

  for (let yy = 0; yy < H; yy += 22) for (let xx = (yy / 22 % 2) * 11; xx < W; xx += 22) {

});
const PARTS = Array.from({ length: 150 }, (_, i) => ({
  a: rnd(i * 1.13) * Math.PI * 2, v: 700 + rnd(i * 2.21) * 1700, s: 9 + rnd(i * 3.37) * 24,
  c: [Y, PK, WHT, BLK, PK][i % 5], spin: (rnd(i * 4.41) - 0.5) * 24, round: i % 3 === 0,

function confetti(c, cx, cy, dt) {

const CHATFIELD = memo('field', () => {

  burst(c, W / 2, H * 0.42, 26, pal.ray, dt * 0.32 + (swap ? 0.4 : 0));
  c.globalAlpha = 0.5; c.drawImage(halftone(pal.ht), 0, 0); c.globalAlpha = 1;
  for (let r = 0; r < 5; r++) marquee(c, '$ODDIE', 120 + r * 215, 200, (r % 2 ? 1 : -1) * 260, t, { stroke: pal.mq, sw: 3, alpha: 0.13 });
  shockwave(c, W / 2, H * 0.44, dt, WHT, 1600, 0.6, 90);
  if (swap) shockwave(c, W / 2, H * 0.44, ds, Y, 1600, 0.5, 70);
  confetti(c, W / 2, H * 0.44, dt); if (swap) confetti(c, W / 2, H * 0.44, ds);
  // the ghost lands, then breathes with the kick
  const gIn = easeOutBack(prog(dt, 0.0, 0.34), 2.0), gs = 640 / GHOST.height * gIn;
  const gy = H * 0.415 + Math.sin(dt * 3.1) * 8;
  put(c, GHOST_SHADOW, W / 2 + 26, gy + 30, gs, 0, 1, 1 + 0.05 * kp, 1 - 0.06 * kp);
  put(c, GHOST, W / 2, gy, gs, Math.sin(dt * 2.3) * 0.03, 1, 1 + 0.05 * kp, 1 - 0.06 * kp);
  const tIn = prog(dt, 0.07, 0.25);
  if (tIn > 0) bigText(c, '$ODDIE', W / 2, H * 0.8, { size: 330, fill: pal.txt, stroke: BLK, sw: 13, ext: 17, extColor: BLK, dir: [1, 1.15], s: (1 + 2.2 * (1 - easeOutExpo(tIn))) * (1 + 0.03 * kp) });
  if (swap) ribbon(c, t, prog(ds, 0, 0.2));
  fx.flash = Math.max(fx.flash, 1.0 * decay(dt, 0.08), swap ? 0.7 * decay(ds, 0.05) : 0);
  fx.rgb = Math.max(fx.rgb, 20 * decay(dt, 0.12) + 7 * kp + (swap ? 14 * decay(ds, 0.1) : 0));
  fx.letterbox = 170 * (1 - prog(dt, 0, 0.06)); fx.grain = 0.1;
  if (dt < 0.1 || (swap && ds < 0.07)) fx.glitch = 0.7;
}
function ribbon(c, t, a) {
  if (a <= 0) return;
  c.save(); c.translate(W / 2, 60); c.rotate(-0.015); c.globalAlpha = a;
  c.fillStyle = BLK; c.fillRect(-W, -44, W * 2, 88);
  const items = ['twitch', 'kick', 'x', 'telegram'], step = 470, off = (t * 420) % (step * 4);
  c.font = `bold 34px ${MONO}`; c.textBaseline = 'middle'; c.textAlign = 'left';
  for (let i = -1; i < 9; i++) {
    const x = -W / 2 - off + i * step, P = PL[items[((i % 4) + 4) % 4]];
    c.drawImage(TILES[P.key], x, -29, 58, 58); c.fillStyle = WHT; c.fillText(P.name, x + 78, 2);
    c.fillStyle = Y; c.fillText('✦', x + 78 + c.measureText(P.name).width + 40, 2);
  }
  c.restore();
}

function sceneStickers(c, t, f, fx) {
  const k = clamp(Math.floor((t - at(TL.stickers[0])) / BEAT), 0, 7), St = STICK[k], dt = t - at(TL.stickers[k]);
  const pop = easeOutBack(prog(dt, 0, 0.2), 2.4), side = k % 2 ? 1 : -1;
  begin(c, t, f, { zoom: 1 + 0.03 * dt / BEAT, punch: 0.04, shake: 12 * decay(dt, 0.09) });
  fillBg(c, St.bg);
  burst(c, W / 2, H * 0.43, 22, St.ray, t * 0.6 + k * 0.4);
  const wordBehind = St.word.replace(/[.?]/g, '');
  for (let r = 0; r < 4; r++) marquee(c, wordBehind, 150 + r * 260, 220, (r % 2 ? 1 : -1) * 380, t, { stroke: St.bg === BLK ? Y : BLK, sw: 2.5, alpha: 0.12 });
  const img = IMG[St.img], sc = Math.min(640 / img.height, 980 / img.width) * lerp(0.25, 1, pop);
  const rot = side * (0.07 + 0.35 * (1 - easeOutCubic(prog(dt, 0, 0.22))));
  put(c, SHADOW[St.img], W / 2 + side * 30 + 22, H * 0.42 + 26, sc, rot);
  put(c, img, W / 2 + side * 30, H * 0.42, sc, rot);
  const size = fitSize(St.word, 1500, 160);
  bigText(c, St.word, W / 2, H * 0.86, { size, fill: St.fg, stroke: BLK, sw: St.bg === BLK ? 0 : 8, ext: 10, extColor: St.ext, s: 1 + 0.45 * (1 - easeOutExpo(prog(dt, 0.03, 0.17))) });
  fx.flash = Math.max(fx.flash, 0.4 * decay(dt, 0.04)); fx.rgb = Math.max(fx.rgb, 10 * decay(dt, 0.07)); fx.grain = 0.1;
}

function sceneTiles(c, t, f, fx) {
  const t0 = at(TL.tiles[0]), dt = t - t0;
  begin(c, t, f, { zoom: 1 + dt * 0.02, punch: 0.035, shake: 8 * decay(since(t, TL.tiles.map(at)), 0.08) });
  fillBg(c, '#06060A');
  glowSpot(c, W / 2, H * 0.62, 1100, PK, 0.22);
  neonGrid(c, t, rgba(PK, 0.45), H * 0.64);
  bigText(c, 'ONE CALL.', W / 2, H * 0.2, { size: 190, fill: Y, ext: 12, extColor: PK, glow: Y, glowA: 0.3, s: 1 + 0.4 * (1 - easeOutExpo(prog(dt, 0, 0.16))) });
  TL.tiles.forEach((b, k) => {
    const tk = at(b); if (t < tk) return;
    const d = t - tk, P = PLAT[k], s = lerp(1.8, 1, easeOutBack(prog(d, 0, 0.2), 1.6)), x = W / 2 + (k - 1.5) * 330, y = H * 0.56;
    c.globalCompositeOperation = 'lighter'; glowSpot(c, x, y, 260, P.bg === '#000000' ? '#FFFFFF' : P.bg, 0.45); c.globalCompositeOperation = 'source-over';
    put(c, TILES[P.key], x, y, 1.0 * s);
    if (d < 0.08) { fx.flash = Math.max(fx.flash, 0.35 * decay(d, 0.04)); fx.rgb = Math.max(fx.rgb, 10 * decay(d, 0.06)); }
  });
  bigText(c, 'EVERY STREAM  ·  EVERY CHAT', W / 2, H * 0.8, { size: 34, fam: MONO, weight: 'bold', fill: WHT, track: 16, alpha: prog(t, at(TL.tiles[3]) + 0.05, at(TL.tiles[3]) + 0.2) });
  fx.bloom = 0.4; fx.grain = 0.14;
}

function sceneTagline(c, t, f, fx) {
  const [b0, b1] = TL.tagline.map(at), s0 = at(TL.strobe[0]);
  if (t < s0) {
    const second = t >= b1, dt = t - (second ? b1 : b0), pop = easeOutExpo(prog(dt, 0, 0.16));
    begin(c, t, f, { zoom: 1 + 0.04 * dt / BEAT, punch: 0.04, shake: 16 * decay(dt, 0.1), rot: second ? 0.02 : -0.02 });
    fillBg(c, second ? PK : Y);
    speedLines(c, W / 2, H / 2, 50, 560, Math.floor(t * 30), second ? 'rgba(0,0,0,0.12)' : rgba(PK, 0.16));
    const str = second ? "DON'T ARGUE." : 'PREDICT.';
    bigText(c, str, W / 2, H / 2, second
      ? { size: fitSize(str, 1700, 330), fill: Y, stroke: BLK, sw: 12, ext: 16, extColor: BLK, s: 1 + 0.5 * (1 - pop) }
      : { size: fitSize(str, 1700, 330), fill: INK, ext: 16, extColor: PK, s: 1 + 0.5 * (1 - pop) });
    fx.flash = Math.max(fx.flash, 0.55 * decay(dt, 0.05)); fx.rgb = Math.max(fx.rgb, 14 * decay(dt, 0.08));
    return;
  }
  // the fill: $ODDIE strobes on every sixteenth, rushing at the lens
  const p = prog(t, s0, S.outro), i = Math.floor((t - s0) / (BEAT / 4));
  const pal = [[Y, INK, PK], [BLK, Y, PK], [PK, Y, BLK], [WHT, PK, BLK]][i % 4];
  begin(c, t, f, { zoom: 1 + easeInCubic(p) * 0.9, shake: 6 + 20 * p, rot: (i % 2 ? 1 : -1) * 0.02 * p });
  fillBg(c, pal[0]);
  speedLines(c, W / 2, H / 2, 70, 300, i, pal[0] === BLK ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)');
  bigText(c, '$ODDIE', W / 2, H / 2, { size: 360, fill: pal[1], ext: 14, extColor: pal[2], s: 1 + 0.1 * (1 - ((t - s0) % (BEAT / 4)) / (BEAT / 4)) });
  fx.rgb = Math.max(fx.rgb, 6 + 16 * p); fx.zoomBlur = p * 0.8; fx.flash = Math.max(fx.flash, easeInCubic(prog(t, S.outro - 0.18, S.outro)));
  fx.glitch = 0.25 + 0.5 * p;
}

function sceneOutro(c, t, f, fx) {
  const t0 = S.outro, dt = t - t0, O = TL.outro;
  begin(c, t, f, { zoom: 1.0 + dt * 0.009, shake: 24 * decay(dt, 0.25) });
  fillBg(c, '#040404');
  glowSpot(c, W / 2, H * 1.05, 1100, PK, 0.28 + 0.05 * Math.sin(t * 2));
  glowSpot(c, W / 2, H * 0.45, 900, Y, 0.09);
  c.globalAlpha = 0.35; c.drawImage(halftone(rgba(PK, 0.6)), 0, 0); c.globalAlpha = 1;
  embers(c, t, 0.9);
  shockwave(c, W / 2, H * 0.45, dt, Y, 1700, 0.7, 80);
  bigText(c, 'POWERED BY', W / 2, H * 0.24, { size: 36, fam: MONO, weight: 'bold', fill: '#F4F4F4', track: 22, alpha: prog(dt, 0.25, 0.5) });
  const tIn = easeOutExpo(prog(dt, 0, 0.3));
  const face = bigText(c, '$ODDIE', W / 2, H * 0.45, { size: 310, fill: Y, stroke: BLK, sw: 10, ext: 15, extColor: PK, dir: [1, 1.15], glow: Y, glowA: 0.45, glowBlur: 40, s: 1 + 1.2 * (1 - tIn) });
  // a light sweeps across the ticker
  const sp = prog(t, at(O.shine), at(O.shine) + 0.6);
  if (sp > 0 && sp < 1) {
    const sx = T2C; T2C.setTransform(1, 0, 0, 1, 0, 0); T2C.clearRect(0, 0, face.width, face.height);
    sx.globalCompositeOperation = 'source-over'; sx.drawImage(face, 0, 0); sx.globalCompositeOperation = 'source-in';
    const bx = lerp(-0.3, 1.3, easeInOut(sp)) * face.width, g = sx.createLinearGradient(bx - 160, 0, bx + 160, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    sx.fillStyle = g; sx.fillRect(0, 0, face.width, face.height); sx.globalCompositeOperation = 'source-over';
    c.save(); c.globalCompositeOperation = 'lighter'; c.drawImage(T2, 0, 0, face.width, face.height, W / 2 - face.width / 2, H * 0.45 - face.height / 2, face.width, face.height); c.restore();
  }
  const ts = at(O.soon);
  if (t >= ts) {
    const a = easeOutCubic(prog(t, ts, ts + 0.5)), str = t < ts + 0.25 ? scramble('COMING SOON', 1 - prog(t, ts, ts + 0.25), f) : 'COMING SOON';
    c.save(); c.font = '132px Anton'; c.letterSpacing = lerp(70, 16, a) + 'px'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.globalAlpha = a; c.fillStyle = WHT; c.shadowColor = rgba(PK, 0.8); c.shadowBlur = 30;
    c.fillText(str, W / 2 + lerp(70, 16, a) / 2, H * 0.71); c.restore();
    if (t < ts + 0.12) { fx.rgb = Math.max(fx.rgb, 12); fx.glitch = 0.6; }
  }
  const tf = at(O.footer);
  if (t >= tf) {
    const a = easeOutCubic(prog(t, tf, tf + 0.5)), y = H * 0.885 + (1 - a) * 30;
    c.save(); c.globalAlpha = a;
    const keys = ['twitch', 'kick', 'x', 'telegram'];
    keys.forEach((k, i) => c.drawImage(TILES[k], W / 2 - 380 + i * 78, y - 28, 56, 56));
    c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(W / 2 - 50, y - 26, 2, 52);
    c.font = `bold 34px ${MONO}`; c.letterSpacing = '8px'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = WHT;
    c.fillText('ODDIE.FUN', W / 2 - 16, y + 2);
    c.restore();
    put(c, MARK, W / 2 + 330, y, 64 / MARK.height, 0, a);
  }
  fx.bloom = 0.5; fx.grain = 0.16; fx.flash = Math.max(fx.flash, decay(dt, 0.14));
  fx.rgb = Math.max(fx.rgb, 16 * decay(dt, 0.15)); if (dt < 0.1) fx.glitch = 0.8;
  fx.fade = prog(t, at(O.fade), DUR - 0.08);
}

// ---------- HUD (drawn over the letterbox) ----------
function hudLive(m, t) {
  m.font = `bold 24px ${MONO}`; m.textBaseline = 'middle'; m.textAlign = 'left';
  if (Math.floor(t * 1.6) % 2 === 0) { m.fillStyle = PK; m.beginPath(); m.arc(78, 69, 9, 0, 7); m.fill(); }
  m.fillStyle = '#DADADA'; m.fillText('LIVE', 100, 70);
  m.textAlign = 'right'; const fr = Math.floor(t * 30) % 30, sec = Math.floor(t);
  m.fillText(`00:00:${String(sec).padStart(2, '0')}:${String(fr).padStart(2, '0')}`, W - 70, 70);
}
function hudLoading(m, t) {
  const p = prog(t, S.rise, at(TL.riseWords[3])), pct = p >= 1 ? 100 : Math.floor(easeInOut(p) * 99);
  if (p >= 1 && Math.floor(t * 10) % 2) return;
  const y = H - 74, w = 640, x = W / 2 - w / 2;
  m.font = `bold 22px ${MONO}`; m.textBaseline = 'middle'; m.letterSpacing = '6px';
  m.textAlign = 'right'; m.fillStyle = Y; m.fillText('LOADING', x - 30, y);
  m.textAlign = 'left'; m.fillText(String(pct).padStart(3, ' ') + '%', x + w + 30, y); m.letterSpacing = '0px';
  m.fillStyle = '#2A2A2A'; m.fillRect(x, y - 6, w, 12); m.fillStyle = Y; m.fillRect(x, y - 6, w * pct / 100, 12);
}

// ---------- post ----------
const GRAIN = Array.from({ length: 6 }, (_, k) => {
  const s = 256, cv = layer(s, s), x = cv.getContext('2d'), d = x.createImageData(s, s);
  let seed = 1234 + k * 7919;
  for (let i = 0; i < d.data.length; i += 4) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; const v = 68 + ((seed >> 16) & 255) * 0.47; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return M.createPattern(cv, 'repeat');
});
const SCAN = (() => { const cv = layer(4, 4), x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, 4, 1); return M.createPattern(cv, 'repeat'); })();
const VIGNETTE = (() => {
  const cv = layer(W, H), x = cv.getContext('2d'), g = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return cv;
})();
function copyMain() { T1C.globalCompositeOperation = 'copy'; T1C.drawImage(main, 0, 0); T1C.globalCompositeOperation = 'source-over'; }

function post(fx, t, f) {
  const m = M; m.setTransform(1, 0, 0, 1, 0, 0); m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
  if (fx.zoomBlur > 0.02) {
    copyMain();
    for (let k = 1; k <= 6; k++) { const s = 1 + k * 0.03 * fx.zoomBlur; m.globalAlpha = 0.3; m.drawImage(T1, W / 2 - W * s / 2, H / 2 - H * s / 2, W * s, H * s); }
    m.globalAlpha = 1;
  }
  if (fx.bloom > 0.02) {
    B1C.globalCompositeOperation = 'copy'; B1C.filter = 'brightness(1.05) contrast(1.7) blur(2px)'; B1C.drawImage(main, 0, 0, B1.width, B1.height); B1C.filter = 'none';
    B2C.globalCompositeOperation = 'copy'; B2C.filter = 'blur(2px)'; B2C.drawImage(B1, 0, 0, B2.width, B2.height); B2C.filter = 'none';
    m.globalCompositeOperation = 'screen'; m.globalAlpha = fx.bloom * 0.7; m.drawImage(B1, 0, 0, W, H);
    m.globalAlpha = fx.bloom; m.drawImage(B2, 0, 0, W, H); m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
  }
  if (fx.rgb > 1) {
    copyMain(); const d = Math.min(fx.rgb, 40);
    m.fillStyle = '#000'; m.fillRect(0, 0, W, H);
    for (const [col, dx, dy] of [['#FF0000', -d, 0], ['#00FF00', 0, 0], ['#0000FF', d, d * 0.3]]) {
      T2C.setTransform(1, 0, 0, 1, 0, 0); T2C.globalCompositeOperation = 'copy'; T2C.drawImage(T1, 0, 0);
      T2C.globalCompositeOperation = 'multiply'; T2C.fillStyle = col; T2C.fillRect(0, 0, W, H); T2C.globalCompositeOperation = 'source-over';
      m.globalCompositeOperation = 'lighter'; m.drawImage(T2, dx - Math.abs(d), dy - Math.abs(d) * 0.3, W + Math.abs(d) * 2, H + Math.abs(d) * 0.6);
    }
    m.globalCompositeOperation = 'source-over';
  }
  if (fx.glitch > 0.02) {
    copyMain(); const n = Math.floor(3 + fx.glitch * 16);
    for (let i = 0; i < n; i++) {
      const y = Math.floor(rnd(f * 7.13 + i * 1.7) * H), h = Math.floor(6 + rnd(f * 3.31 + i * 5.3) * 110 * fx.glitch);
      const dx = (rnd(f * 5.77 + i * 2.13) - 0.5) * 300 * fx.glitch;
      m.drawImage(T1, 0, y, W, h, dx, y, W, h);
      if (rnd(f * 1.9 + i * 9.7) < 0.3 * fx.glitch) {
        m.globalCompositeOperation = 'difference'; m.fillStyle = rnd(i + f) < 0.5 ? PK : Y;
        m.fillRect(rnd(i * 3.1 + f) * W, y, 120 + rnd(i + f * 2.2) * 700, h); m.globalCompositeOperation = 'source-over';
      }
    }
  }
  if (fx.flash > 0.01) { m.globalAlpha = clamp(fx.flash); m.fillStyle = fx.flashColor || WHT; m.fillRect(0, 0, W, H); m.globalAlpha = 1; }
  if (fx.fade > 0) { m.globalAlpha = clamp(fx.fade); m.fillStyle = '#000'; m.fillRect(0, 0, W, H); m.globalAlpha = 1; }
  if (fx.letterbox > 0.5) { m.fillStyle = '#000'; m.fillRect(0, 0, W, fx.letterbox); m.fillRect(0, H - fx.letterbox, W, fx.letterbox); }
  if (fx.hud) fx.hud(m, t);
  m.save(); m.globalCompositeOperation = 'overlay'; m.globalAlpha = fx.grain;
  m.translate(-Math.floor(rnd(f * 1.37) * 256), -Math.floor(rnd(f * 2.71) * 256)); m.fillStyle = GRAIN[f % GRAIN.length]; m.fillRect(0, 0, W + 256, H + 256); m.restore();
  if (fx.scan > 0) { m.globalAlpha = fx.scan; m.fillStyle = SCAN; m.fillRect(0, 0, W, H); m.globalAlpha = 1; }
  m.globalAlpha = fx.vignette; m.drawImage(VIGNETTE, 0, 0); m.globalAlpha = 1;
}

function sceneAt(t) {
  if (t < S.build) return sceneIntro;
  if (t < S.build + BAR) return sceneLogos;
  if (t < S.build + 2 * BAR) return sceneChat;
  if (t < S.build + 3 * BAR) return sceneCard;
  if (t < S.rise) return sceneWords;
  if (t < S.rise + BAR) return scenePortal;
  if (t < S.drop) return sceneNextBigCall;
  if (t < S.drop + 2 * BAR) return sceneHero;
  if (t < S.drop + 4 * BAR) return sceneStickers;
  if (t < S.drop + 5 * BAR) return sceneTiles;
  if (t < S.outro) return sceneTagline;
  return sceneOutro;
}
window.render = (t, f = Math.round(t * 30)) => {
  M.setTransform(1, 0, 0, 1, 0, 0); M.globalAlpha = 1; M.globalCompositeOperation = 'source-over'; M.filter = 'none'; M.letterSpacing = '0px';
  const fx = { rgb: 0, glitch: 0, zoomBlur: 0, bloom: 0, flash: 0, letterbox: 0, grain: 0.14, scan: 0, vignette: 0.5, fade: 0, hud: null };
  sceneAt(t)(M, t, f, fx);
  post(fx, t, f);
};
window.DUR = DUR;
window.ready = Promise.resolve(true);

if (!RENDER) {
  // preview: plays in real time with the score if it has been built (score.wav next to this file)
  const audio = new Audio('score.wav'); let t0 = null;
  const start = () => { audio.currentTime = 0; audio.play().catch(() => {}); t0 = performance.now(); };
  addEventListener('click', start); start();
  (function loop() {
    const t = !audio.paused && audio.currentTime > 0 ? audio.currentTime : ((performance.now() - t0) / 1000) % DUR;
    render(Math.min(t, DUR - 0.001)); requestAnimationFrame(loop);
  })();
}
</script>
