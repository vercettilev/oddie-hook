<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// The whole film is render(t, frame): a pure function of time, drawn on one canvas.
// Serve it over http (render.mjs starts a server; or `npx serve` at the repo root):
// the ghost is keyed off the logo tile with getImageData, which file:// forbids.
const TL = await (await fetch('timeline.json')).json();
const W = 1920, H = 1080;
const BEAT = 60 / TL.bpm, BAR = 4 * BEAT;
const at = b => b * BEAT;
const S = Object.fromEntries(Object.entries(TL.bars).map(([k, v]) => [k, v * BAR]));
const DUR = S.end;
const RENDER = new URLSearchParams(location.search).has('render');

// ---------- time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const easeOutCubic = x => 1 - (1 - x) ** 3;
const easeInCubic = x => x ** 3;
const easeInOut = x => x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
const easeOutExpo = x => x >= 1 ? 1 : 1 - 2 ** (-10 * x);
const easeOutBack = (x, s = 1.70158) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2;
const decay = (dt, tau) => dt < 0 || !isFinite(dt) ? 0 : Math.exp(-dt / tau);
function rnd(n) { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
function since(t, times) { let d = Infinity; for (const x of times) if (t >= x && t - x < d) d = t - x; return d; }

// The beat grid the score plays (build_audio.py derives the same lists from timeline.json).
const KICKS = [], CLAPS = [], ROLL = [], HEARTS = TL.hearts.map(at);
for (let b = TL.bars.streets * 4; b < TL.bars.boss * 4; b++) KICKS.push(at(b));
for (let bar = TL.bars.drop; bar < TL.bars.outro; bar++) {
  for (const s of TL.drop.kick) KICKS.push(at(bar * 4 + s / 4));
  for (const s of TL.drop.clap) CLAPS.push(at(bar * 4 + s / 4));
}
KICKS.push(S.outro);
{ const [r0, r1] = TL.boss.roll; for (let b = r0; b < r0 + 1; b += 0.25) ROLL.push(at(b)); for (let b = r0 + 1; b < r1; b += 0.125) ROLL.push(at(b)); }
const R = TL.roster;
const SPIN = Array.from({ length: R.jumps }, (_, j) => at(R.spin) + (at(R.lock) - at(R.spin)) * (j / R.jumps) ** R.curve);

// ---------- palette, platforms, copy ----------

  kick: new Path2D('M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z'),
  x: new Path2D('M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z'),
  tgPlane: new Path2D('M16.906 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z'),
};
const GLYPH_BOX = { twitch: [12, 12, 1], kick: [12, 12, 1], x: [12, 12, 1], tgPlane: [11.2, 12.4, 0.5] };
const PLAT = [
  { key: 'twitch', glyph: 'twitch', bg: '#9146FF', fg: WHT, neon: '#A970FF' },
  { key: 'kick', glyph: 'kick', bg: '#53FC18', fg: '#000000', neon: '#53FC18' },
  { key: 'x', glyph: 'x', bg: '#000000', fg: WHT, neon: '#FFFFFF' },

function layer(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// ---------- assets ----------
const FILES = {

  prophet: '../../brand/v3/kaynak-prophet.png', loudest: '../../brand/v3/kaynak-loudest.png', lurker: '../../brand/v3/kaynak-lurker.png',
  doubter: '../../brand/v3/kaynak-doubter.png', maxi: '../../brand/v3/kaynak-maxi.png', judge: '../../brand/v3/kaynak-judge.png',
  rookie: '../../brand/v3/kaynak-rookie.png', og: '../../brand/v3/kaynak-og.png', main: '../../brand/v3/kaynak-main.png',

const IMG = {};
const fontsReady = Promise.all([
  ['Anton', '../../assets/fonts/Anton.ttf', {}],
  ['Fredoka', '../../assets/fonts/Fredoka_700Bold.ttf', { weight: '700' }],
].map(async ([fam, url, d]) => { const f = new FontFace(fam, `url(${url})`, d); await f.load(); document.fonts.add(f); }));
await Promise.all([fontsReady, document.fonts.load(`46px ${JP}`, 'オッディ'), ...Object.entries(FILES).map(([k, src]) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => rej(new Error('missing ' + src)); i.src = src;
}))]);

// Trim a sticker to its visible pixels so every one sizes the same way.
function trim(img) {
  const cv = layer(img.width, img.height), x = cv.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, cv.width, cv.height).data, w = cv.width;
  let x0 = w, y0 = cv.height, x1 = -1, y1 = -1;
  for (let i = 3, p = 0; i < d.length; i += 4, p++) if (d[i] > 12) { const px = p % w, py = (p / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
  if (x1 < 0) return cv;
  const out = layer(x1 - x0 + 1, y1 - y0 + 1); out.getContext('2d').drawImage(cv, -x0, -y0); return out;
}
for (const k of ['oracle', 'called', 'cooking', 'w', 'rocket', 'tag', 'trophy', 'prophet', 'loudest', 'lurker', 'doubter', 'maxi', 'judge', 'rookie', 'og', 'main']) IMG[k] = trim(IMG[k]);

// The logo tile is a ghost on flat #FCF604. Colour-to-alpha against that yellow, keeping the
// black outline, white body and pink shadow solid, then trim to the ghost.
function keyTile(img) {
  const w = img.width, h = img.height, cv = layer(w, h), x = cv.getContext('2d');
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, w, h), p = d.data;
  const Yc = [252, 246, 4], REF = [[0, 0, 0], [255, 255, 255], [255, 45, 120]];
  const V = REF.map(f => f.map((v, i) => v - Yc[i])), VV = V.map(v => v[0] ** 2 + v[1] ** 2 + v[2] ** 2);
  for (let i = 0; i < p.length; i += 4) {
    const dr = p[i] - Yc[0], dg = p[i + 1] - Yc[1], db = p[i + 2] - Yc[2];
    let best = 1e12, bt = 1, bk = 0;
    for (let k = 0; k < 3; k++) {
      const v = V[k]; let tt = (dr * v[0] + dg * v[1] + db * v[2]) / VV[k]; tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
      const e = (dr - tt * v[0]) ** 2 + (dg - tt * v[1]) ** 2 + (db - tt * v[2]) ** 2;
      if (e < best) { best = e; bt = tt; bk = k; }
    }
    if (best < 45 * 45) {
      if (bt < 0.08) { p[i + 3] = 0; continue; }
      if (bt < 0.97) { const f = REF[bk]; p[i] = f[0]; p[i + 1] = f[1]; p[i + 2] = f[2]; p[i + 3] = Math.round(bt * 255); }
    }
  }
  x.putImageData(d, 0, 0);
  return trim(cv);
}
const GHOST = keyTile(IMG.tile);

const cache = new Map();
function memo(key, make) { let v = cache.get(key); if (!v) { v = make(); cache.set(key, v); } return v; }
function tinted(img, color, mode = 'source-in') {
  const cv = layer(img.width, img.height), x = cv.getContext('2d');
  x.drawImage(img, 0, 0); x.globalCompositeOperation = mode; x.fillStyle = color; x.fillRect(0, 0, cv.width, cv.height);
  return cv;
}
const shadowOf = k => memo('sh' + k, () => tinted(IMG[k], 'rgba(0,0,0,0.4)'));
const glowOf = (img, key, color, blur = 26) => memo('gl' + key + color, () => {
  const pad = blur * 3, cv = layer(img.width + pad * 2, img.height + pad * 2), x = cv.getContext('2d');
  x.filter = `blur(${blur}px)`; x.drawImage(tinted(img, color), pad, pad); return cv;
});
// the sky hologram: the ghost in cyan, cut into scanlines
const HOLO = (() => {
  const cv = tinted(GHOST, 'rgba(0,229,255,0.6)', 'source-atop'), x = cv.getContext('2d');
  x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000';
  for (let yy = 0; yy < cv.height; yy += 7) x.fillRect(0, yy, cv.width, 2.5);
  return cv;
})();
// the boss: the cigar portrait, and where the ember sits in its pixels
const BOSS = { tip: [683, 823], focus: [600, 720] };

// ---------- drawing helpers ----------
function fillBg(c, color) { c.fillStyle = color; c.fillRect(-W, -H, W * 3, H * 3); }
function glowSpot(c, x, y, r, hex, a) {
  if (a <= 0 || r <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(hex, a)); g.addColorStop(1, rgba(hex, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}
function put(c, img, x, y, s = 1, rot = 0, alpha = 1, sx = 1, sy = 1) {
  if (alpha <= 0.002 || s <= 0) return;
  c.save(); c.globalAlpha *= Math.min(1, alpha); c.translate(x, y); if (rot) c.rotate(rot); c.scale(s * sx, s * sy);
  c.drawImage(img, -img.width / 2, -img.height / 2); c.restore();
}
function glyph(c, key, cx, cy, size, color, rot = 0) {
  const [ox, oy, fill] = GLYPH_BOX[key], k = size / 24 / fill;
  c.save(); c.translate(cx, cy); if (rot) c.rotate(rot); c.scale(k, k); c.translate(-ox, -oy);
  c.fillStyle = color; c.fill(GLYPH[key], 'evenodd'); c.restore();
}
function textSprite(str, o) {
  return memo('t' + JSON.stringify([str, o]), () => {
    const size = o.size, fam = o.fam || 'Anton', weight = o.weight || '', sw = o.sw || 0, blur = o.blur || 0;
    const font = `${weight} ${size}px ${fam}`.trim(), track = (o.track || 0) + 'px';
    const mc = layer(2, 2).getContext('2d'); mc.font = font; mc.letterSpacing = track;
    const tw = mc.measureText(str).width, pad = Math.ceil(sw + blur * 3 + size * 0.1);
    const cv = layer(tw + pad * 2, size * 1.3 + pad * 2), x = cv.getContext('2d');
    x.font = font; x.letterSpacing = track; x.textAlign = 'center'; x.textBaseline = 'middle';
    if (blur) x.filter = `blur(${blur}px)`;
    const cx = cv.width / 2 + (o.track || 0) / 2, cy = cv.height / 2 + size * (fam === 'Anton' ? 0.035 : 0.02);
    if (o.stroke && sw) { x.lineJoin = 'round'; x.lineWidth = sw * 2; x.strokeStyle = o.stroke; x.strokeText(str, cx, cy); }
    if (o.fill) { x.fillStyle = o.fill; x.fillText(str, cx, cy); }
    cv.tw = tw; cv.pad = pad; return cv;
  });
}
function fitSize(str, maxW, maxSize, fam = 'Anton') {
  return memo('f' + [str, maxW, maxSize, fam].join('|'), () => {
    const mc = layer(2, 2).getContext('2d'); mc.font = `100px ${fam}`;
    return Math.min(maxSize, Math.floor(100 * maxW / mc.measureText(str).width));
  });
}
function bigText(c, str, x, y, o) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  const base = { size: o.size, fam: o.fam, weight: o.weight, sw: o.sw || 0, track: o.track };
  c.save(); c.globalAlpha *= a; c.translate(x, y); if (o.rot) c.rotate(o.rot); const s = o.s ?? 1; c.scale(s, s);
  if (o.glow) { const g = textSprite(str, { ...base, fill: o.glow, stroke: o.glow, blur: o.glowBlur || 28 }); c.save(); c.globalAlpha *= o.glowA ?? 0.7; c.drawImage(g, -g.width / 2, -g.height / 2); c.restore(); }
  if (o.ext) {
    const back = textSprite(str, { ...base, fill: o.extColor, stroke: o.sw ? o.extColor : null });
    const [dx, dy] = o.dir || [1, 1.1];
    for (let i = o.ext; i >= 1; i--) c.drawImage(back, -back.width / 2 + dx * i, -back.height / 2 + dy * i);
  }
  const face = textSprite(str, { ...base, fill: o.fill, stroke: o.stroke });
  c.drawImage(face, -face.width / 2, -face.height / 2);
  c.restore();

}
// Neon tube lettering: a coloured glow, the tube, and a pale core.
function neonText(str, o) {
  return memo('n' + JSON.stringify([str, o]), () => {
    const fam = o.fam || 'Anton', size = o.size, font = `${o.weight || ''} ${size}px ${fam}`.trim(), track = (o.track || 0) + 'px';
    const lw = o.lw || 8, blur = o.blur || 30;
    const mc = layer(2, 2).getContext('2d'); mc.font = font; mc.letterSpacing = track; const tw = mc.measureText(str).width;
    const pad = Math.ceil(blur * 2.4 + lw);
    const cv = layer(tw + pad * 2, size * 1.3 + pad * 2), x = cv.getContext('2d');
    x.font = font; x.letterSpacing = track; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
    const cx = cv.width / 2 + (o.track || 0) / 2, cy = cv.height / 2 + size * 0.035;
    if (o.fill) { x.fillStyle = o.fill; x.fillText(str, cx, cy); }
    x.shadowColor = o.color; x.shadowBlur = blur; x.strokeStyle = o.color; x.lineWidth = lw;
    x.strokeText(str, cx, cy); x.shadowBlur = blur * 0.45; x.strokeText(str, cx, cy);
    x.shadowBlur = 6; x.strokeStyle = o.core || '#FFFFFF'; x.lineWidth = Math.max(1.5, lw * 0.32); x.strokeText(str, cx, cy);

const neon = (c, str, x, y, o, alpha = 1, s = 1, rot = 0) => put(c, neonText(str, o), x, y, s, rot, alpha);
// a neon tube flickering on: the same intervals drive the buzz in the score
function neonOn(t, t0, f) {
  const d = t - t0; if (d < 0) return 0;
  const on = 0.93 + 0.07 * rnd(f * 3.31 + t0);
  for (const [a, b] of TL.flicker) if (d >= a && d < b) return on;
  return 0.1;
}
function marquee(c, str, y, size, speed, t, o) {
  const sp = textSprite(str, { size, fam: o.fam, fill: o.fill, stroke: o.stroke, sw: o.sw, track: o.track });
  const period = sp.tw + size * 0.5;
  let x = -(((t * speed) % period) + period) % period - period;
  c.save(); c.globalAlpha *= o.alpha ?? 1;
  for (; x < W + period; x += period) c.drawImage(sp, x - sp.pad, y - sp.height / 2);

function burst(c, cx, cy, n, color, rot) {

const halftone = color => memo('ht' + color, () => {
  const cv = layer(W, H), x = cv.getContext('2d'); x.fillStyle = color;
  for (let yy = 0; yy < H; yy += 22) for (let xx = (yy / 22 % 2) * 11; xx < W; xx += 22) {

const SPARKS = Array.from({ length: 170 }, (_, i) => ({

function neonGrid(c, t, color, horizon) {

  for (let j = 0; j < 16; j++) { const y = horizon + (H + 80 - horizon) * ((j + sc) / 16) ** 2.3; c.moveTo(-W, y); c.lineTo(W * 2, y); }
  c.stroke();

const TILES = Object.fromEntries(PLAT.map(P => [P.key, (() => {
  const s = 256, cv = layer(s, s), x = cv.getContext('2d');
  x.beginPath(); x.roundRect(4, 4, s - 8, s - 8, s * 0.23); x.fillStyle = P.bg; x.fill();

const MARK = (() => {

    const pal = [[PK, Y, BLK], [NAVY, PK, CY], [Y, INK, PK], [CY, NAVY, PK]][(i >> 1) % 4];
    fillBg(c, pal[0]);
    bigText(c, '$ODDIE', W / 2, H / 2, { size: 360, fill: pal[1], ext: 14, extColor: pal[2], s: 1 + 0.1 * (1 - ((t - s0) % (BEAT / 4)) / (BEAT / 4)) });
  }
  fx.rgb = Math.max(fx.rgb, 6 + 16 * p); fx.zoomBlur = p * 0.8; fx.flash = Math.max(fx.flash, easeInCubic(prog(t, S.outro - 0.18, S.outro)));
  fx.glitch = 0.25 + 0.5 * p; fx.grain = 0.12;
}
function sceneOutro(c, t, f, fx) {
  const t0 = S.outro, dt = t - t0, O = TL.outro;
  begin(c, t, f, { zoom: 1.04 + dt * 0.01, shake: 24 * decay(dt, 0.25) });
  drawCity(c, t, { pan: 2700 + dt * 40, lit: 0.9, holo: 0.45, board: Math.floor(dt / (BEAT * 2)) });
  rain(c, t, 0.9);
  c.fillStyle = 'rgba(4,2,10,0.5)'; c.fillRect(-W, -H, W * 3, H * 3);
  c.save(); c.translate(W / 2, H * 0.52); c.scale(1, 0.55); glowSpot(c, 0, 0, 1050, '#04020A', 0.85); c.restore();
  shockwave(c, W / 2, H * 0.45, dt, Y, 1700, 0.7, 80);
  bigText(c, 'POWERED BY', W / 2, H * 0.24, { size: 36, fam: MONO, weight: 'bold', fill: '#F4F4F4', track: 22, alpha: prog(dt, 0.25, 0.5) });
  const on = neonOn(t, t0, f), tIn = easeOutExpo(prog(dt, 0, 0.3));
  bigText(c, '$ODDIE', W / 2, H * 0.45, { size: 310, fill: Y, stroke: BLK, sw: 10, ext: 15, extColor: PK, dir: [1, 1.15], glow: Y, glowA: 0.5, glowBlur: 40, s: 1 + 1.2 * (1 - tIn), alpha: on });
  const ts = at(O.soon);
  if (t >= ts) neon(c, 'COMING SOON', W / 2, H * 0.71, { size: 128, color: CY, core: '#E8FDFF', lw: 6, blur: 30, track: 14 }, neonOn(t, ts, f));
  const tf = at(O.footer);
  if (t >= tf) {
    const a = easeOutCubic(prog(t, tf, tf + 0.5)), y = H * 0.885 + (1 - a) * 30;
    c.save(); c.globalAlpha = a;
    ['twitch', 'kick', 'x', 'telegram'].forEach((k, i) => c.drawImage(TILES[k], W / 2 - 380 + i * 78, y - 28, 56, 56));
    c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(W / 2 - 50, y - 26, 2, 52);
    c.font = `bold 34px ${MONO}`; c.letterSpacing = '8px'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = WHT;
    c.fillText('ODDIE.FUN', W / 2 - 16, y + 2);
    c.restore();
    put(c, MARK, W / 2 + 330, y, 64 / MARK.height, 0, a);
  }
  fx.bloom = 0.55; fx.grain = 0.16; fx.flash = Math.max(fx.flash, decay(dt, 0.14)); fx.scan = 0.04;
  fx.rgb = Math.max(fx.rgb, 16 * decay(dt, 0.15)); if (dt < 0.1) fx.glitch = 0.8;
  fx.fade = prog(t, at(O.fade), DUR - 0.08); fx.hud = hudCorners;
}

// ---------- HUD ----------
function hudCorners(m, t) {
  m.save(); m.strokeStyle = 'rgba(255,255,255,0.55)'; m.lineWidth = 2; const i = 40, q = 46, top = 150, bot = H - 150;
  for (const [x, y, dx, dy] of [[i, top, 1, 1], [W - i, top, -1, 1], [i, bot, 1, -1], [W - i, bot, -1, -1]]) {
    m.beginPath(); m.moveTo(x, y + dy * q); m.lineTo(x, y); m.lineTo(x + dx * q, y); m.stroke();
  }
  m.font = `bold 22px ${MONO}`; m.textBaseline = 'middle'; m.fillStyle = '#DADADA'; m.textAlign = 'right';
  const fr = Math.floor(t * 30) % 30, sec = Math.floor(t);
  m.fillText(`REC  00:00:${String(sec).padStart(2, '0')}:${String(fr).padStart(2, '0')}`, W - 70, 70);
  if (Math.floor(t * 1.6) % 2 === 0) { m.fillStyle = PK; m.beginPath(); m.arc(W - 340, 69, 8, 0, 7); m.fill(); }
  m.restore();
}
function hudType(m, str, x, y, t0, t, color) {
  if (t < t0) return;
  const n = Math.min(str.length, Math.floor((t - t0) / 0.03) + 1);
  m.save(); m.font = `bold 24px ${MONO}`; m.textBaseline = 'middle'; m.textAlign = 'left'; m.fillStyle = color; m.letterSpacing = '4px';
  m.fillText(str.slice(0, n) + (Math.floor(t * 3) % 2 ? '_' : ''), x, y); m.restore();
}

// ---------- post ----------
const GRAIN = Array.from({ length: 6 }, (_, k) => {
  const s = 256, cv = layer(s, s), x = cv.getContext('2d'), d = x.createImageData(s, s);
  let seed = 1234 + k * 7919;
  for (let i = 0; i < d.data.length; i += 4) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; const v = 68 + ((seed >> 16) & 255) * 0.47; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return M.createPattern(cv, 'repeat');
});
const SCAN = (() => { const cv = layer(4, 4), x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, 4, 1); return M.createPattern(cv, 'repeat'); })();
const VIGNETTE = (() => {
  const cv = layer(W, H), x = cv.getContext('2d'), g = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return cv;
})();
function copyMain() { T1C.globalCompositeOperation = 'copy'; T1C.drawImage(main, 0, 0); T1C.globalCompositeOperation = 'source-over'; }
function post(fx, t, f) {
  const m = M; m.setTransform(1, 0, 0, 1, 0, 0); m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
  if (fx.zoomBlur > 0.02) {
    copyMain();
    for (let k = 1; k <= 6; k++) { const s = 1 + k * 0.03 * fx.zoomBlur; m.globalAlpha = 0.3; m.drawImage(T1, W / 2 - W * s / 2, H / 2 - H * s / 2, W * s, H * s); }
    m.globalAlpha = 1;
  }
  if (fx.bloom > 0.02) {
    B1C.globalCompositeOperation = 'copy'; B1C.filter = 'brightness(1.05) contrast(1.7) blur(2px)'; B1C.drawImage(main, 0, 0, B1.width, B1.height); B1C.filter = 'none';
    B2C.globalCompositeOperation = 'copy'; B2C.filter = 'blur(2px)'; B2C.drawImage(B1, 0, 0, B2.width, B2.height); B2C.filter = 'none';
    m.globalCompositeOperation = 'screen'; m.globalAlpha = fx.bloom * 0.7; m.drawImage(B1, 0, 0, W, H);
    m.globalAlpha = fx.bloom; m.drawImage(B2, 0, 0, W, H); m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
  }
  if (fx.rgb > 1) {
    copyMain(); const d = Math.min(fx.rgb, 40);
    m.fillStyle = '#000'; m.fillRect(0, 0, W, H);
    for (const [col, dx, dy] of [['#FF0000', -d, 0], ['#00FF00', 0, 0], ['#0000FF', d, d * 0.3]]) {
      T2C.setTransform(1, 0, 0, 1, 0, 0); T2C.globalCompositeOperation = 'copy'; T2C.drawImage(T1, 0, 0);
      T2C.globalCompositeOperation = 'multiply'; T2C.fillStyle = col; T2C.fillRect(0, 0, W, H); T2C.globalCompositeOperation = 'source-over';
      m.globalCompositeOperation = 'lighter'; m.drawImage(T2, dx - Math.abs(d), dy - Math.abs(d) * 0.3, W + Math.abs(d) * 2, H + Math.abs(d) * 0.6);
    }
    m.globalCompositeOperation = 'source-over';
  }
  if (fx.glitch > 0.02) {
    copyMain(); const n = Math.floor(3 + fx.glitch * 16);
    for (let i = 0; i < n; i++) {
      const y = Math.floor(rnd(f * 7.13 + i * 1.7) * H), h = Math.floor(6 + rnd(f * 3.31 + i * 5.3) * 110 * fx.glitch);
      const dx = (rnd(f * 5.77 + i * 2.13) - 0.5) * 300 * fx.glitch;
      m.drawImage(T1, 0, y, W, h, dx, y, W, h);
      if (rnd(f * 1.9 + i * 9.7) < 0.3 * fx.glitch) {
        m.globalCompositeOperation = 'difference'; m.fillStyle = [PK, Y, CY][Math.floor(rnd(i + f) * 3)];
        m.fillRect(rnd(i * 3.1 + f) * W, y, 120 + rnd(i + f * 2.2) * 700, h); m.globalCompositeOperation = 'source-over';
      }
    }
  }
  if (fx.flash > 0.01) { m.globalAlpha = clamp(fx.flash); m.fillStyle = WHT; m.fillRect(0, 0, W, H); m.globalAlpha = 1; }
  if (fx.fade > 0) { m.globalAlpha = clamp(fx.fade); m.fillStyle = '#000'; m.fillRect(0, 0, W, H); m.globalAlpha = 1; }
  if (fx.letterbox > 0.5) { m.fillStyle = '#000'; m.fillRect(0, 0, W, fx.letterbox); m.fillRect(0, H - fx.letterbox, W, fx.letterbox); }
  if (fx.hud) fx.hud(m, t);
  m.save(); m.globalCompositeOperation = 'overlay'; m.globalAlpha = fx.grain;
  m.translate(-Math.floor(rnd(f * 1.37) * 256), -Math.floor(rnd(f * 2.71) * 256)); m.fillStyle = GRAIN[f % GRAIN.length]; m.fillRect(0, 0, W + 256, H + 256); m.restore();
  if (fx.scan > 0) { m.globalAlpha = fx.scan; m.fillStyle = SCAN; m.fillRect(0, 0, W, H); m.globalAlpha = 1; }
  m.globalAlpha = fx.vignette; m.drawImage(VIGNETTE, 0, 0); m.globalAlpha = 1;
}

function sceneAt(t) {
  if (t < S.oracle) return sceneCity;
  if (t < S.streets) return sceneOracle;
  if (t < S.boss) return sceneStreets;
  if (t < S.drop) return sceneBoss;
  if (t < S.hero) return sceneDropCity;
  if (t < S.pump) return sceneDropHero;
  if (t < S.roster) return scenePump;
  if (t < S.outro) return sceneRoster;
  return sceneOutro;
}
window.render = (t, f = Math.round(t * 30)) => {
  M.setTransform(1, 0, 0, 1, 0, 0); M.globalAlpha = 1; M.globalCompositeOperation = 'source-over'; M.filter = 'none'; M.letterSpacing = '0px';
  const fx = { rgb: 0, glitch: 0, zoomBlur: 0, bloom: 0, flash: 0, letterbox: 0, grain: 0.14, scan: 0, vignette: 0.5, fade: 0, hud: null };
  sceneAt(t)(M, t, f, fx);
  post(fx, t, f);
};
window.DUR = DUR;
window.ready = Promise.resolve(true);

if (!RENDER) {
  // preview: plays in real time with the score if it has been built (score.wav next to this file)
  const audio = new Audio('score.wav'); let t0 = null;
  const start = () => { audio.currentTime = 0; audio.play().catch(() => {}); t0 = performance.now(); };
  addEventListener('click', start); start();
  (function loop() {
    const t = !audio.paused && audio.currentTime > 0 ? audio.currentTime : ((performance.now() - t0) / 1000) % DUR;
    render(Math.min(t, DUR - 0.001)); requestAnimationFrame(loop);
  })();
}
</script>
